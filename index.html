const IDB={db:null,
 open(){return new Promise((res,rej)=>{const r=indexedDB.open('lernspiel',2);r.onupgradeneeded=()=>{const d=r.result;for(const s of['kv','files','cache','outbox'])if(!d.objectStoreNames.contains(s))d.createObjectStore(s);};
  r.onsuccess=()=>{const d=r.result;this.db=d;d.onclose=()=>{if(this.db===d)this.db=null;};d.onversionchange=()=>{d.close();if(this.db===d)this.db=null;};res();};
  r.onerror=()=>rej(r.error);r.onblocked=()=>rej(new Error('IndexedDB blocked'));});},
 /* Safari may close the connection (e.g. after a redirect or when the tab was in the background): reopen and retry once */
 async tx(store,mode,fn,retry){if(!this.db)await this.open();
  try{return await new Promise((res,rej)=>{const tr=this.db.transaction(store,mode);const req=fn(tr.objectStore(store));tr.oncomplete=()=>res(req&&req.result);tr.onerror=()=>rej(tr.error);tr.onabort=()=>rej(tr.error||new Error('IndexedDB aborted'));});}
  catch(e){retry=retry||0;const closing=e&&(e.name==='InvalidStateError'||e.name==='UnknownError'||/closing|closed|connection|lost/i.test(e.message||''));
   if(!closing||retry>=2)throw e;try{this.db&&this.db.close();}catch(_){}this.db=null;await new Promise(r=>setTimeout(r,150*(retry+1)));await this.open();return this.tx(store,mode,fn,retry+1);}},
 /* small settings (login tokens, language, API key) live in localStorage, which Safari keeps reliably; IndexedDB is only the fallback */
 lsKey(k){return'lernspiel:'+k;},lsOk(v){return v==null||['string','number','boolean'].includes(typeof v)||Array.isArray(v)||(typeof v==='object'&&Object.getPrototypeOf(v)===Object.prototype);},
 async get(s,k){if(s==='kv'){try{const x=localStorage.getItem(this.lsKey(k));if(x!==null)return JSON.parse(x);}catch(_){}
   try{return await this.tx(s,'readonly',o=>o.get(k));}catch(e){console.warn('IDB get',k,e);return undefined;}}
  if(s==='cache'){try{return await this.tx(s,'readonly',o=>o.get(k));}catch(e){console.warn('IDB cache',e);return undefined;}}
  return this.tx(s,'readonly',o=>o.get(k));},
 async set(s,k,v){if(s==='kv'&&this.lsOk(v)){try{localStorage.setItem(this.lsKey(k),JSON.stringify(v));try{await this.tx(s,'readwrite',o=>o.delete(k));}catch(_){}return;}catch(_){}}
  if(s==='cache'){try{return await this.tx(s,'readwrite',o=>o.put(v,k));}catch(e){console.warn('IDB cache',e);return;}}
  return this.tx(s,'readwrite',o=>o.put(v,k));},
 async del(s,k){if(s==='kv'){try{localStorage.removeItem(this.lsKey(k));}catch(_){}try{await this.tx(s,'readwrite',o=>o.delete(k));}catch(e){console.warn('IDB del',e);}return;}
  return this.tx(s,'readwrite',o=>o.delete(k));},
 keys(s){return this.tx(s,'readonly',o=>o.getAllKeys());}};

class FolderStore{constructor(hd){this.root=hd;this.kind='folder';this.name=hd.name;}
 async dir(parts,create){let d=this.root;for(const p of parts)d=await d.getDirectoryHandle(p,{create});return d;}
 split(p){const parts=p.split('/');const f=parts.pop();return[parts,f];}
 async read(p){try{const[ps,f]=this.split(p);const d=await this.dir(ps,false);const fh=await d.getFileHandle(f);return JSON.parse(await(await fh.getFile()).text());}
  catch(e){if(e.name==='NotFoundError'||e.name==='TypeMismatchError')return null;throw e;}}

  catch(e){if(e.name==='NotFoundError')return[];throw e;}}
 async remove(p){const[ps,f]=this.split(p);const d=await this.dir(ps,false);await d.removeEntry(f);}
 async readBlob(p){try{const[ps,f]=this.split(p);const d=await this.dir(ps,false);return await(await d.getFileHandle(f)).getFile();}catch(e){if(e.name==='NotFoundError'||e.name==='TypeMismatchError')return null;throw e;}}

 async removeDir(p){try{const parts=p.split('/');const n=parts.pop();const d=await this.dir(parts,false);await d.removeEntry(n,{recursive:true});}catch(e){}}}

function computeState(){S.state={};for(const p of S.profiles)S.state[p.id]=blankState();
 for(const l of uniqLogs().sort((a,b)=>String(a.started).localeCompare(String(b.started))))applyLog(S.state,l);}
function applyLog(state,l){
 const out={};const game=S.games.find(g=>g.id===(l.game&&l.game.id));
 for(const pl of l.players||[]){const s=state[pl.id];if(!s)continue;
  const prof=S.profiles.find(p=>p.id===pl.id);if(prof&&prof.resetAt&&String(l.started)<prof.resetAt)continue;
  const r={newBadges:[],unlocked:[],levelBefore:levelOf(s.xp)};
  const gm=(s.mastery[l.game.id]=s.mastery[l.game.id]||{});
  for(const a of l.answers||[]){if(a.player!==pl.id||a.joke)continue;const m=gm[a.itemId]||{box:0,seen:0,right:0};m.seen++;
   if(a.correct&&!a.second){m.right++;m.box=Math.min(5,m.box+1);}else if(!a.correct)m.box=Math.max(0,m.box-2);gm[a.itemId]=m;}
  s.xp+=pl.score||0;s.answers+=pl.answered||0;s.correct+=pl.correct||0;s.runs++;
  const acc=pl.answered?pl.correct/pl.answered:0;
  const give=id=>{if(!s.badges.includes(id)){s.badges.push(id);r.newBadges.push(id);}};
  give('first_run');
  if(l.mode==='classic'&&!l.aborted&&pl.answered>=5&&pl.correct===pl.answered)give('perfect');

topic('m2-solids',2,2,['Körper erkennen','Recognising solids','Reconnaître les solides'],

topic('m2-timeunits',2,3,['Zeiteinheiten','Units of time','Unités de temps'],

const GSM=[["Marin and his neighbour Nancy each eat 4 apples a day. How many apples do they eat together in 30 days?", "Marin und seine Nachbarin Nancy essen jeden Tag je 4 Äpfel. Wie viele Äpfel essen die beiden zusammen in 30 Tagen?", "Marin et sa voisine Nancy mangent chacun 4 pommes par jour. Combien de pommes mangent-ils ensemble en 30 jours ?", ["4+4", "30*8"], [8, 240], 240], ["A pet shop had 6 cages of rodents. 3 of the cages have 10 hamsters each and the other 3 have 5 guinea pigs each. How many rodents did the pet shop have in total?", "Eine Tierhandlung hat 6 Käfige mit Nagetieren. In 3 Käfigen sind je 10 Hamster, in den anderen 3 je 5 Meerschweinchen. Wie viele Nagetiere sind es insgesamt?", "Une animalerie a 6 cages de rongeurs. 3 cages contiennent chacune 10 hamsters et les 3 autres 5 cochons d’Inde chacune. Combien de rongeurs y a-t-il en tout ?", ["3*10", "3*5", "30+15"], [30, 15, 45], 45], ["Charlie had 10 stickers. He bought 21 stickers in a shop and got 23 stickers for his birthday. Then he gave 9 stickers to his sister and used 28 to decorate a card. How many stickers does Charlie have left?", "Charlie hatte 10 Sticker. Er kaufte 21 Sticker in einem Laden und bekam 23 zum Geburtstag. Dann schenkte er seiner Schwester 9 Sticker und klebte 28 auf eine Karte. Wie viele Sticker hat Charlie noch?", "Charlie avait 10 autocollants. Il en a acheté 21 dans un magasin et en a reçu 23 pour son anniversaire. Ensuite, il en a donné 9 à sa sœur et en a collé 28 sur une carte. Combien d’autocollants lui reste-t-il ?", ["10+21+23", "9+28", "54-37"], [54, 37, 17], 17], ["Ryan plants 2 flowers a day in his garden. After 15 days, how many flowers does he have if 5 did not grow?", "Ryan pflanzt jeden Tag 2 Blumen in seinem Garten. Wie viele Blumen hat er nach 15 Tagen, wenn 5 nicht gewachsen sind?", "Ryan plante 2 fleurs par jour dans son jardin. Combien de fleurs a-t-il après 15 jours, si 5 n’ont pas poussé ?", ["2*15", "30-5"], [30, 25], 25], ["Gretchen has gold and silver coins. There are 30 more gold coins than silver coins. If she has 70 gold coins, how many coins does she have in total?", "Gretchen hat Gold- und Silbermünzen. Sie hat 30 Goldmünzen mehr als Silbermünzen. Sie hat 70 Goldmünzen. Wie viele Münzen hat sie insgesamt?", "Gretchen a des pièces d’or et d’argent. Elle a 30 pièces d’or de plus que de pièces d’argent. Elle a 70 pièces d’or. Combien de pièces a-t-elle en tout ?", ["70-30", "70+40"], [40, 110], 110], ["Tom gets his car washed 4 times a month. Each wash costs 15 francs. How much does he pay in a year?", "Tom lässt sein Auto 4-mal im Monat waschen. Eine Wäsche kostet 15 Franken. Wie viel bezahlt er in einem Jahr?", "Tom fait laver sa voiture 4 fois par mois. Un lavage coûte 15 francs. Combien paie-t-il en un an ?", ["4*12", "48*15"], [48, 720], 720], ["Jan has three times as many pets as Marcia. Marcia has two more pets than Cindy. If Cindy has four pets, how many pets do the three have in total?", "Jan hat dreimal so viele Haustiere wie Marcia. Marcia hat zwei Haustiere mehr als Cindy. Cindy hat vier Haustiere. Wie viele Haustiere haben die drei zusammen?", "Jan a trois fois plus d’animaux que Marcia. Marcia a deux animaux de plus que Cindy. Cindy a quatre animaux. Combien d’animaux les trois ont-ils en tout ?", ["4+2", "3*6", "4+6+18"], [6, 18, 28], 28], ["Bill starts on the 3rd floor. He takes the lift up to the floor that is 4 times his starting floor plus 6. Which floor is Bill on now?", "Bill startet im 3. Stock. Er fährt mit dem Lift in den Stock, der 4-mal so hoch ist wie sein Startstock, plus 6. In welchem Stock ist Bill jetzt?", "Bill part du 3e étage. Il prend l’ascenseur jusqu’à l’étage qui vaut 4 fois son étage de départ plus 6. À quel étage est Bill maintenant ?", ["3*4", "12+6"], [12, 18], 18], ["Bailey starts with some money. Then she gets 5 francs of pocket money every week for 8 weeks. At the end she has 100 francs. How much money did she start with?", "Bailey hat etwas Geld. Dann bekommt sie 8 Wochen lang jede Woche 5 Franken Taschengeld. Am Schluss hat sie 100 Franken. Wie viel Geld hatte sie am Anfang?", "Bailey a un peu d’argent. Ensuite, elle reçoit 5 francs d’argent de poche chaque semaine pendant 8 semaines. À la fin, elle a 100 francs. Combien d’argent avait-elle au début ?", ["5*8", "100-40"], [40, 60], 60], ["After changing schools, Amy made 20 more friends than Lily. Lily made 50 friends. How many friends do Lily and Amy have together?", "Nach dem Schulwechsel fand Amy 20 Freundinnen und Freunde mehr als Lily. Lily fand 50. Wie viele Freundinnen und Freunde haben Lily und Amy zusammen?", "Après avoir changé d’école, Amy s’est fait 20 amis de plus que Lily. Lily s’est fait 50 amis. Combien d’amis Lily et Amy ont-elles ensemble ?", ["50+20", "70+50"], [70, 120], 120], ["Cody eats three times as many biscuits as Amir. If Amir eats 5 biscuits, how many biscuits do they eat together?", "Cody isst dreimal so viele Kekse wie Amir. Amir isst 5 Kekse. Wie viele Kekse essen die beiden zusammen?", "Cody mange trois fois plus de biscuits qu’Amir. Amir mange 5 biscuits. Combien de biscuits mangent-ils ensemble ?", ["5*3", "15+5"], [15, 20], 20], ["On Tuesday, Peter wants to exercise twice as long as on Sunday and Monday together. On Sunday he exercised for 23 minutes, on Monday for 16 minutes. How many minutes must he exercise on Tuesday?", "Am Dienstag will Peter doppelt so lange trainieren wie am Sonntag und Montag zusammen. Am Sonntag trainierte er 23 Minuten, am Montag 16 Minuten. Wie viele Minuten muss er am Dienstag trainieren?", "Mardi, Peter veut s’entraîner deux fois plus longtemps que dimanche et lundi réunis. Dimanche, il s’est entraîné 23 minutes et lundi 16 minutes. Combien de minutes doit-il s’entraîner mardi ?", ["23+16", "39*2"], [39, 78], 78], ["Joseph spent 500 francs in May. In June he spent 60 francs less. How much did he spend in the two months together?", "Joseph gab im Mai 500 Franken aus. Im Juni gab er 60 Franken weniger aus. Wie viel gab er in den beiden Monaten zusammen aus?", "Joseph a dépensé 500 francs en mai. En juin, il a dépensé 60 francs de moins. Combien a-t-il dépensé en tout pendant ces deux mois ?", ["500-60", "500+440"], [440, 940], 940], ["Martin weighs 55 kg. Carl weighs 16 kg more than Martin. Christian weighs 8 kg more than Carl. Harry weighs 5 kg less than Christian. How much does Harry weigh, in kg?", "Martin wiegt 55 kg. Carl wiegt 16 kg mehr als Martin. Christian wiegt 8 kg mehr als Carl. Harry wiegt 5 kg weniger als Christian. Wie viele kg wiegt Harry?", "Martin pèse 55 kg. Carl pèse 16 kg de plus que Martin. Christian pèse 8 kg de plus que Carl. Harry pèse 5 kg de moins que Christian. Combien de kg pèse Harry ?", ["55+16", "71+8", "79-5"], [71, 79, 74], 74], ["A tower is built from 4 blue blocks, twice as many yellow blocks and some red blocks. The tower has 32 blocks in total. How many red blocks are there?", "Ein Turm besteht aus 4 blauen Klötzen, doppelt so vielen gelben Klötzen und einigen roten Klötzen. Insgesamt sind es 32 Klötze. Wie viele rote Klötze sind es?", "Une tour est faite de 4 cubes bleus, de deux fois plus de cubes jaunes et de quelques cubes rouges. Il y a 32 cubes en tout. Combien y a-t-il de cubes rouges ?", ["4*2", "32-4-8"], [8, 20], 20], ["Patricia has 30 roses. She gives 24 roses to her mother. Then she buys 15 more. How many roses does she have now?", "Patricia hat 30 Rosen. Sie schenkt ihrer Mutter 24 Rosen. Dann kauft sie 15 neue. Wie viele Rosen hat sie jetzt?", "Patricia a 30 roses. Elle en offre 24 à sa mère. Puis elle en achète 15 de plus. Combien de roses a-t-elle maintenant ?", ["30-24", "6+15"], [6, 21], 21], ["Harold sleeps 10 hours a night. He works 2 hours less than he sleeps, and he walks his dog for 1 hour every day. How many hours of free time does he have left in a day?", "Harold schläft jede Nacht 10 Stunden. Er arbeitet 2 Stunden weniger, als er schläft, und geht jeden Tag 1 Stunde mit dem Hund spazieren. Wie viele Stunden Freizeit bleiben ihm pro Tag?", "Harold dort 10 heures par nuit. Il travaille 2 heures de moins qu’il ne dort et promène son chien 1 heure par jour. Combien d’heures de temps libre lui reste-t-il par jour ?", ["10-2", "10+8+1", "24-19"], [8, 19, 5], 5], ["Mum bought a set of flower pots for 19 francs and a bag of soil for 26 francs. At the till she used a voucher for 7 francs. How much did she pay?", "Mama kaufte Blumentöpfe für 19 Franken und einen Sack Erde für 26 Franken. An der Kasse löste sie einen Gutschein über 7 Franken ein. Wie viel bezahlte sie?", "Maman a acheté des pots de fleurs pour 19 francs et un sac de terreau pour 26 francs. À la caisse, elle a utilisé un bon de 7 francs. Combien a-t-elle payé ?", ["19+26", "45-7"], [45, 38], 38], ["James is building 4 tables. Each table has 4 legs and each leg needs 2 screws. He has 40 screws. How many screws will he have left over?", "James baut 4 Tische. Jeder Tisch hat 4 Beine und jedes Bein braucht 2 Schrauben. Er hat 40 Schrauben. Wie viele Schrauben bleiben übrig?", "James assemble 4 tables. Chaque table a 4 pieds et chaque pied a besoin de 2 vis. Il a 40 vis. Combien de vis lui restera-t-il ?", ["4*2", "8*4", "40-32"], [8, 32, 8], 8], ["Carmen has 100 francs. Samantha has 25 francs more than Carmen, and Daisy has 50 francs more than Samantha. How much do the three girls have together?", "Carmen hat 100 Franken. Samantha hat 25 Franken mehr als Carmen, und Daisy hat 50 Franken mehr als Samantha. Wie viel Geld haben die drei zusammen?", "Carmen a 100 francs. Samantha a 25 francs de plus que Carmen, et Daisy 50 francs de plus que Samantha. Combien d’argent les trois filles ont-elles ensemble ?", ["100+25", "125+50", "100+125+175"], [125, 175, 400], 400], ["Tommy sells brownies for 3 francs a piece and cheesecake for 4 francs a slice. He sells 43 brownies and 23 slices of cheesecake. How much money does he raise?", "Tommy verkauft Brownies für 3 Franken das Stück und Käsekuchen für 4 Franken das Stück. Er verkauft 43 Brownies und 23 Stück Käsekuchen. Wie viel Geld nimmt er ein?", "Tommy vend des brownies 3 francs la pièce et du gâteau au fromage 4 francs la part. Il vend 43 brownies et 23 parts de gâteau. Combien d’argent récolte-t-il ?", ["43*3", "23*4", "129+92"], [129, 92, 221], 221], ["Joelle has 5 orchids and 4 daisies on her balcony. Each orchid has 5 petals and each daisy has 10 petals. How many more petals do the daisies have than the orchids?", "Joelle hat 5 Orchideen und 4 Margeriten auf dem Balkon. Jede Orchidee hat 5 Blütenblätter, jede Margerite 10. Wie viele Blütenblätter haben die Margeriten mehr als die Orchideen?", "Joëlle a 5 orchidées et 4 marguerites sur son balcon. Chaque orchidée a 5 pétales et chaque marguerite 10. Combien de pétales les marguerites ont-elles de plus que les orchidées ?", ["5*5", "4*10", "40-25"], [25, 40, 15], 15], ["Lloyd earns 10 francs an hour for maths tutoring. He tutored for 5 hours in the first week and 8 hours in the second. How much did he earn in the two weeks?", "Lloyd verdient mit Nachhilfe in Mathe 10 Franken pro Stunde. In der ersten Woche gab er 5 Stunden, in der zweiten 8 Stunden. Wie viel verdiente er in den zwei Wochen?", "Lloyd gagne 10 francs de l’heure en donnant des cours de maths. Il a donné 5 heures la première semaine et 8 heures la deuxième. Combien a-t-il gagné en deux semaines ?", ["5+8", "13*10"], [13, 130], 130], ["Lindsay is doing the laundry. There are 50 socks to wash. She washes 10 pairs of socks and 15 single socks. How many socks has she missed?", "Lindsay wäscht Wäsche. 50 Socken müssen gewaschen werden. Sie wäscht 10 Paar Socken und 15 einzelne Socken. Wie viele Socken hat sie vergessen?", "Lindsay fait la lessive. Il y a 50 chaussettes à laver. Elle lave 10 paires de chaussettes et 15 chaussettes seules. Combien de chaussettes a-t-elle oubliées ?", ["10*2", "20+15", "50-35"], [20, 35, 15], 15], ["Violetta wants to buy crayons in 5 different colours and has 20 francs with her. One crayon costs 2 francs. How much change does she get?", "Violetta will Farbstifte in 5 verschiedenen Farben kaufen und hat 20 Franken dabei. Ein Farbstift kostet 2 Franken. Wie viel Rückgeld bekommt sie?", "Violetta veut acheter des crayons de 5 couleurs différentes et a 20 francs sur elle. Un crayon coûte 2 francs. Combien lui rend-on ?", ["5*2", "20-10"], [10, 10], 10], ["Carlos rents a canoe for 30 francs an hour and Benji rents a raft for 18 francs an hour. Carlos uses the canoe for 3 hours and Benji the raft for 5 hours. How much do they pay altogether?", "Carlos mietet ein Kanu für 30 Franken pro Stunde und Benji ein Floss für 18 Franken pro Stunde. Carlos fährt 3 Stunden, Benji 5 Stunden. Wie viel bezahlen sie zusammen?", "Carlos loue un canoë à 30 francs l’heure et Benji un radeau à 18 francs l’heure. Carlos l’utilise 3 heures et Benji 5 heures. Combien paient-ils en tout ?", ["30*3", "18*5", "90+90"], [90, 90, 180], 180], ["Sarah has 9 books. Joseph had twice as many books as Sarah, but he lost 2 of them. How many books does Joseph have now?", "Sarah hat 9 Bücher. Joseph hatte doppelt so viele Bücher wie Sarah, hat aber 2 verloren. Wie viele Bücher hat Joseph jetzt?", "Sarah a 9 livres. Joseph en avait deux fois plus que Sarah, mais il en a perdu 2. Combien de livres Joseph a-t-il maintenant ?", ["9*2", "18-2"], [18, 16], 16], ["Nick had twice as many sweets as George. Then George ate 5 sweets and now has 3 left. How many sweets does Nick have?", "Nick hatte doppelt so viele Bonbons wie George. Dann ass George 5 Bonbons und hat jetzt noch 3. Wie viele Bonbons hat Nick?", "Nick avait deux fois plus de bonbons que George. Puis George en a mangé 5 et il lui en reste 3. Combien de bonbons Nick a-t-il ?", ["5+3", "2*8"], [8, 16], 16], ["Caroline is three times as old as Ben. Ben is twice as old as Chris. If Chris is 4, how old is Caroline?", "Caroline ist dreimal so alt wie Ben. Ben ist doppelt so alt wie Chris. Chris ist 4 Jahre alt. Wie alt ist Caroline?", "Caroline a trois fois l’âge de Ben. Ben a deux fois l’âge de Chris. Chris a 4 ans. Quel âge a Caroline ?", ["4*2", "8*3"], [8, 24], 24], ["Jennifer bought 12 oranges at the market. She gave each of her three daughters 2 oranges and her son 3 oranges. How many oranges does she have left?", "Jennifer kaufte 12 Orangen auf dem Markt. Jede ihrer drei Töchter bekam 2 Orangen und ihr Sohn 3 Orangen. Wie viele Orangen bleiben ihr?", "Jennifer a acheté 12 oranges au marché. Elle a donné 2 oranges à chacune de ses trois filles et 3 à son fils. Combien d’oranges lui reste-t-il ?", ["3*2", "6+3", "12-9"], [6, 9, 3], 3]];

function wordItem(g,o){/* GSM8K problem: g=[en,de,fr,exprs,results,answer] */ const q=X(g[1],g[0],g[2]);const ex=g[3].map(e=>e.replace(/\*/g,' · ').replace(/-/g,' − ').replace(/\+/g,' + ').replace(/\s+/g,' ').trim());

  if(Math.random()<.5){const it=numItem(X('Welchen Wert hat die Ziffer ','What is the value of the digit ','Quelle est la valeur du chiffre ')+dig+X(' in ',' in ',' dans ')+fmtN(n)+X('? Sie steht bei den '+place(i)[0]+'.','? It is in the '+place(i)[1]+' place.',' ? Il est à la position des '+place(i)[2]+'.'),dig*10**i,{fig:()=>figPVT(n,cols)});

topic('m4-order',4,1,['Punkt vor Strich und Klammern','Order of operations','Priorités de calcul'],

topic('m5-large',5,1,['Grosse Zahlen: Million und Milliarde','Large numbers: million and billion','Grands nombres : million et milliard'],
 ['1 Million = 1 000 000 (6 Nullen), 1 Milliarde = 1 000 Millionen (9 Nullen). Lies grosse Zahlen in Dreiergruppen von rechts.','1 million = 1,000,000 (6 zeros), 1 billion = 1,000 million (9 zeros). Read large numbers in groups of three from the right.','1 million = 1 000 000 (6 zéros), 1 milliard = 1 000 millions (9 zéros). Lis les grands nombres par groupes de trois depuis la droite.'],['million'],
 lv=>{const k=ri(0,2);if(k===0){const q=pick([[X('Wie viele Nullen hat eine Million?','How many zeros does one million have?','Combien de zéros a un million ?'),6],[X('Wie viele Nullen hat eine Milliarde?','How many zeros does one billion have?','Combien de zéros a un milliard ?'),9],[X('Wie viele Tausender sind eine Million?','How many thousands make one million?','Combien de milliers font un million ?'),1000]]);
   return steps(numItem(q[0],q[1]),[X('1 Tausend = 1 000, 1 Million = 1 000 · 1 000.','1 thousand = 1,000, 1 million = 1,000 · 1,000.','1 millier = 1 000, 1 million = 1 000 · 1 000.'),X('1 Milliarde = 1 000 Millionen.','1 billion = 1,000 million.','1 milliard = 1 000 millions.'),String(q[1])]);}
  const n=ri(1,999)*1e6+ri(0,999)*1e3;if(k===1){const it=numItem(fmtN(n)+' + '+fmtN(1e6)+' = ?',n+1e6);return steps(it,[X('Schau auf die Millionen-Gruppe.','Look at the millions group.','Regarde le groupe des millions.'),X('Nur sie ändert sich um 1.','Only that group changes, by 1.','Seul ce groupe change de 1.'),fmtN(n+1e6)]);}
  const r=Math.round(n/1e6)*1e6;const it=numItem(X('Runde ','Round ','Arrondis ')+fmtN(n)+X(' auf Millionen.',' to the nearest million.',' au million près.'),r);return steps(it,[X('Schau auf die Hunderttausender: ','Look at the hundred-thousands: ','Regarde les centaines de milliers : ')+Math.floor(n/1e5)%10+'.',Math.floor(n/1e5)%10>=5?X('Aufrunden.','Round up.','On arrondit au-dessus.'):X('Abrunden.','Round down.','On arrondit en dessous.'),fmtN(r)]);});
topic('m5-decimals',5,1,['Dezimalzahlen verstehen','Understanding decimals','Comprendre les nombres décimaux'],
 ['Nach dem Komma kommen Zehntel, Hundertstel, Tausendstel: 3,47 = 3 + 4 Zehntel + 7 Hundertstel.','After the decimal point come tenths, hundredths, thousandths: 3.47 = 3 + 4 tenths + 7 hundredths.','Après la virgule viennent les dixièmes, centièmes, millièmes : 3,47 = 3 + 4 dixièmes + 7 centièmes.'],['decimal','tenth','hundredth'],
 lv=>{const k=ri(0,2);if(k===0){const v=ri(1,19)/10*(lv===3?1:1);const it={type:'numline',prompt:X('Tippe auf ','Tap ','Touche ')+fmtN(v)+'.',target:v,tol:0,answer:fmtN(v),nl:{a:0,b:2,minor:.1,labelEvery:lv===1?.5:1,snap:.1}};
   return steps(it,[X('Zwischen 0 und 1 liegen 10 Zehntel.','Between 0 and 1 there are 10 tenths.','Entre 0 et 1, il y a 10 dixièmes.'),X('Jeder kleine Strich ist 0,1.','Each small mark is 0.1.','Chaque petit trait vaut 0,1.').replace('0.1',fmtN(.1)).replace('0,1',fmtN(.1)),fmtN(v)]);}
  if(k===1){const a=ri(100,999)/100;const b=Math.round((a+pick([-1,1])*ri(1,30)/100)*100)/100;const r=a<b?'<':'>';const it=choiceItem(fmtN(a)+' ☐ '+fmtN(b),r,['<','>','='].filter(x=>x!==r));
   return steps(it,[X('Vergleiche zuerst die Ganzen, dann die Zehntel, dann die Hundertstel.','Compare the wholes first, then the tenths, then the hundredths.','Compare d’abord les entiers, puis les dixièmes, puis les centièmes.'),X('Schreibe beide mit gleich vielen Stellen nach dem Komma.','Write both with the same number of decimal places.','Écris les deux avec le même nombre de décimales.'),fmtN(a)+' '+r+' '+fmtN(b)]);}
  const e=ri(0,9),z=ri(1,9),hh=ri(0,9);const v=e+z/10+hh/100;const it=numItem(e+X(' Ganze, ',' wholes, ',' unités, ')+z+X(' Zehntel und ',' tenths and ',' dixièmes et ')+hh+X(' Hundertstel = ?',' hundredths = ?',' centièmes = ?'),Math.round(v*100)/100,{keys:','});
  return steps(it,[X('Die Ganzen stehen vor dem Komma.','The wholes go before the decimal point.','Les unités vont avant la virgule.'),X('Zehntel an der 1. Stelle danach, Hundertstel an der 2.','Tenths in the 1st place after it, hundredths in the 2nd.','Les dixièmes à la 1re position après, les centièmes à la 2e.'),fmtN(Math.round(v*100)/100)]);});
topic('m5-decaddsub',5,1,['Dezimalzahlen addieren und subtrahieren','Adding and subtracting decimals','Additionner et soustraire des décimaux'],
 ['Schreibe Komma unter Komma. Fehlende Stellen füllst du mit 0: 4,5 − 1,27 = 4,50 − 1,27.','Line up the decimal points. Fill missing places with 0: 4.5 − 1.27 = 4.50 − 1.27.','Aligne les virgules. Complète les positions manquantes par 0 : 4,5 − 1,27 = 4,50 − 1,27.'],['decimal'],
 lv=>{const d=lv===1?10:100;const a=ri(10,999)/d,b=ri(10,999)/d;const plus=Math.random()<.5;const A=Math.max(a,b),B=Math.min(a,b);const res=Math.round((plus?a+b:A-B)*100)/100;
  const it=numItem(plus?fmtN(a)+' + '+fmtN(b)+' = ?':fmtN(A)+' − '+fmtN(B)+' = ?',res,{keys:','});
  return steps(it,[X('Komma unter Komma schreiben, leere Stellen mit 0 füllen.','Line up the decimal points, fill empty places with 0.','Aligne les virgules, complète par des 0.'),X('Rechne wie mit ganzen Zahlen und setze das Komma an der gleichen Stelle.','Calculate as with whole numbers and keep the point in the same place.','Calcule comme avec des entiers et garde la virgule au même endroit.'),(plus?fmtN(a)+' + '+fmtN(b):fmtN(A)+' − '+fmtN(B))+' = '+fmtN(res)]);});
topic('m5-fracequiv',5,1,['Brüche erweitern und kürzen','Equivalent fractions','Fractions équivalentes'],
 ['Erweitern: Zähler und Nenner mit derselben Zahl malnehmen. Kürzen: beide durch dieselbe Zahl teilen. Der Wert bleibt gleich.','Expanding: multiply numerator and denominator by the same number. Simplifying: divide both by the same number. The value stays the same.','Amplifier : multiplier numérateur et dénominateur par le même nombre. Simplifier : les diviser par le même nombre. La valeur ne change pas.'],['numerator','denominator','simplify'],
 lv=>{const d=ri(2,9),n=ri(1,d-1),[rn,rd]=red2(n,d),f=ri(2,lv===1?4:9);if(Math.random()<.5){const it=numItem(fracStr(rn,rd)+' = '+'{f:?/'+rd*f+'}',rn*f);
   return steps(it,[X('Mit welcher Zahl wurde der Nenner malgenommen? ','What was the denominator multiplied by? ','Par quel nombre a-t-on multiplié le dénominateur ? ')+rd+' · ? = '+rd*f,X('Nimm den Zähler mit derselben Zahl mal.','Multiply the numerator by the same number.','Multiplie le numérateur par le même nombre.'),rn+' · '+f+' = '+rn*f]);}
  const it=numItem(X('Kürze so weit wie möglich: ','Simplify as far as possible: ','Simplifie au maximum : ')+fracStr(rn*f,rd*f),{re:rn/rd,im:0},{keys:'/',answer:fracTxt(rn,rd),reduce:true});
  return steps(it,[X('Suche die grösste Zahl, die Zähler und Nenner teilt.','Find the biggest number that divides both numerator and denominator.','Cherche le plus grand nombre qui divise le numérateur et le dénominateur.'),X('Hier: ','Here: ','Ici : ')+gcd(rn*f,rd*f)+'.',fracTxt(rn,rd)]);});
topic('m5-fraccompare',5,1,['Brüche vergleichen','Comparing fractions','Comparer des fractions'],
 ['Bei gleichem Nenner ist der Bruch mit dem grösseren Zähler grösser. Sonst bringst du beide auf den gleichen Nenner.','With the same denominator, the fraction with the bigger numerator is bigger. Otherwise give both the same denominator.','Avec le même dénominateur, la fraction au plus grand numérateur est la plus grande. Sinon, mets-les au même dénominateur.'],['denominator'],
 lv=>{let a,b;do{const d1=ri(2,lv===1?8:12),d2=lv===1?d1:ri(2,12);a=[ri(1,d1-1),d1];b=[ri(1,d2-1),d2];}while(a[0]*b[1]===b[0]*a[1]&&Math.random()<.8);
  const va=a[0]/a[1],vb=b[0]/b[1];const r=Math.abs(va-vb)<1e-9?'=':va<vb?'<':'>';const L=a[1]*b[1]/gcd(a[1],b[1]);
  const it=choiceItem(fracStr(a[0],a[1])+' ☐ '+fracStr(b[0],b[1]),r,['<','>','='].filter(x=>x!==r));
  return steps(it,[a[1]===b[1]?X('Gleicher Nenner: vergleiche die Zähler.','Same denominator: compare the numerators.','Même dénominateur : compare les numérateurs.'):X('Gemeinsamer Nenner: ','Common denominator: ','Dénominateur commun : ')+L+'.',a[1]===b[1]?a[0]+X(' und ',' and ',' et ')+b[0]+'.':fracTxt(a[0]*L/a[1],L)+X(' und ',' and ',' et ')+fracTxt(b[0]*L/b[1],L)+'.',fracTxt(a[0],a[1])+' '+r+' '+fracTxt(b[0],b[1])]);});
topic('m5-fracsame',5,1,['Gleichnamige Brüche und Bruchteile','Like fractions and fractions of amounts','Fractions de même dénominateur et fractions d’une quantité'],
 ['Gleiche Nenner: nur die Zähler addieren oder subtrahieren. 3/4 von 20: zuerst 20 : 4 = 5, dann 5 · 3 = 15.','Same denominators: only add or subtract the numerators. 3/4 of 20: first 20 : 4 = 5, then 5 · 3 = 15.','Même dénominateur : on additionne ou soustrait seulement les numérateurs. 3/4 de 20 : d’abord 20 : 4 = 5, puis 5 · 3 = 15.'],['numerator','denominator'],
 lv=>{const d=ri(3,12);if(Math.random()<.5){const a=ri(1,d-1),b=ri(1,d-1);const plus=Math.random()<.5||a===b;const A=plus?a:Math.max(a,b),B=plus?b:Math.min(a,b);const rn=plus?A+B:A-B;
   const it=numItem(fracStr(A,d)+(plus?' + ':' − ')+fracStr(B,d)+' = ?',{re:rn/d,im:0},{keys:'/',answer:fracTxt(...red2(rn,d))});
   return steps(it,[X('Der Nenner bleibt ','The denominator stays ','Le dénominateur reste ')+d+'.',X('Rechne nur mit den Zählern: ','Work only with the numerators: ','Calcule seulement avec les numérateurs : ')+A+(plus?' + ':' − ')+B+' = '+rn+'.',fracTxt(rn,d)+(gcd(rn,d)>1?' = '+fracTxt(...red2(rn,d)):'')]);}
  const k=ri(1,d-1),m=ri(2,lv===1?5:12);const it=numItem(fracStr(k,d)+X(' von ',' of ',' de ')+d*m+' = ?',k*m);
  return steps(it,[X('Zuerst durch den Nenner: ','First divide by the denominator: ','D’abord divise par le dénominateur : ')+d*m+' : '+d+' = '+m+'.',X('Dann mal den Zähler: ','Then times the numerator: ','Puis multiplie par le numérateur : ')+m+' · '+k+'.',String(k*m)]);});
topic('m5-mult',5,1,['Schriftlich multiplizieren mit mehreren Ziffern','Long multiplication','Multiplication posée à plusieurs chiffres'],
 ['Multipliziere mit jeder Ziffer des zweiten Faktors einzeln, rücke jede Zeile um eine Stelle ein und addiere am Schluss.','Multiply by each digit of the second factor separately, shift each row one place and add at the end.','Multiplie par chaque chiffre du deuxième facteur séparément, décale chaque ligne d’une position et additionne à la fin.'],['product'],
 lv=>{const a=ri(lv===1?12:100,lv===1?99:999),b=ri(12,lv===3?999:99);const it=numItem(X('Rechne schriftlich: ','Work it out: ','Pose le calcul : ')+fmtN(a)+' · '+fmtN(b),a*b,{fig:()=>figColMul(a,b)});
  const bz=b-b%10;return steps(it,[X('Überschlag: ','Estimate: ','Estimation : ')+fmtN(Math.round(a/10)*10)+' · '+fmtN(Math.round(b/10)*10)+' ≈ '+fmtN(Math.round(a/10)*10*Math.round(b/10)*10)+'.',fmtN(a)+' · '+fmtN(bz)+' = '+fmtN(a*bz)+X(' und ',' and ',' et ')+fmtN(a)+' · '+b%10+' = '+fmtN(a*(b%10))+'.',fmtN(a*bz)+' + '+fmtN(a*(b%10))+' = '+fmtN(a*b)]);});
topic('m5-div',5,1,['Schriftlich dividieren','Long division','Division posée'],
 ['Teile von links nach rechts Stelle für Stelle. Was übrig bleibt, nimmst du mit zur nächsten Stelle.','Divide from left to right, place by place. Whatever is left over is carried to the next place.','Divise de gauche à droite, chiffre par chiffre. Ce qui reste passe à la position suivante.'],['quotient','remainder'],
 lv=>{const b=lv===3?ri(11,25):ri(2,9),q=ri(lv===1?101:201,lv===1?999:3999);const n=b*q;const it=numItem(fmtN(n)+' : '+b+' = ?',q);
  const first=+String(n)[0]>=b?+String(n)[0]:+String(n).slice(0,2);return steps(it,[X('Beginne links: Wie oft passt ','Start on the left: how many times does ','Commence à gauche : combien de fois ')+b+X(' in ',' go into ',' dans ')+first+'? → '+Math.floor(first/b)+X(', Rest ',', remainder ',', reste ')+first%b+'.',X('Hole die nächste Ziffer herunter und teile wieder.','Bring down the next digit and divide again.','Abaisse le chiffre suivant et divise à nouveau.'),fmtN(n)+' : '+b+' = '+fmtN(q)]);});
topic('m5-primes',5,1,['Teilbarkeit und Primzahlen','Divisibility and prime numbers','Divisibilité et nombres premiers'],
 ['Eine Primzahl hat genau zwei Teiler: 1 und sich selbst (2, 3, 5, 7, 11 …). Teilbar durch 3: Quersumme durch 3 teilbar. Durch 5: endet auf 0 oder 5.','A prime number has exactly two factors: 1 and itself (2, 3, 5, 7, 11 …). Divisible by 3: digit sum divisible by 3. By 5: ends in 0 or 5.','Un nombre premier a exactement deux diviseurs : 1 et lui-même (2, 3, 5, 7, 11 …). Divisible par 3 : somme des chiffres divisible par 3. Par 5 : se termine par 0 ou 5.'],['prime','divisor','digitsum'],
 lv=>{const Y=X('ja','yes','oui'),N=X('nein','no','non');if(Math.random()<.5){const n=ri(2,lv===1?30:100);let p=n>1;for(let d=2;d*d<=n;d++)if(n%d===0)p=false;let dd=0;for(let d=2;d*d<=n;d++)if(n%d===0){dd=d;break;}
   const it=choiceItem(X('Ist ','Is ','')+n+X(' eine Primzahl?',' a prime number?',' est-il un nombre premier ?'),p?Y:N,[p?N:Y]);return steps(it,[X('Prüfe die Teiler 2, 3, 5, 7 …','Test the divisors 2, 3, 5, 7 …','Teste les diviseurs 2, 3, 5, 7 …'),p?X('Keiner geht ohne Rest auf.','None divides without a remainder.','Aucun ne tombe juste.'):n+' : '+dd+' = '+n/dd+'.',p?Y:N]);}
  const d=pick([2,3,5,9,10]);const n=ri(100,lv===1?999:99999);const ok=n%d===0;const qs=String(n).split('').reduce((a,b)=>a+ +b,0);
  const rule={2:X('Die letzte Ziffer muss gerade sein.','The last digit must be even.','Le dernier chiffre doit être pair.'),3:X('Die Quersumme muss durch 3 teilbar sein: ','The digit sum must be divisible by 3: ','La somme des chiffres doit être divisible par 3 : ')+qs+'.',5:X('Die Zahl muss auf 0 oder 5 enden.','It must end in 0 or 5.','Il doit se terminer par 0 ou 5.'),9:X('Die Quersumme muss durch 9 teilbar sein: ','The digit sum must be divisible by 9: ','La somme des chiffres doit être divisible par 9 : ')+qs+'.',10:X('Die Zahl muss auf 0 enden.','It must end in 0.','Il doit se terminer par 0.')}[d];
  const it=choiceItem(X('Ist ','Is ','')+fmtN(n)+X(' durch '+d+' teilbar?',' divisible by '+d+'?',' est-il divisible par '+d+' ?'),ok?Y:N,[ok?N:Y]);return steps(it,[X('Regel für ','Rule for ','Règle pour ')+d+': '+rule,X('Prüfe die Regel.','Apply the rule.','Applique la règle.'),ok?Y:N]);});
topic('m5-powers',5,1,['Quadratzahlen und Zehnerpotenzen','Square numbers and powers of ten','Nombres carrés et puissances de dix'],
 ['7² heisst 7 · 7 = 49. 10³ heisst 10 · 10 · 10 = 1000: Die Hochzahl zählt die Nullen.','7² means 7 · 7 = 49. 10³ means 10 · 10 · 10 = 1000: the exponent counts the zeros.','7² veut dire 7 · 7 = 49. 10³ veut dire 10 · 10 · 10 = 1000 : l’exposant compte les zéros.'],['square','power'],
 lv=>{if(Math.random()<.6){const n=ri(2,lv===1?10:20);const it=numItem(n+'² = ?',n*n);return steps(it,[n+'² = '+n+' · '+n+'.',n>10?X('Zerlege: ','Split: ','Décompose : ')+n+' · 10 + '+n+' · '+(n-10)+'.':X('Das ist eine Einmaleins-Aufgabe.','This is a times-table fact.','C’est un calcul des tables.'),String(n*n)]);}
  const e=ri(2,6);const it=numItem('10'+['⁰','¹','²','³','⁴','⁵','⁶'][e]+' = ?',10**e);return steps(it,[X('Die Hochzahl sagt, wie oft 10 malgenommen wird.','The exponent says how many times 10 is multiplied.','L’exposant dit combien de fois on multiplie 10.'),X('Also eine 1 mit ','So a 1 with ','Donc un 1 suivi de ')+e+X(' Nullen.',' zeros.',' zéros.'),fmtN(10**e)]);});
topic('m5-word',5,1,['Sachaufgaben in Schritten','Step-by-step word problems','Problèmes par étapes'],
 ['Zerlege die Aufgabe in Schritte und schreibe zu jedem Schritt eine Rechnung. Prüfe am Schluss mit einem Überschlag.','Break the problem into steps with one calculation each. Check at the end with an estimate.','Découpe le problème en étapes avec un calcul chacune. Vérifie à la fin avec une estimation.'],['sum','product'],
 lv=>wordItem(pick(GSM.filter(g=>g[3].length>=(lv===1?1:2)))));
topic('m5-angles',5,2,['Winkel messen','Measuring angles','Mesurer des angles'],
 ['Lege den Winkelmesser mit der Mitte auf den Scheitel und die Null auf einen Schenkel. Lies dort ab, wo der andere Schenkel die Skala schneidet.','Put the centre of the protractor on the vertex and zero on one arm. Read where the other arm crosses the scale.','Place le centre du rapporteur sur le sommet et le zéro sur un côté. Lis là où l’autre côté coupe la graduation.'],['degree','angle'],
 lv=>{const d=lv===1?ri(1,17)*10:ri(5,175);const it=numItem(X('Wie gross ist der Winkel? (in Grad)','How big is the angle? (in degrees)','Quelle est la mesure de l’angle ? (en degrés)'),d,{fig:()=>figProtractor(d),tol:lv===1?0:2});
  return steps(it,[X('Ein Schenkel liegt auf 0°.','One arm lies on 0°.','Un côté est sur 0°.'),d<90?X('Der Winkel ist kleiner als ein rechter Winkel (90°).','The angle is smaller than a right angle (90°).','L’angle est plus petit qu’un angle droit (90°).'):d>90?X('Der Winkel ist grösser als 90°.','The angle is bigger than 90°.','L’angle est plus grand que 90°.'):X('Es ist ein rechter Winkel.','It is a right angle.','C’est un angle droit.'),d+'°']);});
topic('m5-angletypes',5,2,['Winkelarten','Types of angles','Types d’angles'],
 ['Spitz: kleiner als 90°. Recht: genau 90°. Stumpf: zwischen 90° und 180°. Gestreckt: 180°. Überstumpf: mehr als 180°.','Acute: less than 90°. Right: exactly 90°. Obtuse: between 90° and 180°. Straight: 180°. Reflex: more than 180°.','Aigu : moins de 90°. Droit : exactement 90°. Obtus : entre 90° et 180°. Plat : 180°. Rentrant : plus de 180°.'],['acute','obtuse','rightangle'],
 lv=>{const T=[['spitz','acute','aigu',[10,89]],['recht','right','droit',[90,90]],['stumpf','obtuse','obtus',[91,179]],['gestreckt','straight','plat',[180,180]],['überstumpf','reflex','rentrant',[181,350]]].slice(0,lv===1?3:5);
  const k=ri(0,T.length-1);const d=ri(T[k][3][0],T[k][3][1]);const it=choiceItem(X('Welche Winkelart hat ','What type of angle is ','Quel type d’angle mesure ')+d+'°?',X(T[k][0],T[k][1],T[k][2]),T.filter((x,i)=>i!==k).map(x=>X(x[0],x[1],x[2])),{fig:d<=180?()=>figProtractor(d):null});
  return steps(it,[X('Vergleiche mit 90° und 180°.','Compare with 90° and 180°.','Compare avec 90° et 180°.'),d+'° '+(d<90?'< 90°':d===90?'= 90°':d<180?X('liegt zwischen 90° und 180°','is between 90° and 180°','est entre 90° et 180°'):d===180?'= 180°':'> 180°')+'.',X(T[k][0],T[k][1],T[k][2])]);});
topic('m5-composite',5,2,['Zusammengesetzte Flächen','Composite areas','Aires composées'],
 ['Zerlege die Figur in Rechtecke, berechne jede Fläche und addiere. Oder: grosses Rechteck minus das fehlende Stück.','Split the shape into rectangles, work out each area and add. Or: big rectangle minus the missing piece.','Découpe la figure en rectangles, calcule chaque aire et additionne. Ou : grand rectangle moins la partie manquante.'],['area'],
 lv=>{const W=ri(5,10),H=ri(4,8),w=ri(2,W-2),h2=ri(2,H-2);const area=W*H-w*h2;const c=30;
  const fig=()=>{const s=svgBox((W+2)*c,(H+2)*c);for(let r=0;r<=H+2;r++)s.append(sv('line',{x1:0,y1:r*c,x2:(W+2)*c,y2:r*c,stroke:GRID}));for(let q=0;q<=W+2;q++)s.append(sv('line',{x1:q*c,y1:0,x2:q*c,y2:(H+2)*c,stroke:GRID}));
   s.append(sv('path',{d:`M${c} ${c} h${(W-w)*c} v${h2*c} h${w*c} v${(H-h2)*c} h${-W*c} z`,fill:'#C8D3DE',stroke:INK,'stroke-width':4}));
   s.append(stx(c+W*c/2,(H+1)*c+22,W+' cm',{'font-size':14}),stx(c+6,c+H*c/2+(h2<H/2?c:0),H+' cm',{'font-size':14,'text-anchor':'start'}),stx(c+(W-w)*c+w*c/2,c+h2*c-6,w+' cm',{'font-size':13,fill:RED}),stx(c+(W-w)*c+6,c+h2*c/2,h2+' cm',{'font-size':13,fill:RED,'text-anchor':'start'}));return s;};
  const it=numItem(X('Wie gross ist die Fläche der Figur in cm²? (1 Häuschen = 1 cm²)','What is the area of the shape in cm²? (1 square = 1 cm²)','Quelle est l’aire de la figure en cm² ? (1 carreau = 1 cm²)'),area,{fig});
  return steps(it,[X('Denke dir das ganze Rechteck: ','Imagine the whole rectangle: ','Imagine le rectangle entier : ')+W+' · '+H+' = '+W*H+' cm².',X('Das fehlende Stück: ','The missing piece: ','La partie manquante : ')+w+' · '+h2+' = '+w*h2+' cm².',W*H+' − '+w*h2+' = '+area+' cm²']);});
topic('m5-volume',5,2,['Volumen mit Würfeln','Volume with cubes','Volume avec des cubes'],
 ['Das Volumen zählt, wie viele Einheitswürfel in einen Körper passen. Beim Quader: Länge · Breite · Höhe.','Volume counts how many unit cubes fit into a solid. For a cuboid: length · width · height.','Le volume compte combien de cubes unités tiennent dans un solide. Pour un pavé : longueur · largeur · hauteur.'],['volume','cuboid'],
 lv=>{const a=ri(2,lv===1?4:6),b=ri(1,lv===1?3:4),c=ri(1,lv===1?3:4);const it=numItem(X('Aus wie vielen Würfeln besteht der Quader?','How many cubes make up the cuboid?','De combien de cubes le pavé est-il fait ?'),a*b*c,{fig:()=>figCuboid(a,b,c)});
  return steps(it,[X('Eine Schicht: ','One layer: ','Une couche : ')+a+' · '+b+' = '+a*b+X(' Würfel.',' cubes.',' cubes.'),X('Es gibt ','There are ','Il y a ')+c+X(' Schichten.',' layers.',' couches.'),a*b+' · '+c+' = '+a*b*c]);});
topic('m5-symaxes',5,2,['Symmetrieachsen zählen','Counting lines of symmetry','Compter les axes de symétrie'],
 ['Eine Symmetrieachse teilt eine Figur in zwei spiegelgleiche Hälften. Manche Figuren haben mehrere, manche keine.','A line of symmetry splits a shape into two mirror-image halves. Some shapes have several, some none.','Un axe de symétrie partage une figure en deux moitiés identiques en miroir. Certaines figures en ont plusieurs, d’autres aucun.'],['axis'],
 lv=>{const F=[['square',4],['rectangle',2],['rhombus',2],['parallelogram',0],['kite',1],['trapezoid',1]];const f=pick(F);const it=numItem(X('Wie viele Symmetrieachsen hat diese Figur?','How many lines of symmetry does this shape have?','Combien d’axes de symétrie cette figure a-t-elle ?'),f[1],{fig:()=>figQuad(f[0])});
  return steps(it,[X('Probiere senkrechte und waagrechte Achsen.','Try vertical and horizontal lines.','Essaie des axes vertical et horizontal.'),X('Probiere auch die Diagonalen.','Also try the diagonals.','Essaie aussi les diagonales.'),String(f[1])]);});
topic('m5-coords',5,2,['Koordinatensystem','Coordinate system','Repère'],
 ['Im Koordinatensystem gibst du zuerst x (waagrecht), dann y (senkrecht) an. Der Nullpunkt ist (0 | 0).','In a coordinate system you give x (horizontal) first, then y (vertical). The origin is (0 | 0).','Dans un repère, on donne d’abord x (horizontal), puis y (vertical). L’origine est (0 | 0).'],['coordinate'],
 lv=>{const x=ri(0,10),y=ri(0,8);const it={type:'coord',prompt:X('Tippe auf den Punkt ','Tap the point ','Touche le point ')+'('+x+' | '+y+').',tx:x,ty:y,grid:{x0:0,x1:10,y0:0,y1:8},answer:'('+x+' | '+y+')'};
  return steps(it,[X('Zuerst x: ','First x: ','D’abord x : ')+x+X(' nach rechts.',' to the right.',' vers la droite.'),X('Dann y: ','Then y: ','Puis y : ')+y+X(' nach oben.',' up.',' vers le haut.'),'('+x+' | '+y+')']);});
topic('m5-decunits',5,3,['Masse mit Dezimalzahlen','Measures with decimals','Mesures avec des décimaux'],
 ['1,25 m = 125 cm, 3,5 km = 3500 m, 0,75 kg = 750 g. Das Komma verschiebt sich beim Umrechnen.','1.25 m = 125 cm, 3.5 km = 3,500 m, 0.75 kg = 750 g. The decimal point moves when converting.','1,25 m = 125 cm, 3,5 km = 3 500 m, 0,75 kg = 750 g. La virgule se déplace lors de la conversion.'],['m','km','kg'],
 lv=>{const P=[['m','cm',100],['km','m',1000],['kg','g',1000],['l','ml',1000],['m','mm',1000]];const[u1,u2,f]=pick(P);const v=ri(1,lv===1?99:999)/(f===100?100:lv===1?10:100);const back=Math.random()<.5;
  const big=Math.round(v*f);const it=back?numItem(fmtN(big)+' '+u2+' = ? '+u1,Math.round(big/f*1000)/1000,{keys:','}):numItem(fmtN(v)+' '+u1+' = ? '+u2,big);
  return steps(it,['1 '+u1+' = '+fmtN(f)+' '+u2+'.',back?X('Teile durch ','Divide by ','Divise par ')+fmtN(f)+X(': Das Komma rückt nach links.',': the point moves left.',' : la virgule se déplace vers la gauche.'):X('Mal ','Times ','Fois ')+fmtN(f)+X(': Das Komma rückt nach rechts.',': the point moves right.',' : la virgule se déplace vers la droite.'),back?fmtN(Math.round(big/f*1000)/1000)+' '+u1:fmtN(big)+' '+u2]);});
topic('m5-areaunits',5,3,['Flächeneinheiten','Units of area','Unités d’aire'],
 ['1 dm² = 100 cm², 1 m² = 100 dm² = 10 000 cm². Bei Flächen ist der Umrechnungsschritt 100, nicht 10.','1 dm² = 100 cm², 1 m² = 100 dm² = 10,000 cm². For areas the conversion step is 100, not 10.','1 dm² = 100 cm², 1 m² = 100 dm² = 10 000 cm². Pour les aires, le facteur est 100, pas 10.'],['cm2','m2'],
 lv=>{const P=[['dm²','cm²',100],['m²','dm²',100],['m²','cm²',10000],['a','m²',100],['ha','a',100]].slice(0,lv===1?2:5);const[u1,u2,f]=pick(P);const k=ri(1,9);const it=numItem(k+' '+u1+' = ? '+u2,k*f);
  return steps(it,['1 '+u1+' = '+fmtN(f)+' '+u2+'.',k+' · '+fmtN(f)+'.',fmtN(k*f)+' '+u2]);});
topic('m5-proportion',5,3,['Dreisatz','Unitary method','Règle de trois'],
 ['Rechne zuerst auf 1 zurück, dann auf die gesuchte Menge: 3 Brote kosten 9 Fr. → 1 Brot 3 Fr. → 5 Brote 15 Fr.','Work back to 1 first, then to the amount you want: 3 loaves cost CHF 9 → 1 loaf CHF 3 → 5 loaves CHF 15.','Reviens d’abord à 1, puis à la quantité cherchée : 3 pains coûtent 9 fr. → 1 pain 3 fr. → 5 pains 15 fr.'],['proportional'],
 lv=>{const unit=ri(2,lv===1?9:25),a=ri(2,6),b=ri(2,12);const ctx=pick([['Hefte','notebooks','cahiers'],['Brote','loaves','pains'],['Tickets','tickets','billets']]);
  const it=numItem(X(`${a} ${ctx[0]} kosten ${a*unit} Franken. Was kosten ${b} ${ctx[0]}?`,`${a} ${ctx[1]} cost ${a*unit} francs. What do ${b} ${ctx[1]} cost?`,`${a} ${ctx[2]} coûtent ${a*unit} francs. Combien coûtent ${b} ${ctx[2]} ?`),b*unit);
  return steps(it,[X('Rechne zuerst den Preis für 1: ','First find the price of 1: ','Calcule d’abord le prix pour 1 : ')+a*unit+' : '+a+' = '+unit+'.',X('Dann für ','Then for ','Puis pour ')+b+': '+unit+' · '+b+'.',b*unit+X(' Franken',' francs',' francs')]);});
topic('m5-scale',5,3,['Massstab','Scale','Échelle'],
 ['Massstab 1 : 100 heisst: 1 cm auf dem Plan sind 100 cm = 1 m in Wirklichkeit.','Scale 1 : 100 means 1 cm on the plan is 100 cm = 1 m in reality.','L’échelle 1 : 100 veut dire que 1 cm sur le plan vaut 100 cm = 1 m en réalité.'],['scale'],
 lv=>{const m=pick(lv===1?[100,1000]:[100,1000,25000,50000]);const cm=ri(2,12);const realCm=cm*m;const unitT=realCm>=100000?'km':'m';const real=unitT==='km'?realCm/100000:realCm/100;
  const it=numItem(X(`Auf einer Karte im Massstab 1 : ${fmtN(m)} misst ein Weg ${cm} cm. Wie lang ist er in Wirklichkeit (in ${unitT})?`,`On a map at scale 1 : ${fmtN(m)} a path measures ${cm} cm. How long is it in reality (in ${unitT})?`,`Sur une carte à l’échelle 1 : ${fmtN(m)}, un chemin mesure ${cm} cm. Quelle est sa longueur réelle (en ${unitT}) ?`),real,{keys:','});
  return steps(it,[X('1 cm auf der Karte = ','1 cm on the map = ','1 cm sur la carte = ')+fmtN(m)+X(' cm in Wirklichkeit.',' cm in reality.',' cm en réalité.'),cm+' · '+fmtN(m)+' = '+fmtN(realCm)+' cm.',fmtN(real)+' '+unitT]);});
topic('m5-mean',5,3,['Durchschnitt','Average (mean)','Moyenne'],
 ['Den Durchschnitt findest du so: alle Werte addieren und durch die Anzahl der Werte teilen.','To find the average, add all the values and divide by how many values there are.','Pour trouver la moyenne, additionne toutes les valeurs et divise par leur nombre.'],['mean'],
 lv=>{const n=ri(3,lv===1?4:6),m=ri(3,lv===1?9:50);let vals=Array.from({length:n},()=>m+ri(-3,3));const diff=vals.reduce((a,b)=>a+b,0)-n*m;vals[0]-=diff;if(vals[0]<0)vals[0]=m;const s=vals.reduce((a,b)=>a+b,0);
  const it=numItem(X('Wie gross ist der Durchschnitt von ','What is the average of ','Quelle est la moyenne de ')+vals.join(', ')+'?',s/n,{keys:','});
  return steps(it,[X('Addiere alle Werte: ','Add all the values: ','Additionne toutes les valeurs : ')+vals.join(' + ')+' = '+s+'.',X('Teile durch die Anzahl: ','Divide by how many there are: ','Divise par leur nombre : ')+s+' : '+n+'.',fmtN(s/n)]);});
topic('m5-probability',5,3,['Wahrscheinlichkeit als Bruch','Probability as a fraction','Probabilité sous forme de fraction'],
 ['Wahrscheinlichkeit = günstige Fälle : alle Fälle. Beim Würfel ist die Chance für eine 6 genau 1/6.','Probability = favourable outcomes : all outcomes. With a dice the chance of a 6 is exactly 1/6.','Probabilité = cas favorables : cas possibles. Avec un dé, la probabilité d’obtenir 6 est 1/6.'],['probability'],
 lv=>{if(Math.random()<.5){const ev=pick([[X('eine gerade Zahl','an even number','un nombre pair'),3],[X('eine 6','a 6','un 6'),1],[X('eine Zahl grösser als 4','a number bigger than 4','un nombre plus grand que 4'),2],[X('eine Zahl kleiner als 3','a number smaller than 3','un nombre plus petit que 3'),2]]);
   const it=numItem(X('Du würfelst einmal. Wie gross ist die Wahrscheinlichkeit für ','You roll a dice once. What is the probability of ','Tu lances un dé une fois. Quelle est la probabilité d’obtenir ')+ev[0]+'? '+X('(als Bruch)','(as a fraction)','(en fraction)'),{re:ev[1]/6,im:0},{keys:'/',answer:fracTxt(...red2(ev[1],6))});
   return steps(it,[X('Ein Würfel hat 6 mögliche Ergebnisse.','A dice has 6 possible outcomes.','Un dé a 6 résultats possibles.'),X('Günstige Fälle: ','Favourable outcomes: ','Cas favorables : ')+ev[1]+'.',ev[1]+'/6'+(gcd(ev[1],6)>1?' = '+fracTxt(...red2(ev[1],6)):'')]);}
  const r=ri(1,6),b=ri(1,6);const it=numItem(X(`In einem Sack sind ${r} rote und ${b} blaue Kugeln. Wie gross ist die Wahrscheinlichkeit, eine rote zu ziehen? (als Bruch)`,`A bag holds ${r} red and ${b} blue marbles. What is the probability of drawing a red one? (as a fraction)`,`Un sac contient ${r} billes rouges et ${b} bleues. Quelle est la probabilité de tirer une rouge ? (en fraction)`),{re:r/(r+b),im:0},{keys:'/',answer:fracTxt(...red2(r,r+b)),fig:()=>figMarbles(r,b)});
  return steps(it,[X('Alle Kugeln: ','All marbles: ','Toutes les billes : ')+r+' + '+b+' = '+(r+b)+'.',X('Rote Kugeln: ','Red marbles: ','Billes rouges : ')+r+'.',r+'/'+(r+b)]);});
/* ---- Year 6 ---- */
topic('m6-negative',6,1,['Negative Zahlen','Negative numbers','Nombres négatifs'],
 ['Zahlen unter null heissen negativ: −5 °C ist 5 Grad unter null. Auf dem Zahlenstrahl stehen sie links von 0.','Numbers below zero are negative: −5 °C is 5 degrees below zero. On the number line they are left of 0.','Les nombres sous zéro sont négatifs : −5 °C, c’est 5 degrés sous zéro. Sur la droite numérique, ils sont à gauche de 0.'],['negative'],
 lv=>{const k=ri(0,2);if(k===0){const t0=ri(-15,25);const it=numItem(X('Welche Temperatur zeigt das Thermometer? (in °C)','What temperature does the thermometer show? (in °C)','Quelle température le thermomètre indique-t-il ? (en °C)'),t0,{fig:()=>figThermo(t0),keys:'-'});
   return steps(it,[X('Jeder kleine Strich ist 2 Grad.','Each small mark is 2 degrees.','Chaque petit trait vaut 2 degrés.'),t0<0?X('Die Säule endet unter 0: die Zahl ist negativ.','The column ends below 0: the number is negative.','La colonne s’arrête sous 0 : le nombre est négatif.'):X('Die Säule endet über 0.','The column ends above 0.','La colonne s’arrête au-dessus de 0.'),fmtN(t0)+' °C']);}
  if(k===1){const a=ri(-10,10),d=ri(2,12);const up=Math.random()<.5;const r=up?a+d:a-d;const it=numItem(X(`Es ist ${fmtN(a)} °C. Die Temperatur ${up?'steigt':'sinkt'} um ${d} Grad. Wie warm ist es jetzt?`,`It is ${fmtN(a)} °C. The temperature ${up?'rises':'falls'} by ${d} degrees. What is it now?`,`Il fait ${fmtN(a)} °C. La température ${up?'monte':'baisse'} de ${d} degrés. Combien fait-il maintenant ?`),r,{keys:'-'});
   return steps(it,[X('Stell dir das Thermometer vor.','Picture the thermometer.','Imagine le thermomètre.'),fmtN(a)+(up?' + ':' − ')+d+'.',fmtN(r)+' °C']);}
  const v=ri(-9,9);const it={type:'numline',prompt:X('Tippe auf ','Tap ','Touche ')+fmtN(v)+'.',target:v,tol:0,answer:fmtN(v),nl:{a:-10,b:10,minor:1,labelEvery:lv===1?1:5,snap:1}};
  return steps(it,[X('Negative Zahlen liegen links von 0.','Negative numbers are left of 0.','Les nombres négatifs sont à gauche de 0.'),X('Zähle von 0 aus ','Count from 0 ','Compte à partir de 0 ')+Math.abs(v)+X(' Schritte.',' steps.',' pas.'),fmtN(v)]);});
topic('m6-fracadd',6,1,['Brüche mit verschiedenen Nennern','Fractions with different denominators','Fractions de dénominateurs différents'],
 ['Suche einen gemeinsamen Nenner, erweitere beide Brüche und rechne dann mit den Zählern: 1/3 + 1/4 = 4/12 + 3/12 = 7/12.','Find a common denominator, expand both fractions, then work with the numerators: 1/3 + 1/4 = 4/12 + 3/12 = 7/12.','Trouve un dénominateur commun, amplifie les deux fractions, puis calcule avec les numérateurs : 1/3 + 1/4 = 4/12 + 3/12 = 7/12.'],['denominator','simplify'],
 lv=>genArith(lv===1?1:2,{sets:['frac'],ops:[pick(['+','-'])],range:[0,1]}));
topic('m6-fracmult',6,1,['Brüche multiplizieren und dividieren','Multiplying and dividing fractions','Multiplier et diviser des fractions'],
 ['Zähler mal Zähler, Nenner mal Nenner. Durch einen Bruch teilen heisst mit dem Kehrwert malnehmen.','Numerator times numerator, denominator times denominator. Dividing by a fraction means multiplying by its reciprocal.','Numérateur fois numérateur, dénominateur fois dénominateur. Diviser par une fraction, c’est multiplier par son inverse.'],['reciprocal'],
 lv=>{if(lv===1){const d=ri(2,9),n=ri(1,d-1),k=ri(2,9);const [rn,rd]=red2(n*k,d);const it=numItem(k+' · '+fracStr(n,d)+' = ?',{re:n*k/d,im:0},{keys:'/',answer:fracTxt(rn,rd)});
   return steps(it,[X('Nur der Zähler wird malgenommen: ','Only the numerator is multiplied: ','Seul le numérateur est multiplié : ')+k+' · '+n+' = '+n*k+'.',X('Kürze, wenn möglich.','Simplify if possible.','Simplifie si possible.'),fracTxt(rn,rd)]);}
  return genArith(lv,{sets:['frac'],ops:[pick(['*','/'])],range:[0,1]});});
topic('m6-decmul',6,1,['Dezimalzahlen multiplizieren und dividieren','Multiplying and dividing decimals','Multiplier et diviser des décimaux'],
 ['Rechne zuerst ohne Komma. Beim Malnehmen hat das Ergebnis so viele Stellen nach dem Komma wie beide Faktoren zusammen.','Calculate without the point first. When multiplying, the result has as many decimal places as both factors together.','Calcule d’abord sans virgule. Pour une multiplication, le résultat a autant de décimales que les deux facteurs réunis.'],['decimal'],
 lv=>{if(Math.random()<.5){const a=ri(11,99)/10,b=lv===1?ri(2,9):ri(11,49)/10;const r=Math.round(a*b*100)/100;const it=numItem(fmtN(a)+' · '+fmtN(b)+' = ?',r,{keys:','});
   return steps(it,[X('Ohne Komma: ','Without points: ','Sans virgule : ')+Math.round(a*10)+' · '+(Number.isInteger(b)?b:Math.round(b*10))+' = '+Math.round(a*10)*(Number.isInteger(b)?b:Math.round(b*10))+'.',X('Stellen nach dem Komma zählen: ','Count the decimal places: ','Compte les décimales : ')+(Number.isInteger(b)?1:2)+'.',fmtN(a)+' · '+fmtN(b)+' = '+fmtN(r)]);}
  const b=ri(2,9),q=ri(11,lv===1?99:999)/10;const a=Math.round(q*b*10)/10;const it=numItem(fmtN(a)+' : '+b+' = ?',q,{keys:','});
  return steps(it,[X('Teile wie gewohnt.','Divide as usual.','Divise comme d’habitude.'),X('Setze das Komma im Ergebnis, wenn du beim Komma der Zahl ankommst.','Put the point in the answer when you reach the point in the number.','Place la virgule dans le résultat quand tu atteins celle du nombre.'),fmtN(a)+' : '+b+' = '+fmtN(q)]);});
topic('m6-percent',6,1,['Prozente','Percentages','Pourcentages'],
 ['Prozent heisst «von hundert»: 25 % = 25/100 = 1/4. 25 % von 80 = 80 : 4 = 20. 10 % findest du, indem du durch 10 teilst.','Percent means “out of a hundred”: 25% = 25/100 = 1/4. 25% of 80 = 80 : 4 = 20. To find 10%, divide by 10.','Pour cent veut dire « sur cent » : 25 % = 25/100 = 1/4. 25 % de 80 = 80 : 4 = 20. Pour trouver 10 %, divise par 10.'],['percent'],
 lv=>{const p=pick(lv===1?[10,50,25]:[10,20,25,50,75,5,15,30]),base=ri(2,20)*20;const r=base*p/100;if(lv===3&&Math.random()<.5){const part=r;const it=numItem(X(`Wie viel Prozent sind ${part} von ${base}?`,`What percentage of ${base} is ${part}?`,`Quel pourcentage de ${base} représente ${part} ?`),p);
   return steps(it,[X('Anteil = Teil : Ganzes: ','Share = part : whole: ','Part = partie : tout : ')+part+' : '+base+'.',X('Mal 100 ergibt Prozent.','Times 100 gives the percentage.','Fois 100 donne le pourcentage.'),p+' %']);}
  const it=numItem(p+X(' % von ','% of ',' % de ')+base+' = ?',r,{keys:','});
  return steps(it,[X('1 % von ','1% of ','1 % de ')+base+' = '+base+' : 100 = '+fmtN(base/100)+'.',p+' · '+fmtN(base/100)+'.',fmtN(r)]);});
topic('m6-convert',6,1,['Bruch, Dezimalzahl, Prozent','Fractions, decimals, percentages','Fraction, décimal, pourcentage'],
 ['1/2 = 0,5 = 50 %, 1/4 = 0,25 = 25 %, 3/4 = 0,75 = 75 %, 1/5 = 0,2 = 20 %, 1/10 = 0,1 = 10 %.','1/2 = 0.5 = 50%, 1/4 = 0.25 = 25%, 3/4 = 0.75 = 75%, 1/5 = 0.2 = 20%, 1/10 = 0.1 = 10%.','1/2 = 0,5 = 50 %, 1/4 = 0,25 = 25 %, 3/4 = 0,75 = 75 %, 1/5 = 0,2 = 20 %, 1/10 = 0,1 = 10 %.'],['percent','decimal'],
 lv=>{const F=[[1,2],[1,4],[3,4],[1,5],[2,5],[3,5],[4,5],[1,10],[3,10],[7,10],[1,20],[1,8]].slice(0,lv===1?5:12);const [n,d]=pick(F);const k=ri(0,2);
  if(k===0){const it=numItem(fracStr(n,d)+X(' als Dezimalzahl = ?',' as a decimal = ?',' en nombre décimal = ?'),n/d,{keys:','});return steps(it,[X('Teile den Zähler durch den Nenner: ','Divide the numerator by the denominator: ','Divise le numérateur par le dénominateur : ')+n+' : '+d+'.',X('Oder erweitere auf 10 oder 100 im Nenner.','Or expand to 10 or 100 in the denominator.','Ou amplifie pour avoir 10 ou 100 au dénominateur.'),fmtN(n/d)]);}
  if(k===1){const it=numItem(fracStr(n,d)+' = ? %',n/d*100,{keys:','});return steps(it,[X('Erweitere auf den Nenner 100.','Expand to a denominator of 100.','Amplifie pour avoir 100 au dénominateur.'),'100 : '+d+' = '+fmtN(100/d)+'.',fmtN(n/d*100)+' %']);}
  const it=numItem(fmtN(n/d*100)+X(' % als Bruch (gekürzt) = ?','% as a fraction (simplified) = ?',' % en fraction (simplifiée) = ?'),{re:n/d,im:0},{keys:'/',answer:n+'/'+d,reduce:true});return steps(it,[fmtN(n/d*100)+' % = '+fmtN(n/d*100)+'/100.',X('Kürze so weit wie möglich.','Simplify as far as possible.','Simplifie au maximum.'),n+'/'+d]);});
topic('m6-equations',6,1,['Einfache Gleichungen','Simple equations','Équations simples'],
 ['Eine Gleichung ist wie eine Waage: Was du auf einer Seite machst, machst du auch auf der anderen. x + 7 = 12 → x = 12 − 7 = 5.','An equation is like a balance: whatever you do to one side you do to the other. x + 7 = 12 → x = 12 − 7 = 5.','Une équation est comme une balance : ce que tu fais d’un côté, tu le fais aussi de l’autre. x + 7 = 12 → x = 12 − 7 = 5.'],['equation','variable'],
 lv=>{const x=ri(lv===3?-9:1,lv===1?20:30),a=ri(2,9),b=ri(1,20);const k=ri(0,lv===1?1:3);let q,st;
  if(k===0){q='x + '+b+' = '+(x+b);st=[X('Subtrahiere ','Subtract ','Soustrais ')+b+X(' auf beiden Seiten.',' on both sides.',' des deux côtés.'),'x = '+(x+b)+' − '+b+'.'];}
  else if(k===1){q=a+'x = '+fmtN(a*x);st=[a+'x '+X('heisst','means','veut dire')+' '+a+' · x.',X('Teile beide Seiten durch ','Divide both sides by ','Divise les deux côtés par ')+a+': x = '+fmtN(a*x)+' : '+a+'.'];}
  else if(k===2){q=a+'x + '+b+' = '+fmtN(a*x+b);st=[X('Zuerst ','First subtract ','D’abord soustrais ')+b+X(' abziehen: ',': ',' : ')+a+'x = '+fmtN(a*x)+'.',X('Dann durch ','Then divide by ','Puis divise par ')+a+X(' teilen.','.','.')];}
  else{q=a+'x − '+b+' = '+fmtN(a*x-b);st=[X('Zuerst ','First add ','D’abord ajoute ')+b+X(' addieren: ',': ',' : ')+a+'x = '+fmtN(a*x)+'.',X('Dann durch ','Then divide by ','Puis divise par ')+a+X(' teilen.','.','.')];}
  const it=numItem(q+'. x = ?',x,{keys:'-'});return steps(it,st.concat(['x = '+fmtN(x)]));});
topic('m6-order',6,1,['Rechenregeln mit Klammern und Potenzen','Order of operations with powers','Priorités avec puissances'],
 ['Reihenfolge: Klammern, dann Potenzen, dann Punkt- vor Strichrechnung.','Order: brackets, then powers, then times and divide before plus and minus.','Ordre : parenthèses, puis puissances, puis multiplications et divisions avant additions et soustractions.'],['brackets','power'],
 lv=>{const a=ri(2,9),b=ri(2,5),c=ri(2,9),d=ri(1,9);const k=ri(0,2);let q,v,st;

/* ---- algebraic expressions in x: parse, compare, check form ---- */
function exprFn(str){let s=String(str).replace(/\s/g,'').replace(/[−–]/g,'-').replace(/[·×*]/g,'*').replace(/:/g,'/').replace(/²/g,'^2').replace(/³/g,'^3').replace(/,/g,'.').toLowerCase();
 if(!s||/[^0-9.x+\-*/^()]/.test(s))return null;const tk=s.match(/\d*\.?\d+|x|[+\-*/^()]/g);if(!tk||tk.join('')!==s)return null;
 const t2=[];tk.forEach((a,i)=>{const p=t2[t2.length-1];if(p!=null&&(/^[\d.]+$|^x$|^\)$/.test(p))&&(/^x$|^\($/.test(a)||(/^[\d.]+$/.test(a)&&/^x$|^\)$/.test(p))))t2.push('*');t2.push(a);});
 let i=0;const peek=()=>t2[i],eat=()=>t2[i++];
 const E=()=>{let f=T();while(peek()==='+'||peek()==='-'){const o=eat(),g=T(),f0=f;f=o==='+'?x=>f0(x)+g(x):x=>f0(x)-g(x);}return f;};
 const T=()=>{let f=U();while(peek()==='*'||peek()==='/'){const o=eat(),g=U(),f0=f;f=o==='*'?x=>f0(x)*g(x):x=>f0(x)/g(x);}return f;};
 const U=()=>{if(peek()==='-'){eat();const g=U();return x=>-g(x);}if(peek()==='+'){eat();return U();}return P();};
 const P=()=>{const b=A();if(peek()==='^'){eat();const e=U();return x=>Math.pow(b(x),e(x));}return b;};
 const A=()=>{const a=eat();if(a==null)throw 0;if(a==='x')return x=>x;if(a==='('){const f=E();if(eat()!==')')throw 0;return f;}if(/^[\d.]+$/.test(a)){const v=+a;return()=>v;}throw 0;};
 try{const f=E();if(i!==t2.length)return null;return f;}catch(e){return null;}}
function sameExpr(a,b){const f=exprFn(a),g=exprFn(b);if(!f||!g)return false;for(const x of[-2.5,-1,0.5,1.7,3,4.2]){const u=f(x),v=g(x);if(!isFinite(u)||!isFinite(v)||Math.abs(u-v)>1e-6*(1+Math.abs(v)))return false;}return true;}
function termCount(s){s=String(s).replace(/\s/g,'').replace(/[−–]/g,'-');if(/[()]/.test(s))return 99;return s.replace(/^[+-]/,'').split(/[+-]/).length;}
function exprItem(prompt,ans,o){return Object.assign({type:'expr',prompt,expr:ans,answer:ans},o||{});}
function lin(a,b,v){v=v||'x';const A=a===0?'':a===1?v:a===-1?'−'+v:fmtN(a)+v;const B=b===0?'':(b<0?' − '+fmtN(-b):(A?' + ':'')+fmtN(b));return(A+B)||'0';}
function quad(a,b,c){const parts=[];if(a)parts.push((a===1?'':a===-1?'−':fmtN(a))+'x²');if(b)parts.push((b===1?'x':b===-1?'−x':fmtN(b)+'x'));if(c)parts.push(fmtN(c));
 return parts.map((p,i)=>i===0?p:(p.startsWith('−')?' − '+p.slice(1):' + '+p)).join('')||'0';}
function nr1(v){return Math.round(v*10)/10;}

 (o.fns||[]).forEach((f,k)=>{let d='';for(let i=0;i<=200;i++){const x=o.x0+(o.x1-o.x0)*i/200,y=f(x);if(!isFinite(y)||y<o.y0-1||y>o.y1+1){continue;}d+=(d?' L':'M')+X2(x).toFixed(1)+' '+Y2(y).toFixed(1);}

function figSimilar(k,a,b){const s1=Math.min(200/(Math.max(k,1)*a),150/(Math.max(k,1)*b),30);const W=a*s1+a*k*s1+120;const s=svgBox(W,200);

topic('m7-parallelangles',7,2,['Winkel an Parallelen','Angles at parallel lines','Angles et droites parallèles'],
 ['Schneidet eine Gerade zwei Parallelen, sind Stufenwinkel und Wechselwinkel gleich gross. Nebenwinkel ergeben zusammen 180°.','When a line crosses two parallels, corresponding and alternate angles are equal. Adjacent angles add up to 180°.','Quand une droite coupe deux parallèles, les angles correspondants et alternes-internes sont égaux. Les angles adjacents font 180°.'],['angle','parallel'],
 lv=>{const a=ri(35,80);const cases=[[{p:2,dx:28,dy:-8},a,X('Stufenwinkel','corresponding angle','angle correspondant')],[{p:1,dx:-28,dy:-8},180-a,X('Nebenwinkel','adjacent angle','angle adjacent')],[{p:2,dx:-28,dy:24},a,''],[{p:1,dx:-26,dy:24},a,X('Scheitelwinkel','vertically opposite angle','angle opposé par le sommet')]];

  return steps(it,[X('Welche Beziehung haben die beiden Winkel? Liegen sie an der gleichen Stelle oder nebeneinander?','How are the two angles related? Same position, or side by side?','Quel lien entre les deux angles ? Même position, ou côte à côte ?'),cs[1]===a?X('Gleiche Lage: gleich gross.','Same position: equal.','Même position : égaux.'):X('Nebeneinander: zusammen 180°.','Side by side: together 180°.','Côte à côte : ensemble 180°.'),cs[1]+'°']);});
topic('m7-trianglearea',7,2,['Fläche von Dreieck, Parallelogramm und Trapez','Area of triangle, parallelogram and trapezium','Aire du triangle, du parallélogramme et du trapèze'],
 ['Parallelogramm: g · h. Dreieck: g · h : 2. Trapez: (a + c) : 2 · h. Die Höhe steht immer senkrecht auf der Grundseite.','Parallelogram: b · h. Triangle: b · h : 2. Trapezium: (a + c) : 2 · h. The height is always perpendicular to the base.','Parallélogramme : b · h. Triangle : b · h : 2. Trapèze : (a + c) : 2 · h. La hauteur est toujours perpendiculaire à la base.'],['area','height'],
 lv=>{const g=ri(3,14),hh=ri(2,10);const k=ri(0,lv===1?1:2);if(k===0){const it=numItem(X(`Ein Dreieck hat die Grundseite ${g} cm und die Höhe ${hh} cm. Fläche in cm²?`,`A triangle has base ${g} cm and height ${hh} cm. Area in cm²?`,`Un triangle a une base de ${g} cm et une hauteur de ${hh} cm. Aire en cm² ?`),g*hh/2,{keys:','});
   return steps(it,[X('Dreieck = halbes Parallelogramm.','Triangle = half a parallelogram.','Triangle = moitié d’un parallélogramme.'),g+' · '+hh+' : 2.',fmtN(g*hh/2)+' cm²']);}
  if(k===1){const it=numItem(X(`Ein Parallelogramm hat die Grundseite ${g} cm und die Höhe ${hh} cm. Fläche in cm²?`,`A parallelogram has base ${g} cm and height ${hh} cm. Area in cm²?`,`Un parallélogramme a une base de ${g} cm et une hauteur de ${hh} cm. Aire en cm² ?`),g*hh,{fig:()=>figQuad('parallelogram')});return steps(it,[X('Schneide ein Dreieck ab und setze es auf der anderen Seite an: ein Rechteck.','Cut off a triangle and move it to the other side: a rectangle.','Coupe un triangle et déplace-le de l’autre côté : un rectangle.'),g+' · '+hh+'.',g*hh+' cm²']);}
  const c=ri(2,g-1);const it=numItem(X(`Ein Trapez hat die parallelen Seiten ${g} cm und ${c} cm und die Höhe ${hh} cm. Fläche in cm²?`,`A trapezium has parallel sides ${g} cm and ${c} cm and height ${hh} cm. Area in cm²?`,`Un trapèze a des côtés parallèles de ${g} cm et ${c} cm et une hauteur de ${hh} cm. Aire en cm² ?`),(g+c)/2*hh,{keys:',',fig:()=>figQuad('trapezoid')});
  return steps(it,[X('Mittlere Breite: ','Average width: ','Largeur moyenne : ')+'('+g+' + '+c+') : 2 = '+fmtN((g+c)/2)+'.',X('Mal die Höhe.','Times the height.','Fois la hauteur.'),fmtN((g+c)/2*hh)+' cm²']);});
topic('m7-circle',7,2,['Kreis: Umfang und Fläche','Circle: circumference and area','Cercle : périmètre et aire'],
 ['Umfang u = 2 · π · r = π · d. Fläche A = π · r². π ist ungefähr 3,14.','Circumference C = 2 · π · r = π · d. Area A = π · r². π is about 3.14.','Périmètre P = 2 · π · r = π · d. Aire A = π · r². π vaut environ 3,14.'],['pi','radius','circumference'],
 lv=>{const r=ri(2,lv===1?10:25);const area=lv>1&&Math.random()<.5;const v=area?Math.PI*r*r:2*Math.PI*r;
  const it=numItem((area?X('Fläche','Area','Aire'):X('Umfang','Circumference','Périmètre'))+X(' eines Kreises mit r = ',' of a circle with r = ',' d’un cercle de rayon r = ')+r+' cm?'+PI_NOTE(),nr1(v),{keys:',',tol:piTol(v),fig:()=>figCircleR(r,'r')});

topic('m7-reflect',7,2,['Spiegeln und Verschieben im Koordinatensystem','Reflecting and translating on a grid','Symétrie et translation dans un repère'],
 ['Spiegeln an der y-Achse: x wechselt das Vorzeichen. An der x-Achse: y wechselt das Vorzeichen. Verschieben: zu x und y etwas dazuzählen.','Reflect in the y-axis: x changes sign. In the x-axis: y changes sign. Translate: add something to x and y.','Symétrie par rapport à l’axe y : x change de signe. Par rapport à l’axe x : y change de signe. Translation : on ajoute quelque chose à x et à y.'],['coordinate','mirror'],
 lv=>{const x=ri(-5,5)||2,y=ri(-4,4)||1;const k=ri(0,lv===1?1:2);let tx,ty,txt;
  if(k===0){tx=-x;ty=y;txt=X('an der y-Achse gespiegelt','reflected in the y-axis','par symétrie d’axe y');}else if(k===1){tx=x;ty=-y;txt=X('an der x-Achse gespiegelt','reflected in the x-axis','par symétrie d’axe x');}
  else{const dx=ri(-3,3),dy=ri(-3,3);tx=Math.max(-5,Math.min(5,x+dx));ty=Math.max(-4,Math.min(4,y+dy));txt=X('um ('+fmtN(tx-x)+' | '+fmtN(ty-y)+') verschoben','translated by ('+fmtN(tx-x)+' | '+fmtN(ty-y)+')','déplacé de ('+fmtN(tx-x)+' | '+fmtN(ty-y)+')');}
  const it={type:'coord',prompt:X('Der Punkt P(','Point P(','Le point P(')+fmtN(x)+' | '+fmtN(y)+X(') wird ',') is ',') est ')+txt+X('. Tippe auf den neuen Punkt.','. Tap the new point.','. Touche le nouveau point.'),tx,ty,grid:{x0:-5,x1:5,y0:-4,y1:4,pts:[{x,y,label:'P'}]},answer:'('+fmtN(tx)+' | '+fmtN(ty)+')'};
  return steps(it,[k===0?X('x wechselt das Vorzeichen, y bleibt.','x changes sign, y stays.','x change de signe, y reste.'):k===1?X('y wechselt das Vorzeichen, x bleibt.','y changes sign, x stays.','y change de signe, x reste.'):X('Zähle die Verschiebung zu x und y dazu.','Add the shift to x and y.','Ajoute le déplacement à x et à y.'),'x = '+fmtN(tx)+', y = '+fmtN(ty)+'.','('+fmtN(tx)+' | '+fmtN(ty)+')']);});
topic('m7-proptable',7,3,['Proportionale Zuordnungen','Proportional relationships','Relations proportionnelles'],
 ['Bei einer proportionalen Zuordnung ist der Quotient y : x immer gleich. Der Graph ist eine Gerade durch den Nullpunkt.','In a proportional relationship the quotient y : x is always the same. The graph is a straight line through the origin.','Dans une relation proportionnelle, le quotient y : x est toujours le même. Le graphique est une droite passant par l’origine.'],['proportional'],
 lv=>{const m=ri(2,lv===1?9:25)/(lv===3?2:1);const xs=shuffle([1,2,3,4,5,6,8,10]).slice(0,4).sort((a,b)=>a-b);const hole=ri(1,3);
  const it=numItem(X('Die Tabelle ist proportional. Welche Zahl fehlt?','The table is proportional. Which number is missing?','Le tableau est proportionnel. Quel nombre manque ?'),m*xs[hole],{keys:',',fig:()=>figTable(['x'].concat(xs.map(String)),[['y'].concat(xs.map((x,i)=>i===hole?'?':fmtN(m*x)))])});
  return steps(it,[X('Berechne y : x bei einem vollständigen Paar: ','Work out y : x for a complete pair: ','Calcule y : x pour une paire complète : ')+fmtN(m*xs[0])+' : '+xs[0]+' = '+fmtN(m)+'.',X('Also ist y immer ','So y is always ','Donc y vaut toujours ')+fmtN(m)+' · x.',fmtN(m)+' · '+xs[hole]+' = '+fmtN(m*xs[hole])]);});
topic('m7-graph',7,3,['Graphen lesen','Reading graphs','Lire des graphiques'],
 ['Suche den x-Wert auf der waagrechten Achse, gehe senkrecht zum Graphen und dann waagrecht zur y-Achse.','Find the x-value on the horizontal axis, go straight up to the graph, then across to the y-axis.','Trouve la valeur de x sur l’axe horizontal, monte jusqu’au graphique, puis va horizontalement vers l’axe y.'],['coordinate','function'],
 lv=>{const m=pick([1,2,-1,.5]),q=ri(-2,3);const x=ri(-3,4);let y=m*x+q;if(Math.abs(y)>6||!Number.isInteger(y)){return genItem(mtopic('m7-graph'),lv);}
  const it=numItem(X('Lies ab: Welchen y-Wert hat der Graph bei x = ','Read off: what is the y-value of the graph at x = ','Lis : quelle est la valeur de y du graphique pour x = ')+fmtN(x)+'?',y,{keys:'-',fig:()=>figPlot({fns:[t=>m*t+q],x0:-5,x1:5,y0:-6,y1:6})});
  return steps(it,[X('Suche x = ','Find x = ','Cherche x = ')+fmtN(x)+X(' auf der x-Achse.',' on the x-axis.',' sur l’axe x.'),X('Gehe senkrecht bis zum Graphen, dann waagrecht zur y-Achse.','Go straight to the graph, then across to the y-axis.','Va jusqu’au graphique, puis horizontalement vers l’axe y.'),'y = '+fmtN(y)]);});
topic('m7-stats',7,3,['Mittelwert, Median, Modus, Spannweite','Mean, median, mode, range','Moyenne, médiane, mode, étendue'],
 ['Median: der mittlere Wert der geordneten Liste. Modus: der häufigste Wert. Spannweite: grösster minus kleinster Wert.','Median: the middle value of the sorted list. Mode: the most frequent value. Range: largest minus smallest value.','Médiane : la valeur du milieu de la liste triée. Mode : la valeur la plus fréquente. Étendue : la plus grande moins la plus petite valeur.'],['median','mode','range','mean'],
 lv=>{const n=pick([5,7,9]);let v=Array.from({length:n},()=>ri(1,20));v[1]=v[0];const srt=v.slice().sort((a,b)=>a-b);const k=ri(0,lv===1?1:3);
  const cnt={};v.forEach(x=>cnt[x]=(cnt[x]||0)+1);const mx=Math.max(...Object.values(cnt));const modes=Object.keys(cnt).filter(k2=>cnt[k2]===mx);
  if(k===2&&modes.length>1)return genItem(mtopic('m7-stats'),lv);
  const L=[X('Median','median','médiane'),X('Spannweite','range','étendue'),X('Modus','mode','mode'),X('Mittelwert','mean','moyenne')][k];const val=[srt[(n-1)/2],srt[n-1]-srt[0],+modes[0],Math.round(v.reduce((a,b)=>a+b,0)/n*10)/10][k];
  const it=numItem(X('Daten: ','Data: ','Données : ')+v.join(', ')+'. '+X('Wie gross ist der ','What is the ','Quelle est la valeur de : ')+L+'?'+(k===3?X(' (auf eine Dezimale)',' (one decimal place)',' (au dixième)'):''),val,{keys:',',tol:k===3?0.051:0});
  return steps(it,[X('Ordne zuerst: ','Sort first: ','Trie d’abord : ')+srt.join(', ')+'.',[X('Nimm den Wert in der Mitte (Platz ','Take the value in the middle (position ','Prends la valeur du milieu (rang ')+(n+1)/2+').',X('Grösster minus kleinster Wert.','Largest minus smallest value.','La plus grande moins la plus petite valeur.'),X('Welcher Wert kommt am häufigsten vor?','Which value appears most often?','Quelle valeur apparaît le plus souvent ?'),X('Summe durch Anzahl: ','Sum divided by count: ','Somme divisée par le nombre : ')+v.reduce((a,b)=>a+b,0)+' : '+n+'.'][k],fmtN(val)]);});
topic('m7-laplace',7,3,['Laplace-Wahrscheinlichkeit','Equally likely outcomes','Probabilité de Laplace'],
 ['Sind alle Ergebnisse gleich wahrscheinlich: P = Anzahl günstige : Anzahl mögliche Ergebnisse. Als Bruch, Dezimalzahl oder in %.','When all outcomes are equally likely: P = favourable : possible outcomes. As a fraction, decimal or percentage.','Si tous les résultats sont équiprobables : P = cas favorables : cas possibles. En fraction, en décimal ou en %.'],['probability'],
 lv=>{const n=pick([20,25,50,40]),k=ri(1,n-1);const pct=lv>=2&&Math.random()<.5;const it=numItem(X(`In einer Lostrommel sind ${n} Lose, ${k} davon gewinnen. Wie gross ist die Gewinnwahrscheinlichkeit`,`A raffle drum holds ${n} tickets, ${k} of which win. What is the probability of winning`,`Une urne contient ${n} billets, dont ${k} gagnants. Quelle est la probabilité de gagner`)+(pct?X(' in %?',' in %?',' en % ?'):X(' (als Bruch)?',' (as a fraction)?',' (en fraction) ?')),pct?k/n*100:{re:k/n,im:0},{keys:pct?',':'/',answer:pct?fmtN(k/n*100)+' %':fracTxt(...red2(k,n))});
  return steps(it,[X('Günstige: ','Favourable: ','Favorables : ')+k+', '+X('mögliche: ','possible: ','possibles : ')+n+'.',k+'/'+n+(pct?' · 100':'')+'.',pct?fmtN(k/n*100)+' %':fracTxt(...red2(k,n))]);});

topic('m8-expand',8,1,['Ausmultiplizieren','Expanding brackets','Développer'],

  return steps(it,['x · x = x², x · '+par(b)+' = '+lin(b,0)+', '+fmtN(a)+' · x = '+lin(a,0)+', '+fmtN(a)+' · '+par(b)+' = '+fmtN(a*b)+'.',X('Fasse die x-Glieder zusammen: ','Collect the x-terms: ','Regroupe les termes en x : ')+lin(a+b,0)+'.',quad(1,a+b,a*b)]);});

topic('m8-sqrt',8,1,['Wurzeln abschätzen','Estimating square roots','Estimer des racines carrées'],

topic('m8-pythagoras',8,2,['Satz des Pythagoras','Pythagoras’ theorem','Théorème de Pythagore'],

 lv=>{const T=[[3,4,5],[6,8,10],[5,12,13],[8,15,17],[9,12,15],[7,24,25],[12,16,20]];let[a,b,c]=pick(T);let exact=true;if(lv===3){a=ri(2,12);b=ri(2,12);c=Math.sqrt(a*a+b*b);exact=Number.isInteger(c);}

topic('m8-prism',8,2,['Prismen und Zylinder','Prisms and cylinders','Prismes et cylindres'],

  const r=ri(1,10),H=ri(2,20);const V=Math.PI*r*r*H;const it=numItem(X(`Ein Zylinder hat r = ${r} cm und h = ${H} cm. Volumen in cm³?`,`A cylinder has r = ${r} cm and h = ${H} cm. Volume in cm³?`,`Un cylindre a r = ${r} cm et h = ${H} cm. Volume en cm³ ?`)+PI_NOTE(),nr1(V),{keys:',',tol:piTol(V),fig:()=>figSolid2('cylinder','r = '+r+', h = '+H)});

topic('m8-rotate',8,2,['Drehen im Koordinatensystem','Rotating on a grid','Rotation dans un repère'],

topic('m8-linear',8,3,['Lineare Funktionen','Linear functions','Fonctions affines'],

topic('m8-tree',8,3,['Mehrstufige Zufallsexperimente','Multi-step probability','Expériences aléatoires à plusieurs étapes'],

 lv=>{const n=pick([2,4,5,10]),k=ri(1,n-1);const p=[fracTxt(...red2(k,n)),fracTxt(...red2(n-k,n))];const both=Math.random()<.5;const lab=[X('R','R','R'),X('B','B','B')];

  return steps(it,[both?X('Pfad RR: ','Path RR: ','Chemin RR : ')+p[0]+' · '+p[0]+'.':X('Pfade RB und BR: ','Paths RB and BR: ','Chemins RB et BR : ')+p[0]+' · '+p[1]+X(' und ',' and ',' et ')+p[1]+' · '+p[0]+'.',both?X('Pfadregel: malnehmen.','Path rule: multiply.','Règle du chemin : multiplier.'):X('Summenregel: beide Pfade addieren.','Sum rule: add both paths.','Règle de la somme : additionner les deux chemins.'),fracTxt(...red2(num,den))]);});
topic('m8-word',8,3,['Sachaufgaben mit Gleichungen','Word problems with equations','Problèmes avec équations'],
 ['Gib der gesuchten Grösse einen Namen (x), schreibe die Angaben als Gleichung und löse sie.','Give the unknown a name (x), write the information as an equation and solve it.','Donne un nom à l’inconnue (x), écris les données sous forme d’équation et résous-la.'],['equation','variable'],
 lv=>{const n=pick(NAMES);const k=ri(0,2);let q,v,eq,sol;
  if(k===0){const x=ri(5,30),d=ri(3,15);q=X(`${n} ist ${d} Jahre älter als die Schwester. Zusammen sind sie ${2*x+d} Jahre alt. Wie alt ist die Schwester?`,`${n} is ${d} years older than their sister. Together they are ${2*x+d} years old. How old is the sister?`,`${n} a ${d} ans de plus que sa sœur. Ensemble, ils ont ${2*x+d} ans. Quel âge a la sœur ?`);v=x;eq='x + (x + '+d+') = '+(2*x+d);sol='2x = '+2*x;}
  else if(k===1){const p=ri(2,9),a=ri(3,12),b=ri(2,20);q=X(`Ein Heft kostet ${p} Franken mehr als ein Stift. ${n} kauft ${a} Stifte und ein Heft und bezahlt ${a*b+b+p} Franken. Was kostet ein Stift?`,`A notebook costs ${p} francs more than a pen. ${n} buys ${a} pens and one notebook and pays ${a*b+b+p} francs. How much is a pen?`,`Un cahier coûte ${p} francs de plus qu’un stylo. ${n} achète ${a} stylos et un cahier et paie ${a*b+b+p} francs. Combien coûte un stylo ?`);v=b;eq=a+'x + (x + '+p+') = '+(a*b+b+p);sol=(a+1)+'x = '+(a+1)*b;}
  else{const x=ri(3,20);const m=ri(2,5);q=X(`Denke dir eine Zahl. Nimm sie mal ${m} und addiere 7. Du erhältst ${m*x+7}. Welche Zahl war es?`,`Think of a number. Multiply it by ${m} and add 7. You get ${m*x+7}. What was the number?`,`Pense à un nombre. Multiplie-le par ${m} et ajoute 7. Tu obtiens ${m*x+7}. Quel était le nombre ?`);v=x;eq=m+'x + 7 = '+(m*x+7);sol=m+'x = '+m*x;}
  return steps(numItem(q,v),[X('Nenne die gesuchte Zahl x und schreibe eine Gleichung.','Call the unknown x and write an equation.','Appelle l’inconnue x et écris une équation.'),eq+'.',sol+' → x = '+v]);});

topic('m9-systems',9,1,['Gleichungssysteme','Simultaneous equations','Systèmes d’équations'],

 lv=>{const x=ri(-5,8),y=ri(-5,8);const a=ri(1,4),b=ri(1,4),c=ri(1,4),d=-ri(1,4);if(a*d-b*c===0)return genItem(mtopic('m9-systems'),lv);
  const L=(p,q)=>lin(p,0)+(q<0?' − ':' + ')+(Math.abs(q)===1?'y':Math.abs(q)+'y');
