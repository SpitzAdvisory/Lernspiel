<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lernspiel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Kalam:wght@700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FBFBF6; --grid:#DDE7F1; --ink:#1F3A93; --ink-soft:#E8EDF9;
  --red:#C8322B; --mark:#F6E27A; --graphite:#2F3437; --green:#2E7D4F;
  --muted:#667085; --white:#FFFFFF;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  font-family:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  color:var(--graphite); font-size:18px; line-height:1.5; min-height:100vh;
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;
}
.hand{font-family:"Kalam","Comic Sans MS",cursive}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.top{display:flex;align-items:center;gap:12px;padding:14px 20px;background:rgba(251,251,246,.92);border-bottom:2px solid var(--grid);position:sticky;top:0;z-index:5}
.top h1{font-size:1.35rem;margin:0;flex:1;color:var(--ink)}
.page{max-width:780px;margin:0 auto;padding:24px 20px 60px 36px;border-left:2px solid var(--red);min-height:calc(100vh - 64px);background:linear-gradient(90deg,rgba(251,251,246,.85),rgba(251,251,246,.85))}
.page.wide{max-width:1040px}
h2{font-size:1.5rem;margin:0 0 12px;color:var(--ink)}
h3{font-size:1.15rem;margin:24px 0 8px}
p{margin:0 0 12px}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.btn{border:0;border-radius:10px;padding:10px 18px;background:var(--ink);color:var(--white);font-weight:700}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink)}
.btn.danger{background:transparent;color:var(--red);box-shadow:inset 0 0 0 2px var(--red)}
.btn.small{padding:6px 12px;font-size:.9rem}
.btn.big{padding:14px 28px;font-size:1.15rem}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stack>*+*{margin-top:12px}
.lang{display:flex;border-radius:8px;overflow:hidden;box-shadow:inset 0 0 0 2px var(--ink)}
.lang button{border:0;background:transparent;padding:4px 10px;font-weight:700;color:var(--ink)}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--white)}
.players{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px}
.player{border:2px solid var(--ink);border-radius:16px;background:var(--white);padding:16px 10px;text-align:center}
.player .av{font-size:3rem;line-height:1.1}
.player .nm{font-weight:700;margin-top:6px}
.list{display:flex;flex-direction:column;gap:10px}
.item{display:flex;align-items:center;gap:12px;background:var(--white);border:2px solid var(--grid);border-radius:12px;padding:12px 14px;text-align:left;width:100%}
button.item{border-color:var(--ink)}
.item .grow{flex:1;min-width:0}
.bar{height:10px;border-radius:5px;background:var(--ink-soft);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--ink)}
.choices{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.choice{border:2px solid var(--ink);border-radius:12px;background:var(--white);padding:12px;text-align:left}
.choice[aria-pressed="true"]{background:var(--mark)}
.choice:disabled{opacity:.5;border-style:dashed}
.choice b{display:block}
.choice span{font-size:.85rem;color:var(--muted)}
.stickers{display:flex;flex-wrap:wrap;gap:10px}
.sticker{display:flex;flex-direction:column;align-items:center;width:84px;text-align:center;font-size:.75rem;line-height:1.2}
.sticker i{font-style:normal;font-size:1.7rem;width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:var(--mark);box-shadow:0 0 0 3px var(--white),0 0 0 5px var(--ink);transform:rotate(-6deg);margin-bottom:6px}
.hud{display:flex;flex-wrap:wrap;gap:16px;align-items:center;font-weight:700;margin-bottom:16px}
.hud .sp{flex:1}
.card{background:var(--white);border:2px solid var(--ink);border-radius:18px;padding:22px;position:relative}
.prompt{font-size:1.45rem;line-height:1.35;margin:0 0 6px;font-weight:700}
.hint{font-size:.9rem;color:var(--muted);margin-bottom:16px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{border:2px solid var(--ink);border-radius:12px;background:var(--white);padding:12px 16px;text-align:left;font-size:1.1rem;min-height:52px}
.opt[aria-pressed="true"]{background:var(--mark)}
.opt.ok{border-color:var(--green);background:#E3F3E9}
.opt.bad{border-color:var(--red);background:#FBE5E3}
.seq{min-height:56px;border:2px dashed var(--ink);border-radius:12px;padding:8px;display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chip{border:2px solid var(--ink);border-radius:10px;background:var(--white);padding:8px 12px;font-size:1.05rem}
.chip.placed{background:var(--mark)}
.chip .n{font-weight:700;margin-right:6px;color:var(--ink)}
input[type=text],input[type=password],input[type=number],select,textarea{width:100%;border:2px solid var(--ink);border-radius:10px;padding:10px 12px;background:var(--white)}
textarea{min-height:90px}
label.f{display:block;font-weight:700;margin-bottom:4px}
.answerbox{font-size:1.3rem}
.feedback{margin-top:18px;padding-top:14px;border-top:2px dashed var(--grid)}
.stamp{font-size:2rem;display:inline-block;transform:rotate(-4deg)}
.stamp.ok{color:var(--green)}
.stamp.bad{color:var(--red)}
@media (prefers-reduced-motion:no-preference){
  .stamp{animation:stamp .28s ease-out}
  @keyframes stamp{from{transform:rotate(-4deg) scale(1.6);opacity:0}to{transform:rotate(-4deg) scale(1);opacity:1}}
}
.bigscore{font-size:4rem;color:var(--red);line-height:1;transform:rotate(-3deg);display:inline-block}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:20px}
.tabs button{border:0;background:transparent;padding:8px 14px;border-radius:8px;font-weight:700;color:var(--ink)}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--white)}
table{width:100%;border-collapse:collapse;background:var(--white);font-size:.9rem}
th,td{text-align:left;padding:8px;border-bottom:1px solid var(--grid);vertical-align:top}
.scroll{overflow-x:auto}
.tag{display:inline-block;font-size:.75rem;font-weight:700;padding:2px 8px;border-radius:6px;background:var(--ink-soft);color:var(--ink)}
.avpick{display:flex;flex-wrap:wrap;gap:6px}
.avpick button{font-size:1.6rem;border:2px solid transparent;border-radius:10px;background:var(--white);width:48px;height:48px}
.avpick button[aria-pressed="true"]{border-color:var(--ink);background:var(--mark)}
.thumbs{display:flex;flex-wrap:wrap;gap:8px}
.thumbs img,.thumbs .pdf{width:84px;height:84px;object-fit:cover;border-radius:8px;border:2px solid var(--grid);background:var(--white);display:grid;place-items:center;font-size:.8rem}
dialog{border:2px solid var(--ink);border-radius:14px;max-width:680px;width:92vw;padding:20px}
dialog::backdrop{background:rgba(31,58,147,.25)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--graphite);color:var(--white);padding:10px 18px;border-radius:10px;z-index:50;max-width:90vw}
.toast.err{background:var(--red)}
@media (max-width:560px){.page{padding-left:24px}.prompt{font-size:1.25rem}}
</style>
</head>

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function slug(s){return String(s).replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/Ä/g,'Ae').replace(/Ö/g,'Oe').replace(/Ü/g,'Ue').replace(/ß/g,'ss')
 .normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^A-Za-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,40)||'x';}
function pad(n){return String(n).padStart(2,'0');}
function ymd(d){return d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate());}
function hms(d){return pad(d.getHours())+pad(d.getMinutes())+pad(d.getSeconds());}
function fmtDate(iso){const d=new Date(iso);return d.toLocaleDateString(S.lang==='de'?'de-CH':'en-GB')+' '+pad(d.getHours())+':'+pad(d.getMinutes());}
function toast(msg,err){const el=h('div',{class:'toast'+(err?' err':''),role:'status'},msg);document.body.append(el);setTimeout(()=>el.remove(),err?6000:2600);}
async function sha(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');}
function levelOf(xp){return Math.floor(Math.sqrt((xp||0)/50))+1;}
function xpFor(level){return 50*(level-1)*(level-1);}
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&S.onEnter&&!(e.target&&e.target.tagName==='TEXTAREA')){const f=S.onEnter;e.preventDefault();f();}});

const IDB={db:null,
 open(){return new Promise((res,rej)=>{const r=indexedDB.open('lernspiel',2);r.onupgradeneeded=()=>{const d=r.result;for(const s of['kv','files','cache','outbox'])if(!d.objectStoreNames.contains(s))d.createObjectStore(s);};
  r.onsuccess=()=>{this.db=r.result;res();};r.onerror=()=>rej(r.error);});},
 tx(store,mode,fn){return new Promise((res,rej)=>{const tr=this.db.transaction(store,mode);const req=fn(tr.objectStore(store));tr.oncomplete=()=>res(req&&req.result);tr.onerror=()=>rej(tr.error);});},
 get(s,k){return this.tx(s,'readonly',o=>o.get(k));},set(s,k,v){return this.tx(s,'readwrite',o=>o.put(v,k));},
 del(s,k){return this.tx(s,'readwrite',o=>o.delete(k));},keys(s){return this.tx(s,'readonly',o=>o.getAllKeys());}};
class IdbStore{constructor(){this.kind='browser';this.name=t('browserStorage');}
 async read(p){const v=await IDB.get('files',p);return v===undefined?null:JSON.parse(v);}
 async write(p,o){await IDB.set('files',p,JSON.stringify(o,null,2));}
 async list(dir){const ks=await IDB.keys('files');const pre=dir.replace(/\/?$/,'/');return ks.filter(k=>k.startsWith(pre)&&!k.slice(pre.length).includes('/')).map(k=>k.slice(pre.length));}
 async remove(p){await IDB.del('files',p);}}
class FolderStore{constructor(hd){this.root=hd;this.kind='folder';this.name=hd.name;}
 async dir(parts,create){let d=this.root;for(const p of parts)d=await d.getDirectoryHandle(p,{create});return d;}
 split(p){const parts=p.split('/');const f=parts.pop();return[parts,f];}
 async read(p){try{const[ps,f]=this.split(p);const d=await this.dir(ps,false);const fh=await d.getFileHandle(f);return JSON.parse(await(await fh.getFile()).text());}
  catch(e){if(e.name==='NotFoundError'||e.name==='TypeMismatchError')return null;throw e;}}
 async write(p,o){const[ps,f]=this.split(p);const d=await this.dir(ps,true);const fh=await d.getFileHandle(f,{create:true});const w=await fh.createWritable();await w.write(JSON.stringify(o,null,2));await w.close();}
 async list(dir){try{const d=await this.dir(dir.split('/').filter(Boolean),false);const out=[];for await(const[n,hd]of d.entries()){if(hd.kind==='file')out.push(n);}return out;}
  catch(e){if(e.name==='NotFoundError')return[];throw e;}}
 async remove(p){const[ps,f]=this.split(p);const d=await this.dir(ps,false);await d.removeEntry(f);}}

async function refreshData(){S.profiles=(await S.store.read('profiles.json'))||[];S.games=await loadGames();await syncLogs();}
async function pool(items,n,fn){let i=0;await Promise.all(Array.from({length:Math.min(n,items.length)},async()=>{while(i<items.length){const k=i++;await fn(items[k]);}}));}
function uniqLogs(){const seen=new Set();return Object.values(S.logMap||{}).filter(l=>l&&l.id&&!seen.has(l.id)&&seen.add(l.id));}
async function syncLogs(){
 S.logMap=S.logMap||{};const dbx=S.store.kind==='dropbox';
 const names=(await S.store.list('logs')).filter(n=>n.endsWith('.json')&&!S.logMap[n]);
 await pool(names,6,async n=>{let l=null;
  if(dbx){const c=await IDB.get('cache','file:logs/'+n);if(c&&c!=='null')l=JSON.parse(c);}
  if(!l){try{l=await S.store.read('logs/'+n);}catch(e){console.warn(n,e);}}
  if(l)S.logMap[n]=l;});
 if(dbx)for(const k of await IDB.keys('outbox'))if(!S.logMap[k]){const v=await IDB.get('outbox',k);if(v)S.logMap[k]=JSON.parse(v);}
 computeState();
}
async function writeLog(name,log){
 try{await S.store.write('logs/'+name,log);if(S.store.kind==='dropbox')await IDB.set('cache','file:logs/'+name,JSON.stringify(log));}
 catch(e){if(S.store.kind!=='dropbox')throw e;await IDB.set('outbox',name,JSON.stringify(log));toast(t('savedOffline'));}
}
async function flushOutbox(){
 if(!S.store||S.store.kind!=='dropbox')return;
 for(const k of await IDB.keys('outbox')){try{const v=await IDB.get('outbox',k);await S.store.write('logs/'+k,JSON.parse(v));await IDB.set('cache','file:logs/'+k,v);await IDB.del('outbox',k);}catch(e){break;}}
}
/* ---- progress is derived from logs only ---- */
function blankState(){return{xp:0,answers:0,correct:0,runs:0,badges:[],unlocks:{},mastery:{}};}
function st(pid){return(S.state&&S.state[pid])||blankState();}
function computeState(){S.state={};for(const p of S.profiles)S.state[p.id]=blankState();
 for(const l of uniqLogs().sort((a,b)=>String(a.started).localeCompare(String(b.started))))applyLog(S.state,l);}
function applyLog(state,l){
 const out={};const game=S.games.find(g=>g.id===(l.game&&l.game.id));
 for(const pl of l.players||[]){const s=state[pl.id];if(!s)continue;
  const prof=S.profiles.find(p=>p.id===pl.id);if(prof&&prof.resetAt&&String(l.started)<prof.resetAt)continue;
  const r={newBadges:[],unlocked:[],levelBefore:levelOf(s.xp)};
  const gm=(s.mastery[l.game.id]=s.mastery[l.game.id]||{});
  for(const a of l.answers||[]){if(a.player!==pl.id)continue;const m=gm[a.itemId]||{box:0,seen:0,right:0};m.seen++;
   if(a.correct){m.right++;m.box=Math.min(5,m.box+1);}else m.box=Math.max(0,m.box-2);gm[a.itemId]=m;}
  s.xp+=pl.score||0;s.answers+=pl.answered||0;s.correct+=pl.correct||0;s.runs++;
  const acc=pl.answered?pl.correct/pl.answered:0;
  const give=id=>{if(!s.badges.includes(id)){s.badges.push(id);r.newBadges.push(id);}};
  give('first_run');
  if(l.mode==='classic'&&!l.aborted&&pl.answered>=5&&pl.correct===pl.answered)give('perfect');
  if((pl.bestStreak||0)>=10)give('streak10');if(s.answers>=100)give('answers100');
  if(l.mode==='survival'&&pl.correct>=20)give('survivor20');if(l.mode==='timed'&&pl.correct>=15)give('speed15');
  if(l.mode==='duel'&&l.winner===pl.id)give('duel_win');if(l.difficulty==='hard'&&pl.answered>=5&&acc>=0.8)give('hard_clear');
  if(game&&game.items.length&&game.items.every(it=>gm[it.id]&&gm[it.id].box>=3))give('master_game');
  const u=(s.unlocks[l.game.id]=s.unlocks[l.game.id]||{});
  if(pl.answered>=5&&l.difficulty==='easy'&&acc>=0.7&&!u.medium){u.medium=true;r.unlocked.push('medium');}
  if(pl.answered>=5&&l.difficulty==='medium'&&acc>=0.8&&!u.hard){u.hard=true;r.unlocked.push('hard');}
  r.levelAfter=levelOf(s.xp);out[pl.id]=r;}
 return out;
}
/* ---- Dropbox (play page on GitHub) ---- */
function b64url(bytes){let s='';for(const b of bytes)s+=String.fromCharCode(b);return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');}
function dbxArg(o){return JSON.stringify(o).replace(/[\u007f-\uffff]/g,c=>'\\u'+('000'+c.charCodeAt(0).toString(16)).slice(-4));}
const DBX={token:null,exp:0,TOKEN_URL:'https://api.dropboxapi.com/oauth2/token',
 redirect(){return location.origin+location.pathname.replace(/index\.html$/,'');},
 async start(){const v=b64url(crypto.getRandomValues(new Uint8Array(48)));
  const ch=b64url(new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(v))));
  await IDB.set('kv','dbxVerifier',v);
  location.href='https://www.dropbox.com/oauth2/authorize?'+new URLSearchParams({client_id:DBX_KEY,response_type:'code',code_challenge:ch,code_challenge_method:'S256',redirect_uri:this.redirect(),token_access_type:'offline'});},
 async finish(code){const v=await IDB.get('kv','dbxVerifier');
  const r=await fetch(this.TOKEN_URL,{method:'POST',body:new URLSearchParams({code,grant_type:'authorization_code',code_verifier:v||'',client_id:DBX_KEY,redirect_uri:this.redirect()})});
  const d=await r.json().catch(()=>({}));if(!r.ok||!d.refresh_token)throw new Error(d.error_description||d.error||('HTTP '+r.status));
  await IDB.set('kv','dbxRefresh',d.refresh_token);await IDB.del('kv','dbxVerifier');this.token=d.access_token;this.exp=Date.now()+((d.expires_in||3600)-60)*1000;},
 async access(){if(this.token&&Date.now()<this.exp)return this.token;const rt=await IDB.get('kv','dbxRefresh');if(!rt)throw new Error('not connected');
  const r=await fetch(this.TOKEN_URL,{method:'POST',body:new URLSearchParams({grant_type:'refresh_token',refresh_token:rt,client_id:DBX_KEY})});
  const d=await r.json().catch(()=>({}));if(!r.ok){if(r.status===400||r.status===401)await IDB.del('kv','dbxRefresh');throw new Error('not connected');}
  this.token=d.access_token;this.exp=Date.now()+((d.expires_in||3600)-60)*1000;return this.token;},
 async call(url,opts){for(let k=0;k<2;k++){const tok=await this.access();
  const r=await fetch(url,Object.assign({},opts,{headers:Object.assign({Authorization:'Bearer '+tok},opts.headers||{})}));
  if(r.status===401&&k===0){this.token=null;continue;}return r;}},
 async rpc(ep,body){const r=await this.call('https://api.dropboxapi.com/2/'+ep,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  const txt=await r.text();let d=null;try{d=JSON.parse(txt);}catch(e){}
  if(!r.ok){const e=new Error((d&&d.error_summary)||txt||('HTTP '+r.status));e.status=r.status;throw e;}return d;},
 async download(path){const r=await this.call('https://content.dropboxapi.com/2/files/download',{method:'POST',headers:{'Dropbox-API-Arg':dbxArg({path})}});
  if(r.status===409)return null;if(!r.ok)throw new Error('HTTP '+r.status+' '+await r.text());return r.text();},
 async upload(path,text,mode){const r=await this.call('https://content.dropboxapi.com/2/files/upload',{method:'POST',
  headers:{'Dropbox-API-Arg':dbxArg({path,mode,autorename:true,mute:true}),'Content-Type':'application/octet-stream'},body:text});
  if(!r.ok)throw new Error('HTTP '+r.status+' '+await r.text());return r.json();}
};
class DbxStore{constructor(){this.kind='dropbox';this.name='Dropbox';}
 async read(p){try{const tx=await DBX.download('/'+p);await IDB.set('cache','file:'+p,tx==null?'null':tx);return tx==null?null:JSON.parse(tx);}
  catch(e){if(e.message==='not connected')throw e;const c=await IDB.get('cache','file:'+p);if(c!==undefined)return JSON.parse(c);throw e;}}
 async write(p,o){await DBX.upload('/'+p,JSON.stringify(o,null,2),p.startsWith('logs/')?'add':'overwrite');}
 async list(dir){try{let d=await DBX.rpc('files/list_folder',{path:'/'+dir});let out=d.entries;
   while(d.has_more){d=await DBX.rpc('files/list_folder/continue',{cursor:d.cursor});out=out.concat(d.entries);}
   const names=out.filter(e=>e['.tag']==='file').map(e=>e.name);await IDB.set('cache','list:'+dir,JSON.stringify(names));return names;}
  catch(e){if(e.status===409)return[];if(e.message==='not connected')throw e;const c=await IDB.get('cache','list:'+dir);if(c)return JSON.parse(c);throw e;}}
 async remove(p){await DBX.rpc('files/delete_v2',{path:'/'+p});}}

function poolFor(g,d){const allow={easy:[1,2],medium:[1,2,3],hard:[2,3]}[d];const p=g.items.filter(i=>allow.includes(i.difficulty));return p.length>=5?p:g.items.slice();}
async function startRun(o){

 const R={id:uid(),players:o.players,game:o.game,mode:o.mode,diff:o.diff,adaptive:o.adaptive,sel:o.sel,started:new Date(),pool,used:new Set(),answers:[],
  score:o.players.map(()=>0),streak:o.players.map(()=>0),best:o.players.map(()=>0),lives:3,level:DIFF_LEVEL[o.diff],up:0,down:0,q:0,masteries,timer:null,ended:false};
 R.target=o.mode==='classic'?Math.min(10,pool.length):o.mode==='duel'?10:Infinity;
 if(o.mode==='timed'){R.deadline=Date.now()+({easy:90,medium:60,hard:45}[o.diff])*1000;R.timer=setInterval(()=>tick(R),250);}

function curIdx(R){return R.mode==='duel'?R.q%2:0;}
function tick(R){if(R.ended)return clearInterval(R.timer);const left=Math.max(0,Math.ceil((R.deadline-Date.now())/1000));const el=$('#timer');if(el)el.textContent='⏱ '+left+' s';
 if(left<=0){toast(t('timeUp'));finishRun(R,false);}}
function pickItem(R){
 let cand=R.pool.filter(i=>!R.used.has(i.id));if(!cand.length){R.used.clear();cand=R.pool.slice();}
 if(!R.adaptive)return cand[Math.floor(Math.random()*cand.length)];
 const gm=R.masteries[R.players[curIdx(R)].id][R.game.id]||{};
 const w=cand.map(i=>{const b=(gm[i.id]&&gm[i.id].box)||0;const dd=Math.abs(i.difficulty-R.level);return(1/(b+1))*(dd===0?2.5:dd===1?1:0.4);});
 let r=Math.random()*w.reduce((a,b)=>a+b,0);for(let k=0;k<cand.length;k++){r-=w[k];if(r<=0)return cand[k];}return cand[cand.length-1];
}
function prepare(item,diff){
 const Q={item,type:item.type};
 if(item.type==='single'||item.type==='multi'){let opts=item.options.map((text,i)=>({text,ok:item.correct.includes(i)}));
  if(item.type==='single'&&diff==='easy'&&opts.length>3){const right=opts.filter(o=>o.ok);opts=right.concat(shuffle(opts.filter(o=>!o.ok)).slice(0,3-right.length));}
  Q.opts=shuffle(opts);}
 if(item.type==='order'){let s=shuffle(item.order);for(let k=0;k<6&&item.order.length>1&&s.join('\u0001')===item.order.join('\u0001');k++)s=shuffle(item.order);Q.chips=s;}
 return Q;
}
function answerText(it){switch(it.type){case'single':return it.options[it.correct[0]];case'multi':return it.correct.map(i=>it.options[i]).join(', ');
 case'order':return it.order.join(' → ');case'input':return it.answer;default:return'';}}
function nextQuestion(R){
 if(R.ended)return;const item=pickItem(R);R.used.add(item.id);const Q=prepare(item,R.diff);Q.t0=performance.now();renderQuestion(R,Q);
}

function onAnswer(R,Q,given,correct,fb){
 const i=curIdx(R);const p=R.players[i];const it=Q.item;const ms=Math.round(performance.now()-Q.t0);let pts=0;
 if(correct){R.streak[i]++;R.best[i]=Math.max(R.best[i],R.streak[i]);pts=10*it.difficulty+Math.min(R.streak[i]-1,5)*2+(R.mode==='timed'&&ms<5000?5:0);R.score[i]+=pts;R.up++;R.down=0;}

 const gm=(R.masteries[p.id][R.game.id]=R.masteries[p.id][R.game.id]||{});const st=gm[it.id]||{box:0,seen:0,right:0};

  !correct?h('p',{},h('b',{},t('rightAnswer',{a:answerText(it)}))):null,
  !correct&&(it.type==='input'||it.type==='order')?h('p',{class:'muted'},t('yourAnswer',{a:given})):null,
  R.mode!=='timed'&&it.explanation?h('p',{class:'muted'},it.explanation):null);

async function finishRun(R,aborted){

 if(!R.answers.length)return viewRunSetup(R.players[0],R.game,R.sel);

  return{p,i,answered:a.length,correct:c,acc:a.length?c/a.length:0,score:R.score[i],best:R.best[i],newBadges:[],unlocked:[],levelBefore:lv,levelAfter:lv};});

  started:R.started.toISOString(),ended:ended.toISOString(),

 for(const r of results){const e=eff[r.p.id];if(e)Object.assign(r,{newBadges:e.newBadges,unlocked:e.unlocked,levelBefore:e.levelBefore,levelAfter:e.levelAfter});
  const lp=log.players.find(x=>x.id===r.p.id);lp.badgesEarned=r.newBadges;lp.unlocked=r.unlocked;}

 S.logMap=S.logMap||{};S.logMap[fname]=log;

    document.body.append(a);a.click();a.remove();}},t('exportGame')),
   h('button',{class:'btn danger small',onclick:async()=>{if(!confirm(t('confirmDelGame',{t:g.title})))return;await S.store.remove('games/'+g.id+'.json');S.games=await loadGames();viewAdmin('games');}},t('del'))))));
}
function validItem(it){
 if(!it||typeof it.prompt!=='string'||!it.prompt.trim())return false;
 it.difficulty=[1,2,3].includes(+it.difficulty)?+it.difficulty:2;
 if(Array.isArray(it.correct))it.correct=it.correct.map(Number);
 const opt=Array.isArray(it.options)&&it.options.length>=2&&it.options.every(o=>typeof o==='string');
 switch(it.type){
  case'single':return opt&&Array.isArray(it.correct)&&it.correct.length===1&&Number.isInteger(it.correct[0])&&it.correct[0]>=0&&it.correct[0]<it.options.length;
  case'multi':return opt&&Array.isArray(it.correct)&&it.correct.length>=1&&it.correct.every(i=>Number.isInteger(i)&&i>=0&&i<it.options.length);
  case'order':return Array.isArray(it.order)&&it.order.length>=2&&it.order.every(o=>typeof o==='string');
  case'input':if(it.accept&&!Array.isArray(it.accept))delete it.accept;return typeof it.answer==='string'&&it.answer.trim().length>0;
  default:return false;}
}
function itemRow(it,opts){
 return h('div',{class:'item',style:'align-items:flex-start'},opts.check||null,
  h('div',{class:'grow'},h('div',{class:'row',style:'gap:6px;margin-bottom:4px'},h('span',{class:'tag'},t('t_'+it.type)),h('span',{class:'tag'},t('diff')+' '+it.difficulty)),
   h('div',{},it.prompt),h('div',{class:'small',style:'color:var(--green)'},'✓ '+answerText(it)),
   (it.type==='single'||it.type==='multi')?h('div',{class:'small muted'},it.options.join(' · ')):null),
  h('div',{class:'stack',style:'min-width:110px'},h('button',{class:'btn ghost small',onclick:opts.onEdit},t('edit')),opts.onDelete?h('button',{class:'btn danger small',onclick:opts.onDelete},t('del')):null));
}
function jsonEdit(it,onSave){
 const dlg=$('#dlg');const ta=h('textarea',{style:'min-height:320px;font-family:ui-monospace,Consolas,monospace;font-size:.85rem'});ta.value=JSON.stringify(it,null,2);
 dlg.replaceChildren(h('div',{class:'stack'},h('h2',{},t('editJson')),ta,h('div',{class:'row'},
  h('button',{class:'btn',onclick:async()=>{let n;try{n=JSON.parse(ta.value);}catch(e){return toast(t('jsonInvalid'),true);}if(!validItem(n))return toast(t('jsonInvalid'),true);
   n.id=it.id;await onSave(n);dlg.close();}},t('save')),h('button',{class:'btn ghost',onclick:()=>dlg.close()},t('cancel')))));
 dlg.showModal();
}
function viewItems(g){
 const draw=()=>{screen(topbar(t('questionsOf',{t:g.title}),{back:()=>viewAdmin('games'),rerender:draw}),h('main',{class:'page wide'},
  g.items.length?h('div',{class:'list'},g.items.map((it,k)=>itemRow(it,{
   onEdit:()=>jsonEdit(it,async n=>{g.items[k]=n;await saveGame(g);draw();}),
   onDelete:async()=>{g.items.splice(k,1);await saveGame(g);draw();}}))):h('p',{class:'muted'},t('noQuestions'))));};

/* generation */
function blobToB64(b){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]);r.onerror=()=>rej(r.error);r.readAsDataURL(b);});}
async function fileToBlock(file){
 if(file.type==='application/pdf')return{type:'document',source:{type:'base64',media_type:'application/pdf',data:await blobToB64(file)}};
 const url=URL.createObjectURL(file);
 try{const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error(file.name+': image could not be read (HEIC?)'));i.src=url;});
  const sc=Math.min(1,1568/Math.max(img.naturalWidth,img.naturalHeight));const c=document.createElement('canvas');c.width=Math.round(img.naturalWidth*sc);c.height=Math.round(img.naturalHeight*sc);
  c.getContext('2d').drawImage(img,0,0,c.width,c.height);return{type:'image',source:{type:'base64',media_type:'image/jpeg',data:c.toDataURL('image/jpeg',0.85).split(',')[1]}};}
 finally{URL.revokeObjectURL(url);}
}
const GEN_SYSTEM=`You create quiz questions from learning material shown in images or PDFs.
Return ONLY a JSON object, with no prose and no code fences, of the form {"items":[...]}.
Each item has: "type" (one of "single","multi","order","input"), "prompt" (the question), "difficulty" (1 easy, 2 medium, 3 hard), "explanation" (one short sentence explaining the answer, based only on the material).
- single: "options" (3 to 5 strings), "correct" ([index of the one right option]).
- multi: "options" (4 to 6 strings), "correct" ([indices of all right options, at least 2]).
- order: "order" (3 to 6 strings in the correct order); the prompt must state the ordering criterion.
- input: "answer" (the exact expected answer: one word or a short term, spelled and capitalised exactly as in the material); optional "accept" (other spellings that are equally correct).
Rules: use only facts contained in the material and never invent content. Wrong options must be plausible but clearly wrong. Mix the types where the material allows (roughly 50% single, 15% multi, 15% order, 20% input). For vocabulary, ask in both directions and use input questions for spelling. Write the questions in the language of the material unless the notes say otherwise. Skip anything unreadable.`;
async function callClaude(content){
 const key=await IDB.get('kv','apiKey');const model=(await IDB.get('kv','model'))||DEFAULT_MODEL;
 const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
  body:JSON.stringify({model,max_tokens:8000,system:GEN_SYSTEM,messages:[{role:'user',content}]})});
 const data=await r.json().catch(()=>null);
 if(!r.ok)throw new Error((data&&data.error&&data.error.message)||('HTTP '+r.status));
 const txt=(data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('\n').replace(/```json|```/g,'');
 const a=txt.indexOf('{'),b=txt.lastIndexOf('}');if(a<0||b<a)throw new Error('no JSON in response');
 const obj=JSON.parse(txt.slice(a,b+1));return Array.isArray(obj.items)?obj.items:[];
}
function viewGenerate(g){
 const f={title:g?g.title:'',kind:g?(g.kind||'other'):'vocab',instr:g?(g.instructions||''):'',count:20,files:[]};
 const title=h('input',{type:'text',id:'gt',value:f.title});const kind=h('select',{id:'gk'},['vocab','science','other'].map(k=>h('option',{value:k},t('k_'+k))));kind.value=f.kind;
 const instr=h('textarea',{id:'gi',placeholder:t('instrPh')});instr.value=f.instr;const cnt=h('input',{type:'number',id:'gc',min:'5',max:'80',value:'20'});
 const thumbs=h('div',{class:'thumbs'});const status=h('p',{class:'muted','aria-live':'polite'});
 const fi=h('input',{type:'file',id:'gf',multiple:true,accept:'image/*,application/pdf',onchange:e=>{f.files=[...e.target.files];
  thumbs.replaceChildren(...f.files.map(x=>x.type==='application/pdf'?h('div',{class:'pdf'},'PDF'):h('img',{src:URL.createObjectURL(x),alt:x.name})));}});
 const btn=h('button',{class:'btn big'},t('generate'));
 btn.addEventListener('click',async()=>{
  if(!g&&!title.value.trim())return toast(t('needTitle'),true);if(!f.files.length)return toast(t('needFiles'),true);
  if(!await IDB.get('kv','apiKey'))return toast(t('needKey'),true);
  btn.disabled=true;const total=Math.max(5,Math.min(80,parseInt(cnt.value,10)||20));const batches=[];for(let k=0;k<f.files.length;k+=4)batches.push(f.files.slice(k,k+4));
  const existing=g?g.items.map(i=>i.prompt).slice(0,80):[];let out=[],dropped=0;
  try{for(let b=0;b<batches.length;b++){status.textContent=t('working',{i:b+1,n:batches.length});
    const blocks=[];for(const file of batches[b])blocks.push(await fileToBlock(file));
    const n=Math.max(3,Math.round(total*batches[b].length/f.files.length));
    blocks.push({type:'text',text:`Material type: ${kind.value}. Create about ${n} questions. Notes: ${instr.value.trim()||'none'}.`+(existing.length?`\nDo not repeat these existing questions:\n- `+existing.join('\n- '):'')});
    const items=await callClaude(blocks);for(const it of items){if(validItem(it)){it.id=uid();out.push(it);}else dropped++;}}}
  catch(e){btn.disabled=false;status.textContent='';return toast(t('genErr',{e:e.message}),true);}
  viewReview(g,{title:title.value.trim(),kind:kind.value,instructions:instr.value.trim(),files:f.files.map(x=>x.name)},out,dropped);
 });
 const draw=()=>screen(topbar(g?t('addMaterial')+': '+g.title:t('newGame'),{back:()=>viewAdmin('games')}),h('main',{class:'page stack'},
  !g?h('div',{},h('label',{class:'f',for:'gt'},t('gameTitle')),title):null,
  h('div',{},h('label',{class:'f',for:'gk'},t('kind')),kind),h('div',{},h('label',{class:'f',for:'gi'},t('instructions')),instr),
  h('div',{},h('label',{class:'f',for:'gc'},t('count')),cnt),h('div',{},h('label',{class:'f',for:'gf'},t('files')),fi,h('p',{class:'small muted',style:'margin-top:6px'},t('materialNote'))),
  thumbs,btn,status));
 draw();
}
function viewReview(g,meta,items,dropped){
 const keep=items.map(()=>true);
 const draw=()=>screen(topbar(t('review'),{back:()=>viewAdmin('games')}),h('main',{class:'page wide stack'},
  h('p',{},t('genDone',{n:items.length,d:dropped})),
  h('div',{class:'list'},items.map((it,k)=>{const cb=h('input',{type:'checkbox','aria-label':t('keep'),onchange:e=>{keep[k]=e.target.checked;}});cb.checked=keep[k];
   return itemRow(it,{check:cb,onEdit:()=>jsonEdit(it,async n=>{items[k]=n;draw();})});})),
  h('button',{class:'btn big',onclick:async()=>{
   const chosen=items.filter((_,k)=>keep[k]);const game=g||{id:uid(),title:meta.title,kind:meta.kind,instructions:meta.instructions,createdAt:new Date().toISOString(),sources:[],items:[]};
   const seen=new Set(game.items.map(i=>i.type+'|'+i.prompt.trim().toLowerCase()));let dup=0;
   for(const it of chosen){const key=it.type+'|'+it.prompt.trim().toLowerCase();if(seen.has(key)){dup++;continue;}seen.add(key);game.items.push(it);}
   game.sources=(game.sources||[]).concat([{date:new Date().toISOString(),files:meta.files,added:chosen.length-dup}]);
   if(meta.instructions)game.instructions=meta.instructions;
   try{await saveGame(game);}catch(e){return toast(t('err',{e:e.message}),true);}
   toast(t('saved')+(dup?' – '+t('dupSkipped',{n:dup}):''));viewAdmin('games');}},t('saveToGame'))));
 draw();
}

  h('tbody',{},logs.map(l=>h('tr',{},h('td',{},fmtDate(l.started)),h('td',{},l.players.map(p=>p.name).join(' vs ')),h('td',{},l.game.title),

   h('td',{},l.players.map(p=>p.score).join(' : ')),h('td',{},l.players.map(p=>p.accuracy+' %').join(' : ')),
   h('td',{},h('button',{class:'btn ghost small',onclick:()=>logDetails(l)},t('details')))))))));

function logDetails(l){
 const wrong=l.answers.filter(a=>!a.correct);const dlg=$('#dlg');const nameOf=id=>(l.players.find(p=>p.id===id)||{}).name||'';
 dlg.replaceChildren(h('div',{class:'stack'},h('h2',{},l.game.title+' – '+fmtDate(l.started)),h('h3',{},t('mistakes')),
  wrong.length?h('div',{class:'list'},wrong.map(a=>h('div',{class:'item',style:'display:block'},h('div',{},(l.players.length>1?nameOf(a.player)+': ':'')+a.prompt),
   h('div',{class:'small',style:'color:var(--red)'},'✗ '+a.given),h('div',{class:'small',style:'color:var(--green)'},'✓ '+a.expected)))):h('p',{class:'muted'},t('noMistakes')),
  h('button',{class:'btn',onclick:()=>dlg.close()},'OK')));
 dlg.showModal();
}
