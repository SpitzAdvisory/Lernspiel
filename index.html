<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lernspiel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Kalam:wght@700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FBFBF6; --grid:#DDE7F1; --ink:#1F3A93; --ink-soft:#E8EDF9;
  --red:#C8322B; --mark:#F6E27A; --graphite:#2F3437; --green:#2E7D4F;
  --muted:#667085; --white:#FFFFFF;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  font-family:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  color:var(--graphite); font-size:18px; line-height:1.5; min-height:100vh;
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;
}
.hand{font-family:"Kalam","Comic Sans MS",cursive}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.top{display:flex;align-items:center;gap:12px;padding:14px 20px;background:rgba(251,251,246,.92);border-bottom:2px solid var(--grid);position:sticky;top:0;z-index:5}
.top h1{font-size:1.35rem;margin:0;flex:1;color:var(--ink)}
.page{max-width:780px;margin:0 auto;padding:24px 20px 60px 36px;border-left:2px solid var(--red);min-height:calc(100vh - 64px);background:linear-gradient(90deg,rgba(251,251,246,.85),rgba(251,251,246,.85))}
.page.wide{max-width:1040px}
h2{font-size:1.5rem;margin:0 0 12px;color:var(--ink)}
h3{font-size:1.15rem;margin:24px 0 8px}
p{margin:0 0 12px}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.btn{border:0;border-radius:10px;padding:10px 18px;background:var(--ink);color:var(--white);font-weight:700}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink)}
.btn.danger{background:transparent;color:var(--red);box-shadow:inset 0 0 0 2px var(--red)}
.btn.small{padding:6px 12px;font-size:.9rem}
.btn.big{padding:14px 28px;font-size:1.15rem}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stack>*+*{margin-top:12px}
.lang{display:flex;border-radius:8px;overflow:hidden;box-shadow:inset 0 0 0 2px var(--ink)}
.lang button{border:0;background:transparent;padding:4px 10px;font-weight:700;color:var(--ink)}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--white)}
.players{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px}
.player{border:2px solid var(--ink);border-radius:16px;background:var(--white);padding:16px 10px;text-align:center}
.player .av{font-size:3rem;line-height:1.1}
.player .nm{font-weight:700;margin-top:6px}
.list{display:flex;flex-direction:column;gap:10px}
.item{display:flex;align-items:center;gap:12px;background:var(--white);border:2px solid var(--grid);border-radius:12px;padding:12px 14px;text-align:left;width:100%}
button.item{border-color:var(--ink)}
.item .grow{flex:1;min-width:0}
.bar{height:10px;border-radius:5px;background:var(--ink-soft);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--ink)}
.choices{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.choice{border:2px solid var(--ink);border-radius:12px;background:var(--white);padding:12px;text-align:left}
.choice[aria-pressed="true"]{background:var(--mark)}
.choice:disabled{opacity:.5;border-style:dashed}
.choice b{display:block}
.choice span{font-size:.85rem;color:var(--muted)}
.stickers{display:flex;flex-wrap:wrap;gap:10px}
.sticker{display:flex;flex-direction:column;align-items:center;width:84px;text-align:center;font-size:.75rem;line-height:1.2}
.sticker i{font-style:normal;font-size:1.7rem;width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:var(--mark);box-shadow:0 0 0 3px var(--white),0 0 0 5px var(--ink);transform:rotate(-6deg);margin-bottom:6px}
.hud{display:flex;flex-wrap:wrap;gap:16px;align-items:center;font-weight:700;margin-bottom:16px}
.hud .sp{flex:1}
.card{background:var(--white);border:2px solid var(--ink);border-radius:18px;padding:22px;position:relative}
.prompt{font-size:1.45rem;line-height:1.35;margin:0 0 6px;font-weight:700}
.hint{font-size:.9rem;color:var(--muted);margin-bottom:16px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{border:2px solid var(--ink);border-radius:12px;background:var(--white);padding:12px 16px;text-align:left;font-size:1.1rem;min-height:52px}
.opt[aria-pressed="true"]{background:var(--mark)}
.opt.ok{border-color:var(--green);background:#E3F3E9}
.opt.bad{border-color:var(--red);background:#FBE5E3}
.seq{min-height:56px;border:2px dashed var(--ink);border-radius:12px;padding:8px;display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chip{border:2px solid var(--ink);border-radius:10px;background:var(--white);padding:8px 12px;font-size:1.05rem}
.chip.placed{background:var(--mark)}
.chip .n{font-weight:700;margin-right:6px;color:var(--ink)}
input[type=text],input[type=password],input[type=number],select,textarea{width:100%;border:2px solid var(--ink);border-radius:10px;padding:10px 12px;background:var(--white)}
textarea{min-height:90px}
label.f{display:block;font-weight:700;margin-bottom:4px}
.answerbox{font-size:1.3rem}
.feedback{margin-top:18px;padding-top:14px;border-top:2px dashed var(--grid)}
.stamp{font-size:2rem;display:inline-block;transform:rotate(-4deg)}
.stamp.ok{color:var(--green)}
.stamp.bad{color:var(--red)}
@media (prefers-reduced-motion:no-preference){
  .stamp{animation:stamp .28s ease-out}
  @keyframes stamp{from{transform:rotate(-4deg) scale(1.6);opacity:0}to{transform:rotate(-4deg) scale(1);opacity:1}}
}
.bigscore{font-size:4rem;color:var(--red);line-height:1;transform:rotate(-3deg);display:inline-block}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:20px}
.tabs button{border:0;background:transparent;padding:8px 14px;border-radius:8px;font-weight:700;color:var(--ink)}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--white)}
table{width:100%;border-collapse:collapse;background:var(--white);font-size:.9rem}
th,td{text-align:left;padding:8px;border-bottom:1px solid var(--grid);vertical-align:top}
.scroll{overflow-x:auto}
.tag{display:inline-block;font-size:.75rem;font-weight:700;padding:2px 8px;border-radius:6px;background:var(--ink-soft);color:var(--ink)}
.avpick{display:flex;flex-wrap:wrap;gap:6px}
.avpick button{font-size:1.6rem;border:2px solid transparent;border-radius:10px;background:var(--white);width:48px;height:48px}
.avpick button[aria-pressed="true"]{border-color:var(--ink);background:var(--mark)}
.thumbs{display:flex;flex-wrap:wrap;gap:8px}
.thumbs img,.thumbs .pdf{width:84px;height:84px;object-fit:cover;border-radius:8px;border:2px solid var(--grid);background:var(--white);display:grid;place-items:center;font-size:.8rem}
dialog{border:2px solid var(--ink);border-radius:14px;max-width:680px;width:92vw;padding:20px}
dialog::backdrop{background:rgba(31,58,147,.25)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--graphite);color:var(--white);padding:10px 18px;border-radius:10px;z-index:50;max-width:90vw}
.toast.err{background:var(--red)}
.figwrap{position:relative;display:inline-block;max-width:100%;margin:4px 0 14px;line-height:0}
.figwrap img{display:block;max-width:100%;max-height:48vh;border-radius:10px;border:2px solid var(--grid);background:#fff;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.figwrap.spotable img{cursor:crosshair;touch-action:manipulation}
.spotmark{position:absolute;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px var(--graphite)}
.spotmark.ok{background:var(--green)}.spotmark.bad{background:var(--red)}
.spottarget{position:absolute;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;border:3px solid var(--green);background:rgba(46,125,79,.18);pointer-events:none}
.thumb{width:110px;height:82px;object-fit:contain;border:1px solid var(--grid);border-radius:8px;background:#fff;flex:none}
dialog.wide{max-width:1000px}
.stage{position:relative;display:inline-block;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;line-height:0;max-width:100%}
.stage img{display:block;max-width:100%;max-height:62vh;pointer-events:none}
.stage .crop{position:absolute;border:2px dashed #fff;box-shadow:0 0 0 9999px rgba(0,0,0,.45)}
.stage .cover{position:absolute;background:#D9DDE3;border:1px solid #9AA3AF}
.stage .temp{opacity:.7}
.stage .spotdot{position:absolute;width:24px;height:24px;margin:-12px 0 0 -12px;border-radius:50%;border:3px solid var(--red);background:rgba(255,255,255,.7)}
.mapwrap{position:relative;width:100%;margin:4px 0 14px;border:2px solid var(--grid);border-radius:12px;overflow:hidden;background:#cfe3f3}
.mapwrap svg.map{display:block;width:100%;height:auto;max-height:62vh;touch-action:none;-webkit-user-select:none;user-select:none;cursor:crosshair}
.mapctl{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:6px;z-index:2}
.mapctl button{width:38px;height:38px;border-radius:8px;border:2px solid var(--ink);background:#fff;font-weight:700;font-size:1.1rem;color:var(--ink);line-height:1}
.mapattr{position:absolute;left:6px;bottom:4px;font-size:.62rem;color:#56606c;background:rgba(255,255,255,.7);padding:1px 5px;border-radius:4px;line-height:1.3}
.maptip{position:absolute;left:8px;top:8px;background:rgba(255,255,255,.92);border:1px solid var(--grid);border-radius:8px;padding:4px 8px;font-size:.85rem;line-height:1.3;max-width:70%;pointer-events:none}
.m-ocean{fill:#cfe3f3;stroke:#9ab3c8;stroke-width:.6;vector-effect:non-scaling-stroke}
.m-sea{fill:transparent;stroke:none}
.m-land{fill:#f3efe4;stroke:#9a8f7a;stroke-width:.6;vector-effect:non-scaling-stroke}
.m-land.m-bg{fill:#ece6d6}
.m-canton{fill:#f8f4ea;stroke:#7d725d;stroke-width:.8;vector-effect:non-scaling-stroke}
.m-continent{fill:transparent;stroke:none}
.m-landscape{fill:transparent;stroke:none}
.showfaint .m-landscape,.showfaint .m-continent{fill:#c9a86a;fill-opacity:.18;stroke:#a88f60;stroke-width:.6;vector-effect:non-scaling-stroke}
.m-water{fill:#9cc7e8;stroke:#6aa0cc;stroke-width:.5;vector-effect:non-scaling-stroke}
.m-river{fill:none;stroke:#5b9bd5;stroke-width:1.3;vector-effect:non-scaling-stroke;stroke-linecap:round;stroke-linejoin:round}
.m-pt{fill:#2f3437;stroke:#fff;stroke-width:1.2;vector-effect:non-scaling-stroke}
.m-landbase{fill:#efe9dc;stroke:none}
.m-chbase{fill:#e2dccd;stroke:#b3a88f;stroke-width:.6;vector-effect:non-scaling-stroke}
.m-hist{stroke:#6b6255;stroke-width:.7;vector-effect:non-scaling-stroke}
.mapcap{position:absolute;left:8px;top:8px;background:rgba(255,255,255,.92);border:1px solid var(--grid);border-radius:8px;padding:3px 9px;font-weight:700;font-size:.9rem;color:var(--ink);pointer-events:none;line-height:1.3}
.maphead{margin:18px 0 8px;color:var(--muted);font-weight:700;font-size:.9rem;text-transform:uppercase;letter-spacing:.04em}
svg.map .hl{fill:#f6c343!important;fill-opacity:.9;stroke:#c8322b;stroke-width:2.2;vector-effect:non-scaling-stroke}
svg.map .m-river.hl,svg.map path.hl.line{fill:none!important;stroke:#c8322b;stroke-width:4.5}
svg.map .ok{fill:#57b27a!important;fill-opacity:.85;stroke:#1d6b3e;stroke-width:2.2;vector-effect:non-scaling-stroke}
svg.map .bad{fill:#e2766f!important;fill-opacity:.85;stroke:#8f1f19;stroke-width:2.2;vector-effect:non-scaling-stroke}
svg.map .m-river.ok,svg.map path.ok.line{fill:none!important;stroke:#1d6b3e;stroke-width:4.5}
svg.map .m-river.bad,svg.map path.bad.line{fill:none!important;stroke:#8f1f19;stroke-width:4.5}
svg.map circle.hl{fill:#f6c343;stroke:#c8322b;stroke-width:2.5}
svg.map circle.badge{fill:#1F3A93;stroke:#fff;stroke-width:2;vector-effect:non-scaling-stroke}
svg.map text.badge{fill:#fff;font-weight:700;font-family:"Atkinson Hyperlegible",system-ui,sans-serif;pointer-events:none}
svg.map circle.tapdot{stroke:#fff;stroke-width:2;vector-effect:non-scaling-stroke}
.maplist{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.mfig{display:block;width:100%;max-width:520px;height:auto;margin:6px 0 14px;-webkit-user-select:none;user-select:none}
.mfig.clock{max-width:230px}.mfig.tap{cursor:pointer;touch-action:manipulation}
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.05;margin:0 3px;font-size:.9em}.frac span:first-child{border-bottom:2px solid currentColor;padding:0 3px}
.keypad{display:grid;grid-template-columns:repeat(3,64px);gap:8px;margin-top:12px}.key{height:56px;min-width:56px;border:2px solid var(--ink);border-radius:12px;background:var(--white);font-size:1.4rem;font-weight:700;color:var(--ink)}
.key:active{background:var(--ink-soft)}.numrow{gap:14px;align-items:flex-end}.numf{display:flex;flex-direction:column;gap:4px;font-weight:700}.numbox{width:170px;font-size:1.6rem;text-align:center}
.coinrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:6px 0 12px}.coin{border-radius:50%;border:3px solid #9b7b1c;background:radial-gradient(circle at 35% 30%,#fff6c8,#e0c05a);font-weight:700;font-size:.95rem;color:#3b2f00;padding:0}
.coin.note{border-radius:8px;width:96px;height:52px;background:linear-gradient(135deg,#d9ecff,#b6d0f2);border-color:#35609c;color:#16325c}
.purse{min-height:70px;border:2px dashed var(--ink);border-radius:14px;padding:8px;margin:10px 0}
.emogrid{display:grid;grid-template-columns:repeat(3,64px);gap:6px;font-size:2.4rem;margin:6px 0 14px}.emogrid span{background:var(--white);border:2px solid var(--grid);border-radius:10px;text-align:center}
.pv{display:flex;gap:14px;flex-wrap:wrap;margin:8px 0}.pv>div{border:2px solid var(--ink);border-radius:12px;padding:8px 12px;text-align:center;background:var(--white)}.pv b{display:block;font-size:1.6rem}
.helpbox{margin:10px 0 0;padding:10px 14px;border-left:4px solid var(--mark);background:#FFFBEA;border-radius:8px}.helpbox li{margin:4px 0}
.years{display:flex;flex-wrap:wrap;gap:8px}.topicrow{display:flex;gap:8px;align-items:stretch}.topicrow .choice{flex:1}
.mtable{border-collapse:collapse;margin:6px 0 14px;background:#fff}.mtable th,.mtable td{border:1.5px solid var(--ink);padding:6px 14px;text-align:left}.mtable th{background:var(--ink-soft)}
.glos dt{font-weight:700;margin-top:10px}.glos dd{margin:2px 0 0 0}
@media (max-width:560px){.page{padding-left:24px}.prompt{font-size:1.25rem}}
</style>
</head>

const $=(s,r=document)=>r.querySelector(s);
function h(tag,attrs,...kids){const el=document.createElement(tag);for(const[k,v]of Object.entries(attrs||{})){if(v==null||v===false)continue;
 if(k==='class')el.className=v;else if(k.startsWith('on'))el.addEventListener(k.slice(2),v);else if(k==='value')el.value=v;else el.setAttribute(k,v===true?'':v);}
 for(const c of kids.flat(Infinity)){if(c==null||c===false)continue;el.append(c instanceof Node?c:document.createTextNode(String(c)));}return el;}
function screen(...kids){S.sid=(S.sid||0)+1;$('#app').replaceChildren(...kids);window.scrollTo(0,0);S.onEnter=null;}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function slug(s){return String(s).replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/Ä/g,'Ae').replace(/Ö/g,'Oe').replace(/Ü/g,'Ue').replace(/ß/g,'ss')
 .normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^A-Za-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,40)||'x';}
function pad(n){return String(n).padStart(2,'0');}
function ymd(d){return d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate());}
function hms(d){return pad(d.getHours())+pad(d.getMinutes())+pad(d.getSeconds());}
function fmtDate(iso){const d=new Date(iso);return d.toLocaleDateString({de:'de-CH',en:'en-GB',fr:'fr-CH'}[S.lang]||'de-CH')+' '+pad(d.getHours())+':'+pad(d.getMinutes());}
function toast(msg,err){const el=h('div',{class:'toast'+(err?' err':''),role:'status'},msg);document.body.append(el);setTimeout(()=>el.remove(),err?6000:2600);}
async function sha(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');}
function levelOf(xp){return Math.floor(Math.sqrt((xp||0)/50))+1;}
function xpFor(level){return 50*(level-1)*(level-1);}

const IDB={db:null,
 open(){return new Promise((res,rej)=>{const r=indexedDB.open('lernspiel',2);r.onupgradeneeded=()=>{const d=r.result;for(const s of['kv','files','cache','outbox'])if(!d.objectStoreNames.contains(s))d.createObjectStore(s);};
  r.onsuccess=()=>{const d=r.result;this.db=d;d.onclose=()=>{if(this.db===d)this.db=null;};d.onversionchange=()=>{d.close();if(this.db===d)this.db=null;};res();};
  r.onerror=()=>rej(r.error);r.onblocked=()=>rej(new Error('IndexedDB blocked'));});},
 /* Safari may close the connection (e.g. after a redirect or when the tab was in the background): reopen and retry once */
 async tx(store,mode,fn,retry){if(!this.db)await this.open();
  try{return await new Promise((res,rej)=>{const tr=this.db.transaction(store,mode);const req=fn(tr.objectStore(store));tr.oncomplete=()=>res(req&&req.result);tr.onerror=()=>rej(tr.error);tr.onabort=()=>rej(tr.error||new Error('IndexedDB aborted'));});}
  catch(e){retry=retry||0;const closing=e&&(e.name==='InvalidStateError'||e.name==='UnknownError'||/closing|closed|connection|lost/i.test(e.message||''));
   if(!closing||retry>=2)throw e;try{this.db&&this.db.close();}catch(_){}this.db=null;await new Promise(r=>setTimeout(r,150*(retry+1)));await this.open();return this.tx(store,mode,fn,retry+1);}},
 /* small settings (login tokens, language, API key) live in localStorage, which Safari keeps reliably; IndexedDB is only the fallback */
 lsKey(k){return'lernspiel:'+k;},lsOk(v){return v==null||['string','number','boolean'].includes(typeof v)||Array.isArray(v)||(typeof v==='object'&&Object.getPrototypeOf(v)===Object.prototype);},
 async get(s,k){if(s==='kv'){try{const x=localStorage.getItem(this.lsKey(k));if(x!==null)return JSON.parse(x);}catch(_){}
   try{return await this.tx(s,'readonly',o=>o.get(k));}catch(e){console.warn('IDB get',k,e);return undefined;}}
  if(s==='cache'){try{return await this.tx(s,'readonly',o=>o.get(k));}catch(e){console.warn('IDB cache',e);return undefined;}}
  return this.tx(s,'readonly',o=>o.get(k));},
 async set(s,k,v){if(s==='kv'&&this.lsOk(v)){try{localStorage.setItem(this.lsKey(k),JSON.stringify(v));try{await this.tx(s,'readwrite',o=>o.delete(k));}catch(_){}return;}catch(_){}}
  if(s==='cache'){try{return await this.tx(s,'readwrite',o=>o.put(v,k));}catch(e){console.warn('IDB cache',e);return;}}
  return this.tx(s,'readwrite',o=>o.put(v,k));},
 async del(s,k){if(s==='kv'){try{localStorage.removeItem(this.lsKey(k));}catch(_){}try{await this.tx(s,'readwrite',o=>o.delete(k));}catch(e){console.warn('IDB del',e);}return;}
  return this.tx(s,'readwrite',o=>o.delete(k));},
 keys(s){return this.tx(s,'readonly',o=>o.getAllKeys());}};
class IdbStore{constructor(){this.kind='browser';this.name=t('browserStorage');}
 async read(p){const v=await IDB.get('files',p);return v===undefined?null:JSON.parse(v);}
 async write(p,o){await IDB.set('files',p,JSON.stringify(o,null,2));}
 async list(dir){const ks=await IDB.keys('files');const pre=dir.replace(/\/?$/,'/');return ks.filter(k=>k.startsWith(pre)&&!k.slice(pre.length).includes('/')).map(k=>k.slice(pre.length));}
 async remove(p){await IDB.del('files',p);}
 async readBlob(p){const v=await IDB.get('files',p);return v instanceof Blob?v:null;}
 async writeBlob(p,b){await IDB.set('files',p,b);}
 async removeDir(p){const pre=p.replace(/\/?$/,'/');for(const k of await IDB.keys('files'))if(k.startsWith(pre))await IDB.del('files',k);}}
class FolderStore{constructor(hd){this.root=hd;this.kind='folder';this.name=hd.name;}
 async dir(parts,create){let d=this.root;for(const p of parts)d=await d.getDirectoryHandle(p,{create});return d;}
 split(p){const parts=p.split('/');const f=parts.pop();return[parts,f];}
 async read(p){try{const[ps,f]=this.split(p);const d=await this.dir(ps,false);const fh=await d.getFileHandle(f);return JSON.parse(await(await fh.getFile()).text());}
  catch(e){if(e.name==='NotFoundError'||e.name==='TypeMismatchError')return null;throw e;}}
 async write(p,o){const[ps,f]=this.split(p);const d=await this.dir(ps,true);const fh=await d.getFileHandle(f,{create:true});const w=await fh.createWritable();await w.write(JSON.stringify(o,null,2));await w.close();}
 async list(dir){try{const d=await this.dir(dir.split('/').filter(Boolean),false);const out=[];for await(const[n,hd]of d.entries()){if(hd.kind==='file')out.push(n);}return out;}
  catch(e){if(e.name==='NotFoundError')return[];throw e;}}
 async remove(p){const[ps,f]=this.split(p);const d=await this.dir(ps,false);await d.removeEntry(f);}
 async readBlob(p){try{const[ps,f]=this.split(p);const d=await this.dir(ps,false);return await(await d.getFileHandle(f)).getFile();}catch(e){if(e.name==='NotFoundError'||e.name==='TypeMismatchError')return null;throw e;}}
 async writeBlob(p,b){const[ps,f]=this.split(p);const d=await this.dir(ps,true);const fh=await d.getFileHandle(f,{create:true});const w=await fh.createWritable();await w.write(b);await w.close();}
 async removeDir(p){try{const parts=p.split('/');const n=parts.pop();const d=await this.dir(parts,false);await d.removeEntry(n,{recursive:true});}catch(e){}}}
async function copyAll(a,b){for(const f of['config.json','profiles.json']){const v=await a.read(f);if(v)await b.write(f,v);}

function blankState(){return{xp:0,answers:0,correct:0,runs:0,badges:[],unlocks:{},mastery:{}};}
function st(pid){return(S.state&&S.state[pid])||blankState();}
function computeState(){S.state={};for(const p of S.profiles)S.state[p.id]=blankState();
 for(const l of uniqLogs().sort((a,b)=>String(a.started).localeCompare(String(b.started))))applyLog(S.state,l);}
function applyLog(state,l){
 const out={};const game=S.games.find(g=>g.id===(l.game&&l.game.id));
 for(const pl of l.players||[]){const s=state[pl.id];if(!s)continue;
  const prof=S.profiles.find(p=>p.id===pl.id);if(prof&&prof.resetAt&&String(l.started)<prof.resetAt)continue;
  const r={newBadges:[],unlocked:[],levelBefore:levelOf(s.xp)};
  const gm=(s.mastery[l.game.id]=s.mastery[l.game.id]||{});
  for(const a of l.answers||[]){if(a.player!==pl.id||a.joke)continue;const m=gm[a.itemId]||{box:0,seen:0,right:0};m.seen++;
   if(a.correct&&!a.second){m.right++;m.box=Math.min(5,m.box+1);}else if(!a.correct)m.box=Math.max(0,m.box-2);gm[a.itemId]=m;}
  s.xp+=pl.score||0;s.answers+=pl.answered||0;s.correct+=pl.correct||0;s.runs++;
  const acc=pl.answered?pl.correct/pl.answered:0;
  const give=id=>{if(!s.badges.includes(id)){s.badges.push(id);r.newBadges.push(id);}};
  give('first_run');
  if(l.mode==='classic'&&!l.aborted&&pl.answered>=5&&pl.correct===pl.answered)give('perfect');
  if((pl.bestStreak||0)>=10)give('streak10');if(s.answers>=100)give('answers100');
  if(l.mode==='survival'&&pl.correct>=20)give('survivor20');if(l.mode==='timed'&&pl.correct>=15)give('speed15');
  if(l.mode==='duel'&&l.winner===pl.id)give('duel_win');if(l.difficulty==='hard'&&pl.answered>=5&&acc>=0.8)give('hard_clear');
  if(game&&gameUnits(game).length&&gameUnits(game).every(id=>gm[id]&&gm[id].box>=3))give('master_game');
  const u=(s.unlocks[l.game.id]=s.unlocks[l.game.id]||{});
  if(pl.answered>=5&&l.difficulty==='easy'&&acc>=0.7&&!u.medium){u.medium=true;r.unlocked.push('medium');}
  if(pl.answered>=5&&l.difficulty==='medium'&&acc>=0.8&&!u.hard){u.hard=true;r.unlocked.push('hard');}
  r.levelAfter=levelOf(s.xp);out[pl.id]=r;}
 return out;
}

function b64url(bytes){let s='';for(const b of bytes)s+=String.fromCharCode(b);return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');}
function dbxArg(o){return JSON.stringify(o).replace(/[\u007f-\uffff]/g,c=>'\\u'+('000'+c.charCodeAt(0).toString(16)).slice(-4));}
const DBX={token:null,exp:0,TOKEN_URL:'https://api.dropboxapi.com/oauth2/token',
 redirect(){return location.origin+location.pathname.replace(/index\.html$/,'');},
 async start(){const v=b64url(crypto.getRandomValues(new Uint8Array(48)));
  const ch=b64url(new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(v))));
  await IDB.set('kv','dbxVerifier',v);
  location.href='https://www.dropbox.com/oauth2/authorize?'+new URLSearchParams({client_id:DBX_KEY,response_type:'code',code_challenge:ch,code_challenge_method:'S256',redirect_uri:this.redirect(),token_access_type:'offline'});},
 async finish(code){const v=await IDB.get('kv','dbxVerifier');
  const r=await fetch(this.TOKEN_URL,{method:'POST',body:new URLSearchParams({code,grant_type:'authorization_code',code_verifier:v||'',client_id:DBX_KEY,redirect_uri:this.redirect()})});
  const d=await r.json().catch(()=>({}));if(!r.ok||!d.refresh_token)throw new Error(d.error_description||d.error||('HTTP '+r.status));
  await IDB.set('kv','dbxRefresh',d.refresh_token);await IDB.del('kv','dbxVerifier');this.token=d.access_token;this.exp=Date.now()+((d.expires_in||3600)-60)*1000;},
 async access(){if(this.token&&Date.now()<this.exp)return this.token;const rt=await IDB.get('kv','dbxRefresh');if(!rt)throw new Error('not connected');
  const r=await fetch(this.TOKEN_URL,{method:'POST',body:new URLSearchParams({grant_type:'refresh_token',refresh_token:rt,client_id:DBX_KEY})});
  const d=await r.json().catch(()=>({}));if(!r.ok){if(r.status===400||r.status===401)await IDB.del('kv','dbxRefresh');throw new Error('not connected');}
  this.token=d.access_token;this.exp=Date.now()+((d.expires_in||3600)-60)*1000;return this.token;},
 async call(url,opts){for(let k=0;k<2;k++){const tok=await this.access();
  const r=await fetch(url,Object.assign({},opts,{headers:Object.assign({Authorization:'Bearer '+tok},opts.headers||{})}));
  if(r.status===401&&k===0){this.token=null;continue;}return r;}},
 async rpc(ep,body){const r=await this.call('https://api.dropboxapi.com/2/'+ep,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  const txt=await r.text();let d=null;try{d=JSON.parse(txt);}catch(e){}
  if(!r.ok){const e=new Error((d&&d.error_summary)||txt||('HTTP '+r.status));e.status=r.status;throw e;}return d;},
 async download(path){const r=await this.call('https://content.dropboxapi.com/2/files/download',{method:'POST',headers:{'Dropbox-API-Arg':dbxArg({path})}});
  if(r.status===409)return null;if(!r.ok)throw new Error('HTTP '+r.status+' '+await r.text());return r.text();},
 async downloadBlob(path){const r=await this.call('https://content.dropboxapi.com/2/files/download',{method:'POST',headers:{'Dropbox-API-Arg':dbxArg({path})}});
  if(r.status===409)return null;if(!r.ok)throw new Error('HTTP '+r.status+' '+await r.text());return r.blob();},
 async upload(path,text,mode){const r=await this.call('https://content.dropboxapi.com/2/files/upload',{method:'POST',
  headers:{'Dropbox-API-Arg':dbxArg({path,mode,autorename:true,mute:true}),'Content-Type':'application/octet-stream'},body:text});
  if(!r.ok)throw new Error('HTTP '+r.status+' '+await r.text());return r.json();}
};
class DbxStore{constructor(){this.kind='dropbox';this.name='Dropbox';}
 async read(p){try{const tx=await DBX.download('/'+p);await IDB.set('cache','file:'+p,tx==null?'null':tx);return tx==null?null:JSON.parse(tx);}
  catch(e){if(e.message==='not connected')throw e;const c=await IDB.get('cache','file:'+p);if(c!==undefined)return JSON.parse(c);throw e;}}
 async write(p,o){await DBX.upload('/'+p,JSON.stringify(o,null,2),p.startsWith('logs/')?'add':'overwrite');}
 async list(dir){try{let d=await DBX.rpc('files/list_folder',{path:'/'+dir});let out=d.entries;
   while(d.has_more){d=await DBX.rpc('files/list_folder/continue',{cursor:d.cursor});out=out.concat(d.entries);}
   const names=out.filter(e=>e['.tag']==='file').map(e=>e.name);await IDB.set('cache','list:'+dir,JSON.stringify(names));return names;}
  catch(e){if(e.status===409)return[];if(e.message==='not connected')throw e;const c=await IDB.get('cache','list:'+dir);if(c)return JSON.parse(c);throw e;}}
 async remove(p){await DBX.rpc('files/delete_v2',{path:'/'+p});}
 async readBlob(p){const c=await IDB.get('cache','blob:'+p);if(c instanceof Blob)return c;const b=await DBX.downloadBlob('/'+p);if(b)await IDB.set('cache','blob:'+p,b);return b;}

topic('m1-double',1,1,['Verdoppeln und Halbieren','Doubling and halving','Doubler et partager en deux'],
 ['Verdoppeln heisst: dieselbe Zahl noch einmal dazu, 6 + 6 = 12. Halbieren heisst: in zwei gleiche Teile teilen, die Hälfte von 12 ist 6.','Doubling means adding the same number again: 6 + 6 = 12. Halving means splitting into two equal parts: half of 12 is 6.','Doubler, c’est ajouter le même nombre : 6 + 6 = 12. Partager en deux, c’est faire deux parts égales : la moitié de 12, c’est 6.'],['double','half'],

topic('m1-shapes',1,2,['Formen erkennen','Recognising shapes','Reconnaître les formes'],
 ['Ein Dreieck hat 3 Ecken, ein Viereck 4. Ein Quadrat ist ein Viereck mit 4 gleich langen Seiten. Ein Kreis hat keine Ecken.','A triangle has 3 corners, a quadrilateral 4. A square is a quadrilateral with 4 equal sides. A circle has no corners.','Un triangle a 3 sommets, un quadrilatère 4. Un carré est un quadrilatère avec 4 côtés égaux. Un cercle n’a pas de sommet.'],['triangle','square','rectangle','circle','corner'],

topic('m1-position',1,2,['Lage: links, rechts, oben, unten','Position: left, right, above, below','Position : gauche, droite, dessus, dessous'],

 lv=>{const E=shuffle(['🍎','🐸','⭐','🚗','🎈','🐟','🌻','🍌','⚽']);const g=[[0,1,2],[3,4,5],[6,7,8]];const r=ri(0,2),c=ri(0,2);
  const dirs=[['links','left','à gauche',0,-1],['rechts','right','à droite',0,1],['oben','above','au-dessus',-1,0],['unten','below','en dessous',1,0]].filter(d=>r+d[3]>=0&&r+d[3]<3&&c+d[4]>=0&&c+d[4]<3);
  const d=pick(lv===1?dirs.filter(x=>x[3]===0).concat(dirs).slice(0,dirs.length):dirs);const tgt=E[g[r+d[3]][c+d[4]]];
  const q=X('Was ist direkt '+d[0]+' von '+E[g[r][c]]+'?','What is directly '+d[1]+' '+(d[3]?'':'of ')+E[g[r][c]]+'?','Qu’est-ce qui est juste '+d[2]+(d[3]?' de ':' de ')+E[g[r][c]]+' ?');

  return steps(it,[X('Suche zuerst ','First find ','Cherche d’abord ')+E[g[r][c]]+'.',X('Schau jetzt nach ','Now look ','Regarde maintenant ')+X(d[0],d[1],d[2])+'.',tgt]);});
topic('m1-money',1,3,['Geld bis 20 Franken','Money up to 20 francs','L’argent jusqu’à 20 francs'],
 ['Münzen gibt es zu 1, 2 und 5 Franken, Noten zu 10 und 20 Franken. Zähle mit der grössten Münze oder Note zuerst.','There are coins of 1, 2 and 5 francs and notes of 10 and 20 francs. Start counting with the biggest one.','Il existe des pièces de 1, 2 et 5 francs et des billets de 10 et 20 francs. Commence à compter par la plus grande valeur.'],['franc'],
 lv=>{const pool=lv===1?[100,200,500]:[100,200,500,1000];let list=[],sum=0;const n=ri(2,lv===1?3:5);for(let k=0;k<n;k++){const v=pick(pool);if(sum+v>2000)break;list.push(v);sum+=v;}list.sort((a,b)=>b-a);

   return steps(it,[X('Nimm zuerst die grösste Münze oder Note, die noch passt.','First take the biggest coin or note that still fits.','Prends d’abord la plus grande pièce ou le plus grand billet qui convient encore.'),X('Wie viel fehlt noch? Lege weiter.','How much is still missing? Keep going.','Combien manque-t-il encore ? Continue.'),fmtFr(tgt)]);}
  const it=numItem(X('Wie viele Franken sind das?','How many francs is that?','Combien de francs cela fait-il ?'),sum/100,{fig:()=>figCoins(list)});

topic('m1-clock',1,3,['Uhr: volle und halbe Stunden','Clock: o’clock and half past','L’heure : heures pile et demies'],
 ['Der kurze Zeiger zeigt die Stunde, der lange die Minuten. Zeigt der lange Zeiger auf die 12, ist es eine volle Stunde, zeigt er auf die 6, ist es halb.','The short hand shows the hour, the long hand the minutes. Long hand on 12: o’clock. Long hand on 6: half past.','La petite aiguille indique l’heure, la grande les minutes. Grande aiguille sur 12 : heure pile. Sur 6 : et demie.'],['hourhand','minutehand'],
 lv=>{const hh=ri(1,12),mm=lv===1?0:pick([0,30]);const right=clockWords(hh,mm);const wrong=new Set();let g=0;while(wrong.size<3&&g++<50){const w=clockWords(ri(1,12),pick([0,30]));if(w!==right)wrong.add(w);}
  if(mm===30)wrong.add(clockWords(hh,0));const it=choiceItem(X('Wie spät ist es?','What time is it?','Quelle heure est-il ?'),right,[...wrong].slice(0,3),{fig:()=>figClock(hh,mm).el});

topic('m1-length',1,3,['Längen vergleichen','Comparing lengths','Comparer des longueurs'],
 ['Um Längen zu vergleichen, legst du sie am gleichen Anfang an. Was weiter hinausragt, ist länger.','To compare lengths, line them up at the same start. The one that reaches further is longer.','Pour comparer des longueurs, aligne-les au même point de départ. Celle qui va le plus loin est la plus longue.'],['length'],

  const longest=L.indexOf(Math.max(...L)),shortest=L.indexOf(Math.min(...L));const askLong=lv===1||Math.random()<.5;const k=askLong?longest:shortest;
  const fig=()=>{const s=svgBox(460,n*40+10);L.forEach((l,i)=>s.append(sv('rect',{x:10+(lv===3?ri(0,60):0),y:10+i*40,width:l*34,height:22,rx:11,fill:cols[i][3]})));return s;};

topic('m2-numline100',2,1,['Zahlenstrahl bis 100','Number line to 100','Droite numérique jusqu’à 100'],

topic('m2-add100',2,1,['Plus bis 100','Adding to 100','Additions jusqu’à 100'],

const GSM=[["Marin and his neighbour Nancy each eat 4 apples a day. How many apples do they eat together in 30 days?", "Marin und seine Nachbarin Nancy essen jeden Tag je 4 Äpfel. Wie viele Äpfel essen die beiden zusammen in 30 Tagen?", "Marin et sa voisine Nancy mangent chacun 4 pommes par jour. Combien de pommes mangent-ils ensemble en 30 jours ?", ["4+4", "30*8"], [8, 240], 240], ["A pet shop had 6 cages of rodents. 3 of the cages have 10 hamsters each and the other 3 have 5 guinea pigs each. How many rodents did the pet shop have in total?", "Eine Tierhandlung hat 6 Käfige mit Nagetieren. In 3 Käfigen sind je 10 Hamster, in den anderen 3 je 5 Meerschweinchen. Wie viele Nagetiere sind es insgesamt?", "Une animalerie a 6 cages de rongeurs. 3 cages contiennent chacune 10 hamsters et les 3 autres 5 cochons d’Inde chacune. Combien de rongeurs y a-t-il en tout ?", ["3*10", "3*5", "30+15"], [30, 15, 45], 45], ["Charlie had 10 stickers. He bought 21 stickers in a shop and got 23 stickers for his birthday. Then he gave 9 stickers to his sister and used 28 to decorate a card. How many stickers does Charlie have left?", "Charlie hatte 10 Sticker. Er kaufte 21 Sticker in einem Laden und bekam 23 zum Geburtstag. Dann schenkte er seiner Schwester 9 Sticker und klebte 28 auf eine Karte. Wie viele Sticker hat Charlie noch?", "Charlie avait 10 autocollants. Il en a acheté 21 dans un magasin et en a reçu 23 pour son anniversaire. Ensuite, il en a donné 9 à sa sœur et en a collé 28 sur une carte. Combien d’autocollants lui reste-t-il ?", ["10+21+23", "9+28", "54-37"], [54, 37, 17], 17], ["Ryan plants 2 flowers a day in his garden. After 15 days, how many flowers does he have if 5 did not grow?", "Ryan pflanzt jeden Tag 2 Blumen in seinem Garten. Wie viele Blumen hat er nach 15 Tagen, wenn 5 nicht gewachsen sind?", "Ryan plante 2 fleurs par jour dans son jardin. Combien de fleurs a-t-il après 15 jours, si 5 n’ont pas poussé ?", ["2*15", "30-5"], [30, 25], 25], ["Gretchen has gold and silver coins. There are 30 more gold coins than silver coins. If she has 70 gold coins, how many coins does she have in total?", "Gretchen hat Gold- und Silbermünzen. Sie hat 30 Goldmünzen mehr als Silbermünzen. Sie hat 70 Goldmünzen. Wie viele Münzen hat sie insgesamt?", "Gretchen a des pièces d’or et d’argent. Elle a 30 pièces d’or de plus que de pièces d’argent. Elle a 70 pièces d’or. Combien de pièces a-t-elle en tout ?", ["70-30", "70+40"], [40, 110], 110], ["Tom gets his car washed 4 times a month. Each wash costs 15 francs. How much does he pay in a year?", "Tom lässt sein Auto 4-mal im Monat waschen. Eine Wäsche kostet 15 Franken. Wie viel bezahlt er in einem Jahr?", "Tom fait laver sa voiture 4 fois par mois. Un lavage coûte 15 francs. Combien paie-t-il en un an ?", ["4*12", "48*15"], [48, 720], 720], ["Jan has three times as many pets as Marcia. Marcia has two more pets than Cindy. If Cindy has four pets, how many pets do the three have in total?", "Jan hat dreimal so viele Haustiere wie Marcia. Marcia hat zwei Haustiere mehr als Cindy. Cindy hat vier Haustiere. Wie viele Haustiere haben die drei zusammen?", "Jan a trois fois plus d’animaux que Marcia. Marcia a deux animaux de plus que Cindy. Cindy a quatre animaux. Combien d’animaux les trois ont-ils en tout ?", ["4+2", "3*6", "4+6+18"], [6, 18, 28], 28], ["Bill starts on the 3rd floor. He takes the lift up to the floor that is 4 times his starting floor plus 6. Which floor is Bill on now?", "Bill startet im 3. Stock. Er fährt mit dem Lift in den Stock, der 4-mal so hoch ist wie sein Startstock, plus 6. In welchem Stock ist Bill jetzt?", "Bill part du 3e étage. Il prend l’ascenseur jusqu’à l’étage qui vaut 4 fois son étage de départ plus 6. À quel étage est Bill maintenant ?", ["3*4", "12+6"], [12, 18], 18], ["Bailey starts with some money. Then she gets 5 francs of pocket money every week for 8 weeks. At the end she has 100 francs. How much money did she start with?", "Bailey hat etwas Geld. Dann bekommt sie 8 Wochen lang jede Woche 5 Franken Taschengeld. Am Schluss hat sie 100 Franken. Wie viel Geld hatte sie am Anfang?", "Bailey a un peu d’argent. Ensuite, elle reçoit 5 francs d’argent de poche chaque semaine pendant 8 semaines. À la fin, elle a 100 francs. Combien d’argent avait-elle au début ?", ["5*8", "100-40"], [40, 60], 60], ["After changing schools, Amy made 20 more friends than Lily. Lily made 50 friends. How many friends do Lily and Amy have together?", "Nach dem Schulwechsel fand Amy 20 Freundinnen und Freunde mehr als Lily. Lily fand 50. Wie viele Freundinnen und Freunde haben Lily und Amy zusammen?", "Après avoir changé d’école, Amy s’est fait 20 amis de plus que Lily. Lily s’est fait 50 amis. Combien d’amis Lily et Amy ont-elles ensemble ?", ["50+20", "70+50"], [70, 120], 120], ["Cody eats three times as many biscuits as Amir. If Amir eats 5 biscuits, how many biscuits do they eat together?", "Cody isst dreimal so viele Kekse wie Amir. Amir isst 5 Kekse. Wie viele Kekse essen die beiden zusammen?", "Cody mange trois fois plus de biscuits qu’Amir. Amir mange 5 biscuits. Combien de biscuits mangent-ils ensemble ?", ["5*3", "15+5"], [15, 20], 20], ["On Tuesday, Peter wants to exercise twice as long as on Sunday and Monday together. On Sunday he exercised for 23 minutes, on Monday for 16 minutes. How many minutes must he exercise on Tuesday?", "Am Dienstag will Peter doppelt so lange trainieren wie am Sonntag und Montag zusammen. Am Sonntag trainierte er 23 Minuten, am Montag 16 Minuten. Wie viele Minuten muss er am Dienstag trainieren?", "Mardi, Peter veut s’entraîner deux fois plus longtemps que dimanche et lundi réunis. Dimanche, il s’est entraîné 23 minutes et lundi 16 minutes. Combien de minutes doit-il s’entraîner mardi ?", ["23+16", "39*2"], [39, 78], 78], ["Joseph spent 500 francs in May. In June he spent 60 francs less. How much did he spend in the two months together?", "Joseph gab im Mai 500 Franken aus. Im Juni gab er 60 Franken weniger aus. Wie viel gab er in den beiden Monaten zusammen aus?", "Joseph a dépensé 500 francs en mai. En juin, il a dépensé 60 francs de moins. Combien a-t-il dépensé en tout pendant ces deux mois ?", ["500-60", "500+440"], [440, 940], 940], ["Martin weighs 55 kg. Carl weighs 16 kg more than Martin. Christian weighs 8 kg more than Carl. Harry weighs 5 kg less than Christian. How much does Harry weigh, in kg?", "Martin wiegt 55 kg. Carl wiegt 16 kg mehr als Martin. Christian wiegt 8 kg mehr als Carl. Harry wiegt 5 kg weniger als Christian. Wie viele kg wiegt Harry?", "Martin pèse 55 kg. Carl pèse 16 kg de plus que Martin. Christian pèse 8 kg de plus que Carl. Harry pèse 5 kg de moins que Christian. Combien de kg pèse Harry ?", ["55+16", "71+8", "79-5"], [71, 79, 74], 74], ["A tower is built from 4 blue blocks, twice as many yellow blocks and some red blocks. The tower has 32 blocks in total. How many red blocks are there?", "Ein Turm besteht aus 4 blauen Klötzen, doppelt so vielen gelben Klötzen und einigen roten Klötzen. Insgesamt sind es 32 Klötze. Wie viele rote Klötze sind es?", "Une tour est faite de 4 cubes bleus, de deux fois plus de cubes jaunes et de quelques cubes rouges. Il y a 32 cubes en tout. Combien y a-t-il de cubes rouges ?", ["4*2", "32-4-8"], [8, 20], 20], ["Patricia has 30 roses. She gives 24 roses to her mother. Then she buys 15 more. How many roses does she have now?", "Patricia hat 30 Rosen. Sie schenkt ihrer Mutter 24 Rosen. Dann kauft sie 15 neue. Wie viele Rosen hat sie jetzt?", "Patricia a 30 roses. Elle en offre 24 à sa mère. Puis elle en achète 15 de plus. Combien de roses a-t-elle maintenant ?", ["30-24", "6+15"], [6, 21], 21], ["Harold sleeps 10 hours a night. He works 2 hours less than he sleeps, and he walks his dog for 1 hour every day. How many hours of free time does he have left in a day?", "Harold schläft jede Nacht 10 Stunden. Er arbeitet 2 Stunden weniger, als er schläft, und geht jeden Tag 1 Stunde mit dem Hund spazieren. Wie viele St function figCuboid(a,b,c){/* a wide, b deep, c high, isometric unit cubes */ const u=24,dx=u*0.8,dy=u*0.45;const W=a*u+b*dx+20,H=c*u+b*dy+20;const s=svgBox(W,H);const ox=10,oy=10+b*dy;

 for(let x=0;x<a;x++)for(let z=0;z<c;z++)poly([P(x,0,z),P(x+1,0,z),P(x+1,0,z+1),P(x,0,z+1)],'#C9D4F0');
 for(let y=0;y<b;y++)for(let z=0;z<c;z++)poly([P(a,y,z),P(a,y+1,z),P(a,y+1,z+1),P(a,y,z+1)],'#AFC0E8');

 s.append(stx(X2(o.x1)+14,Y2(0)+5,'x',{'font-size':15,'font-style':'italic'}),stx(X2(0),Y2(o.y1)-8,'y',{'font-size':15,'font-style':'italic'}));

topic('m4-coords',4,2,['Punkte im Gitter','Points on a grid','Points sur un quadrillage'],

topic('m4-time',4,3,['Uhrzeiten und Zeitspannen','Times and durations','Heures et durées'],

topic('m4-money',4,3,['Geld mit Franken und Rappen','Money in francs and centimes','L’argent en francs et centimes'],

topic('m4-tables',4,3,['Tabellen lesen','Reading tables','Lire des tableaux'],

topic('m5-large',5,1,['Grosse Zahlen: Million und Milliarde','Large numbers: million and billion','Grands nombres : million et milliard'],

topic('m5-decimals',5,1,['Dezimalzahlen verstehen','Understanding decimals','Comprendre les nombres décimaux'],

topic('m5-fracequiv',5,1,['Brüche erweitern und kürzen','Equivalent fractions','Fractions équivalentes'],

topic('m5-fraccompare',5,1,['Brüche vergleichen','Comparing fractions','Comparer des fractions'],

/* ---- algebraic expressions in x: parse, compare, check form ---- */
function exprFn(str){let s=String(str).replace(/\s/g,'').replace(/[−–]/g,'-').replace(/[·×*]/g,'*').replace(/:/g,'/').replace(/²/g,'^2').replace(/³/g,'^3').replace(/,/g,'.').toLowerCase();
 if(!s||/[^0-9.x+\-*/^()]/.test(s))return null;const tk=s.match(/\d*\.?\d+|x|[+\-*/^()]/g);if(!tk||tk.join('')!==s)return null;
 const t2=[];tk.forEach((a,i)=>{const p=t2[t2.length-1];if(p!=null&&(/^[\d.]+$|^x$|^\)$/.test(p))&&(/^x$|^\($/.test(a)||(/^[\d.]+$/.test(a)&&/^x$|^\)$/.test(p))))t2.push('*');t2.push(a);});
 let i=0;const peek=()=>t2[i],eat=()=>t2[i++];
 const E=()=>{let f=T();while(peek()==='+'||peek()==='-'){const o=eat(),g=T(),f0=f;f=o==='+'?x=>f0(x)+g(x):x=>f0(x)-g(x);}return f;};
 const T=()=>{let f=U();while(peek()==='*'||peek()==='/'){const o=eat(),g=U(),f0=f;f=o==='*'?x=>f0(x)*g(x):x=>f0(x)/g(x);}return f;};
 const U=()=>{if(peek()==='-'){eat();const g=U();return x=>-g(x);}if(peek()==='+'){eat();return U();}return P();};
 const P=()=>{const b=A();if(peek()==='^'){eat();const e=U();return x=>Math.pow(b(x),e(x));}return b;};
 const A=()=>{const a=eat();if(a==null)throw 0;if(a==='x')return x=>x;if(a==='('){const f=E();if(eat()!==')')throw 0;return f;}if(/^[\d.]+$/.test(a)){const v=+a;return()=>v;}throw 0;};
 try{const f=E();if(i!==t2.length)return null;return f;}catch(e){return null;}}
function sameExpr(a,b){const f=exprFn(a),g=exprFn(b);if(!f||!g)return false;for(const x of[-2.5,-1,0.5,1.7,3,4.2]){const u=f(x),v=g(x);if(!isFinite(u)||!isFinite(v)||Math.abs(u-v)>1e-6*(1+Math.abs(v)))return false;}return true;}
function termCount(s){s=String(s).replace(/\s/g,'').replace(/[−–]/g,'-');if(/[()]/.test(s))return 99;return s.replace(/^[+-]/,'').split(/[+-]/).length;}
function exprItem(prompt,ans,o){return Object.assign({type:'expr',prompt,expr:ans,answer:ans},o||{});}
function lin(a,b,v){v=v||'x';const A=a===0?'':a===1?v:a===-1?'−'+v:fmtN(a)+v;const B=b===0?'':(b<0?' − '+fmtN(-b):(A?' + ':'')+fmtN(b));return(A+B)||'0';}
function quad(a,b,c){const parts=[];if(a)parts.push((a===1?'':a===-1?'−':fmtN(a))+'x²');if(b)parts.push((b===1?'x':b===-1?'−x':fmtN(b)+'x'));if(c)parts.push(fmtN(c));
 return parts.map((p,i)=>i===0?p:(p.startsWith('−')?' − '+p.slice(1):' + '+p)).join('')||'0';}

 e(180,50,330,20,p1[0]);e(180,50,330,80,p1[1]);e(180,170,330,140,p1[0]);e(180,170,330,200,p1[1]);n(355,25,labels[0]+labels[0]);n(355,85,labels[0]+labels[1]);n(355,145,labels[1]+labels[0]);n(355,205,labels[1]+labels[1]);return s;}
function figSector(r,deg){const s=svgBox(240,240);const a=deg*Math.PI/180;s.append(sv('circle',{cx:120,cy:120,r:100,fill:'#fff',stroke:INK,'stroke-width':2,'stroke-dasharray':'5 4'}),
 sv('path',{d:`M120 120 L220 120 A100 100 0 ${deg>180?1:0} 0 ${120+100*Math.cos(a)} ${120-100*Math.sin(a)} Z`,fill:'#C9D4F0',stroke:INK,'stroke-width':3}),stx(170,138,'r = '+fmtN(r)+' cm',{'font-size':13}),stx(142,112,deg+'°',{'font-size':13,fill:RED}));return s;}
const PI_NOTE=()=>X(' (π ≈ 3,14; auf eine Dezimale runden)',' (π ≈ 3.14; round to one decimal place)',' (π ≈ 3,14 ; arrondis au dixième)');
function piTol(v){return Math.max(0.15,Math.abs(v)*0.0012+0.06);}

topic('m7-integers',7,1,['Rechnen mit ganzen Zahlen','Calculating with integers','Calculer avec des entiers relatifs'],
 ['Plus eine negative Zahl ist wie minus: 5 + (−3) = 2. Minus eine negative Zahl ist wie plus: 5 − (−3) = 8. Mal und Geteilt: gleiche Vorzeichen ergeben plus, verschiedene minus.','Adding a negative is like subtracting: 5 + (−3) = 2. Subtracting a negative is like adding: 5 − (−3) = 8. Times and divide: same signs give plus, different signs give minus.','Ajouter un négatif, c’est soustraire : 5 + (−3) = 2. Soustraire un négatif, c’est ajouter : 5 − (−3) = 8. Multiplication et division : signes égaux donnent plus, signes différents moins.'],['negative','integer'],
 lv=>genArith(lv,{sets:['int'],ops:lv===1?['+','-']:['+','-','*','/'],range:[-20,20]}));
topic('m7-rationals',7,1,['Rationale Zahlen','Rational numbers','Nombres rationnels'],
 ['Rationale Zahlen sind alle Brüche, positiv und negativ. Die Vorzeichenregeln gelten genauso wie bei ganzen Zahlen.','Rational numbers are all fractions, positive and negative. The sign rules work exactly as for integers.','Les nombres rationnels sont toutes les fractions, positives et négatives. Les règles des signes sont les mêmes que pour les entiers.'],['rational','negative'],
 lv=>Math.random()<.5?genArith(lv,{sets:['frac'],ops:['+','-','*'],range:[-2,2]}):genArith(lv,{sets:['dec'],ops:['+','-','*'],range:[-10,10]}));
topic('m7-terms',7,1,['Terme vereinfachen','Simplifying expressions','Réduire des expressions'],
 ['Gleichartige Glieder fasst du zusammen: 3x + 5x = 8x, aber 3x + 5 bleibt so. Zahlen mit Zahlen, x mit x.','Collect like terms: 3x + 5x = 8x, but 3x + 5 stays as it is. Numbers with numbers, x with x.','On regroupe les termes semblables : 3x + 5x = 8x, mais 3x + 5 reste tel quel. Les nombres avec les nombres, les x avec les x.'],['term','variable'],
 lv=>{const a=ri(-9,9)||2,b=ri(-9,9)||3,c=ri(-12,12),d=ri(-12,12);const A=a+b,C=c+d;const q=lin(a,c)+(b<0?' − ':' + ')+lin(Math.abs(b),0)+(d<0?' − ':' + ')+fmtN(Math.abs(d));
  const it=exprItem(X('Vereinfache: ','Simplify: ','Réduis : ')+q,lin(A,C),{form:'expanded',maxTerms:(A?1:0)+(C?1:0)||1});
  return steps(it,[X('Sortiere: alle x-Glieder und alle Zahlen.','Sort: all x-terms and all numbers.','Trie : tous les termes en x et tous les nombres.'),X('x-Glieder: ','x-terms: ','Termes en x : ')+a+' '+(b<0?'− '+(-b):'+ '+b)+' = '+A+'; '+X('Zahlen: ','numbers: ','nombres : ')+c+' '+(d<0?'− '+(-d):'+ '+d)+' = '+C+'.',lin(A,C)]);});
topic('m7-evaluate',7,1,['Terme berechnen','Evaluating expressions','Calculer la valeur d’une expression'],
 ['Setze für x die Zahl ein und rechne mit den Rechenregeln. Negative Zahlen in Klammern setzen: für x = −2 ist 3x² = 3 · (−2)² = 12.','Substitute the number for x and follow the order of operations. Put negative numbers in brackets: for x = −2, 3x² = 3 · (−2)² = 12.','Remplace x par le nombre et respecte les priorités. Mets les nombres négatifs entre parenthèses : pour x = −2, 3x² = 3 · (−2)² = 12.'],['term','variable'],
 lv=>{const x=ri(lv===1?1:-5,6),a=ri(2,9),b=ri(-9,9),c=ri(1,5);const useQ=lv>=2&&Math.random()<.5;const expr=useQ?quad(c,a,b):lin(a,b);const v=useQ?c*x*x+a*x+b:a*x+b;
  const it=numItem(X('Berechne ','Evaluate ','Calcule ')+expr+X(' für x = ',' for x = ',' pour x = ')+fmtN(x)+'.',v,{keys:'-'});
  return steps(it,[X('Setze ein: ','Substitute: ','Remplace : ')+expr.replace(/x/g,'·'+par(x)).replace(/^·/,'').replace(/ ·/g,' ').replace(/(\d)·/g,'$1 · ')+'.',useQ?par(x)+'² = '+x*x+'.':X('Rechne Punkt vor Strich.','Multiply before adding.','La multiplication d’abord.'),String(fmtN(v))]);});
topic('m7-equations',7,1,['Lineare Gleichungen','Linear equations','Équations du premier degré'],
 ['Bringe alle x auf eine Seite und alle Zahlen auf die andere. Was du links machst, machst du auch rechts.','Bring all x to one side and all numbers to the other. Whatever you do on the left, do on the right too.','Mets tous les x d’un côté et tous les nombres de l’autre. Ce que tu fais à gauche, fais-le aussi à droite.'],['equation','variable'],
 lv=>{const x=ri(-9,12),a=ri(2,9),c=ri(1,a-1)||1,b=ri(-15,15);const d=a*x+b-c*x;const eq=lv===1?lin(a,b)+' = '+fmtN(a*x+b):lin(a,b)+' = '+lin(c,d);

   :[X('Subtrahiere ','Subtract ','Soustrais ')+c+X('x auf beiden Seiten: ','x on both sides: ','x des deux côtés : ')+lin(a-c,b)+' = '+fmtN(d)+'.',X('Subtrahiere ','Subtract ','Soustrais ')+fmtN(b)+': '+lin(a-c,0)+' = '+fmtN(d-b)+'.','x = '+fmtN(d-b)+' : '+(a-c)+' = '+fmtN(x)]);});
topic('m7-roots',7,1,['Potenzen und Quadratwurzeln','Powers and square roots','Puissances et racines carrées'],
 ['√49 = 7, weil 7² = 49. Die Wurzel ist die Umkehrung des Quadrierens. 2⁵ = 2 · 2 · 2 · 2 · 2 = 32.','√49 = 7 because 7² = 49. The square root reverses squaring. 2⁵ = 2 · 2 · 2 · 2 · 2 = 32.','√49 = 7, car 7² = 49. La racine carrée est l’inverse du carré. 2⁵ = 2 · 2 · 2 · 2 · 2 = 32.'],['root','power'],
 lv=>{if(Math.random()<.5){const n=ri(2,lv===1?12:25);const it=numItem('√'+n*n+' = ?',n);return steps(it,[X('Welche Zahl mal sich selbst ergibt ','Which number times itself gives ','Quel nombre multiplié par lui-même donne ')+n*n+'?',X('Probiere: ','Try: ','Essaie : ')+(n-1)+'² = '+(n-1)**2+'.',n+'² = '+n*n]);}
  const b=ri(2,lv===1?5:10),e=ri(2,lv===1?4:6);const sup=['⁰','¹','²','³','⁴','⁵','⁶'][e];const it=numItem(b+sup+' = ?',b**e);return steps(it,[b+sup+' = '+Array(e).fill(b).join(' · ')+'.',X('Rechne Schritt für Schritt: ','Work step by step: ','Calcule pas à pas : ')+b+' · '+b+' = '+b*b+' …',fmtN(b**e)]);});
topic('m7-percent',7,1,['Prozentrechnen','Percentage calculations','Calculs de pourcentage'],
 ['Grundwert = das Ganze (100 %), Prozentwert = der Teil, Prozentsatz = der Anteil in %. Prozentwert = Grundwert · p/100.','Base = the whole (100%), percentage value = the part, rate = the share in %. Part = base · p/100.','Valeur de base = le tout (100 %), valeur = la partie, taux = la part en %. Partie = base · p/100.'],['percent'],
 lv=>{const G=ri(4,40)*25,p=pick([4,5,8,10,12,15,20,25,30,40,60,75]);const W=G*p/100;const k=ri(0,lv===1?0:2);
  if(k===0){const it=numItem(p+X(' % von ','% of ',' % de ')+fmtN(G)+' = ?',W,{keys:','});return steps(it,['1 % = '+fmtN(G)+' : 100 = '+fmtN(G/100)+'.',p+' · '+fmtN(G/100)+'.',fmtN(W)]);}
  if(k===1){const it=numItem(fmtN(W)+X(' sind wie viel Prozent von ',' is what percentage of ',' représente quel pourcentage de ')+fmtN(G)+'?',p);return steps(it,[X('Anteil = Teil : Ganzes = ','Share = part : whole = ','Part = partie : tout = ')+fmtN(W)+' : '+fmtN(G)+'.',X('Mal 100.','Times 100.','Fois 100.'),p+' %']);}
  const it=numItem(fmtN(W)+X(' sind ',' is ',' représentent ')+p+X(' %. Wie gross ist das Ganze?','%. How big is the whole?',' %. Quelle est la valeur de base ?'),G);return steps(it,[X('Rechne auf 1 %: ','Work out 1%: ','Calcule 1 % : ')+fmtN(W)+' : '+p+' = '+fmtN(W/p)+'.',X('Mal 100 für 100 %.','Times 100 for 100%.','Fois 100 pour 100 %.'),fmtN(G)]);});
topic('m7-word',7,1,['Sachaufgaben','Word problems','Problèmes'],
 ['Schreibe auf, was gegeben und was gesucht ist. Zerlege in Schritte und prüfe am Schluss mit einem Überschlag.','Write down what is given and what is wanted. Break it into steps and check with an estimate at the end.','Note ce qui est donné et ce qui est cherché. Découpe en étapes et vérifie à la fin avec une estimation.'],['sum','product'],

topic('m7-parallelangles',7,2,['Winkel an Parallelen','Angles at parallel lines','Angles et droites parallèles'],
 ['Schneidet eine Gerade zwei Parallelen, sind Stufenwinkel und Wechselwinkel gleich gross. Nebenwinkel ergeben zusammen 180°.','When a line crosses two parallels, corresponding and alternate angles are equal. Adjacent angles add up to 180°.','Quand une droite coupe deux parallèles, les angles correspondants et alternes-internes sont égaux. Les angles adjacents font 180°.'],['angle','parallel'],
 lv=>{const a=ri(35,80);const cases=[[{p:2,dx:28,dy:-8},a,X('Stufenwinkel','corresponding angle','angle correspondant')],[{p:1,dx:-28,dy:-8},180-a,X('Nebenwinkel','adjacent angle','angle adjacent')],[{p:2,dx:-28,dy:24},a,''],[{p:1,dx:-26,dy:24},a,X('Scheitelwinkel','vertically opposite angle','angle opposé par le sommet')]];
  const cs=pick(cases.slice(0,lv===1?2:4));/* label positions: top-right of P2 = corresponding, top-left of P1 = adjacent, bottom-left = vertically opposite */const it=numItem(X('Die schwarzen Geraden sind parallel. Wie gross ist der Winkel «?» in Grad?','The black lines are parallel. How big is the angle “?” in degrees?','Les droites noires sont parallèles. Quelle est la mesure de l’angle « ? » en degrés ?'),cs[1],{fig:()=>figParallel(a,cs[0])});
  return steps(it,[X('Welche Beziehung haben die beiden Winkel? Liegen sie an der gleichen Stelle oder nebeneinander?','How are the two angles related? Same position, or side by side?','Quel lien entre les deux angles ? Même position, ou côte à côte ?'),cs[1]===a?X('Gleiche Lage: gleich gross.','Same position: equal.','Même position : égaux.'):X('Nebeneinander: zusammen 180°.','Side by side: together 180°.','Côte à côte : ensemble 180°.'),cs[1]+'°']);});
topic('m7-trianglearea',7,2,['Fläche von Dreieck, Parallelogramm und Trapez','Area of triangle, parallelogram and trapezium','Aire du triangle, du parallélogramme et du trapèze'],
 ['Parallelogramm: g · h. Dreieck: g · h : 2. Trapez: (a + c) : 2 · h. Die Höhe steht immer senkrecht auf der Grundseite.','Parallelogram: b · h. Triangle: b · h : 2. Trapezium: (a + c) : 2 · h. The height is always perpendicular to the base.','Parallélogramme : b · h. Triangle : b · h : 2. Trapèze : (a + c) : 2 · h. La hauteur est toujours perpendiculaire à la base.'],['area','height'],
 lv=>{const g=ri(3,14),hh=ri(2,10);const k=ri(0,lv===1?1:2);if(k===0){const it=numItem(X(`Ein Dreieck hat die Grundseite ${g} cm und die Höhe ${hh} cm. Fläche in cm²?`,`A triangle has base ${g} cm and height ${hh} cm. Area in cm²?`,`Un triangle a une base de ${g} cm et une hauteur de ${hh} cm. Aire en cm² ?`),g*hh/2,{keys:','});
   return steps(it,[X('Dreieck = halbes Parallelogramm.','Triangle = half a parallelogram.','Triangle = moitié d’un parallélogramme.'),g+' · '+hh+' : 2.',fmtN(g*hh/2)+' cm²']);}
  if(k===1){const it=numItem(X(`Ein Parallelogramm hat die Grundseite ${g} cm und die Höhe ${hh} cm. Fläche in cm²?`,`A parallelogram has base ${g} cm and height ${hh} cm. Area in cm²?`,`Un parallélogramme a une base de ${g} cm et une hauteur de ${hh} cm. Aire en cm² ?`),g*hh,{fig:()=>figQuad('parallelogram')});return steps(it,[X('Schneide ein Dreieck ab und setze es auf der anderen Seite an: ein Rechteck.','Cut off a triangle and move it to the other side: a rectangle.','Coupe un triangle et déplace-le de l’autre côté : un rectangle.'),g+' · '+hh+'.',g*hh+' cm²']);}
  const c=ri(2,g-1);const it=numItem(X(`Ein Trapez hat die parallelen Seiten ${g} cm und ${c} cm und die Höhe ${hh} cm. Fläche in cm²?`,`A trapezium has parallel sides ${g} cm and ${c} cm and height ${hh} cm. Area in cm²?`,`Un trapèze a des côtés parallèles de ${g} cm et ${c} cm et une hauteur de ${hh} cm. Aire en cm² ?`),(g+c)/2*hh,{keys:',',fig:()=>figQuad('trapezoid')});
  return steps(it,[X('Mittlere Breite: ','Average width: ','Largeur moyenne : ')+'('+g+' + '+c+') : 2 = '+fmtN((g+c)/2)+'.',X('Mal die Höhe.','Times the height.','Fois la hauteur.'),fmtN((g+c)/2*hh)+' cm²']);});
topic('m7-circle',7,2,['Kreis: Umfang und Fläche','Circle: circumference and area','Cercle : périmètre et aire'],
 ['Umfang u = 2 · π · r = π · d. Fläche A = π · r². π ist ungefähr 3,14.','Circumference C = 2 · π · r = π · d. Area A = π · r². π is about 3.14.','Périmètre P = 2 · π · r = π · d. Aire A = π · r². π vaut environ 3,14.'],['pi','radius','circumference'],

topic('m7-reflect',7,2,['Spiegeln und Verschieben im Koordinatensystem','Reflecting and translating on a grid','Symétrie et translation dans un repère'],
 ['Spiegeln an der y-Achse: x wechselt das Vorzeichen. An der x-Achse: y wechselt das Vorzeichen. Verschieben: zu x und y etwas dazuzählen.','Reflect in the y-axis: x changes sign. In the x-axis: y changes sign. Translate: add something to x and y.','Symétrie par rapport à l’axe y : x change de signe. Par rapport à l’axe x : y change de signe. Translation : on ajoute quelque chose à x et à y.'],['coordinate','mirror'],
 lv=>{const x=ri(-5,5)||2,y=ri(-4,4)||1;const k=ri(0,lv===1?1:2);let tx,ty,txt;
  if(k===0){tx=-x;ty=y;txt=X('an der y-Achse gespiegelt','reflected in the y-axis','par symétrie d’axe y');}else if(k===1){tx=x;ty=-y;txt=X('an der x-Achse gespiegelt','reflected in the x-axis','par symétrie d’axe x');}
  else{const dx=ri(-3,3),dy=ri(-3,3);tx=Math.max(-5,Math.min(5,x+dx));ty=Math.max(-4,Math.min(4,y+dy));txt=X('um ('+fmtN(tx-x)+' | '+fmtN(ty-y)+') verschoben','translated by ('+fmtN(tx-x)+' | '+fmtN(ty-y)+')','déplacé de ('+fmtN(tx-x)+' | '+fmtN(ty-y)+')');}
  const it={type:'coord',prompt:X('Der Punkt P(','Point P(','Le point P(')+fmtN(x)+' | '+fmtN(y)+X(') wird ',') is ',') est ')+txt+X('. Tippe auf den neuen Punkt.','. Tap the new point.','. Touche le nouveau point.'),tx,ty,grid:{x0:-5,x1:5,y0:-4,y1:4,pts:[{x,y,label:'P'}]},answer:'('+fmtN(tx)+' | '+fmtN(ty)+')'};
  return steps(it,[k===0?X('x wechselt das Vorzeichen, y bleibt.','x changes sign, y stays.','x change de signe, y reste.'):k===1?X('y wechselt das Vorzeichen, x bleibt.','y changes sign, x stays.','y change de signe, x reste.'):X('Zähle die Verschiebung zu x und y dazu.','Add the shift to x and y.','Ajoute le déplacement à x et à y.'),'x = '+fmtN(tx)+', y = '+fmtN(ty)+'.','('+fmtN(tx)+' | '+fmtN(ty)+')']);});
topic('m7-proptable',7,3,['Proportionale Zuordnungen','Proportional relationships','Relations proportionnelles'],
 ['Bei einer proportionalen Zuordnung ist der Quotient y : x immer gleich. Der Graph ist eine Gerade durch den Nullpunkt.','In a proportional relationship the quotient y : x is always the same. The graph is a straight line through the origin.','Dans une relation proportionnelle, le quotient y : x est toujours le même. Le graphique est une droite passant par l’origine.'],['proportional'],
 lv=>{const m=ri(2,lv===1?9:25)/(lv===3?2:1);const xs=shuffle([1,2,3,4,5,6,8,10]).slice(0,4).sort((a,b)=>a-b);const hole=ri(1,3);

topic('m7-graph',7,3,['Graphen lesen','Reading graphs','Lire des graphiques'],
 ['Suche den x-Wert auf der waagrechten Achse, gehe senkrecht zum Graphen und dann waagrecht zur y-Achse.','Find the x-value on the horizontal axis, go straight up to the graph, then across to the y-axis.','Trouve la valeur de x sur l’axe horizontal, monte jusqu’au graphique, puis va horizontalement vers l’axe y.'],['coordinate','function'],

topic('m7-stats',7,3,['Mittelwert, Median, Modus, Spannweite','Mean, median, mode, range','Moyenne, médiane, mode, étendue'],
 ['Median: der mittlere Wert der geordneten Liste. Modus: der häufigste Wert. Spannweite: grösster minus kleinster Wert.','Median: the middle value of the sorted list. Mode: the most frequent value. Range: largest minus smallest value.','Médiane : la valeur du milieu de la liste triée. Mode : la valeur la plus fréquente. Étendue : la plus grande moins la plus petite valeur.'],['median','mode','range','mean'],
 lv=>{const n=pick([5,7,9]);let v=Array.from({length:n},()=>ri(1,20));v[1]=v[0];const srt=v.slice().sort((a,b)=>a-b);const k=ri(0,lv===1?1:3);

topic('m8-tree',8,3,['Mehrstufige Zufallsexperimente','Multi-step probability','Expériences aléatoires à plusieurs étapes'],
 ['Im Baumdiagramm nimmst du die Wahrscheinlichkeiten entlang eines Pfades mal (Pfadregel) und addierst die Pfade, die zum Ereignis gehören (Summenregel).','In a tree diagram multiply the probabilities along a path (path rule) and add the paths that belong to the event (sum rule).','Dans un arbre, on multiplie les probabilités le long d’un chemin et on additionne les chemins de l’événement.'],['probability','treediagram'],
 lv=>{const n=pick([2,4,5,10]),k=ri(1,n-1);const p=[fracTxt(...red2(k,n)),fracTxt(...red2(n-k,n))];const both=Math.random()<.5;const lab=[X('R','R','R'),X('B','B','B')];
  const v=both?(k/n)**2:2*(k/n)*((n-k)/n);const num=both?k*k:2*k*(n-k),den=n*n;
  const it=numItem(X(`Aus einer Urne mit ${k} roten (R) und ${n-k} blauen (B) Kugeln wird zweimal mit Zurücklegen gezogen. Wahrscheinlichkeit für `,`From an urn with ${k} red (R) and ${n-k} blue (B) balls you draw twice with replacement. Probability of `,`On tire deux fois avec remise dans une urne contenant ${k} boules rouges (R) et ${n-k} bleues (B). Probabilité d’obtenir `)+(both?X('zweimal Rot','red twice','deux fois rouge'):X('genau einmal Rot','exactly one red','exactement une rouge'))+X('? (als Bruch)','? (as a fraction)',' ? (en fraction)'),{re:v,im:0},{keys:'/',answer:fracTxt(...red2(num,den)),fig:()=>figTree(p,lab)});
  return steps(it,[both?X('Pfad RR: ','Path RR: ','Chemin RR : ')+p[0]+' · '+p[0]+'.':X('Pfade RB und BR: ','Paths RB and BR: ','Chemins RB et BR : ')+p[0]+' · '+p[1]+X(' und ',' and ',' et ')+p[1]+' · '+p[0]+'.',both?X('Pfadregel: malnehmen.','Path rule: multiply.','Règle du chemin : multiplier.'):X('Summenregel: beide Pfade addieren.','Sum rule: add both paths.','Règle de la somme : additionner les deux chemins.'),fracTxt(...red2(num,den))]);});
topic('m8-word',8,3,['Sachaufgaben mit Gleichungen','Word problems with equations','Problèmes avec équations'],
 ['Gib der gesuchten Grösse einen Namen (x), schreibe die Angaben als Gleichung und löse sie.','Give the unknown a name (x), write the information as an equation and solve it.','Donne un nom à l’inconnue (x), écris les données sous forme d’équation et résous-la.'],['equation','variable'],
 lv=>{const n=pick(NAMES);const k=ri(0,2);let q,v,eq,sol;
  if(k===0){const x=ri(5,30),d=ri(3,15);q=X(`${n} ist ${d} Jahre älter als die Schwester. Zusammen sind sie ${2*x+d} Jahre alt. Wie alt ist die Schwester?`,`${n} is ${d} years older than their sister. Together they are ${2*x+d} years old. How old is the sister?`,`${n} a ${d} ans de plus que sa sœur. Ensemble, ils ont ${2*x+d} ans. Quel âge a la sœur ?`);v=x;eq='x + (x + '+d+') = '+(2*x+d);sol='2x = '+2*x;}
  else if(k===1){const p=ri(2,9),a=ri(3,12),b=ri(2,20);q=X(`Ein Heft kostet ${p} Franken mehr als ein Stift. ${n} kauft ${a} Stifte und ein Heft und bezahlt ${a*b+b+p} Franken. Was kostet ein Stift?`,`A notebook costs ${p} francs more than a pen. ${n} buys ${a} pens and one notebook and pays ${a*b+b+p} francs. How much is a pen?`,`Un cahier coûte ${p} francs de plus qu’un stylo. ${n} achète ${a} stylos et un cahier et paie ${a*b+b+p} francs. Combien coûte un stylo ?`);v=b;eq=a+'x + (x + '+p+') = '+(a*b+b+p);sol=(a+1)+'x = '+(a+1)*b;}
  else{const x=ri(3,20);const m=ri(2,5);q=X(`Denke dir eine Zahl. Nimm sie mal ${m} und addiere 7. Du erhältst ${m*x+7}. Welche Zahl war es?`,`Think of a number. Multiply it by ${m} and add 7. You get ${m*x+7}. What was the number?`,`Pense à un nombre. Multiplie-le par ${m} et ajoute 7. Tu obtiens ${m*x+7}. Quel était le nombre ?`);v=x;eq=m+'x + 7 = '+(m*x+7);sol=m+'x = '+m*x;}
  return steps(numItem(q,v),[X('Nenne die gesuchte Zahl x und schreibe eine Gleichung.','Call the unknown x and write an equation.','Appelle l’inconnue x et écris une équation.'),eq+'.',sol+' → x = '+v]);});

topic('m9-systems',9,1,['Gleichungssysteme','Simultaneous equations','Systèmes d’équations'],
 ['Zwei Gleichungen, zwei Unbekannte: Addiere oder subtrahiere die Gleichungen so, dass eine Variable wegfällt (Additionsverfahren), oder setze eine Gleichung in die andere ein.','Two equations, two unknowns: add or subtract the equations so that one variable disappears, or substitute one equation into the other.','Deux équations, deux inconnues : additionne ou soustrais les équations pour éliminer une variable, ou substitue une équation dans l’autre.'],['equation','system'],
 lv=>{const x=ri(-5,8),y=ri(-5,8);const a=ri(1,4),b=ri(1,4),c=ri(1,4),d=-ri(1,4);if(a*d-b*c===0)return genItem(mtopic('m9-systems'),lv);
  const L=(p,q)=>lin(p,0)+(q<0?' − ':' + ')+(Math.abs(q)===1?'y':Math.abs(q)+'y');
  const it=numItem('I: '+L(a,b)+' = '+fmtN(a*x+b*y)+'   II: '+L(c,d)+' = '+fmtN(c*x+d*y),0,{fields:[{label:'x',ans:x},{label:'y',ans:y}],keys:'-',answer:'x = '+x+', y = '+y});
  return steps(it,[X('Mache die Faktoren vor y gleich gross (mit entgegengesetztem Vorzeichen) und addiere dann die Gleichungen.','Make the y-coefficients equal and opposite, then add the equations.','Rends les coefficients de y opposés, puis additionne les équations.'),X('I · ','I · ','I · ')+Math.abs(d)+X(' und II · ',' and II · ',' et II · ')+b+': '+X('y fällt weg.','y cancels.','y disparaît.')+' '+(a*Math.abs(d)+c*b)+'x = '+(a*x+b*y)*Math.abs(d)+' + '+par((c*x+d*y)*b)+'.','x = '+x+', y = '+y]);});
topic('m9-quadratic',9,1,['Quadratische Gleichungen','Quadratic equations','Équations du second degré'],
 ['x² = 49 hat zwei Lösungen: x = 7 und x = −7. Ist ein Produkt null, ist ein Faktor null: (x − 2)(x + 5) = 0 → x = 2 oder x = −5.','x² = 49 has two solutions: x = 7 and x = −7. If a product is zero, one factor is zero: (x − 2)(x + 5) = 0 → x = 2 or x = −5.','x² = 49 a deux solutions : x = 7 et x = −7. Si un produit est nul, un facteur est nul : (x − 2)(x + 5) = 0 → x = 2 ou x = −5.'],['quadratic','root'],
 lv=>{const k=lv===1?0:ri(0,2);let p,q,x1,x2,st;
  if(k===0){const r=ri(1,12);p='x² = '+r*r;x1=r;x2=-r;st=[X('Welche Zahlen ergeben quadriert ','Which numbers squared give ','Quels nombres au carré donnent ')+r*r+'?',X('Denke an die negative Lösung.','Remember the negative solution.','Pense à la solution négative.')];}
  else if(k===1){x1=ri(-8,8);x2=ri(-8,8);p='('+lin(1,-x1)+')('+lin(1,-x2)+') = 0';st=[X('Ein Produkt ist null, wenn ein Faktor null ist.','A product is zero when one factor is zero.','Un produit est nul si un facteur est nul.'),lin(1,-x1)+' = 0 '+X('oder','or','ou')+' '+lin(1,-x2)+' = 0.'];}
  else{x1=ri(-7,7);x2=ri(-7,7);p=quad(1,-(x1+x2),x1*x2)+' = 0';st=[X('Suche zwei Zahlen mit Produkt ','Find two numbers with product ','Cherche deux nombres de produit ')+x1*x2+X(' und Summe ',' and sum ',' et de somme ')+(-(x1+x2))+'.',X('Schreibe als Produkt von zwei Klammern.','Write it as a product of two brackets.','Écris-le comme produit de deux parenthèses.')];}
  const it=numItem(p+X('. Gib beide Lösungen an.','. Give both solutions.','. Donne les deux solutions.'),0,{fields:[{label:'x₁',ans:x1},{label:'x₂',ans:x2}],unordered:true,keys:'-',answer:'x = '+x1+(x1!==x2?X(' oder ',' or ',' ou ')+x2:'')});
  return steps(it,st.concat(['x₁ = '+x1+', x₂ = '+x2]));});
topic('m9-powerlaws',9,1,['Potenzgesetze','Laws of indices','Règles des puissances'],
 ['aᵐ · aⁿ = aᵐ⁺ⁿ, aᵐ : aⁿ = aᵐ⁻ⁿ, (aᵐ)ⁿ = aᵐ·ⁿ, a⁻ⁿ = 1/aⁿ, a⁰ = 1.','aᵐ · aⁿ = aᵐ⁺ⁿ, aᵐ : aⁿ = aᵐ⁻ⁿ, (aᵐ)ⁿ = aᵐ·ⁿ, a⁻ⁿ = 1/aⁿ, a⁰ = 1.','aᵐ · aⁿ = aᵐ⁺ⁿ, aᵐ : aⁿ = aᵐ⁻ⁿ, (aᵐ)ⁿ = aᵐ·ⁿ, a⁻ⁿ = 1/aⁿ, a⁰ = 1.'],['power','exponent'],
 lv=>{const b=pick([2,3,5,10]),m=ri(2,6),n=ri(1,5);const k=ri(0,lv===1?1:3);let q,e,rule;

  else if(k===1){q=b+'^'+(m+n)+' : '+b+'^'+n;e=m;rule=X('Gleiche Basis, geteilt: Hochzahlen subtrahieren.','Same base, divide: subtract the exponents.','Même base, division : on soustrait les exposants.');}

  else{q=b+'^'+n+' : '+b+'^'+(n+m);e=-m;rule=X('Die Hochzahl kann negativ werden: a⁻ⁿ = 1/aⁿ.','The exponent can become negative: a⁻ⁿ = 1/aⁿ.','L’exposant peut devenir négatif : a⁻ⁿ = 1/aⁿ.');}
  const it=numItem(q+' = '+b+'^n. n = ?',e,{keys:'-'});return steps(it,[rule,k===0?m+' + '+n:k===1?(m+n)+' − '+n:k===2?m+' · '+n:n+' − '+(n+m),'n = '+e]);});
topic('m9-roots',9,1,['Wurzeln vereinfachen','Simplifying roots','Simplifier des racines'],

topic('m9-formula',9,1,['Formeln umstellen','Rearranging formulas','Transformer des formules'],

 lv=>{const F=[()=>{const r=ri(2,9),h=ri(2,12);return[X(`Die Fläche eines Rechtecks ist A = a · b. A = ${r*h} cm², a = ${r} cm. b = ?`,`The area of a rectangle is A = a · b. A = ${r*h} cm², a = ${r} cm. b = ?`,`L’aire d’un rectangle est A = a · b. A = ${r*h} cm², a = ${r} cm. b = ?`),h,'b = A : a']},

  ()=>{const c=ri(-10,35);return[X(`Temperatur: F = 1,8 · C + 32. F = ${fmtN(1.8*c+32)}. C = ?`,`Temperature: F = 1.8 · C + 32. F = ${fmtN(1.8*c+32)}. C = ?`,`Température : F = 1,8 · C + 32. F = ${fmtN(1.8*c+32)}. C = ?`),c,'C = (F − 32) : 1,8']},
  ()=>{const b=ri(2,12),h=ri(2,12);return[X(`Dreieck: A = g · h : 2. A = ${b*h/2} cm², g = ${b} cm. h = ?`,`Triangle: A = b · h : 2. A = ${b*h/2} cm², b = ${b} cm. h = ?`,`Triangle : A = b · h : 2. A = ${b*h/2} cm², b = ${b} cm. h = ?`),h,'h = 2 · A : g']}];
  const[q,v,f]=pick(F.slice(0,lv===1?2:4))();const it=numItem(q,v,{keys:'-,'});return steps(it,[X('Stelle die Formel nach der gesuchten Grösse um: ','Rearrange for the quantity you want: ','Isole la grandeur cherchée : ')+f+'.',X('Setze die Zahlen ein.','Substitute the numbers.','Remplace par les nombres.'),fmtN(v)]);});
topic('m9-pythagoras3d',9,2,['Pythagoras im Raum','Pythagoras in 3D','Pythagore dans l’espace'],

topic('m9-conesphere',9,2,['Kegel, Pyramide und Kugel','Cone, pyramid and sphere','Cône, pyramide et boule'],

 lv=>{const k=ri(0,lv===1?0:2);if(k===0){const a=ri(2,9)*(lv===1?1:1),h=ri(2,9)*3;const V=a*a*h/3;const it=numItem(X(`Eine Pyramide hat eine quadratische Grundfläche mit a = ${a} cm und die Höhe ${h} cm. Volumen in cm³?`,`A pyramid has a square base with a = ${a} cm and height ${h} cm. Volume in cm³?`,`Une pyramide a une base carrée de côté ${a} cm et une hauteur de ${h} cm. Volume en cm³ ?`),V,{fig:()=>figSolid('pyramid')});

   return steps(it,[X('Grundfläche: π · ','Base area: π · ','Aire de la base : π · ')+r+'² ≈ '+fmtN(nr1(Math.PI*r*r))+'.',X('Mal Höhe, durch 3.','Times height, divided by 3.','Fois la hauteur, divisé par 3.'),fmtN(nr1(V))+' cm³']);}

topic('m9-sector',9,2,['Kreisbogen und Kreissektor','Arcs and sectors','Arcs et secteurs'],

function normTr(it){const tr=it.tr;if(!tr||typeof tr!=='object'){delete it.tr;return;}const o={};
 for(const l of LANGS){const x=tr[l];if(!x||typeof x!=='object'||typeof x.prompt!=='string'||!x.prompt.trim())continue;const y={prompt:x.prompt.trim()};
  if(typeof x.explanation==='string'&&x.explanation.trim())y.explanation=x.explanation.trim();
  if(Array.isArray(it.options)){if(!(Array.isArray(x.options)&&x.options.length===it.options.length&&x.options.every(v=>typeof v==='string'&&v.trim())))continue;y.options=x.options;}
  if(Array.isArray(it.order)){if(!(Array.isArray(x.order)&&x.order.length===it.order.length&&x.order.every(v=>typeof v==='string'&&v.trim())))continue;y.order=x.order;}
  if(typeof x.answer==='string'&&x.answer.trim())y.answer=x.answer.trim();if(Array.isArray(x.hints))y.hints=x.hints.filter(v=>typeof v==='string'&&v.trim());if(Array.isArray(x.accept))y.accept=x.accept.filter(v=>typeof v==='string'&&v.trim());
  o[l]=y;}
 if(Object.keys(o).length)it.tr=o;else delete it.tr;}
function validItem(it){
 if(!it||typeof it.prompt!=='string'||!it.prompt.trim())return false;
 normTr(it);if(it.hints!=null){if(Array.isArray(it.hints))it.hints=it.hints.filter(v=>typeof v==='string'&&v.trim()).slice(0,5);else delete it.hints;}
 it.difficulty=[1,2,3].includes(+it.difficulty)?+it.difficulty:2;
 if(Array.isArray(it.correct))it.correct=it.correct.map(Number);
 const opt=Array.isArray(it.options)&&it.options.length>=2&&it.options.every(o=>typeof o==='string');
 switch(it.type){
  case'single':return opt&&Array.isArray(it.correct)&&it.correct.length===1&&Number.isInteger(it.correct[0])&&it.correct[0]>=0&&it.correct[0]<it.options.length;
  case'multi':return opt&&Array.isArray(it.correct)&&it.correct.length>=1&&it.correct.every(i=>Number.isInteger(i)&&i>=0&&i<it.options.length);
  case'order':return Array.isArray(it.order)&&it.order.length>=2&&it.order.every(o=>typeof o==='string');
  case'input':if(it.accept&&!Array.isArray(it.accept))delete it.accept;return typeof it.answer==='string'&&it.answer.trim().length>0;
  case'map':{const m=it.map;if(!m||typeof m.pack!=='string'||typeof m.target!=='string'||!['tap','choose','name','label','number'].includes(m.task))return false;
   const P=PACKS[m.pack];if(!P)return false;const f=P.byId[m.target];if(!f||f.bg||f.kind==='bg')return false;
   if(m.task==='choose'){let o=(Array.isArray(m.options)?m.options:[]).filter(id=>P.byId[id]&&P.byId[id].layer===f.layer&&!P.byId[id].bg);
    if(!o.includes(f.id))o.unshift(f.id);o=o.filter((v,i,a)=>a.indexOf(v)===i);
    if(o.length<3){const pool=P.layers.find(l=>l.id===f.layer).f.filter(x=>!x.bg&&!o.includes(x.id));while(o.length<4&&pool.length)o.push(pool.splice(Math.floor(Math.random()*pool.length),1)[0].id);}
    m.options=o.slice(0,6);}
   if(m.task==='name'&&!(typeof it.answer==='string'&&it.answer.trim()))it.answer=f.n.de;
   if(m.task==='label'||m.task==='number'){let o=(Array.isArray(m.labels)?m.labels:[]).filter(id=>P.byId[id]&&P.byId[id].layer===f.layer&&!P.byId[id].bg);
    if(!o.includes(f.id))o.unshift(f.id);o=o.filter((v,i,a)=>a.indexOf(v)===i);
    if(o.length<3){const pool=P.layers.find(l=>l.id===f.layer).f.filter(x=>!x.bg&&!o.includes(x.id));while(o.length<4&&pool.length)o.push(pool.splice(Math.floor(Math.random()*pool.length),1)[0].id);}
    m.labels=o.slice(0,12);if(!m.labels.includes(f.id))m.labels[0]=f.id;
    if(m.task==='label'&&!/\{nr\}/.test(it.prompt))it.prompt=t('mapLabelQ');
    if(m.task==='number')it.prompt=it.prompt.replace(/\{nr\}/g,'');
    if(it.tr)for(const l in it.tr){const x=it.tr[l];if(m.task==='label'&&!/\{nr\}/.test(x.prompt))x.prompt=(T[l]||T.en).mapLabelQ;if(m.task==='number')x.prompt=x.prompt.replace(/\{nr\}/g,'');}}
   delete it.figure;delete it._fig;return true;}
  case'spot':return!!((it._fig&&it._fig.spot)||(it.image&&it.image.path&&it.spot&&isFinite(it.spot.x)&&isFinite(it.spot.y)));
  default:return false;}
}
