bankTopic('it7-ports',7,1,['Anschlüsse und Verbindungen','Ports and connections','Ports et connexions'],
 ['USB-C ist klein, oval und passt in beide Richtungen. USB-A ist rechteckig. HDMI überträgt Bild und Ton zu Bildschirm oder Beamer. Ethernet ist das Netzwerkkabel. Kabellos gibt es WLAN und Bluetooth.','USB-C is small, oval and fits either way round. USB-A is rectangular. HDMI carries picture and sound to a screen or projector. Ethernet is the network cable. Wireless options are Wi-Fi and Bluetooth.','L’USB-C est petit, ovale et se branche dans les deux sens. L’USB-A est rectangulaire. Le HDMI transmet image et son vers un écran ou un projecteur. L’Ethernet est le câble réseau. Sans fil : Wi-Fi et Bluetooth.'],['it_usb','it_hdmi','it_bluetooth'],[
 N('f','Tippe auf den USB-C-Anschluss.|Tap the USB-C port.|Touche le port USB-C.','ports','Klein, oval, abgerundet.|Small, oval, rounded.|Petit, ovale, arrondi.','USB-C ist der ovale Anschluss.|USB-C is the oval port.|L’USB-C est le port ovale.','usbc'),
 N('f','Tippe auf den HDMI-Anschluss.|Tap the HDMI port.|Touche le port HDMI.','ports','Er ist unten schräg abgeschnitten.|Its bottom corners are cut off.|Ses coins inférieurs sont biseautés.','HDMI hat eine Trapezform.|HDMI has a trapezoid shape.|Le HDMI a une forme de trapèze.','hdmi'),
 N('f','Tippe auf den Netzwerkanschluss (Ethernet).|Tap the network port (Ethernet).|Touche le port réseau (Ethernet).','ports','Er hat unten eine Nase für den Klipp.|It has a notch at the bottom for the clip.|Il a une encoche en bas pour le clip.','Ethernet (RJ45) ist fast quadratisch mit Klipp.|Ethernet (RJ45) is almost square with a clip.|L’Ethernet (RJ45) est presque carré, avec un clip.','ethernet'),
 N('s','Welche Verbindung nutzt du für kabellose Kopfhörer?|Which connection do you use for wireless headphones?|Quelle connexion utilises-tu pour des écouteurs sans fil ?',['Bluetooth|Bluetooth|Bluetooth','HDMI|HDMI|HDMI','Ethernet|Ethernet|Ethernet'],'Kurze Distanz, ohne Kabel.|Short range, no cable.|Courte distance, sans câble.','Bluetooth verbindet Geräte in der Nähe ohne Kabel.|Bluetooth connects nearby devices without cables.|Le Bluetooth relie des appareils proches sans câble.'),
 N('s','Du willst deinen Laptop an einen Beamer anschliessen, mit Bild und Ton. Welches Kabel passt meistens?|You want to connect your laptop to a projector, with picture and sound. Which cable usually fits?|Tu veux brancher ton portable à un projecteur, avec image et son. Quel câble convient généralement ?',['HDMI|HDMI|HDMI','Ethernet|Ethernet|Ethernet','Ladekabel|charging cable|câble de charge'],'Es überträgt Video und Audio.|It carries video and audio.|Il transmet vidéo et audio.','HDMI überträgt Bild und Ton.|HDMI carries picture and sound.|Le HDMI transmet image et son.')]);
bankTopic('it7-apple',7,3,['iPhone und iPad: Bildschirmzeit, Wo ist?, Backup','iPhone and iPad: Screen Time, Find My, backup','iPhone et iPad : Temps d’écran, Localiser, sauvegarde'],
 ['Bildschirmzeit zeigt, wie lange du Apps nutzt, und kann Grenzen setzen. «Wo ist?» hilft, ein verlorenes Gerät zu finden. Ein iCloud-Backup sichert die Daten des Geräts.','Screen Time shows how long you use apps and can set limits. Find My helps you locate a lost device. An iCloud backup saves the device’s data.','Temps d’écran montre combien de temps tu utilises les apps et peut fixer des limites. Localiser aide à retrouver un appareil perdu. Une sauvegarde iCloud protège les données de l’appareil.'],['it_screentime','it_findmy'],[
 N('s','Dein iPad ist verloren. Welche App hilft beim Suchen?|Your iPad is lost. Which app helps you search for it?|Ton iPad est perdu. Quelle app aide à le chercher ?',['Wo ist?|Find My|Localiser','Fotos|Photos|Photos','Notizen|Notes|Notes'],'Der Name sagt es.|The name says it.|Le nom le dit.','«Wo ist?» zeigt das Gerät auf einer Karte und kann einen Ton abspielen.|Find My shows the device on a map and can play a sound.|Localiser montre l’appareil sur une carte et peut faire sonner.'),
 N('s','Wo siehst du, wie viel Zeit du mit Apps verbringst?|Where can you see how much time you spend in apps?|Où vois-tu combien de temps tu passes dans les apps ?',['in der Bildschirmzeit|in Screen Time|dans Temps d’écran','im Kontrollzentrum|in Control Center|dans le centre de contrôle','in der Kamera|in the camera|dans l’appareil photo'],'Es ist in den Einstellungen.|It is in Settings.|C’est dans les Réglages.','Einstellungen → Bildschirmzeit zeigt die Nutzung und erlaubt Grenzen.|Settings → Screen Time shows usage and allows limits.|Réglages → Temps d’écran montre l’usage et permet des limites.'),
 N('s','Wie wechselst du auf dem iPhone ohne Home-Taste zwischen offenen Apps?|How do you switch between open apps on an iPhone without a Home button?|Comment passes-tu d’une app ouverte à l’autre sur un iPhone sans bouton principal ?',['vom unteren Rand nach oben wischen und kurz halten|swipe up from the bottom edge and pause|glisser vers le haut depuis le bas et marquer une pause','zweimal auf die Kamera tippen|tap the camera twice|toucher deux fois l’appareil photo','Lautstärke lauter drücken|press volume up|appuyer sur volume +'],'Wie «Home», aber mit einer Pause.|Like going Home, but with a pause.|Comme pour l’accueil, mais avec une pause.','Nach oben wischen und kurz halten öffnet den App-Umschalter.|Swiping up and pausing opens the App Switcher.|Glisser vers le haut et marquer une pause ouvre le sélecteur d’apps.')]);
bankTopic('it7-security',7,1,['Sicher unterwegs','Staying safe','Rester en sécurité'],
 ['Starke, verschiedene Passwörter, Zwei-Faktor-Anmeldung, Updates und Vorsicht bei unerwarteten Nachrichten mit Links (Phishing) schützen deine Konten.','Strong, different passwords, two-factor sign-in, updates and caution with unexpected messages containing links (phishing) protect your accounts.','Des mots de passe forts et différents, la double authentification, les mises à jour et la prudence face aux messages inattendus contenant des liens (hameçonnage) protègent tes comptes.'],['it_2fa','it_phishing'],[
 N('s','Du bekommst eine Nachricht: «Dein Konto wird gesperrt! Klicke sofort hier und gib dein Passwort ein.» Was tust du?|You get a message: “Your account will be blocked! Click here now and enter your password.” What do you do?|Tu reçois un message : « Ton compte va être bloqué ! Clique ici tout de suite et entre ton mot de passe. » Que fais-tu ?',['nicht klicken und einer erwachsenen Person zeigen|not click and show an adult|ne pas cliquer et montrer à un adulte','sofort das Passwort eingeben|enter the password straight away|entrer tout de suite le mot de passe','die Nachricht an alle weiterleiten|forward it to everyone|le transférer à tout le monde'],'Druck und Eile sind Warnzeichen.|Pressure and urgency are warning signs.|La pression et l’urgence sont des signaux d’alerte.','Das ist typisches Phishing: Nie über solche Links Passwörter eingeben.|This is typical phishing: never enter passwords via such links.|C’est du hameçonnage typique : ne jamais entrer de mot de passe via ces liens.'),
 N('s','Was ist Zwei-Faktor-Authentifizierung?|What is two-factor authentication?|Qu’est-ce que la double authentification ?',['Neben dem Passwort braucht es einen zweiten Nachweis, z. B. einen Code auf dem Handy.|Besides the password a second proof is needed, e.g. a code on your phone.|En plus du mot de passe, il faut une deuxième preuve, par ex. un code sur le téléphone.','zwei Passwörter, die gleich sind|two passwords that are the same|deux mots de passe identiques','zwei Bildschirme|two screens|deux écrans'],'Etwas, das du weisst, und etwas, das du hast.|Something you know and something you have.|Quelque chose que tu sais et quelque chose que tu possèdes.','Selbst mit gestohlenem Passwort kommt niemand ohne den zweiten Faktor ins Konto.|Even with a stolen password, nobody gets in without the second factor.|Même avec un mot de passe volé, personne n’entre sans le deuxième facteur.'),
 N('m','Was macht deine Konten sicherer?|What makes your accounts safer?|Qu’est-ce qui rend tes comptes plus sûrs ?',['*für jedes Konto ein anderes Passwort|a different password for each account|un mot de passe différent pour chaque compte','*Updates installieren|installing updates|installer les mises à jour','*Zwei-Faktor-Anmeldung|two-factor sign-in|la double authentification','überall dasselbe kurze Passwort|the same short password everywhere|le même mot de passe court partout'],'Wenn ein Passwort gestohlen wird, was dann?|What happens if one password is stolen?|Que se passe-t-il si un mot de passe est volé ?','Unterschiedliche Passwörter, Updates und Zwei-Faktor-Anmeldung schützen; ein einziges Passwort für alles ist riskant.|Different passwords, updates and two-factor sign-in protect you; one password for everything is risky.|Des mots de passe différents, les mises à jour et la double authentification protègent ; un seul mot de passe pour tout est risqué.')]);

bankTopic('it8-performance',8,1,['Leistung eines Computers','Computer performance','Performances d’un ordinateur'],
 ['Mehr Prozessorkerne erlauben, mehrere Aufgaben gleichzeitig zu rechnen. Mehr Arbeitsspeicher (RAM) hilft bei vielen offenen Programmen. Eine SSD ist viel schneller als eine alte Festplatte (HDD).','More processor cores allow several tasks to be computed at once. More RAM helps with many open programs. An SSD is much faster than an old hard disk (HDD).','Plus de cœurs de processeur permettent de calculer plusieurs tâches à la fois. Plus de RAM aide avec beaucoup de programmes ouverts. Un SSD est bien plus rapide qu’un ancien disque dur (HDD).'],['it_cpu','it_ram','it_ssd'],[
 N('s','Viele Programme sind offen und der Computer wird langsam. Was hilft am meisten?|Many programs are open and the computer slows down. What helps most?|Beaucoup de programmes sont ouverts et l’ordinateur ralentit. Qu’est-ce qui aide le plus ?',['mehr Arbeitsspeicher (RAM) oder Programme schliessen|more RAM or closing programs|plus de RAM ou fermer des programmes','ein grösserer Bildschirm|a bigger screen|un plus grand écran','eine neue Maus|a new mouse|une nouvelle souris'],'Offene Programme brauchen RAM.|Open programs need RAM.|Les programmes ouverts utilisent de la RAM.','Wird der RAM knapp, muss das System auslagern und wird langsam.|When RAM runs short, the system has to swap and slows down.|Quand la RAM manque, le système doit échanger des données et ralentit.'),
 N('s','Was ist schneller beim Starten und Laden?|What is faster at starting up and loading?|Qu’est-ce qui est plus rapide au démarrage et au chargement ?',['SSD|SSD|SSD','HDD (Festplatte mit Scheiben)|HDD (disk with platters)|HDD (disque à plateaux)','beide gleich|both the same|les deux pareil'],'Die eine hat keine beweglichen Teile.|One has no moving parts.|L’un n’a pas de pièces mobiles.','Die SSD speichert elektronisch ohne bewegliche Teile und ist deshalb viel schneller.|An SSD stores electronically with no moving parts, so it is much faster.|Le SSD stocke électroniquement, sans pièces mobiles, donc bien plus vite.'),
 N('s','Was sagt die Angabe «3,2 GHz» bei einem Prozessor?|What does “3.2 GHz” tell you about a processor?|Que dit l’indication « 3,2 GHz » d’un processeur ?',['wie viele Takte pro Sekunde er macht|how many clock cycles per second it runs|combien de cycles par seconde il effectue','wie viel er wiegt|how much it weighs|combien il pèse','wie viel Speicherplatz er hat|how much storage it has|combien de stockage il a'],'Giga = Milliarden, Hertz = pro Sekunde.|Giga = billion, hertz = per second.|Giga = milliard, hertz = par seconde.','GHz ist die Taktfrequenz: 3,2 Milliarden Takte pro Sekunde. Sie allein bestimmt die Leistung aber nicht.|GHz is the clock speed: 3.2 billion cycles per second. It alone does not decide performance.|Les GHz sont la fréquence : 3,2 milliards de cycles par seconde. Elle ne détermine pas seule la performance.')]);
bankTopic('it8-network',8,1,['Netzwerke','Networks','Réseaux'],
 ['Jedes Gerät im Netz hat eine IP-Adresse. Der Router verbindet das Heimnetz mit dem Internet. DNS übersetzt Namen wie «beispiel.ch» in IP-Adressen. Die Geschwindigkeit misst man in Mbit/s.','Every device on a network has an IP address. The router connects the home network to the internet. DNS translates names like “example.ch” into IP addresses. Speed is measured in Mbit/s.','Chaque appareil du réseau a une adresse IP. Le routeur relie le réseau domestique à Internet. Le DNS traduit des noms comme « exemple.ch » en adresses IP. La vitesse se mesure en Mbit/s.'],['it_ip','it_dns','it_router'],[
 N('s','Was macht DNS?|What does DNS do?|Que fait le DNS ?',['Es übersetzt Webadressen in IP-Adressen.|It translates web addresses into IP addresses.|Il traduit les adresses web en adresses IP.','Es lädt den Akku.|It charges the battery.|Il recharge la batterie.','Es druckt Webseiten.|It prints web pages.|Il imprime les pages web.'],'Wie ein Telefonbuch fürs Internet.|Like a phone book for the internet.|Comme un annuaire pour Internet.','DNS findet zu einem Namen die passende IP-Adresse.|DNS finds the matching IP address for a name.|Le DNS trouve l’adresse IP correspondant à un nom.'),
 N('s','Welche ist eine gültige IPv4-Adresse?|Which is a valid IPv4 address?|Laquelle est une adresse IPv4 valide ?',['192.168.1.20|192.168.1.20|192.168.1.20','192.168.1.300|192.168.1.300|192.168.1.300','192.168.1|192.168.1|192.168.1'],'Vier Zahlen, jede von 0 bis 255.|Four numbers, each from 0 to 255.|Quatre nombres, chacun de 0 à 255.','IPv4-Adressen haben vier Zahlen zwischen 0 und 255.|IPv4 addresses have four numbers between 0 and 255.|Les adresses IPv4 ont quatre nombres entre 0 et 255.'),
 N('s','Eine Leitung hat 100 Mbit/s. Etwa wie viele Megabyte pro Sekunde sind das?|A connection has 100 Mbit/s. About how many megabytes per second is that?|Une connexion a 100 Mbit/s. Cela fait environ combien de mégaoctets par seconde ?',['12,5 MB/s|12.5 MB/s|12,5 Mo/s','100 MB/s|100 MB/s|100 Mo/s','800 MB/s|800 MB/s|800 Mo/s'],'1 Byte = 8 Bit.|1 byte = 8 bits.|1 octet = 8 bits.','100 : 8 = 12,5 MB/s (theoretisch).|100 : 8 = 12.5 MB/s (in theory).|100 : 8 = 12,5 Mo/s (en théorie).')]);
bankTopic('it8-troubleshoot',8,1,['Probleme lösen','Troubleshooting','Résoudre les problèmes'],
 ['Gehe systematisch vor: Was genau funktioniert nicht? Zuerst Einfaches prüfen (Strom, Kabel, WLAN), dann neu starten, dann Updates und Speicherplatz prüfen, dann Hilfe suchen.','Work systematically: what exactly isn’t working? Check simple things first (power, cables, Wi-Fi), then restart, then check updates and storage, then get help.','Procède avec méthode : qu’est-ce qui ne marche pas exactement ? Vérifie d’abord les choses simples (courant, câbles, Wi-Fi), puis redémarre, puis vérifie mises à jour et stockage, puis demande de l’aide.'],['it_restart'],[
 N('o','Das WLAN geht nicht. Ordne die sinnvollen Schritte.|The Wi-Fi isn’t working. Put the sensible steps in order.|Le Wi-Fi ne marche pas. Range les étapes dans un ordre sensé.',['prüfen, ob WLAN am Gerät eingeschaltet ist|check Wi-Fi is switched on on the device|vérifier que le Wi-Fi est activé sur l’appareil','prüfen, ob andere Geräte Internet haben|check whether other devices have internet|vérifier si d’autres appareils ont Internet','Router neu starten|restart the router|redémarrer le routeur','Internetanbieter kontaktieren|contact the internet provider|contacter le fournisseur d’accès'],'Vom Einfachsten zum Aufwendigsten.|From simplest to most effort.|Du plus simple au plus compliqué.','Zuerst das eigene Gerät, dann das Netz, dann den Router, zuletzt den Anbieter.|First your own device, then the network, then the router, finally the provider.|D’abord ton appareil, puis le réseau, puis le routeur, enfin le fournisseur.'),
 N('s','Das Tablet meldet «Speicher voll». Was hilft?|The tablet says “Storage full”. What helps?|La tablette indique « Stockage plein ». Qu’est-ce qui aide ?',['grosse, unnötige Apps und Videos löschen oder auslagern|delete or move large unneeded apps and videos|supprimer ou déplacer les grosses apps et vidéos inutiles','den Bildschirm heller stellen|make the screen brighter|augmenter la luminosité','die Hülle abnehmen|remove the case|enlever la coque'],'Was braucht viel Platz?|What takes up a lot of space?|Qu’est-ce qui prend beaucoup de place ?','In den Einstellungen siehst du, was am meisten Speicher braucht.|Settings show what uses the most storage.|Les Réglages montrent ce qui prend le plus de stockage.'),
 N('s','Warum hilft ein Neustart oft?|Why does restarting often help?|Pourquoi redémarrer aide-t-il souvent ?',['Er leert den Arbeitsspeicher und startet Programme frisch.|It clears the working memory and starts programs fresh.|Il vide la mémoire vive et relance les programmes à neuf.','Er kauft neue Teile.|It buys new parts.|Il achète de nouvelles pièces.','Er löscht alle Dateien.|It deletes all files.|Il efface tous les fichiers.'],'Denk an den RAM.|Think of RAM.|Pense à la RAM.','Beim Neustart beginnen System und Programme mit einem sauberen Zustand.|On restart, system and programs begin from a clean state.|Au redémarrage, système et programmes repartent d’un état propre.')]);

ITT.push({id:'it9-binary',y:9,a:1,n:['Binärzahlen','Binary numbers','Nombres binaires'],c:['Computer rechnen mit nur zwei Ziffern: 0 und 1. Jede Stelle ist doppelt so viel wert wie die rechts davon: 1, 2, 4, 8, 16, 32 … Beispiel: 1011 = 8 + 2 + 1 = 11.','Computers work with only two digits: 0 and 1. Each place is worth twice the one to its right: 1, 2, 4, 8, 16, 32 … Example: 1011 = 8 + 2 + 1 = 11.','Les ordinateurs calculent avec seulement deux chiffres : 0 et 1. Chaque position vaut le double de celle de droite : 1, 2, 4, 8, 16, 32 … Exemple : 1011 = 8 + 2 + 1 = 11.'],terms:['it_bit','it_binary'],
 g:lv=>{const n=ri(lv===1?2:5,lv===1?15:lv===2?63:255);const b=n.toString(2);if(Math.random()<.5){const it=numItem(X('Welche Dezimalzahl ist die Binärzahl ','Which decimal number is the binary number ','Quel nombre décimal correspond au nombre binaire ')+b+'?',n);
   const parts=b.split('').map((d,i)=>d==='1'?2**(b.length-1-i):0).filter(Boolean);return steps(it,[X('Schreibe die Stellenwerte darüber: ','Write the place values above: ','Écris les valeurs de position au-dessus : ')+b.split('').map((d,i)=>2**(b.length-1-i)).join(', ')+'.',X('Zähle die Werte mit einer 1 zusammen.','Add the values that have a 1.','Additionne les valeurs qui ont un 1.'),parts.join(' + ')+' = '+n]);}
  const it=numItem(X('Schreibe ','Write ','Écris ')+n+X(' als Binärzahl.',' as a binary number.',' en binaire.'),0,{fields:[{label:X('binär','binary','binaire'),ans:+b}],answer:b});
  return steps(it,[X('Welche Zweierpotenz ist gerade noch kleiner oder gleich ','Which power of two is just below or equal to ','Quelle puissance de deux est juste inférieure ou égale à ')+n+'? → '+2**(b.length-1)+'.',X('Ziehe sie ab und mache mit dem Rest weiter; jede benutzte Stelle wird 1, die anderen 0.','Subtract it and continue with the rest; every used place becomes 1, the others 0.','Soustrais-la et continue avec le reste ; chaque position utilisée devient 1, les autres 0.'),b]);}});
bankTopic('it9-backup',9,1,['Backup und Datenschutz','Backup and data protection','Sauvegarde et protection des données'],
 ['Die 3-2-1-Regel: 3 Kopien deiner Daten, auf 2 verschiedenen Speichern, davon 1 an einem anderen Ort. Verschlüsselung (zum Beispiel BitLocker unter Windows oder FileVault auf dem Mac) schützt Daten, wenn ein Gerät gestohlen wird.','The 3-2-1 rule: 3 copies of your data, on 2 different storage media, 1 of them in another place. Encryption (for example BitLocker on Windows or FileVault on a Mac) protects data if a device is stolen.','La règle 3-2-1 : 3 copies de tes données, sur 2 supports différents, dont 1 dans un autre lieu. Le chiffrement (par exemple BitLocker sous Windows ou FileVault sur Mac) protège les données si un appareil est volé.'],['it_backup','it_encryption'],[
 N('s','Was bedeutet die 3-2-1-Regel?|What does the 3-2-1 rule mean?|Que signifie la règle 3-2-1 ?',['3 Kopien, 2 Speicherarten, 1 Kopie an einem anderen Ort|3 copies, 2 kinds of storage, 1 copy elsewhere|3 copies, 2 supports, 1 copie ailleurs','3 Passwörter, 2 Geräte, 1 Konto|3 passwords, 2 devices, 1 account|3 mots de passe, 2 appareils, 1 compte','3 Updates pro Woche|3 updates a week|3 mises à jour par semaine'],'Es geht um Sicherungskopien.|It is about backups.|Il s’agit de sauvegardes.','So überleben die Daten auch Diebstahl, Defekt oder Brand an einem Ort.|That way data survives theft, failure or fire in one place.|Ainsi les données survivent à un vol, une panne ou un incendie à un endroit.'),
 N('s','Wie heisst das eingebaute Backup-Programm des Mac?|What is the Mac’s built-in backup program called?|Comment s’appelle le programme de sauvegarde intégré du Mac ?',['Time Machine|Time Machine|Time Machine','Spotlight|Spotlight|Spotlight','Dock|Dock|Dock'],'Es reist sozusagen in der Zeit zurück.|It travels back in time, so to speak.|Il voyage dans le temps, pour ainsi dire.','Time Machine sichert den Mac regelmässig auf ein externes Laufwerk.|Time Machine backs up the Mac regularly to an external drive.|Time Machine sauvegarde régulièrement le Mac sur un disque externe.'),
 N('s','Wozu dient die Verschlüsselung eines Laptops?|What is encrypting a laptop for?|À quoi sert le chiffrement d’un ordinateur portable ?',['Ohne Passwort kann niemand die Daten lesen, auch nicht nach einem Diebstahl.|Without the password nobody can read the data, even after theft.|Sans mot de passe, personne ne peut lire les données, même après un vol.','Er wird schneller.|It gets faster.|Il devient plus rapide.','Er braucht keinen Strom mehr.|It no longer needs power.|Il n’a plus besoin de courant.'],'Die Daten werden unlesbar gemacht.|The data is made unreadable.|Les données sont rendues illisibles.','Verschlüsselte Daten sind ohne Schlüssel nur Zeichensalat.|Encrypted data is gibberish without the key.|Les données chiffrées sont illisibles sans la clé.')]);
bankTopic('it9-ecosystem',9,3,['Zusammenarbeit der Geräte','Devices working together','Appareils qui travaillent ensemble'],
 ['Mit AirDrop sendest du Dateien kabellos an Apple-Geräte in der Nähe. iCloud Drive hält Dateien auf Mac, iPad und iPhone gleich. Unter Windows übernimmt OneDrive eine ähnliche Rolle; Handy und PC lassen sich ebenfalls koppeln.','AirDrop sends files wirelessly to nearby Apple devices. iCloud Drive keeps files the same on Mac, iPad and iPhone. On Windows, OneDrive plays a similar role; phones and PCs can also be linked.','AirDrop envoie des fichiers sans fil aux appareils Apple proches. iCloud Drive garde les fichiers identiques sur Mac, iPad et iPhone. Sous Windows, OneDrive joue un rôle semblable ; téléphone et PC peuvent aussi être reliés.'],['it_airdrop','it_cloud'],[
 N('s','Du willst ein Foto schnell vom iPhone auf den Mac daneben schicken. Was ist am einfachsten?|You want to send a photo quickly from your iPhone to the Mac next to it. What is easiest?|Tu veux envoyer vite une photo de l’iPhone au Mac à côté. Qu’est-ce qui est le plus simple ?',['AirDrop|AirDrop|AirDrop','ausdrucken und einscannen|print and scan it|l’imprimer et le scanner','HDMI-Kabel|HDMI cable|câble HDMI'],'Kabellos, für Geräte in der Nähe.|Wireless, for nearby devices.|Sans fil, pour les appareils proches.','AirDrop überträgt Dateien direkt zwischen Apple-Geräten in der Nähe.|AirDrop transfers files directly between nearby Apple devices.|AirDrop transfère des fichiers directement entre appareils Apple proches.'),
 N('s','Welcher Dienst gleicht Dateien zwischen Windows-PCs über das Internet ab?|Which service syncs files between Windows PCs over the internet?|Quel service synchronise les fichiers entre PC Windows via Internet ?',['OneDrive|OneDrive|OneDrive','AirDrop|AirDrop|AirDrop','Bluetooth|Bluetooth|Bluetooth'],'Es ist Microsofts Cloud-Speicher.|It is Microsoft’s cloud storage.|C’est le stockage cloud de Microsoft.','OneDrive ist in Windows eingebaut und synchronisiert Dateien.|OneDrive is built into Windows and syncs files.|OneDrive est intégré à Windows et synchronise les fichiers.'),
 N('m','Was braucht es, damit AirDrop funktioniert?|What is needed for AirDrop to work?|Que faut-il pour qu’AirDrop fonctionne ?',['*Beide Geräte sind in der Nähe.|Both devices are nearby.|Les deux appareils sont à proximité.','*WLAN und Bluetooth sind eingeschaltet.|Wi-Fi and Bluetooth are on.|Wi-Fi et Bluetooth sont activés.','ein HDMI-Kabel|an HDMI cable|un câble HDMI','ein Drucker|a printer|une imprimante'],'Es funktioniert ohne Kabel.|It works without cables.|Ça marche sans câble.','AirDrop nutzt Bluetooth und WLAN zwischen Geräten in der Nähe.|AirDrop uses Bluetooth and Wi-Fi between nearby devices.|AirDrop utilise Bluetooth et Wi-Fi entre appareils proches.')]);

/* ================= admin ================= */
function viewAdminLogin(){
 const pw=h('input',{type:'password',id:'pw',autocomplete:'current-password'});
 const go=async()=>{if(await sha(S.cfg.salt+pw.value)===S.cfg.pwHash){S.admin=true;viewAdmin('players');}else{toast(t('pwWrong'),true);pw.value='';pw.focus();}};
 screen(topbar(t('pwTitle'),{back:viewHome,rerender:viewAdminLogin}),h('main',{class:'page stack'},
  h('div',{},h('label',{class:'f',for:'pw'},t('password')),pw),h('button',{class:'btn',onclick:go},t('unlock'))));
 S.onEnter=go;pw.focus();
}
function viewAdmin(tab){
 if(!S.admin)return viewAdminLogin();
 const body=h('div',{});
 screen(topbar(t('admin'),{rerender:()=>viewAdmin(tab),extra:h('button',{class:'btn ghost small',onclick:viewHome},t('lockAdmin'))}),
  h('main',{class:'page wide'},h('div',{class:'tabs',role:'tablist'},[['players','tabPlayers'],['games','tabGames'],['logs','tabLogs'],['maps','tabMaps'],['settings','tabSettings']].map(([k,l])=>
   h('button',{role:'tab','aria-selected':String(tab===k),onclick:()=>viewAdmin(k)},t(l)))),body));
 ({players:adminPlayers,games:adminGames,logs:adminLogs,maps:adminMaps,settings:adminSettings})[tab](body);
}
/* players */
function adminPlayers(body){
 body.append(h('div',{class:'row',style:'margin-bottom:14px'},h('button',{class:'btn',onclick:()=>editPlayer(null)},'+ '+t('addPlayer'))),
  h('div',{class:'list'},S.profiles.map(p=>h('div',{class:'item'},h('span',{style:'font-size:2rem'},p.avatar),
   h('div',{class:'grow'},h('b',{},p.name),h('div',{class:'small muted'},t('level',{n:levelOf(st(p.id).xp)})+' · '+st(p.id).xp+' '+t('points')+' · '+st(p.id).badges.length+' 🏅'+(p.unlockAll?' · 🔓':''))),
   h('button',{class:'btn ghost small',onclick:()=>editPlayer(p)},t('edit')),
   h('button',{class:'btn danger small',onclick:async()=>{if(!confirm(t('confirmDelPlayer',{name:p.name})))return;S.profiles=S.profiles.filter(x=>x.id!==p.id);
    await saveProfiles();computeState();viewAdmin('players');}},t('del'))))));
}
function editPlayer(p){
 const d={name:p?p.name:'',avatar:p?p.avatar:AVATARS[Math.floor(Math.random()*AVATARS.length)],unlockAll:p?!!p.unlockAll:false};
 const dlg=$('#dlg');const nm=h('input',{type:'text',id:'pn',value:d.name,maxlength:'30'});
 const avs=h('div',{class:'avpick'});const drawAv=()=>avs.replaceChildren(...AVATARS.map(a=>h('button',{type:'button','aria-pressed':String(d.avatar===a),onclick:()=>{d.avatar=a;drawAv();}},a)));drawAv();
 const ua=h('input',{type:'checkbox',id:'ua'});ua.checked=d.unlockAll;
 dlg.replaceChildren(h('div',{class:'stack'},h('h2',{},p?t('editPlayer'):t('addPlayer')),
  h('div',{},h('label',{class:'f',for:'pn'},t('name')),nm),h('div',{},h('div',{class:'f'},t('avatar')),avs),
  h('label',{},ua,' '+t('unlockAll')),
  p?h('button',{class:'btn danger small',onclick:async()=>{if(!confirm(t('confirmReset',{name:p.name})))return;p.resetAt=new Date().toISOString();
   await saveProfiles();computeState();dlg.close();viewAdmin('players');}},t('resetProgress')):null,
  h('div',{class:'row'},h('button',{class:'btn',onclick:async()=>{const n=nm.value.trim();if(!n)return nm.focus();
   if(p){p.name=n;p.avatar=d.avatar;p.unlockAll=ua.checked;}else S.profiles.push({id:uid(),name:n,avatar:d.avatar,unlockAll:ua.checked,createdAt:new Date().toISOString()});
   try{await saveProfiles();}catch(e){return toast(t('err',{e:e.message}),true);}computeState();dlg.close();viewAdmin('players');}},t('save')),
   h('button',{class:'btn ghost',onclick:()=>dlg.close()},t('cancel')))));
 dlg.showModal();nm.focus();
}
/* games */
function adminGames(body){

const HEIC_LIBS=[
 {url:'https://cdn.jsdelivr.net/npm/heic-to@1.5.2/dist/iife/heic-to.js',ready:()=>typeof window.HeicTo==='function',
  run:f=>window.HeicTo({blob:f,type:'image/jpeg',quality:0.9})},
 {url:'https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js',ready:()=>typeof window.heic2any==='function',
  run:async f=>{const o=await window.heic2any({blob:f,toType:'image/jpeg',quality:0.9});return Array.isArray(o)?o[0]:o;}}];
function loadScript(url){return new Promise((res,rej)=>{const sc=document.createElement('script');sc.src=url;sc.onload=()=>res();
 sc.onerror=()=>rej(new Error('HEIC converter could not be loaded (internet connection?)'));document.head.append(sc);});}
async function heicToJpeg(file){const errs=[];
 for(const lib of HEIC_LIBS){try{if(!lib.ready())await loadScript(lib.url);const b=await lib.run(file);if(b&&b.size)return b;errs.push('empty result');}
  catch(e){errs.push((e&&(e.message||e.code))||String(e));}}
 throw new Error(file.name+': HEIC conversion failed ('+errs.join(' / ')+')');}
function blobToB64(b){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]);r.onerror=()=>rej(r.error);r.readAsDataURL(b);});}
async function fileToBlock(file){return(await photoFromFile(file)).block;}
async function photoFromFile(file){
 if(file.type==='application/pdf')return{pdf:true,block:{type:'document',source:{type:'base64',media_type:'application/pdf',data:await blobToB64(file)}}};
 let src=file;
 if(/hei[cf]/i.test(file.type)||/\.hei[cf]$/i.test(file.name))src=await heicToJpeg(file);
 const url=URL.createObjectURL(src);
 try{const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error(file.name+': image could not be read (HEIC?)'));i.src=url;});
  const sc=Math.min(1,1568/Math.max(img.naturalWidth,img.naturalHeight));const c=document.createElement('canvas');c.width=Math.round(img.naturalWidth*sc);c.height=Math.round(img.naturalHeight*sc);
  c.getContext('2d').drawImage(img,0,0,c.width,c.height);const dataUrl=c.toDataURL('image/jpeg',0.85);
  return{url:dataUrl,w:c.width,h:c.height,block:{type:'image',source:{type:'base64',media_type:'image/jpeg',data:dataUrl.split(',')[1]}}};}
 finally{URL.revokeObjectURL(url);}
}
const GEN_SYSTEM=`You create quiz questions for a self-contained learning game. The photos or PDFs are only your source of facts: players never see them.
Deliver all questions by calling the save_questions tool once, with every question in "items".
Every question must be answerable without the learning material. Never refer to the material, the worksheet, a page, a figure, a picture, a learning goal ("Lernziel") or to numbers/letters printed in the material.
Each item has: "type" (one of "single","multi","order","input","map"), "prompt", "difficulty" (1 easy, 2 medium, 3 hard), "explanation" (one short sentence explaining the answer).
- single: "options" (3 to 5 strings), "correct" ([index of the one right option]).
- multi: "options" (4 to 6 strings), "correct" ([indices of all right options, at least 2]).
- order: "order" (3 to 6 strings in the correct order); the prompt states the ordering criterion.
- input: "answer" (exact expected answer: one word or a short term, spelled and capitalised exactly as in the material); optional "accept" (other equally correct spellings).
- map: a question on the game's own interactive map, built from the map packs listed in the request. "map": {"pack": pack id, "task", "target": an object id copied exactly from the pack list, plus task fields}. Tasks:
  tap = the player taps the target ("Tippe auf den Kanton Uri").
  choose = the target is highlighted, the player picks its name; "options": 3 to 5 ids from the same layer including the target.
  name = the target is highlighted, the player types its name; give "answer" (the name as written in the material) and optional "accept".
  label = the game draws its own numbers on a set of objects and asks for the name behind one number; "labels": the ids of all objects that belong to the exercise (for example all 7 continents or all oceans that the material numbers or names), target = one of them; write the prompt with the placeholder {nr}, e.g. "Wie heisst der Kontinent mit der Nummer {nr}?".
  number = the game draws its own numbers on "labels" and the player picks the number of the target, e.g. "Welche Nummer hat Australien?".
  The game assigns new random numbers every time, so never use or mention the numbers from the material. The prompt must never contain the answer of choose/name/label tasks. Use only ids from the list.
If the material contains a map (for example a numbered or labelled map), recreate it with map questions (label, number, tap, choose, name) for exactly those places. Never create a question that needs the material's map or pictures.
When map packs are listed, use "map" questions for everything about places: countries, cantons, continents, capitals, cities, rivers, lakes, seas and oceans, mountains, passes, landscapes, monuments and historic sites. Use the other types for facts that do not need a map (e.g. "Welcher Kontinent ist der grösste?").
History map packs (ids starting with "h", e.g. "h07-revolutionen-napoleon") contain one political map per year; their layer ids look like "y1815" or "ym500" (m = BC), object ids like "y1815:austrian-empire". Pick the year layer that matches the time in the material (the nearest available year) and say the year in the prompt, e.g. "Tippe auf das Kaisertum Österreich (1815)". Borders in these maps are simplified and approximate. Their "places" layer holds cities, battles and historic sites.
Country groups (Skandinavien, Nordische Länder, Baltikum, Benelux, Britische Inseln, Iberische Halbinsel) are in the "regions" layer of the world and europe packs.
Jokes: add one extra item per about 10 questions with "joke": true, type "single": a funny, kind, age-appropriate fake question about the topic whose correct option (put it first, the game shuffles) is the joking answer; "explanation" is the punchline. Never make fun of people, countries or groups.
Languages: every item also has \"tr\" with the keys \"de\", \"en\" and \"fr\". Each holds the complete question in that language: \"prompt\", \"explanation\" and, depending on the type, \"options\" (same number and same order as the item's options, so the correct indices stay valid), \"order\" (same order), \"answer\" and \"accept\". The top-level fields hold the version in the language of the material. Translate naturally for children and keep the difficulty. German is written the Swiss way, without \"ß\" (use \"ss\"). For vocabulary questions translate only the instruction: the words being asked about and the expected answers stay in the language that is being tested (example: de \"Was heisst 'Haus' auf Französisch?\", en \"What is 'Haus' in French?\", fr \"Comment dit-on « Haus » en français ?\"; the answer is \"maison\" in all three). Map questions: keep the placeholder {nr}; for name tasks give \"answer\" as the place name in that language. Jokes: translate the joke, or if the pun does not work, write an equally kind joke on the same topic whose joking answer stays the first option.\nHelp steps: for every question that needs thinking (always for mathematics) add \"hints\": 2 to 4 short steps that lead the child towards the solution one at a time, like a good teacher: first what to look at, then the method, never the final result. Give the hints in \"tr\" for each language too.\nRules: use only facts contained in the material and never invent content. Wrong options must be plausible but clearly wrong. For vocabulary, ask in both directions and use input questions for spelling. Write the questions in the language of the material unless the notes say otherwise. Skip anything unreadable.`;

}
const TR_SYSTEM=`You translate quiz questions of a children's learning game so that every question exists in German ("de"), English ("en") and French ("fr"). Call the save_translations tool once with one entry per question, using the same "id".
For each language give "prompt", "explanation" (if the question has one) and, depending on the question, "options" (same number and same order, so the correct indices stay valid), "order" (same order), "answer" and "accept". The language the question is already written in is copied unchanged.
Keep meaning and difficulty. German is written the Swiss way, without "ß" (use "ss").
Vocabulary questions: translate only the instruction; the words being asked about and the expected answers stay in the language that is being tested (example: de "Was heisst 'Haus' auf Französisch?", en "What is 'Haus' in French?", fr "Comment dit-on « Haus » en français ?"; the answer is "maison" in all three).
Map questions: keep the placeholder {nr} unchanged; if the question expects a typed place name, give "answer" as the place name in that language.
Jokes ("joke": true): translate the joke, or if the pun does not work in a language, write an equally kind joke on the same topic whose joking answer stays the first option. Never add or remove options.`;
const TR_TOOL={name:'save_translations',description:'Save the translated questions.',input_schema:{type:'object',required:['items'],properties:{items:{type:'array',items:{type:'object',required:['id','tr'],properties:{id:{type:'string'},tr:TR_SCHEMA}}}}}};
function trPayload(it){const o={id:it.id,type:it.type,prompt:it.prompt};for(const k of['explanation','options','order','answer','accept','joke'])if(it[k]!=null)o[k]=it[k];
 if(it.type==='map'&&it.map)o.mapTask=it.map.task;if(it.tr)o.existing=it.tr;return o;}
async function translateGame(g){
 if(!await IDB.get('kv','apiKey'))return toast(t('needKey'),true);
 for(const pk of new Set(g.items.filter(i=>i.type==='map'&&i.map).map(i=>i.map.pack)))await loadPack(pk).catch(()=>{});
 const todo=g.items.filter(i=>trMissing(i).length);if(!todo.length)return toast(t('tr_none'));
 const dlg=$('#dlg');const st=h('p',{'aria-live':'polite'},t('tr_working',{n:0,t:todo.length}));dlg.replaceChildren(h('div',{class:'stack'},h('h2',{},'🌐 '+t('tr_btn')+': '+g.title),st));dlg.showModal();
 let done=0,fail=0;
 try{for(let k=0;k<todo.length;k+=12){const batch=todo.slice(k,k+12);
   const res=await callClaude([{type:'text',text:'Questions (JSON):\n'+JSON.stringify(batch.map(trPayload))}],TR_SYSTEM,TR_TOOL);
   const by={};for(const r of res||[])if(r&&r.id)by[r.id]=r.tr;
   for(const it of batch){const nt=by[it.id];if(!nt){fail++;continue;}const keep=it.tr||{};const cand=Object.assign({},it,{tr:Object.assign({},nt,keep)});normTr(cand);
    if(cand.tr&&LANGS.every(l=>cand.tr[l])){it.tr=cand.tr;done++;}else{if(cand.tr)it.tr=cand.tr;fail++;}}
   st.textContent=t('tr_working',{n:Math.min(k+12,todo.length),t:todo.length});
   await saveGame(g);}}
 catch(e){dlg.close();toast(t('err',{e:e.message}),true);viewAdmin('games');return;}
 dlg.close();toast(t('tr_done',{n:done})+(fail?' · '+t('tr_fail',{n:fail}):''),!!fail);viewAdmin('games');}
async function viewGenerate(g){
 const avail=await listPacks();const used=new Set(((g&&g.items)||[]).filter(i=>i.type==='map'&&i.map).map(i=>i.map.pack).concat((g&&g.mapPacks)||[]));
 const pchk=avail.sort().map(id=>{const c=h('input',{type:'checkbox',value:id});c.checked=used.size?used.has(id):!isHistPack(id);return h('label',{style:'display:inline-flex;gap:6px;align-items:center;margin-right:16px'},c,id);});
 const f={title:g?g.title:'',kind:g?(g.kind||'other'):'vocab',instr:g?(g.instructions||''):'',count:20,files:[]};
 const title=h('input',{type:'text',id:'gt',value:f.title});const kind=h('select',{id:'gk'},['vocab','geo','hist','math','it','science','other'].map(k=>h('option',{value:k},t('k_'+k))));kind.value=f.kind;
 const instr=h('textarea',{id:'gi',placeholder:t('instrPh')});instr.value=f.instr;const cnt=h('input',{type:'number',id:'gc',min:'5',max:'80',value:'20'});
 const thumbs=h('div',{class:'thumbs'});const status=h('p',{class:'muted','aria-live':'polite'});
 const fi=h('input',{type:'file',id:'gf',multiple:true,accept:'image/*,application/pdf',onchange:e=>{f.files=[...e.target.files];
  thumbs.replaceChildren(...f.files.map(x=>x.type==='application/pdf'?h('div',{class:'pdf'},'PDF')
   :(/hei[cf]/i.test(x.type)||/\.hei[cf]$/i.test(x.name))?h('div',{class:'pdf',title:x.name},'HEIC'):h('img',{src:URL.createObjectURL(x),alt:x.name})));}});
 const btn=h('button',{class:'btn big'},t('generate'));
 btn.addEventListener('click',async()=>{
  if(!g&&!title.value.trim())return toast(t('needTitle'),true);if(!f.files.length)return toast(t('needFiles'),true);
  if(!await IDB.get('kv','apiKey'))return toast(t('needKey'),true);
  const packs=pchk.map(l=>l.querySelector('input')).filter(c=>c.checked).map(c=>c.value);let catalog='';
  try{for(const id of packs)catalog+=packCatalog(await loadPack(id))+'\n\n';}catch(e){return toast(e.message,true);}
  btn.disabled=true;const total=Math.max(5,Math.min(80,parseInt(cnt.value,10)||20));const batches=[];for(let k=0;k<f.files.length;k+=4)batches.push(f.files.slice(k,k+4));
  const existing=g?g.items.map(i=>i.prompt).slice(0,80):[];let out=[],dropped=0;const photos=[];
  try{for(let b=0;b<batches.length;b++){
    const blocks=[],imgIdx=[];for(const file of batches[b]){const ph=await photoFromFile(file);blocks.push(ph.block);if(!ph.pdf){imgIdx.push(photos.length);photos.push(ph);}}
    const want=Math.max(3,Math.round(total*batches[b].length/f.files.length));let got=0;
    for(let round=0;got<want&&round<5;round++){
     status.textContent=t('working',{n:out.length,t:total});
     const n=Math.min(12,want-got);const avoid=existing.concat(out.map(i=>i.prompt)).slice(-150);
     const req=blocks.concat([{type:'text',text:`Images in this request: ${imgIdx.length}. Material type: ${kind.value}. Create about ${n} questions. Notes: ${instr.value.trim()||'none'}.`+(catalog?`\n\nAvailable map packs (object ids for map questions):\n${catalog}`:'')+(avoid.length?`\nDo not repeat these existing questions:\n- `+avoid.join('\n- '):'')}]);
     const items=await callClaude(req);for(const pk of new Set(items.filter(x=>x&&x.type==='map'&&x.map&&avail.includes(x.map.pack)).map(x=>x.map.pack)))await loadPack(pk).catch(()=>{});let valid=0;for(const it of items){delete it.figure;delete it.spot;if(docRef(it)){dropped++;continue;}if(validItem(it)){it.id=uid();out.push(it);valid++;}else dropped++;}
     got+=valid;if(!valid)break;}}}
  catch(e){btn.disabled=false;status.textContent='';return toast(t('genErr',{e:e.message}),true);}
  const sources=photos.map(ph=>{let pr=null;return()=>pr||(pr=loadImgEl(ph.url));});
  viewReview(g,{title:title.value.trim(),kind:kind.value,instructions:instr.value.trim(),files:f.files.map(x=>x.name),mapPacks:packs},out,dropped,sources);
 });
 const draw=()=>screen(topbar(g?t('addMaterial')+': '+g.title:t('newGame'),{back:()=>viewAdmin('games')}),h('main',{class:'page stack'},
  !g?h('div',{},h('label',{class:'f',for:'gt'},t('gameTitle')),title):null,
  h('div',{},h('label',{class:'f',for:'gk'},t('kind')),kind),h('div',{},h('label',{class:'f',for:'gi'},t('instructions')),instr),
  h('div',{},h('label',{class:'f',for:'gc'},t('count')),cnt),h('div',{},h('label',{class:'f',for:'gf'},t('files')),fi,h('p',{class:'small muted',style:'margin-top:6px'},t('materialNote'))),
  avail.length?h('div',{},h('div',{class:'f'},t('mapsForGame')),h('div',{},pchk)):null,
  thumbs,btn,status));
 draw();
}
function viewReview(g,meta,items,dropped,sources){
 sources=sources||[];const keep=items.map(()=>true);const status=h('p',{class:'muted','aria-live':'polite'});
 const thumbFor=it=>{if(!it._fig)return null;const im=h('img',{class:'thumb',alt:''});const src=sources[it._fig.photo];
  if(src)src().then(img=>{im.src=bakeFigure(img,it._fig,240).toDataURL('image/jpeg',0.8);}).catch(()=>{});return im;};
 const draw=()=>screen(topbar(t('review'),{back:()=>viewAdmin('games')}),h('main',{class:'page wide stack'},
  h('p',{},t('genDone',{n:items.length,d:dropped})),
  h('div',{class:'list'},items.map((it,k)=>{const cb=h('input',{type:'checkbox','aria-label':t('keep'),onchange:e=>{keep[k]=e.target.checked;}});cb.checked=keep[k];
   return itemRow(it,{check:cb,thumb:thumbFor(it),onMapChange:async()=>draw(),onEdit:()=>jsonEdit(it,async n=>{items[k]=n;draw();}),
    onImage:(sources.length&&it._fig)?()=>figEditor({sources,spot:it.type==='spot',fig:it._fig,onApply:f=>{it._fig=f;draw();},onRemove:it._fig?()=>{delete it._fig;draw();}:null}):null,
    imageLabel:it._fig?t('imgEdit'):t('imgAdd')});})),
  h('button',{class:'btn big',onclick:async e=>{const btn=e.currentTarget;btn.disabled=true;
   const chosen=items.filter((_,k)=>keep[k]);const game=g||{id:uid(),title:meta.title,kind:meta.kind,instructions:meta.instructions,createdAt:new Date().toISOString(),sources:[],items:[]};
   const seen=new Set(game.items.map(i=>i.type+'|'+i.prompt.trim().toLowerCase()));let dup=0,skipped=0;const add=[];
   for(const it of chosen){if(it.type==='spot'&&!spotInBox(it._fig)){skipped++;continue;}
    const key=it.type+'|'+it.prompt.trim().toLowerCase();if(seen.has(key)){dup++;continue;}seen.add(key);add.push(it);}
   try{const figs=add.filter(it=>it._fig);let n=0;
    for(const it of figs){status.textContent=t('savingImgs',{i:++n,n:figs.length});const img=await sources[it._fig.photo]();const c=bakeFigure(img,it._fig,1200);
     const path='games/'+game.id+'/img/'+uid()+'.jpg';await S.store.writeBlob(path,await canvasBlob(c));it.image={path,w:c.width,h:c.height};
     if(it.type==='spot')it.spot=spotInBox(it._fig);delete it._fig;}
    for(const it of add){delete it._fig;game.items.push(it);}
    game.sources=(game.sources||[]).concat([{date:new Date().toISOString(),files:meta.files,added:add.length}]);
    if(meta.instructions)game.instructions=meta.instructions;if(meta.mapPacks&&meta.mapPacks.length)game.mapPacks=[...new Set((game.mapPacks||[]).concat(meta.mapPacks))];await saveGame(game);}
   catch(err){btn.disabled=false;status.textContent='';return toast(t('err',{e:err.message}),true);}
   toast(t('saved')+(dup?' – '+t('dupSkipped',{n:dup}):'')+(skipped?' – '+t('spotSkipped',{n:skipped}):''));viewAdmin('games');}},t('saveToGame')),status));
 draw();
}

async function adminMaps(body){
 const imp=h('input',{type:'file',accept:'application/json,.json',multiple:true,style:'display:none',onchange:async e=>{let n=0;
  try{for(const file of e.target.files){const d=JSON.parse(await file.text());const list=Array.isArray(d.packs)?d.packs:[d];
    for(const P of list){if(!P||!P.id||!Array.isArray(P.layers))continue;await S.store.write('maps/'+P.id+'.json',P);delete PACKS[P.id];n++;}}
   toast(t('mapsImported',{n}));}catch(err){toast(t('err',{e:err.message}),true);}viewAdmin('maps');}});
 const ids=await listPacks();const viewer=h('div',{});
 body.append(h('p',{class:'muted'},t('mapsIntro')),h('div',{class:'row',style:'margin-bottom:14px'},h('button',{class:'btn',onclick:()=>imp.click()},t('importMaps')),imp));
 if(!ids.length)return body.append(h('p',{class:'muted'},t('noMaps')));
 const geoC=h('div',{class:'maplist'}),histC=h('div',{class:'maplist'});body.append(h('div',{class:'maphead'},t('g_geo')),geoC,h('div',{class:'maphead'},t('g_hist')),histC,viewer);
 for(const id of ids.sort()){const cards=isHistPack(id)?histC:geoC;let P;try{P=await loadPack(id);}catch(e){continue;}const n=P.layers.reduce((a,L)=>a+L.f.filter(f=>!f.bg&&L.kind!=='bg').length,0);
  cards.append(h('button',{class:'item',onclick:()=>showPack(P)},h('div',{class:'grow'},h('b',{},fname({n:P.name})),h('div',{class:'small muted'},(P.period?perText(P.period)+' · ':'')+t('objects',{n}))),'›'));}
 function showPack(P){const shown=new Set();const box=h('div',{});const tip=h('div',{class:'maptip'},t('tapToName'));
  const draw=()=>{const mv=mapView(P,{show:[...shown],faint:shown.has('landscapes')||shown.has('continents')});mv.el.append(tip);
   mv.onTap=(x,y,ppu)=>{const order=[...shown].concat(P.layers.filter(L=>L.kind!=='bg'&&L.kind!=='point'&&!['landscapes','continents','seas'].includes(L.id)&&!shown.has(L.id)).map(L=>L.id).reverse());let hit=null;
    for(const L of order){const hs=mapHits(P,L,x,y,ppu,'medium');if(hs.length){hit=hs[0];break;}}
    tip.textContent=hit?fname(P.byId[hit])+' ('+(P.layers.find(l=>l.id===P.byId[hit].layer).label[S.lang]||'')+')':t('tapToName');
    Object.values(mv.els).forEach(e=>e.classList.remove('hl'));if(hit&&mv.els[hit])mv.els[hit].classList.add('hl');};
   box.replaceChildren(mv.el);};
  const toggles=h('div',{class:'row',style:'gap:14px;margin:10px 0'},P.layers.filter(L=>L.kind==='point'||L.opt||['landscapes','continents','regions'].includes(L.id)).map(L=>{
   const c=h('input',{type:'checkbox',onchange:e=>{e.target.checked?shown.add(L.id):shown.delete(L.id);draw();}});return h('label',{style:'display:inline-flex;gap:6px;align-items:center'},c,L.label[S.lang]||L.id);}));
  viewer.replaceChildren(h('h3',{},fname({n:P.name})),h('div',{class:'small muted'},t('layers')+':'),toggles,box);draw();}
