<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lernspiel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Kalam:wght@700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FBFBF6; --grid:#DDE7F1; --ink:#1F3A93; --ink-soft:#E8EDF9;
  --red:#C8322B; --mark:#F6E27A; --graphite:#2F3437; --green:#2E7D4F;
  --muted:#667085; --white:#FFFFFF;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  font-family:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  color:var(--graphite); font-size:18px; line-height:1.5; min-height:100vh;
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;
}
.hand{font-family:"Kalam","Comic Sans MS",cursive}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.top{display:flex;align-items:center;gap:12px;padding:14px 20px;background:rgba(251,251,246,.92);border-bottom:2px solid var(--grid);position:sticky;top:0;z-index:5}
.top h1{font-size:1.35rem;margin:0;flex:1;color:var(--ink)}
.page{max-width:780px;margin:0 auto;padding:24px 20px 60px 36px;border-left:2px solid var(--red);min-height:calc(100vh - 64px);background:linear-gradient(90deg,rgba(251,251,246,.85),rgba(251,251,246,.85))}
.page.wide{max-width:1040px}
h2{font-size:1.5rem;margin:0 0 12px;color:var(--ink)}
h3{font-size:1.15rem;margin:24px 0 8px}
p{margin:0 0 12px}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.btn{border:0;border-radius:10px;padding:10px 18px;background:var(--ink);color:var(--white);font-weight:700}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink)}
.btn.danger{background:transparent;color:var(--red);box-shadow:inset 0 0 0 2px var(--red)}
.btn.small{padding:6px 12px;font-size:.9rem}
.btn.big{padding:14px 28px;font-size:1.15rem}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stack>*+*{margin-top:12px}
.lang{display:flex;border-radius:8px;overflow:hidden;box-shadow:inset 0 0 0 2px var(--ink)}
.lang button{border:0;background:transparent;padding:4px 10px;font-weight:700;color:var(--ink)}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--white)}
.players{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px}
.player{border:2px solid var(--ink);border-radius:16px;background:var(--white);padding:16px 10px;text-align:center}
.player .av{font-size:3rem;line-height:1.1}
.player .nm{font-weight:700;margin-top:6px}
.list{display:flex;flex-direction:column;gap:10px}
.item{display:flex;align-items:center;gap:12px;background:var(--white);border:2px solid var(--grid);border-radius:12px;padding:12px 14px;text-align:left;width:100%}
button.item{border-color:var(--ink)}
.item .grow{flex:1;min-width:0}
.bar{height:10px;border-radius:5px;background:var(--ink-soft);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--ink)}
.choices{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.choice{border:2px solid var(--ink);border-radius:12px;background:var(--white);padding:12px;text-align:left}
.choice[aria-pressed="true"]{background:var(--mark)}
.choice:disabled{opacity:.5;border-style:dashed}
.choice b{display:block}
.choice span{font-size:.85rem;color:var(--muted)}
.stickers{display:flex;flex-wrap:wrap;gap:10px}
.sticker{display:flex;flex-direction:column;align-items:center;width:84px;text-align:center;font-size:.75rem;line-height:1.2}
.sticker i{font-style:normal;font-size:1.7rem;width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:var(--mark);box-shadow:0 0 0 3px var(--white),0 0 0 5px var(--ink);transform:rotate(-6deg);margin-bottom:6px}
.hud{display:flex;flex-wrap:wrap;gap:16px;align-items:center;font-weight:700;margin-bottom:16px}
.hud .sp{flex:1}
.card{background:var(--white);border:2px solid var(--ink);border-radius:18px;padding:22px;position:relative}
.prompt{font-size:1.45rem;line-height:1.35;margin:0 0 6px;font-weight:700}
.hint{font-size:.9rem;color:var(--muted);margin-bottom:16px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{border:2px solid var(--ink);border-radius:12px;background:var(--white);padding:12px 16px;text-align:left;font-size:1.1rem;min-height:52px}
.opt[aria-pressed="true"]{background:var(--mark)}
.opt.ok{border-color:var(--green);background:#E3F3E9}
.opt.bad{border-color:var(--red);background:#FBE5E3}
.seq{min-height:56px;border:2px dashed var(--ink);border-radius:12px;padding:8px;display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chip{border:2px solid var(--ink);border-radius:10px;background:var(--white);padding:8px 12px;font-size:1.05rem}
.chip.placed{background:var(--mark)}
.chip .n{font-weight:700;margin-right:6px;color:var(--ink)}
input[type=text],input[type=password],input[type=number],select,textarea{width:100%;border:2px solid var(--ink);border-radius:10px;padding:10px 12px;background:var(--white)}
textarea{min-height:90px}
label.f{display:block;font-weight:700;margin-bottom:4px}
.answerbox{font-size:1.3rem}
.feedback{margin-top:18px;padding-top:14px;border-top:2px dashed var(--grid)}
.stamp{font-size:2rem;display:inline-block;transform:rotate(-4deg)}
.stamp.ok{color:var(--green)}
.stamp.bad{color:var(--red)}
@media (prefers-reduced-motion:no-preference){
  .stamp{animation:stamp .28s ease-out}
  @keyframes stamp{from{transform:rotate(-4deg) scale(1.6);opacity:0}to{transform:rotate(-4deg) scale(1);opacity:1}}
}
.bigscore{font-size:4rem;color:var(--red);line-height:1;transform:rotate(-3deg);display:inline-block}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:20px}
.tabs button{border:0;background:transparent;padding:8px 14px;border-radius:8px;font-weight:700;color:var(--ink)}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--white)}
table{width:100%;border-collapse:collapse;background:var(--white);font-size:.9rem}
th,td{text-align:left;padding:8px;border-bottom:1px solid var(--grid);vertical-align:top}
.scroll{overflow-x:auto}
.tag{display:inline-block;font-size:.75rem;font-weight:700;padding:2px 8px;border-radius:6px;background:var(--ink-soft);color:var(--ink)}
.avpick{display:flex;flex-wrap:wrap;gap:6px}
.avpick button{font-size:1.6rem;border:2px solid transparent;border-radius:10px;background:var(--white);width:48px;height:48px}
.avpick button[aria-pressed="true"]{border-color:var(--ink);background:var(--mark)}
.thumbs{display:flex;flex-wrap:wrap;gap:8px}
.thumbs img,.thumbs .pdf{width:84px;height:84px;object-fit:cover;border-radius:8px;border:2px solid var(--grid);background:var(--white);display:grid;place-items:center;font-size:.8rem}
dialog{border:2px solid var(--ink);border-radius:14px;max-width:680px;width:92vw;padding:20px}
dialog::backdrop{background:rgba(31,58,147,.25)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--graphite);color:var(--white);padding:10px 18px;border-radius:10px;z-index:50;max-width:90vw}
.toast.err{background:var(--red)}
.figwrap{position:relative;display:inline-block;max-width:100%;margin:4px 0 14px;line-height:0}
.figwrap img{display:block;max-width:100%;max-height:48vh;border-radius:10px;border:2px solid var(--grid);background:#fff;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.figwrap.spotable img{cursor:crosshair;touch-action:manipulation}
.spotmark{position:absolute;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px var(--graphite)}
.spotmark.ok{background:var(--green)}.spotmark.bad{background:var(--red)}
.spottarget{position:absolute;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;border:3px solid var(--green);background:rgba(46,125,79,.18);pointer-events:none}
.thumb{width:110px;height:82px;object-fit:contain;border:1px solid var(--grid);border-radius:8px;background:#fff;flex:none}
dialog.wide{max-width:1000px}
.stage{position:relative;display:inline-block;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;line-height:0;max-width:100%}
.stage img{display:block;max-width:100%;max-height:62vh;pointer-events:none}
.stage .crop{position:absolute;border:2px dashed #fff;box-shadow:0 0 0 9999px rgba(0,0,0,.45)}
.stage .cover{position:absolute;background:#D9DDE3;border:1px solid #9AA3AF}
.stage .temp{opacity:.7}
.stage .spotdot{position:absolute;width:24px;height:24px;margin:-12px 0 0 -12px;border-radius:50%;border:3px solid var(--red);background:rgba(255,255,255,.7)}
.mapwrap{position:relative;width:100%;margin:4px 0 14px;border:2px solid var(--grid);border-radius:12px;overflow:hidden;background:#cfe3f3}
.mapwrap svg.map{display:block;width:100%;height:auto;max-height:62vh;touch-action:none;-webkit-user-select:none;user-select:none;cursor:crosshair}
.mapctl{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:6px;z-index:2}
.mapctl button{width:38px;height:38px;border-radius:8px;border:2px solid var(--ink);background:#fff;font-weight:700;font-size:1.1rem;color:var(--ink);line-height:1}
.mapattr{position:absolute;left:6px;bottom:4px;font-size:.62rem;color:#56606c;background:rgba(255,255,255,.7);padding:1px 5px;border-radius:4px;line-height:1.3}
.maptip{position:absolute;left:8px;top:8px;background:rgba(255,255,255,.92);border:1px solid var(--grid);border-radius:8px;padding:4px 8px;font-size:.85rem;line-height:1.3;max-width:70%;pointer-events:none}
.m-ocean{fill:#cfe3f3;stroke:#9ab3c8;stroke-width:.6;vector-effect:non-scaling-stroke}
.m-sea{fill:transparent;stroke:none}
.m-land{fill:#f3efe4;stroke:#9a8f7a;stroke-width:.6;vector-effect:non-scaling-stroke}
.m-land.m-bg{fill:#ece6d6}
.m-canton{fill:#f8f4ea;stroke:#7d725d;stroke-width:.8;vector-effect:non-scaling-stroke}
.m-continent{fill:transparent;stroke:none}
.m-landscape{fill:transparent;stroke:none}
.showfaint .m-landscape,.showfaint .m-continent{fill:#c9a86a;fill-opacity:.18;stroke:#a88f60;stroke-width:.6;vector-effect:non-scaling-stroke}
.m-water{fill:#9cc7e8;stroke:#6aa0cc;stroke-width:.5;vector-effect:non-scaling-stroke}
.m-river{fill:none;stroke:#5b9bd5;stroke-width:1.3;vector-effect:non-scaling-stroke;stroke-linecap:round;stroke-linejoin:round}
.m-pt{fill:#2f3437;stroke:#fff;stroke-width:1.2;vector-effect:non-scaling-stroke}
.m-landbase{fill:#efe9dc;stroke:none}
.m-chbase{fill:#e2dccd;stroke:#b3a88f;stroke-width:.6;vector-effect:non-scaling-stroke}
.m-hist{stroke:#6b6255;stroke-width:.7;vector-effect:non-scaling-stroke}
.mapcap{position:absolute;left:8px;top:8px;background:rgba(255,255,255,.92);border:1px solid var(--grid);border-radius:8px;padding:3px 9px;font-weight:700;font-size:.9rem;color:var(--ink);pointer-events:none;line-height:1.3}
.maphead{margin:18px 0 8px;color:var(--muted);font-weight:700;font-size:.9rem;text-transform:uppercase;letter-spacing:.04em}
svg.map .hl{fill:#f6c343!important;fill-opacity:.9;stroke:#c8322b;stroke-width:2.2;vector-effect:non-scaling-stroke}
svg.map .m-river.hl,svg.map path.hl.line{fill:none!important;stroke:#c8322b;stroke-width:4.5}
svg.map .ok{fill:#57b27a!important;fill-opacity:.85;stroke:#1d6b3e;stroke-width:2.2;vector-effect:non-scaling-stroke}
svg.map .bad{fill:#e2766f!important;fill-opacity:.85;stroke:#8f1f19;stroke-width:2.2;vector-effect:non-scaling-stroke}
svg.map .m-river.ok,svg.map path.ok.line{fill:none!important;stroke:#1d6b3e;stroke-width:4.5}
svg.map .m-river.bad,svg.map path.bad.line{fill:none!important;stroke:#8f1f19;stroke-width:4.5}
svg.map circle.hl{fill:#f6c343;stroke:#c8322b;stroke-width:2.5}
svg.map circle.badge{fill:#1F3A93;stroke:#fff;stroke-width:2;vector-effect:non-scaling-stroke}
svg.map text.badge{fill:#fff;font-weight:700;font-family:"Atkinson Hyperlegible",system-ui,sans-serif;pointer-events:none}
svg.map circle.tapdot{stroke:#fff;stroke-width:2;vector-effect:non-scaling-stroke}
.maplist{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.mfig{display:block;width:100%;max-width:520px;height:auto;margin:6px 0 14px;-webkit-user-select:none;user-select:none}
.mfig.clock{max-width:230px}.mfig.tap{cursor:pointer;touch-action:manipulation}
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.05;margin:0 3px;font-size:.9em}.frac span:first-child{border-bottom:2px solid currentColor;padding:0 3px}
.keypad{display:grid;grid-template-columns:repeat(3,64px);gap:8px;margin-top:12px}.key{height:56px;min-width:56px;border:2px solid var(--ink);border-radius:12px;background:var(--white);font-size:1.4rem;font-weight:700;color:var(--ink)}
.key:active{background:var(--ink-soft)}.numrow{gap:14px;align-items:flex-end}.numf{display:flex;flex-direction:column;gap:4px;font-weight:700}.numbox{width:170px;font-size:1.6rem;text-align:center}
.coinrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:6px 0 12px}.coin{border-radius:50%;border:3px solid #9b7b1c;background:radial-gradient(circle at 35% 30%,#fff6c8,#e0c05a);font-weight:700;font-size:.95rem;color:#3b2f00;padding:0}
.coin.note{border-radius:8px;width:96px;height:52px;background:linear-gradient(135deg,#d9ecff,#b6d0f2);border-color:#35609c;color:#16325c}
.purse{min-height:70px;border:2px dashed var(--ink);border-radius:14px;padding:8px;margin:10px 0}
.emogrid{display:grid;grid-template-columns:repeat(3,64px);gap:6px;font-size:2.4rem;margin:6px 0 14px}.emogrid span{background:var(--white);border:2px solid var(--grid);border-radius:10px;text-align:center}
.pv{display:flex;gap:14px;flex-wrap:wrap;margin:8px 0}.pv>div{border:2px solid var(--ink);border-radius:12px;padding:8px 12px;text-align:center;background:var(--white)}.pv b{display:block;font-size:1.6rem}
.helpbox{margin:10px 0 0;padding:10px 14px;border-left:4px solid var(--mark);background:#FFFBEA;border-radius:8px}.helpbox li{margin:4px 0}
.years{display:flex;flex-wrap:wrap;gap:8px}.topicrow{display:flex;gap:8px;align-items:stretch}.topicrow .choice{flex:1}
.glos dt{font-weight:700;margin-top:10px}.glos dd{margin:2px 0 0 0}
@media (max-width:560px){.page{padding-left:24px}.prompt{font-size:1.25rem}}
</style>
</head>

const $=(s,r=document)=>r.querySelector(s);
function h(tag,attrs,...kids){const el=document.createElement(tag);for(const[k,v]of Object.entries(attrs||{})){if(v==null||v===false)continue;
 if(k==='class')el.className=v;else if(k.startsWith('on'))el.addEventListener(k.slice(2),v);else if(k==='value')el.value=v;else el.setAttribute(k,v===true?'':v);}
 for(const c of kids.flat(Infinity)){if(c==null||c===false)continue;el.append(c instanceof Node?c:document.createTextNode(String(c)));}return el;}

function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function slug(s){return String(s).replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/Ä/g,'Ae').replace(/Ö/g,'Oe').replace(/Ü/g,'Ue').replace(/ß/g,'ss')
 .normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^A-Za-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,40)||'x';}
function pad(n){return String(n).padStart(2,'0');}
function ymd(d){return d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate());}
function hms(d){return pad(d.getHours())+pad(d.getMinutes())+pad(d.getSeconds());}
function fmtDate(iso){const d=new Date(iso);return d.toLocaleDateString({de:'de-CH',en:'en-GB',fr:'fr-CH'}[S.lang]||'de-CH')+' '+pad(d.getHours())+':'+pad(d.getMinutes());}
function toast(msg,err){const el=h('div',{class:'toast'+(err?' err':''),role:'status'},msg);document.body.append(el);setTimeout(()=>el.remove(),err?6000:2600);}
async function sha(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');}
function levelOf(xp){return Math.floor(Math.sqrt((xp||0)/50))+1;}
function xpFor(level){return 50*(level-1)*(level-1);}

const IDB={db:null,
 open(){return new Promise((res,rej)=>{const r=indexedDB.open('lernspiel',2);r.onupgradeneeded=()=>{const d=r.result;for(const s of['kv','files','cache','outbox'])if(!d.objectStoreNames.contains(s))d.createObjectStore(s);};
  r.onsuccess=()=>{const d=r.result;this.db=d;d.onclose=()=>{if(this.db===d)this.db=null;};d.onversionchange=()=>{d.close();if(this.db===d)this.db=null;};res();};
  r.onerror=()=>rej(r.error);r.onblocked=()=>rej(new Error('IndexedDB blocked'));});},
 /* Safari may close the connection (e.g. after a redirect or when the tab was in the background): reopen and retry once */
 async tx(store,mode,fn,retry){if(!this.db)await this.open();
  try{return await new Promise((res,rej)=>{const tr=this.db.transaction(store,mode);const req=fn(tr.objectStore(store));tr.oncomplete=()=>res(req&&req.result);tr.onerror=()=>rej(tr.error);tr.onabort=()=>rej(tr.error||new Error('IndexedDB aborted'));});}
  catch(e){retry=retry||0;const closing=e&&(e.name==='InvalidStateError'||e.name==='UnknownError'||/closing|closed|connection|lost/i.test(e.message||''));
   if(!closing||retry>=2)throw e;try{this.db&&this.db.close();}catch(_){}this.db=null;await new Promise(r=>setTimeout(r,150*(retry+1)));await this.open();return this.tx(store,mode,fn,retry+1);}},
 /* small settings (login tokens, language, API key) live in localStorage, which Safari keeps reliably; IndexedDB is only the fallback */
 lsKey(k){return'lernspiel:'+k;},lsOk(v){return v==null||['string','number','boolean'].includes(typeof v)||Array.isArray(v)||(typeof v==='object'&&Object.getPrototypeOf(v)===Object.prototype);},
 async get(s,k){if(s==='kv'){try{const x=localStorage.getItem(this.lsKey(k));if(x!==null)return JSON.parse(x);}catch(_){}
   try{return await this.tx(s,'readonly',o=>o.get(k));}catch(e){console.warn('IDB get',k,e);return undefined;}}
  if(s==='cache'){try{return await this.tx(s,'readonly',o=>o.get(k));}catch(e){console.warn('IDB cache',e);return undefined;}}
  return this.tx(s,'readonly',o=>o.get(k));},
 async set(s,k,v){if(s==='kv'&&this.lsOk(v)){try{localStorage.setItem(this.lsKey(k),JSON.stringify(v));try{await this.tx(s,'readwrite',o=>o.delete(k));}catch(_){}return;}catch(_){}}
  if(s==='cache'){try{return await this.tx(s,'readwrite',o=>o.put(v,k));}catch(e){console.warn('IDB cache',e);return;}}
  return this.tx(s,'readwrite',o=>o.put(v,k));},
 async del(s,k){if(s==='kv'){try{localStorage.removeItem(this.lsKey(k));}catch(_){}try{await this.tx(s,'readwrite',o=>o.delete(k));}catch(e){console.warn('IDB del',e);}return;}
  return this.tx(s,'readwrite',o=>o.delete(k));},
 keys(s){return this.tx(s,'readonly',o=>o.getAllKeys());}};
class IdbStore{constructor(){this.kind='browser';this.name=t('browserStorage');}
 async read(p){const v=await IDB.get('files',p);return v===undefined?null:JSON.parse(v);}
 async write(p,o){await IDB.set('files',p,JSON.stringify(o,null,2));}
 async list(dir){const ks=await IDB.keys('files');const pre=dir.replace(/\/?$/,'/');return ks.filter(k=>k.startsWith(pre)&&!k.slice(pre.length).includes('/')).map(k=>k.slice(pre.length));}
 async remove(p){await IDB.del('files',p);}
 async readBlob(p){const v=await IDB.get('files',p);return v instanceof Blob?v:null;}
 async writeBlob(p,b){await IDB.set('files',p,b);}
 async removeDir(p){const pre=p.replace(/\/?$/,'/');for(const k of await IDB.keys('files'))if(k.startsWith(pre))await IDB.del('files',k);}}
class FolderStore{constructor(hd){this.root=hd;this.kind='folder';this.name=hd.name;}
 async dir(parts,create){let d=this.root;for(const p of parts)d=await d.getDirectoryHandle(p,{create});return d;}
 split(p){const parts=p.split('/');const f=parts.pop();return[parts,f];}
 async read(p){try{const[ps,f]=this.split(p);const d=await this.dir(ps,false);const fh=await d.getFileHandle(f);return JSON.parse(await(await fh.getFile()).text());}
  catch(e){if(e.name==='NotFoundError'||e.name==='TypeMismatchError')return null;throw e;}}
 async write(p,o){const[ps,f]=this.split(p);const d=await this.dir(ps,true);const fh=await d.getFileHandle(f,{create:true});const w=await fh.createWritable();await w.write(JSON.stringify(o,null,2));await w.close();}
 async list(dir){try{const d=await this.dir(dir.split('/').filter(Boolean),false);const out=[];for await(const[n,hd]of d.entries()){if(hd.kind==='file')out.push(n);}return out;}
  catch(e){if(e.name==='NotFoundError')return[];throw e;}}
 async remove(p){const[ps,f]=this.split(p);const d=await this.dir(ps,false);await d.removeEntry(f);}
 async readBlob(p){try{const[ps,f]=this.split(p);const d=await this.dir(ps,false);return await(await d.getFileHandle(f)).getFile();}catch(e){if(e.name==='NotFoundError'||e.name==='TypeMismatchError')return null;throw e;}}
 async writeBlob(p,b){const[ps,f]=this.split(p);const d=await this.dir(ps,true);const fh=await d.getFileHandle(f,{create:true});const w=await fh.createWritable();await w.write(b);await w.close();}
 async removeDir(p){try{const parts=p.split('/');const n=parts.pop();const d=await this.dir(parts,false);await d.removeEntry(n,{recursive:true});}catch(e){}}}
async function copyAll(a,b){for(const f of['config.json','profiles.json']){const v=await a.read(f);if(v)await b.write(f,v);}
 for(const d of['games','mastery','logs'])for(const n of await a.list(d)){const v=await a.read(d+'/'+n);if(v)await b.write(d+'/'+n,v);}
 if(a.readBlob&&b.writeBlob)for(const n of await a.list('games')){const g=await a.read('games/'+n);
  for(const it of(g&&g.items)||[])if(it.image&&it.image.path){const bl=await a.readBlob(it.image.path);if(bl)await b.writeBlob(it.image.path,bl);}}}

async function pool(items,n,fn){let i=0;await Promise.all(Array.from({length:Math.min(n,items.length)},async()=>{while(i<items.length){const k=i++;await fn(items[k]);}}));}
function uniqLogs(){const seen=new Set();return Object.values(S.logMap||{}).filter(l=>l&&l.id&&!seen.has(l.id)&&seen.add(l.id));}
async function syncLogs(){
 S.logMap=S.logMap||{};const dbx=S.store.kind==='dropbox';
 const names=(await S.store.list('logs')).filter(n=>n.endsWith('.json')&&!S.logMap[n]);
 await pool(names,6,async n=>{let l=null;

function blankState(){return{xp:0,answers:0,correct:0,runs:0,badges:[],unlocks:{},mastery:{}};}
function st(pid){return(S.state&&S.state[pid])||blankState();}
function computeState(){S.state={};for(const p of S.profiles)S.state[p.id]=blankState();
 for(const l of uniqLogs().sort((a,b)=>String(a.started).localeCompare(String(b.started))))applyLog(S.state,l);}
function applyLog(state,l){
 const out={};const game=S.games.find(g=>g.id===(l.game&&l.game.id));
 for(const pl of l.players||[]){const s=state[pl.id];if(!s)continue;
  const prof=S.profiles.find(p=>p.id===pl.id);if(prof&&prof.resetAt&&String(l.started)<prof.resetAt)continue;
  const r={newBadges:[],unlocked:[],levelBefore:levelOf(s.xp)};
  const gm=(s.mastery[l.game.id]=s.mastery[l.game.id]||{});
  for(const a of l.answers||[]){if(a.player!==pl.id||a.joke)continue;const m=gm[a.itemId]||{box:0,seen:0,right:0};m.seen++;
   if(a.correct&&!a.second){m.right++;m.box=Math.min(5,m.box+1);}else if(!a.correct)m.box=Math.max(0,m.box-2);gm[a.itemId]=m;}
  s.xp+=pl.score||0;s.answers+=pl.answered||0;s.correct+=pl.correct||0;s.runs++;
  const acc=pl.answered?pl.correct/pl.answered:0;
  const give=id=>{if(!s.badges.includes(id)){s.badges.push(id);r.newBadges.push(id);}};
  give('first_run');
  if(l.mode==='classic'&&!l.aborted&&pl.answered>=5&&pl.correct===pl.answered)give('perfect');
  if((pl.bestStreak||0)>=10)give('streak10');if(s.answers>=100)give('answers100');
  if(l.mode==='survival'&&pl.correct>=20)give('survivor20');if(l.mode==='timed'&&pl.correct>=15)give('speed15');
  if(l.mode==='duel'&&l.winner===pl.id)give('duel_win');if(l.difficulty==='hard'&&pl.answered>=5&&acc>=0.8)give('hard_clear');
  if(game&&gameUnits(game).length&&gameUnits(game).every(id=>gm[id]&&gm[id].box>=3))give('master_game');
  const u=(s.unlocks[l.game.id]=s.unlocks[l.game.id]||{});
  if(pl.answered>=5&&l.difficulty==='easy'&&acc>=0.7&&!u.medium){u.medium=true;r.unlocked.push('medium');}
  if(pl.answered>=5&&l.difficulty==='medium'&&acc>=0.8&&!u.hard){u.hard=true;r.unlocked.push('hard');}
  r.levelAfter=levelOf(s.xp);out[pl.id]=r;}
 return out;
}

 async start(){const v=b64url(crypto.getRandomValues(new Uint8Array(48)));
  const ch=b64url(new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(v))));

  const d=await r.json().catch(()=>({}));if(!r.ok||!d.refresh_token)throw new Error(d.error_description||d.error||('HTTP '+r.status));
  await IDB.set('kv','dbxRefresh',d.refresh_token);await IDB.del('kv','dbxVerifier');this.token=d.access_token;this.exp=Date.now()+((d.expires_in||3600)-60)*1000;},

  const r=await fetch(this.TOKEN_URL,{method:'POST',body:new URLSearchParams({grant_type:'refresh_token',refresh_token:rt,client_id:DBX_KEY})});
  const d=await r.json().catch(()=>({}));if(!r.ok){if(r.status===400||r.status===401)await IDB.del('kv','dbxRefresh');throw new Error('not connected');}
  this.token=d.access_token;this.exp=Date.now()+((d.expires_in||3600)-60)*1000;return this.token;},

  if(!r.ok){const e=new Error((d&&d.error_summary)||txt||('HTTP '+r.status));e.status=r.status;throw e;}return d;},
 async download(path){const r=await this.call('https://content.dropboxapi.com/2/files/download',{method:'POST',headers:{'Dropbox-API-Arg':dbxArg({path})}});
  if(r.status===409)return null;if(!r.ok)throw new Error('HTTP '+r.status+' '+await r.text());return r.text();},

  if(r.status===409)return null;if(!r.ok)throw new Error('HTTP '+r.status+' '+await r.text());return r.blob();},

topic('m1-double',1,1,['Verdoppeln und Halbieren','Doubling and halving','Doubler et partager en deux'],

topic('m1-shapes',1,2,['Formen erkennen','Recognising shapes','Reconnaître les formes'],

topic('m1-position',1,2,['Lage: links, rechts, oben, unten','Position: left, right, above, below','Position : gauche, droite, dessus, dessous'],

 lv=>{const E=shuffle(['🍎','🐸','⭐','🚗','🎈','🐟','🌻','🍌','⚽']);const g=[[0,1,2],[3,4,5],[6,7,8]];const r=ri(0,2),c=ri(0,2);

topic('m1-money',1,3,['Geld bis 20 Franken','Money up to 20 francs','L’argent jusqu’à 20 francs'],

topic('m1-clock',1,3,['Uhr: volle und halbe Stunden','Clock: o’clock and half past','L’heure : heures pile et demies'],

  if(mm===30)wrong.add(clockWords(hh,0));const it=choiceItem(X('Wie spät ist es?','What time is it?','Quelle heure est-il ?'),right,[...wrong].slice(0,3),{fig:()=>figClock(hh,mm).el});

  const longest=L.indexOf(Math.max(...L)),shortest=L.indexOf(Math.min(...L));const askLong=lv===1||Math.random()<.5;const k=askLong?longest:shortest;

topic('m2-div',2,1,['Teilen','Dividing','Diviser'],
 ['Teilen ist die Umkehrung von Mal: 20 : 4 = 5, weil 5 · 4 = 20.','Dividing is the reverse of times: 20 : 4 = 5 because 5 · 4 = 20.','Diviser, c’est l’inverse de multiplier : 20 : 4 = 5 car 5 · 4 = 20.'],['quotient','inverse'],
 lv=>{const b=ri(2,lv===1?5:10),q=ri(1,10);const it=numItem(b*q+' : '+b+' = ?',q);return steps(it,[X('Denke an das Einmaleins mit ','Think of the ','Pense à la table de ')+b+X('.',' times table.','.'),X('Welche Zahl mal ','Which number times ','Quel nombre fois ')+b+X(' ergibt ',' gives ',' donne ')+b*q+'?',q+' · '+b+' = '+b*q+X(', also ',', so ',', donc ')+b*q+' : '+b+' = '+q]);});
topic('m2-evenodd',2,1,['Gerade und ungerade Zahlen','Even and odd numbers','Nombres pairs et impairs'],
 ['Gerade Zahlen kann man in zwei gleiche Hälften teilen. Sie enden auf 0, 2, 4, 6 oder 8.','Even numbers can be split into two equal halves. They end in 0, 2, 4, 6 or 8.','Les nombres pairs se partagent en deux moitiés égales. Ils finissent par 0, 2, 4, 6 ou 8.'],['even','odd'],
 lv=>{const n=ri(1,lv===1?20:lv===2?100:999);const ev=n%2===0;const E=X('gerade','even','pair'),O=X('ungerade','odd','impair');
  const it=choiceItem(X('Ist ','Is ','Le nombre ')+n+X(' gerade oder ungerade?',' even or odd?',' est-il pair ou impair ?'),ev?E:O,[ev?O:E]);return steps(it,[X('Schau nur auf die letzte Ziffer: ','Only look at the last digit: ','Regarde seulement le dernier chiffre : ')+n%10+'.',X('Gerade Zahlen enden auf 0, 2, 4, 6 oder 8.','Even numbers end in 0, 2, 4, 6 or 8.','Les nombres pairs finissent par 0, 2, 4, 6 ou 8.'),ev?E:O]);});
topic('m2-symmetry',2,2,['Symmetrie','Symmetry','Symétrie'],
 ['Eine Figur ist symmetrisch, wenn beide Hälften an der Spiegelachse genau gleich sind, wie in einem Spiegel.','A figure is symmetrical when both halves match exactly at the mirror line, like in a mirror.','Une figure est symétrique quand ses deux moitiés sont identiques de part et d’autre de l’axe, comme dans un miroir.'],['axis','mirror'],
 lv=>{const rows=lv===1?4:5,half=lv===1?2:3,cols=half*2;const f=new Set();while(f.size<(lv===1?3:5))f.add(ri(0,rows-1)+','+ri(0,half-1));
  const target=new Set([...f].map(k=>{const[r,c]=k.split(',').map(Number);return r+','+(cols-1-c);}));
  const it={type:'grid',prompt:X('Male das Spiegelbild auf der rechten Seite.','Draw the mirror image on the right side.','Dessine l’image miroir sur le côté droit.'),rows,cols,filled:[...f],target:[...target],axis:half,answer:X('Spiegelbild','mirror image','image miroir')};
  return steps(it,[X('Die rote Linie ist der Spiegel.','The red line is the mirror.','La ligne rouge est le miroir.'),X('Ein Feld, das 1 Häuschen links vom Spiegel ist, kommt 1 Häuschen rechts davon hin.','A square 1 box left of the mirror goes 1 box right of it.','Une case à 1 carreau à gauche du miroir va à 1 carreau à droite.'),X('Gehe Zeile für Zeile vor.','Go row by row.','Procède ligne par ligne.')]);});
topic('m2-solids',2,2,['Körper erkennen','Recognising solids','Reconnaître les solides'],
 ['Körper sind dreidimensional. Ein Würfel hat 6 gleiche quadratische Flächen, eine Kugel hat keine Ecken und Kanten.','Solids are three-dimensional. A cube has 6 equal square faces, a sphere has no corners or edges.','Les solides ont trois dimensions. Un cube a 6 faces carrées identiques, une boule n’a ni sommet ni arête.'],['cube','cuboid','sphere','cylinder','cone','pyramid','edge','face'],
 lv=>{const ks=Object.keys(SOLIDS);const k=pick(ks);const it=choiceItem(X('Wie heisst dieser Körper?','What is this solid called?','Comment s’appelle ce solide ?'),nm3(SOLIDS[k]),shuffle(ks.filter(x=>x!==k)).slice(0,lv===1?2:3).map(x=>nm3(SOLIDS[x])),{fig:()=>figSolid(k)});
  const tip={cube:X('Alle Kanten sind gleich lang.','All edges are the same length.','Toutes les arêtes ont la même longueur.'),cuboid:X('Er hat Ecken und Kanten, aber nicht alle Kanten sind gleich lang.','It has corners and edges, but not all edges are the same length.','Il a des sommets et des arêtes, mais elles n’ont pas toutes la même longueur.'),sphere:X('Keine Ecken, keine Kanten, überall rund.','No corners, no edges, round everywhere.','Pas de sommet, pas d’arête, rond partout.'),cylinder:X('Zwei runde Flächen oben und unten.','Two round faces at top and bottom.','Deux faces rondes en haut et en bas.'),cone:X('Eine runde Fläche und eine Spitze.','One round face and a point.','Une face ronde et une pointe.'),pyramid:X('Dreieckige Seitenflächen treffen sich in einer Spitze.','Triangular faces meet at a point.','Des faces triangulaires se rejoignent en une pointe.')}[k];
  return steps(it,[X('Hat der Körper Ecken? Runde Flächen?','Does the solid have corners? Round faces?','Le solide a-t-il des sommets ? Des faces rondes ?'),tip,nm3(SOLIDS[k])]);});
topic('m2-money',2,3,['Geld: Franken und Rappen','Money: francs and centimes','L’argent : francs et centimes'],
 ['1 Franken = 100 Rappen. Münzen gibt es zu 5, 10, 20 und 50 Rappen und zu 1, 2 und 5 Franken.','1 franc = 100 centimes (Rappen). Coins: 5, 10, 20 and 50 centimes and 1, 2 and 5 francs.','1 franc = 100 centimes. Pièces : 5, 10, 20 et 50 centimes et 1, 2 et 5 francs.'],['franc','rappen'],
 lv=>{if(lv>=2&&Math.random()<.6){const tgt=lv===2?ri(2,20)*50:ri(10,99)*10+(Math.random()<.4?5:0);const it={type:'coins',prompt:X('Lege genau ','Pay exactly ','Paie exactement ')+fmtFr(tgt)+'.',target:tgt,coins:[5,10,20,50,100,200,500,1000],answer:fmtFr(tgt)};
   return steps(it,[X('Lege zuerst die Franken.','First put down the francs.','Pose d’abord les francs.'),X('Dann die Rappen: Wie viele fehlen noch bis ','Then the centimes: how many are still missing to ','Puis les centimes : combien manque-t-il encore pour ')+fmtFr(tgt)+'?',fmtFr(tgt)]);}
  const list=[];let sum=0;for(let k=0;k<ri(3,5);k++){const v=pick([10,20,50,100,200]);list.push(v);sum+=v;}list.sort((a,b)=>b-a);
  const it=numItem(X('Wie viele Rappen sind das zusammen?','How many centimes is that altogether?','Combien de centimes cela fait-il en tout ?'),sum,{fig:()=>figCoins(list)});
  return steps(it,[X('1 Franken sind 100 Rappen, 2 Franken sind 200 Rappen.','1 franc is 100 centimes, 2 francs are 200 centimes.','1 franc vaut 100 centimes, 2 francs valent 200 centimes.'),X('Zähle vom grössten Wert aus: ','Count from the biggest value: ','Compte à partir de la plus grande valeur : ')+list.join(' + ')+'.',list.join(' + ')+' = '+sum]);});
topic('m2-clock',2,3,['Uhr: Viertelstunden und Minuten','Clock: quarters and minutes','L’heure : quarts d’heure et minutes'],
 ['Eine Stunde hat 60 Minuten. Von einer Zahl zur nächsten auf dem Zifferblatt sind es 5 Minuten.','An hour has 60 minutes. From one number to the next on the clock face is 5 minutes.','Une heure a 60 minutes. D’un nombre au suivant sur le cadran, il y a 5 minutes.'],['hour','minute'],
 lv=>{const hh=ri(1,12),mm=lv===1?pick([0,15,30,45]):ri(0,11)*5;
  if(lv>=2&&Math.random()<.5){const it={type:'clockset',prompt:X('Stelle die Uhr auf ','Set the clock to ','Règle l’horloge sur ')+hh+':'+pad(mm)+'.',th:hh,tm:mm,step:5,answer:hh+':'+pad(mm)};
   return steps(it,[X('Stelle zuerst den langen Minutenzeiger: ','First set the long minute hand: ','Règle d’abord la grande aiguille : ')+mm+X(' Minuten',' minutes',' minutes')+(mm?X(' = Zahl ',' = number ',' = chiffre ')+mm/5:'')+'.',X('Der kurze Zeiger zeigt die Stunde ','The short hand shows the hour ','La petite aiguille montre l’heure ')+hh+'.',hh+':'+pad(mm)]);}
  const it=numItem(X('Wie spät ist es? (Stunden : Minuten)','What time is it? (hours : minutes)','Quelle heure est-il ? (heures : minutes)'),0,{fig:()=>figClock(hh,mm).el,fields:[{label:'h',ans:hh},{label:'min',ans:mm}],answer:hh+':'+pad(mm)});
  return steps(it,[X('Der lange Zeiger zeigt auf die ','The long hand points to ','La grande aiguille pointe vers le ')+(mm/5||12)+'. '+X('Rechne ','Work out ','Calcule ')+(mm/5||12)+' · 5.',X('Der kurze Zeiger ist ','The short hand is ','La petite aiguille est ')+(mm?X('nach der ','past ','après le ')+hh:X('auf der ','on ','sur le ')+hh)+'.',hh+':'+pad(mm)]);});
topic('m2-measure',2,3,['Messen mit dem Massstab','Measuring with a ruler','Mesurer avec la règle'],
 ['Lege das Lineal bei 0 an, nicht beim Rand. Dann liest du ab, wo das Ende ist. 1 m = 100 cm.','Put the ruler at 0, not at its edge. Then read where the end is. 1 m = 100 cm.','Place la règle au 0, pas au bord. Puis lis où se trouve la fin. 1 m = 100 cm.'],['cm','m'],

  const L=lv===1?ri(2,14)*10:ri(15,145);const cm=L/10;const it=numItem(X('Wie lang ist der rote Streifen? (in cm)','How long is the red strip? (in cm)','Quelle est la longueur de la bande rouge ? (en cm)'),cm,{fig:()=>figRuler(L),keys:lv===1?'':','});

topic('m2-timeunits',2,3,['Zeiteinheiten','Units of time','Unités de temps'],
 ['1 Stunde = 60 Minuten, 1 Tag = 24 Stunden, 1 Woche = 7 Tage, 1 Jahr = 12 Monate.','1 hour = 60 minutes, 1 day = 24 hours, 1 week = 7 days, 1 year = 12 months.','1 heure = 60 minutes, 1 jour = 24 heures, 1 semaine = 7 jours, 1 an = 12 mois.'],['hour','minute'],
 lv=>{const Q=[[X('Wie viele Minuten hat eine Stunde?','How many minutes are in an hour?','Combien de minutes y a-t-il dans une heure ?'),60],[X('Wie viele Tage hat eine Woche?','How many days are in a week?','Combien de jours y a-t-il dans une semaine ?'),7],[X('Wie viele Monate hat ein Jahr?','How many months are in a year?','Combien de mois y a-t-il dans une année ?'),12],[X('Wie viele Stunden hat ein Tag?','How many hours are in a day?','Combien d’heures y a-t-il dans une journée ?'),24]];
  if(lv>=2){const k=ri(2,lv===2?3:6);Q.push([k+X(' Wochen sind wie viele Tage?',' weeks are how many days?',' semaines font combien de jours ?'),7*k],[k+X(' Stunden sind wie viele Minuten?',' hours are how many minutes?',' heures font combien de minutes ?'),60*k],[X('Eine halbe Stunde sind wie viele Minuten?','Half an hour is how many minutes?','Une demi-heure, c’est combien de minutes ?'),30]);}
  const q=pick(Q);const it=numItem(q[0],q[1]);return steps(it,[X('Erinnere dich: 1 Stunde = 60 Minuten, 1 Woche = 7 Tage.','Remember: 1 hour = 60 minutes, 1 week = 7 days.','Rappelle-toi : 1 heure = 60 minutes, 1 semaine = 7 jours.'),X('Musst du etwas mehrmals nehmen? Dann rechne mal.','Do you need something several times? Then multiply.','Faut-il prendre quelque chose plusieurs fois ? Alors multiplie.'),String(q[1])]);});
topic('m2-data',2,3,['Strichlisten und Diagramme','Tally charts and bar charts','Tableaux à traits et diagrammes'],
 ['In einer Strichliste steht jeder Strich für 1, der Querstrich macht ein Fünferbündel. Im Säulendiagramm zeigt die Höhe der Säule die Anzahl.','In a tally chart each mark is 1; the crossing line makes a bundle of five. In a bar chart the height shows the number.','Dans un tableau à traits, chaque trait vaut 1 ; le trait en travers fait un paquet de cinq. Dans un diagramme en barres, la hauteur montre le nombre.'],['tally','barchart'],
 lv=>{const fr=shuffle(FRUIT).slice(0,lv===1?3:4);const rows=fr.map(f=>({label:nm3(f),v:ri(2,lv===1?9:14)}));const tally=lv===1||Math.random()<.5;
  const a=ri(0,rows.length-1);let b=ri(0,rows.length-1);if(b===a)b=(a+1)%rows.length;
  let q,val,st;if(lv===1){q=X('Wie viele ','How many ','Combien de ')+rows[a].label+'?';val=rows[a].v;st=[X('Suche die Zeile ','Find the row ','Cherche la ligne ')+rows[a].label+'.',X('Zähle die Fünferbündel zuerst.','Count the bundles of five first.','Compte d’abord les paquets de cinq.'),String(val)];}
  else if(Math.random()<.5){q=X('Wie viele ','How many ','Combien de ')+rows[a].label+X(' und ',' and ',' et de ')+rows[b].label+X(' sind es zusammen?',' are there altogether?',' y a-t-il en tout ?');val=rows[a].v+rows[b].v;st=[rows[a].label+': '+rows[a].v+'.',rows[b].label+': '+rows[b].v+'.',rows[a].v+' + '+rows[b].v+' = '+val];}
  else{const hi=rows[a].v>=rows[b].v?a:b,lo=hi===a?b:a;q=X('Wie viele ','How many ','Combien de ')+rows[hi].label+X(' mehr als ',' more than ',' de plus que de ')+rows[lo].label+'?';val=rows[hi].v-rows[lo].v;st=[rows[hi].label+': '+rows[hi].v+', '+rows[lo].label+': '+rows[lo].v+'.',X('«Wie viele mehr» heisst: Unterschied rechnen, also minus.','“How many more” means finding the difference: subtract.','« Combien de plus » veut dire calculer la différence : soustraire.'),rows[hi].v+' − '+rows[lo].v+' = '+val];}
  const it=numItem(q,val,{fig:()=>tally?figTally(rows):figBars(rows,lv===1?1:2)});return steps(it,st);});

topic('m3-placevalue',3,1,['Zahlen bis 1000: Stellenwerte','Numbers to 1000: place value','Nombres jusqu’à 1000 : valeur de position'],
 ['Eine dreistellige Zahl hat Hunderter, Zehner und Einer: 358 = 3 H + 5 Z + 8 E.','A three-digit number has hundreds, tens and ones: 358 = 3 H + 5 T + 8 O.','Un nombre à trois chiffres a des centaines, des dizaines et des unités : 358 = 3 c + 5 d + 8 u.'],['hundreds','tens','ones','placevalue'],
 lv=>{const H1=ri(1,9),Z=ri(0,9),E=ri(0,9),n=100*H1+10*Z+E;const r=Math.random();
  if(r<.33){const it={type:'build',prompt:X('Lege die Zahl ','Build the number ','Construis le nombre ')+n+'.',target:n,places:3,answer:String(n)};return steps(it,[X('Beginne mit den Hundertern: ','Start with the hundreds: ','Commence par les centaines : ')+H1+'.',X('Dann ','Then ','Puis ')+Z+X(' Zehner und ',' tens and ',' dizaines et ')+E+X(' Einer.',' ones.',' unités.'),H1+' H '+Z+' Z '+E+' E']);}
  if(r<.66){const it=numItem(H1+X(' Hunderter, ',' hundreds, ',' centaines, ')+Z+X(' Zehner und ',' tens and ',' dizaines et ')+E+X(' Einer = ?',' ones = ?',' unités = ?'),n);return steps(it,[H1+X(' Hunderter = ',' hundreds = ',' centaines = ')+100*H1+'.',Z+X(' Zehner = ',' tens = ',' dizaines = ')+10*Z+'.',100*H1+' + '+10*Z+' + '+E+' = '+n]);}
  const place=pick([['Hunderter','hundreds','centaines',H1],['Zehner','tens','dizaines',Z],['Einer','ones','unités',E]]);const it=numItem(X('Wie viele '+place[0]+' hat '+n+'?','How many '+place[1]+' does '+n+' have?','Combien de '+place[2]+' le nombre '+n+' a-t-il ?'),place[3]);
  return steps(it,[X('Von links: Hunderter, Zehner, Einer.','From the left: hundreds, tens, ones.','De gauche à droite : centaines, dizaines, unités.'),X('Suche die richtige Stelle in ','Find the right place in ','Trouve la bonne position dans ')+n+'.',String(place[3])]);});
topic('m3-numline1000',3,1,['Zahlenstrahl bis 1000','Number line to 1000','Droite numérique jusqu’à 1000'],
 ['Zwischen 0 und 1000 helfen die Hunderter als Orientierung. 500 liegt in der Mitte.','Between 0 and 1000 the hundreds help you find your way. 500 is in the middle.','Entre 0 et 1000, les centaines servent de repères. 500 est au milieu.'],['numberline'],
 lv=>{const n=lv===1?ri(1,9)*100:lv===2?ri(1,99)*10:ri(5,195)*5;const it={type:'numline',prompt:X('Tippe auf die Zahl ','Tap the number ','Touche le nombre ')+n+'.',target:n,tol:lv===1?20:lv===2?10:10,answer:String(n),nl:{a:0,b:1000,minor:lv===1?100:50,labelEvery:lv===3?500:100,mid:lv===3?100:null,snap:lv===1?100:5}};
  return steps(it,[X('Suche zuerst den Hunderter: ','First find the hundred: ','Cherche d’abord la centaine : ')+(n-n%100)+'.',n%100?X('Gehe von dort noch ','From there go ','De là, avance encore de ')+n%100+X(' weiter. 50 ist die Hälfte bis zum nächsten Hunderter.',' further. 50 is halfway to the next hundred.','. 50, c’est la moitié jusqu’à la centaine suivante.'):X('Die Zahl ist genau ein Hunderter.','The number is exactly a hundred.','Le nombre est exactement une centaine.'),String(n)]);});
topic('m3-order',3,1,['Zahlen ordnen','Ordering numbers','Ranger des nombres'],
 ['Vergleiche zuerst die Hunderter. Sind sie gleich, vergleiche die Zehner, dann die Einer.','Compare the hundreds first. If they are equal, compare the tens, then the ones.','Compare d’abord les centaines. Si elles sont égales, compare les dizaines, puis les unités.'],['placevalue'],

topic('m3-round',3,1,['Runden','Rounding','Arrondir'],
 ['Beim Runden schaust du auf die Stelle rechts davon: 0 bis 4 abrunden, 5 bis 9 aufrunden. 347 ≈ 350 (Zehner), 347 ≈ 300 (Hunderter).','When rounding, look at the digit to the right: 0 to 4 round down, 5 to 9 round up. 347 ≈ 350 (tens), 347 ≈ 300 (hundreds).','Pour arrondir, regarde le chiffre à droite : de 0 à 4 on arrondit en dessous, de 5 à 9 au-dessus. 347 ≈ 350 (dizaine), 347 ≈ 300 (centaine).'],['round'],

topic('m3-addsub1000',3,1,['Plus und Minus bis 1000','Adding and subtracting to 1000','Additions et soustractions jusqu’à 1000'],
 ['Zerlege die zweite Zahl in Hunderter, Zehner und Einer und rechne Schritt für Schritt: 456 + 237 = 456 + 200 + 30 + 7.','Split the second number into hundreds, tens and ones and go step by step: 456 + 237 = 456 + 200 + 30 + 7.','Décompose le deuxième nombre en centaines, dizaines et unités et avance pas à pas : 456 + 237 = 456 + 200 + 30 + 7.'],['sum','difference'],
 lv=>{const plus=Math.random()<.5;let a,b;if(lv===1){a=ri(1,8)*100+ri(0,9)*10;b=ri(1,9-Math.floor(a/100))*100;if(!plus){a=ri(3,9)*100+ri(0,9)*10;b=ri(1,Math.floor(a/100)-1)*100;}}

topic('m3-written',3,1,['Schriftlich addieren und subtrahieren','Written addition and subtraction','Addition et soustraction posées'],
 ['Schreibe die Zahlen stellengerecht untereinander: Einer unter Einer. Rechne von rechts nach links und notiere den Übertrag.','Write the numbers in columns: ones under ones. Work from right to left and carry over.','Écris les nombres en colonnes : unités sous unités. Calcule de droite à gauche et note la retenue.'],['carry'],
 lv=>{const plus=Math.random()<.5;let a,b;if(plus){a=ri(lv===1?100:200,lv===1?499:799);b=ri(100,999-a);}else{a=ri(400,999);b=ri(101,a-10);}
  const op=plus?'+':'−';const res=plus?a+b:a-b;const it=numItem(X('Rechne schriftlich.','Work it out in columns.','Pose le calcul.'),res,{fig:()=>figColumns(a,b,op)});

topic('m3-mult',3,1,['Multiplizieren','Multiplying','Multiplier'],
 ['Mit Zehnerzahlen rechnest du wie im Einmaleins und hängst eine 0 an: 4 · 30 = 4 · 3 · 10 = 120.','With tens you use the times table and add a 0: 4 · 30 = 4 · 3 · 10 = 120.','Avec des dizaines, utilise les tables et ajoute un 0 : 4 · 30 = 4 · 3 · 10 = 120.'],['product','factor'],
 lv=>{const a=ri(2,9);if(lv===1){const b=ri(2,10);const it=numItem(a+' · '+b+' = ?',a*b);return steps(it,[X('Nutze eine Kernaufgabe: ','Use a key fact: ','Utilise un calcul clé : ')+'5 · '+b+' = '+5*b+'.',(a>5?'+ ':'− ')+Math.abs(a-5)+' · '+b+'.',a+' · '+b+' = '+a*b]);}
  if(lv===2){const b=ri(2,9)*10;const it=numItem(a+' · '+b+' = ?',a*b);return steps(it,[a+' · '+b+' = '+a+' · '+b/10+' · 10.',a+' · '+b/10+' = '+a*b/10+'.',a*b/10+' · 10 = '+a*b]);}
  const b=ri(12,19);const it=numItem(a+' · '+b+' = ?',a*b);return steps(it,[X('Zerlege ','Split ','Décompose ')+b+' = 10 + '+(b-10)+'.',a+' · 10 = '+10*a+', '+a+' · '+(b-10)+' = '+a*(b-10)+'.',10*a+' + '+a*(b-10)+' = '+a*b]);});
topic('m3-divrest',3,1,['Teilen mit Rest','Division with remainder','Division avec reste'],
 ['Nicht jede Zahl lässt sich ohne Rest teilen: 23 : 4 = 5 Rest 3, weil 5 · 4 = 20 und 23 − 20 = 3.','Not every number divides exactly: 23 : 4 = 5 remainder 3, because 5 · 4 = 20 and 23 − 20 = 3.','Tous les nombres ne se divisent pas exactement : 23 : 4 = 5 reste 3, car 5 · 4 = 20 et 23 − 20 = 3.'],['quotient','remainder'],
 lv=>{const b=ri(2,lv===1?5:9),q=ri(2,9),r=ri(lv===1?0:1,b-1),n=b*q+r;
  const it=numItem(n+' : '+b+' = ?',0,{fields:[{label:X('Ergebnis','result','résultat'),ans:q},{label:X('Rest','remainder','reste'),ans:r}],answer:q+' '+X('Rest','R','reste')+' '+r});
  return steps(it,[X('Welche Zahl aus der ','Which number in the ','Quel nombre de la table de ')+b+X('er-Reihe ist am nächsten unter ',' times table is just below ',' est juste en dessous de ')+n+'?',q+' · '+b+' = '+q*b+'. '+X('Wie viel fehlt bis ','How much is left to ','Combien reste-t-il jusqu’à ')+n+'?',n+' : '+b+' = '+q+' '+X('Rest','remainder','reste')+' '+r]);});
topic('m3-missing',3,1,['Platzhalter und Umkehraufgaben','Missing numbers and inverse operations','Nombres manquants et opérations inverses'],
 ['Eine Umkehraufgabe hilft: Ist ? + 45 = 120, dann rechnest du 120 − 45. Ist 3 · ? = 24, dann rechnest du 24 : 3.','An inverse operation helps: if ? + 45 = 120, work out 120 − 45. If 3 · ? = 24, work out 24 : 3.','L’opération inverse aide : si ? + 45 = 120, calcule 120 − 45. Si 3 · ? = 24, calcule 24 : 3.'],['inverse'],
 lv=>{const k=ri(0,lv===1?1:3);let q,v,inv;if(k===0){const a=ri(20,400),b=ri(20,500);q='? + '+b+' = '+(a+b);v=a;inv=(a+b)+' − '+b;}else if(k===1){const a=ri(100,900),b=ri(10,a-10);q=a+' − ? = '+(a-b);v=b;inv=a+' − '+(a-b);}
  else if(k===2){const a=ri(2,9),b=ri(2,10);q=a+' · ? = '+a*b;v=b;inv=a*b+' : '+a;}else{const a=ri(2,9),b=ri(2,10);q='? : '+a+' = '+b;v=a*b;inv=b+' · '+a;}
  const it=numItem(q,v);return steps(it,[X('Welche Umkehraufgabe passt?','Which inverse operation fits?','Quelle opération inverse convient ?'),X('Rechne ','Work out ','Calcule ')+inv+'.',inv+' = '+v]);});
topic('m3-estimate',3,1,['Überschlagen','Estimating','Estimer'],
 ['Beim Überschlag rundest du die Zahlen und rechnest ungefähr: 398 + 205 ≈ 400 + 200 = 600. So kannst du dein Ergebnis prüfen.','To estimate, round the numbers and calculate roughly: 398 + 205 ≈ 400 + 200 = 600. That lets you check your answer.','Pour estimer, arrondis les nombres et calcule à peu près : 398 + 205 ≈ 400 + 200 = 600. Ainsi tu peux vérifier ton résultat.'],['estimate','round'],
 lv=>{const a=ri(1,7)*100+ri(-12,12),b=ri(1,8-Math.round(a/100))*100+ri(-12,12);const plus=lv===1||Math.random()<.6;const A=Math.round(a/100)*100,B=Math.round(b/100)*100;
  const exact=plus?a+b:Math.abs(a-b);const right=plus?A+B:Math.abs(A-B);const ex=plus?a+' + '+b:Math.max(a,b)+' − '+Math.min(a,b);
  const it=choiceItem(X('Ungefähr wie viel ist ','Roughly how much is ','Environ combien font ')+ex+'?',fmtN(right),[fmtN(right+100),fmtN(Math.max(0,right-100)),fmtN(right+1000)].filter(x=>x!==fmtN(right)));
  return steps(it,[X('Runde beide Zahlen auf Hunderter: ','Round both numbers to hundreds: ','Arrondis les deux nombres à la centaine : ')+(plus?A+' + '+B:Math.max(A,B)+' − '+Math.min(A,B))+'.',X('Rechne jetzt mit den runden Zahlen.','Now calculate with the round numbers.','Calcule maintenant avec les nombres ronds.'),'≈ '+right+X(' (genau: ',' (exactly: ',' (exactement : ')+exact+')']);});
topic('m3-word',3,1,['Sachaufgaben','Word problems','Problèmes'],
 ['Lies genau: Was weisst du, was ist gesucht? Schreibe die Rechnung auf und prüfe am Schluss, ob die Antwort passt.','Read carefully: what do you know, what are you looking for? Write the calculation and check that the answer makes sense.','Lis bien : que sais-tu, que cherches-tu ? Écris le calcul et vérifie que la réponse a du sens.'],['sum','difference','product'],
 lv=>{const n=pick(NAMES);const k=ri(0,lv===1?2:6);let q,v,st;
  if(k===0){const a=ri(20,80),b=ri(5,40);q=X(`${n} hat ${a} Sammelbilder und bekommt ${b} dazu. Wie viele sind es jetzt?`,`${n} has ${a} stickers and gets ${b} more. How many are there now?`,`${n} a ${a} images et en reçoit ${b} de plus. Combien en a-t-il maintenant ?`);v=a+b;st=[X('Es kommt etwas dazu: plus.','Something is added: plus.','On ajoute quelque chose : plus.'),a+' + '+b+'.',a+' + '+b+' = '+v];}
  else if(k===1){const a=ri(40,95),b=ri(5,a-5);q=X(`Im Bus sitzen ${a} Personen. ${b} steigen aus. Wie viele sind noch im Bus?`,`There are ${a} people on the bus. ${b} get off. How many are still on the bus?`,`Il y a ${a} personnes dans le bus. ${b} descendent. Combien en reste-t-il ?`);v=a-b;st=[X('Es wird weniger: minus.','It gets fewer: minus.','Il y en a moins : moins.'),a+' − '+b+'.',a+' − '+b+' = '+v];}
  else if(k===2){const kk=ri(2,9),p=ri(2,9);q=X(`${n} kauft ${kk} Hefte zu je ${p} Franken. Wie viele Franken kostet das?`,`${n} buys ${kk} notebooks at ${p} francs each. How many francs does that cost?`,`${n} achète ${kk} cahiers à ${p} francs chacun. Combien de francs cela coûte-t-il ?`);v=kk*p;st=[X('Gleich viel, mehrmals: mal.','The same amount several times: times.','Plusieurs fois la même quantité : fois.'),kk+' · '+p+'.',kk+' · '+p+' = '+v];}
  else if(k===3){const p=ri(12,45);q=X(`Ein Buch kostet ${p} Franken. ${n} bezahlt mit einer 50-Franken-Note. Wie viel Rückgeld gibt es?`,`A book costs ${p} francs. ${n} pays with a 50-franc note. How much change is there?`,`Un livre coûte ${p} francs. ${n} paie avec un billet de 50 francs. Combien lui rend-on ?`);v=50-p;st=[X('Rückgeld = bezahlt − Preis.','Change = paid − price.','Monnaie rendue = payé − prix.'),'50 − '+p+'.','50 − '+p+' = '+v];}
  else if(k===4){const kk=ri(2,8),e=ri(2,9);q=X(`${kk*e} Äpfel werden gleichmässig auf ${kk} Kinder verteilt. Wie viele bekommt jedes Kind?`,`${kk*e} apples are shared equally among ${kk} children. How many does each child get?`,`${kk*e} pommes sont partagées également entre ${kk} enfants. Combien chaque enfant en reçoit-il ?`);v=e;st=[X('Gleichmässig verteilen: geteilt.','Share equally: divide.','Partager également : diviser.'),kk*e+' : '+kk+'.',kk*e+' : '+kk+' = '+e];}
  else if(k===5){const a=ri(3,9),b=ri(2,6);q=X(`Auf einem Bauernhof leben ${a} Hühner und ${b} Kühe. Wie viele Beine haben sie zusammen?`,`On a farm there are ${a} hens and ${b} cows. How many legs do they have altogether?`,`Dans une ferme, il y a ${a} poules et ${b} vaches. Combien de pattes ont-elles en tout ?`);v=2*a+4*b;st=[X('Ein Huhn hat 2 Beine, eine Kuh 4.','A hen has 2 legs, a cow 4.','Une poule a 2 pattes, une vache 4.'),a+' · 2 = '+2*a+', '+b+' · 4 = '+4*b+'.',2*a+' + '+4*b+' = '+v];}
  else{const a=ri(30,80),b=ri(10,40),c=ri(5,a-5);q=X(`Im Bus sitzen ${a} Personen. ${c} steigen aus und ${b} steigen ein. Wie viele sitzen jetzt im Bus?`,`There are ${a} people on the bus. ${c} get off and ${b} get on. How many are on the bus now?`,`Il y a ${a} personnes dans le bus. ${c} descendent et ${b} montent. Combien y en a-t-il maintenant ?`);v=a-c+b;st=[X('Zwei Schritte: zuerst aussteigen, dann einsteigen.','Two steps: first getting off, then getting on.','Deux étapes : d’abord ceux qui descendent, puis ceux qui montent.'),a+' − '+c+' = '+(a-c)+'.',(a-c)+' + '+b+' = '+v];}
  return steps(numItem(q,v),[X('Was weisst du? Was ist gesucht?','What do you know? What are you looking for?','Que sais-tu ? Que cherches-tu ?')].concat(st));});
topic('m3-perimeter',3,2,['Umfang und Fläche auf dem Gitter','Perimeter and area on a grid','Périmètre et aire sur quadrillage'],
 ['Der Umfang ist der Weg rund um die Figur: alle Seiten zusammen. Die Fläche zählst du in Häuschen.','The perimeter is the distance around the shape: all sides together. The area is counted in squares.','Le périmètre est le tour de la figure : tous les côtés ensemble. L’aire se compte en carreaux.'],['perimeter','area'],
 lv=>{const w=ri(2,7),hh=ri(2,5);const area=lv===3&&Math.random()<.5;
  const it=numItem(area?X('Wie viele Häuschen gross ist das Rechteck?','How many squares does the rectangle cover?','Combien de carreaux le rectangle couvre-t-il ?'):X('Wie lang ist der Umfang? (1 Häuschen = 1 cm)','How long is the perimeter? (1 square = 1 cm)','Quel est le périmètre ? (1 carreau = 1 cm)'),area?w*hh:2*(w+hh),{fig:()=>figRectGrid(w,hh,area)});
  return steps(it,area?[X('Zähle, wie viele Häuschen in einer Reihe sind: ','Count the squares in one row: ','Compte les carreaux d’une rangée : ')+w+'.',X('Es gibt ','There are ','Il y a ')+hh+X(' Reihen.',' rows.',' rangées.'),hh+' · '+w+' = '+w*hh]:[X('Das Rechteck ist ','The rectangle is ','Le rectangle mesure ')+w+X(' cm lang und ',' cm long and ',' cm de long et ')+hh+X(' cm breit.',' cm wide.',' cm de large.'),X('Gehe einmal ganz herum: ','Go all the way round: ','Fais tout le tour : ')+[w,hh,w,hh].join(' + ')+'.',[w,hh,w,hh].join(' + ')+' = '+2*(w+hh)+' cm']);});
topic('m3-angles',3,2,['Rechte Winkel','Right angles','Angles droits'],
 ['Ein rechter Winkel sieht aus wie die Ecke eines Blatts Papier. Du kannst ihn mit einem gefalteten Papier prüfen.','A right angle looks like the corner of a sheet of paper. You can check it with a folded piece of paper.','Un angle droit ressemble au coin d’une feuille de papier. Tu peux le vérifier avec un papier plié.'],['rightangle'],
 lv=>{const kinds=shuffle(['right','acute','obtuse']);const k=kinds.indexOf('right');const L=['A','B','C'];
  const it=choiceItem(X('Welcher Winkel ist ein rechter Winkel?','Which angle is a right angle?','Quel angle est un angle droit ?'),L[k],L.filter((x,i)=>i!==k),{fig:()=>figAngles(kinds)});
  return steps(it,[X('Ein rechter Winkel ist wie die Ecke eines Blatts.','A right angle is like the corner of a sheet of paper.','Un angle droit est comme le coin d’une feuille.'),X('Ein Schenkel steht genau senkrecht auf dem anderen.','One arm stands exactly upright on the other.','Un côté est exactement perpendiculaire à l’autre.'),L[k]]);});
topic('m3-mirror',3,2,['Spiegeln auf dem Gitter','Reflecting on a grid','Symétrie sur quadrillage'],
 ['Beim Spiegeln bleibt jedes Feld gleich weit von der Spiegelachse entfernt, nur auf der anderen Seite.','When reflecting, every square stays the same distance from the mirror line, just on the other side.','Dans une symétrie, chaque case reste à la même distance de l’axe, mais de l’autre côté.'],['axis','mirror'],
 lv=>{const rows=lv===1?5:6,half=lv===1?3:4,cols=half*2;const f=new Set();const n=lv===1?4:lv===2?6:8;while(f.size<n)f.add(ri(0,rows-1)+','+ri(0,half-1));
  const target=new Set([...f].map(k=>{const[r,c]=k.split(',').map(Number);return r+','+(cols-1-c);}));
  const it={type:'grid',prompt:X('Spiegle die Figur an der roten Linie.','Reflect the shape in the red line.','Trace le symétrique de la figure par rapport à la ligne rouge.'),rows,cols,filled:[...f],target:[...target],axis:half,answer:X('Spiegelbild','mirror image','image miroir')};
  return steps(it,[X('Beginne mit dem Feld, das am nächsten an der Linie ist.','Start with the square closest to the line.','Commence par la case la plus proche de la ligne.'),X('Zähle die Häuschen bis zur Linie und gleich viele auf der anderen Seite.','Count the squares to the line and the same number on the other side.','Compte les carreaux jusqu’à la ligne et autant de l’autre côté.'),X('Prüfe jede Zeile.','Check every row.','Vérifie chaque ligne.')]);});
topic('m3-length',3,3,['Längen umrechnen','Converting lengths','Convertir des longueurs'],
 ['1 km = 1000 m, 1 m = 10 dm = 100 cm, 1 cm = 10 mm.','1 km = 1000 m, 1 m = 10 dm = 100 cm, 1 cm = 10 mm.','1 km = 1000 m, 1 m = 10 dm = 100 cm, 1 cm = 10 mm.'],['m','cm','mm','km'],
 lv=>{const P=lv===1?[['m','cm',100],['cm','mm',10]]:lv===2?[['m','cm',100],['cm','mm',10],['km','m',1000],['m','dm',10],['dm','cm',10]]:[['m','cm',100],['km','m',1000],['cm','mm',10],['m','mm',1000]];
  const[u1,u2,f]=pick(P);const back=lv>=2&&Math.random()<.5;const k=ri(1,9)*(back?1:1);let q,v;if(back){q=k*f+' '+u2+' = ? '+u1;v=k;}else{q=k+' '+u1+' = ? '+u2;v=k*f;}
  return steps(numItem(q,v),['1 '+u1+' = '+f+' '+u2+'.',back?X('Wie oft passt ','How many times does ','Combien de fois ')+f+X(' in ',' go into ',' dans ')+k*f+'?':k+' · '+f+'.',q.replace('?',String(v))]);});
topic('m3-mass',3,3,['Gewicht: kg und g','Mass: kg and g','Masse : kg et g'],
 ['1 kg = 1000 g. Ein halbes Kilogramm sind 500 g.','1 kg = 1000 g. Half a kilogram is 500 g.','1 kg = 1000 g. Un demi-kilo, c’est 500 g.'],['kg','g'],
 lv=>{if(lv===1||Math.random()<.5){const k=ri(1,9);const back=Math.random()<.5;const it=numItem(back?k*1000+' g = ? kg':k+' kg = ? g',back?k:k*1000);return steps(it,['1 kg = 1000 g.',back?k*1000+' : 1000.':k+' · 1000.',back?String(k):String(k*1000)]);}
  const a=ri(1,9)*100,b=ri(1,9)*100;const it=numItem(a+' g + '+b+' g = ? g',a+b);return steps(it,[X('Beide sind in Gramm.','Both are in grams.','Les deux sont en grammes.'),a+' + '+b+'.',(a+b)+' g']);});
topic('m3-capacity',3,3,['Hohlmasse: l, dl, ml','Capacity: l, dl, ml','Contenances : l, dl, ml'],

topic('m3-timespan',3,3,['Uhrzeit und Zeitspannen','Times and time spans','Heures et durées'],
 ['Zeitspannen rechnest du in Schritten: zuerst bis zur vollen Stunde, dann die ganzen Stunden, dann den Rest.','Work out time spans in steps: first to the full hour, then whole hours, then the rest.','Calcule les durées par étapes : d’abord jusqu’à l’heure pile, puis les heures entières, puis le reste.'],['hour','minute'],
 lv=>{if(Math.random()<.4){const hh=ri(1,12),mm=ri(0,59);const it=numItem(X('Wie spät ist es? (Stunden : Minuten)','What time is it? (hours : minutes)','Quelle heure est-il ? (heures : minutes)'),0,{fig:()=>figClock(hh,mm).el,fields:[{label:'h',ans:hh},{label:'min',ans:mm}],answer:hh+':'+pad(mm)});
   return steps(it,[X('Zähle beim langen Zeiger in 5er-Schritten bis zur letzten Zahl, dann einzeln weiter.','For the long hand, count in fives to the last number, then in ones.','Pour la grande aiguille, compte de 5 en 5 jusqu’au dernier chiffre, puis de 1 en 1.'),X('Der kurze Zeiger ist nach der ','The short hand is past ','La petite aiguille a dépassé le ')+hh+'.',hh+':'+pad(mm)]);}
  const h1=ri(7,15),m1=ri(0,11)*5,d=lv===1?pick([30,60,90]):ri(4,30)*5;const tot=h1*60+m1+d;const h2=Math.floor(tot/60),m2=tot%60;const toFull=m1?60-m1:0;
  const it=numItem(X(`Von ${h1}:${pad(m1)} bis ${h2}:${pad(m2)}. Wie viele Minuten sind das?`,`From ${h1}:${pad(m1)} to ${h2}:${pad(m2)}. How many minutes is that?`,`De ${h1}:${pad(m1)} à ${h2}:${pad(m2)}. Combien de minutes cela fait-il ?`),d);
  return steps(it,[toFull&&toFull<d?X('Bis zur vollen Stunde: ','To the full hour: ','Jusqu’à l’heure pile : ')+toFull+' min.':X('Zähle die ganzen Stunden: 1 h = 60 min.','Count the whole hours: 1 h = 60 min.','Compte les heures entières : 1 h = 60 min.'),X('Dann weiter bis ','Then on to ','Puis jusqu’à ')+h2+':'+pad(m2)+'.',d+' min']);});
topic('m3-change',3,3,['Geld: Rückgeld und Preise','Money: change and prices','L’argent : monnaie et prix'],
 ['Rückgeld = bezahlter Betrag − Preis. Rechne Franken und Rappen getrennt oder alles in Rappen.','Change = amount paid − price. Work out francs and centimes separately, or everything in centimes.','Monnaie rendue = montant payé − prix. Calcule francs et centimes séparément, ou tout en centimes.'],['franc','rappen'],

topic('m3-chance',3,3,['Zufall: sicher, möglich, unmöglich','Chance: certain, possible, impossible','Hasard : certain, possible, impossible'],
 ['Sicher heisst: es passiert immer. Unmöglich heisst: es passiert nie. Möglich heisst: es kann passieren, muss aber nicht.','Certain means it always happens. Impossible means it never happens. Possible means it can happen, but does not have to.','Certain veut dire que ça arrive toujours. Impossible, que ça n’arrive jamais. Possible, que ça peut arriver, mais pas forcément.'],['certain','possible','impossible'],
 lv=>{const r=pick([0,ri(1,5),ri(1,5)]),b=r===0?ri(3,6):pick([0,ri(1,5)]);const col=Math.random()<.5?'r':'b';const nr=col==='r'?r:b,nt=r+b;
  const C=X('sicher','certain','certain'),P=X('möglich','possible','possible'),I=X('unmöglich','impossible','impossible');const right=nr===0?I:nr===nt?C:P;
  const it=choiceItem(X('Du ziehst ohne hinzuschauen eine Kugel. Sie ist ','Without looking, you draw a marble. It is ','Sans regarder, tu tires une bille. Elle est ')+(col==='r'?X('rot','red','rouge'):X('blau','blue','bleue'))+X('. Ist das sicher, möglich oder unmöglich?','. Is that certain, possible or impossible?','. Est-ce certain, possible ou impossible ?'),right,[C,P,I].filter(x=>x!==right),{fig:()=>figMarbles(r,b)});
  return steps(it,[X('Zähle die ','Count the ','Compte les billes ')+(col==='r'?X('roten','red','rouges'):X('blauen','blue','bleues'))+X(' Kugeln: ',' marbles: ',' : ')+nr+'.',X('Wie viele Kugeln sind es insgesamt? ','How many marbles are there in total? ','Combien y a-t-il de billes en tout ? ')+nt+'.',right]);});
topic('m3-combi',3,3,['Kombinieren','Combinations','Combinaisons'],
 ['Wenn du jedes Teil mit jedem kombinierst, rechnest du mal: 3 T-Shirts und 2 Hosen ergeben 3 · 2 = 6 Möglichkeiten.','If you combine every item with every other, multiply: 3 T-shirts and 2 trousers give 3 · 2 = 6 outfits.','Si tu combines chaque élément avec chaque autre, multiplie : 3 t-shirts et 2 pantalons donnent 3 · 2 = 6 tenues.'],['combination'],

function normTr(it){const tr=it.tr;if(!tr||typeof tr!=='object'){delete it.tr;return;}const o={};
 for(const l of LANGS){const x=tr[l];if(!x||typeof x!=='object'||typeof x.prompt!=='string'||!x.prompt.trim())continue;const y={prompt:x.prompt.trim()};
  if(typeof x.explanation==='string'&&x.explanation.trim())y.explanation=x.explanation.trim();
  if(Array.isArray(it.options)){if(!(Array.isArray(x.options)&&x.options.length===it.options.length&&x.options.every(v=>typeof v==='string'&&v.trim())))continue;y.options=x.options;}
  if(Array.isArray(it.order)){if(!(Array.isArray(x.order)&&x.order.length===it.order.length&&x.order.every(v=>typeof v==='string'&&v.trim())))continue;y.order=x.order;}
  if(typeof x.answer==='string'&&x.answer.trim())y.answer=x.answer.trim();if(Array.isArray(x.hints))y.hints=x.hints.filter(v=>typeof v==='string'&&v.trim());if(Array.isArray(x.accept))y.accept=x.accept.filter(v=>typeof v==='string'&&v.trim());
  o[l]=y;}
 if(Object.keys(o).length)it.tr=o;else delete it.tr;}
function validItem(it){
 if(!it||typeof it.prompt!=='string'||!it.prompt.trim())return false;
 normTr(it);if(it.hints!=null){if(Array.isArray(it.hints))it.hints=it.hints.filter(v=>typeof v==='string'&&v.trim()).slice(0,5);else delete it.hints;}
 it.difficulty=[1,2,3].includes(+it.difficulty)?+it.difficulty:2;
 if(Array.isArray(it.correct))it.correct=it.correct.map(Number);
 const opt=Array.isArray(it.options)&&it.options.length>=2&&it.options.every(o=>typeof o==='string');
 switch(it.type){
  case'single':return opt&&Array.isArray(it.correct)&&it.correct.length===1&&Number.isInteger(it.correct[0])&&it.correct[0]>=0&&it.correct[0]<it.options.length;
  case'multi':return opt&&Array.isArray(it.correct)&&it.correct.length>=1&&it.correct.every(i=>Number.isInteger(i)&&i>=0&&i<it.options.length);
  case'order':return Array.isArray(it.order)&&it.order.length>=2&&it.order.every(o=>typeof o==='string');
  case'input':if(it.accept&&!Array.isArray(it.accept))delete it.accept;return typeof it.answer==='string'&&it.answer.trim().length>0;
  case'map':{const m=it.map;if(!m||typeof m.pack!=='string'||typeof m.target!=='string'||!['tap','choose','name','label','number'].includes(m.task))return false;
   const P=PACKS[m.pack];if(!P)return false;const f=P.byId[m.target];if(!f||f.bg||f.kind==='bg')return false;
   if(m.task==='choose'){let o=(Array.isArray(m.options)?m.options:[]).filter(id=>P.byId[id]&&P.byId[id].layer===f.layer&&!P.byId[id].bg);
    if(!o.includes(f.id))o.unshift(f.id);o=o.filter((v,i,a)=>a.indexOf(v)===i);
    if(o.length<3){const pool=P.layers.find(l=>l.id===f.layer).f.filter(x=>!x.bg&&!o.includes(x.id));while(o.length<4&&pool.length)o.push(pool.splice(Math.floor(Math.random()*pool.length),1)[0].id);}
    m.options=o.slice(0,6);}
   if(m.task==='name'&&!(typeof it.answer==='string'&&it.answer.trim()))it.answer=f.n.de;
   if(m.task==='label'||m.task==='number'){let o=(Array.isArray(m.labels)?m.labels:[]).filter(id=>P.byId[id]&&P.byId[id].layer===f.layer&&!P.byId[id].bg);
    if(!o.includes(f.id))o.unshift(f.id);o=o.filter((v,i,a)=>a.indexOf(v)===i);
    if(o.length<3){const pool=P.layers.find(l=>l.id===f.layer).f.filter(x=>!x.bg&&!o.includes(x.id));while(o.length<4&&pool.length)o.push(pool.splice(Math.floor(Math.random()*pool.length),1)[0].id);}
    m.labels=o.slice(0,12);if(!m.labels.includes(f.id))m.labels[0]=f.id;
    if(m.task==='label'&&!/\{nr\}/.test(it.prompt))it.prompt=t('mapLabelQ');
    if(m.task==='number')it.prompt=it.prompt.replace(/\{nr\}/g,'');
    if(it.tr)for(const l in it.tr){const x=it.tr[l];if(m.task==='label'&&!/\{nr\}/.test(x.prompt))x.prompt=(T[l]||T.en).mapLabelQ;if(m.task==='number')x.prompt=x.prompt.replace(/\{nr\}/g,'');}}
   delete it.figure;delete it._fig;return true;}
  case'spot':return!!((it._fig&&it._fig.spot)||(it.image&&it.image.path&&it.spot&&isFinite(it.spot.x)&&isFinite(it.spot.y)));
  default:return false;}
}

const HEIC_LIBS=[
 {url:'https://cdn.jsdelivr.net/npm/heic-to@1.5.2/dist/iife/heic-to.js',ready:()=>typeof window.HeicTo==='function',
  run:f=>window.HeicTo({blob:f,type:'image/jpeg',quality:0.9})},
 {url:'https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js',ready:()=>typeof window.heic2any==='function',
  run:async f=>{const o=await window.heic2any({blob:f,toType:'image/jpeg',quality:0.9});return Array.isArray(o)?o[0]:o;}}];
function loadScript(url){return new Promise((res,rej)=>{const sc=document.createElement('script');sc.src=url;sc.onload=()=>res();
 sc.onerror=()=>rej(new Error('HEIC converter could not be loaded (internet connection?)'));document.head.append(sc);});}
async function heicToJpeg(file){const errs=[];
 for(const lib of HEIC_LIBS){try{if(!lib.ready())await loadScript(lib.url);const b=await lib.run(file);if(b&&b.size)return b;errs.push('empty result');}
  catch(e){errs.push((e&&(e.message||e.code))||String(e));}}
 throw new Error(file.name+': HEIC conversion failed ('+errs.join(' / ')+')');}
function blobToB64(b){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]);r.onerror=()=>rej(r.error);r.readAsDataURL(b);});}
async function fileToBlock(file){return(await photoFromFile(file)).block;}
async function photoFromFile(file){
 if(file.type==='application/pdf')return{pdf:true,block:{type:'document',source:{type:'base64',media_type:'application/pdf',data:await blobToB64(file)}}};
 let src=file;
 if(/hei[cf]/i.test(file.type)||/\.hei[cf]$/i.test(file.name))src=await heicToJpeg(file);
 const url=URL.createObjectURL(src);
 try{const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error(file.name+': image could not be read (HEIC?)'));i.src=url;});
  const sc=Math.min(1,1568/Math.max(img.naturalWidth,img.naturalHeight));const c=document.createElement('canvas');c.width=Math.round(img.naturalWidth*sc);c.height=Math.round(img.naturalHeight*sc);
  c.getContext('2d').drawImage(img,0,0,c.width,c.height);const dataUrl=c.toDataURL('image/jpeg',0.85);
  return{url:dataUrl,w:c.width,h:c.height,block:{type:'image',source:{type:'base64',media_type:'image/jpeg',data:dataUrl.split(',')[1]}}};}
 finally{URL.revokeObjectURL(url);}
}
const GEN_SYSTEM=`You create quiz questions for a self-contained learning game. The photos or PDFs are only your source of facts: players never see them.
Deliver all questions by calling the save_questions tool once, with every question in "items".
Every question must be answerable without the learning material. Never refer to the material, the worksheet, a page, a figure, a picture, a learning goal ("Lernziel") or to numbers/letters printed in the material.
Each item has: "type" (one of "single","multi","order","input","map"), "prompt", "difficulty" (1 easy, 2 medium, 3 hard), "explanation" (one short sentence explaining the answer).
- single: "options" (3 to 5 strings), "correct" ([index of the one right option]).
- multi: "options" (4 to 6 strings), "correct" ([indices of all right options, at least 2]).
- order: "order" (3 to 6 strings in the correct order); the prompt states the ordering criterion.
- input: "answer" (exact expected answer: one word or a short term, spelled and capitalised exactly as in the material); optional "accept" (other equally correct spellings).
- map: a question on the game's own interactive map, built from the map packs listed in the request. "map": {"pack": pack id, "task", "target": an object id copied exactly from the pack list, plus task fields}. Tasks:
  tap = the player taps the target ("Tippe auf den Kanton Uri").
  choose = the target is highlighted, the player picks its name; "options": 3 to 5 ids from the same layer including the target.
  name = the target is highlighted, the player types its name; give "answer" (the name as written in the material) and optional "accept".
  label = the game draws its own numbers on a set of objects and asks for the name behind one number; "labels": the ids of all objects that belong to the exercise (for example all 7 continents or all oceans that the material numbers or names), target = one of them; write the prompt with the placeholder {nr}, e.g. "Wie heisst der Kontinent mit der Nummer {nr}?".
  number = the game draws its own numbers on "labels" and the player picks the number of the target, e.g. "Welche Nummer hat Australien?".
  The game assigns new random numbers every time, so never use or mention the numbers from the material. The prompt must never contain the answer of choose/name/label tasks. Use only ids from the list.
If the material contains a map (for example a numbered or labelled map), recreate it with map questions (label, number, tap, choose, name) for exactly those places. Never create a question that needs the material's map or pictures.
When map packs are listed, use "map" questions for everything about places: countries, cantons, continents, capitals, cities, rivers, lakes, seas and oceans, mountains, passes, landscapes, monuments and historic sites. Use the other types for facts that do not need a map (e.g. "Welcher Kontinent ist der grösste?").
History map packs (ids starting with "h", e.g. "h07-revolutionen-napoleon") contain one political map per year; their layer ids look like "y1815" or "ym500" (m = BC), object ids like "y1815:austrian-empire". Pick the year layer that matches the time in the material (the nearest available year) and say the year in the prompt, e.g. "Tippe auf das Kaisertum Österreich (1815)". Borders in these maps are simplified and approximate. Their "places" layer holds cities, battles and historic sites.
Country groups (Skandinavien, Nordische Länder, Baltikum, Benelux, Britische Inseln, Iberische Halbinsel) are in the "regions" layer of the world and europe packs.
Jokes: add one extra item per about 10 questions with "joke": true, type "single": a funny, kind, age-appropriate fake question about the topic whose correct option (put it first, the game shuffles) is the joking answer; "explanation" is the punchline. Never make fun of people, countries or groups.

  h('p',{class:'small muted'},t('folderHint')),
  h('button',{class:'btn ghost',onclick:async()=>{const hd=await pickFolder();if(!hd)return;const ns=new FolderStore(hd);
   try{const ex=await ns.read('config.json');if(ex)toast(t('folderExisting'));else{await copyAll(S.store,ns);toast(t('folderMoved'));}
    await IDB.set('kv','dirHandle',hd);await IDB.set('kv','storeMode','folder');S.store=ns;await loadAll();viewAdmin('settings');}catch(e){toast(t('err',{e:e.message}),true);}}},t('chooseFolder')),
  h('h3',{},t('apiKey')),key,h('p',{class:'small muted'},t('apiKeyNote')),
  h('div',{},h('label',{class:'f',for:'am'},t('model')),model,h('p',{class:'small muted'},t('modelNote'))),
  h('button',{class:'btn',onclick:async()=>{await IDB.set('kv','apiKey',key.value.trim());await IDB.set('kv','model',model.value.trim()||DEFAULT_MODEL);toast(t('keySaved'));}},t('save')),
  h('h3',{},t('changePw')),h('div',{},h('label',{class:'f',for:'np'},t('newPw')),npw),
  h('button',{class:'btn ghost',onclick:async()=>{if(npw.value.length<4)return toast(t('pwShort'),true);const salt=uid()+uid();
   S.cfg=Object.assign({},S.cfg,{salt,pwHash:await sha(salt+npw.value)});await S.store.write('config.json',S.cfg);npw.value='';toast(t('pwSet'));}},t('changePw'))));
}

init();
</script>
</body>
</html>
