  return steps(it,[X('Mache die Faktoren vor y gleich gross (mit entgegengesetztem Vorzeichen) und addiere dann die Gleichungen.','Make the y-coefficients equal and opposite, then add the equations.','Rends les coefficients de y opposés, puis additionne les équations.'),X('I · ','I · ','I · ')+Math.abs(d)+X(' und II · ',' and II · ',' et II · ')+b+': '+X('y fällt weg.','y cancels.','y disparaît.')+' '+(a*Math.abs(d)+c*b)+'x = '+(a*x+b*y)*Math.abs(d)+' + '+par((c*x+d*y)*b)+'.','x = '+x+', y = '+y]);});
topic('m9-quadratic',9,1,['Quadratische Gleichungen','Quadratic equations','Équations du second degré'],
 ['x² = 49 hat zwei Lösungen: x = 7 und x = −7. Ist ein Produkt null, ist ein Faktor null: (x − 2)(x + 5) = 0 → x = 2 oder x = −5.','x² = 49 has two solutions: x = 7 and x = −7. If a product is zero, one factor is zero: (x − 2)(x + 5) = 0 → x = 2 or x = −5.','x² = 49 a deux solutions : x = 7 et x = −7. Si un produit est nul, un facteur est nul : (x − 2)(x + 5) = 0 → x = 2 ou x = −5.'],['quadratic','root'],

  else{x1=ri(-7,7);x2=ri(-7,7);p=quad(1,-(x1+x2),x1*x2)+' = 0';st=[X('Suche zwei Zahlen mit Produkt ','Find two numbers with product ','Cherche deux nombres de produit ')+x1*x2+X(' und Summe ',' and sum ',' et de somme ')+(-(x1+x2))+'.',X('Schreibe als Produkt von zwei Klammern.','Write it as a product of two brackets.','Écris-le comme produit de deux parenthèses.')];}
  const it=numItem(p+X('. Gib beide Lösungen an.','. Give both solutions.','. Donne les deux solutions.'),0,{fields:[{label:'x₁',ans:x1},{label:'x₂',ans:x2}],unordered:true,keys:'-',answer:'x = '+x1+(x1!==x2?X(' oder ',' or ',' ou ')+x2:'')});

topic('m9-powerlaws',9,1,['Potenzgesetze','Laws of indices','Règles des puissances'],
 ['aᵐ · aⁿ = aᵐ⁺ⁿ, aᵐ : aⁿ = aᵐ⁻ⁿ, (aᵐ)ⁿ = aᵐ·ⁿ, a⁻ⁿ = 1/aⁿ, a⁰ = 1.','aᵐ · aⁿ = aᵐ⁺ⁿ, aᵐ : aⁿ = aᵐ⁻ⁿ, (aᵐ)ⁿ = aᵐ·ⁿ, a⁻ⁿ = 1/aⁿ, a⁰ = 1.','aᵐ · aⁿ = aᵐ⁺ⁿ, aᵐ : aⁿ = aᵐ⁻ⁿ, (aᵐ)ⁿ = aᵐ·ⁿ, a⁻ⁿ = 1/aⁿ, a⁰ = 1.'],['power','exponent'],

  else{q=b+'^'+n+' : '+b+'^'+(n+m);e=-m;rule=X('Die Hochzahl kann negativ werden: a⁻ⁿ = 1/aⁿ.','The exponent can become negative: a⁻ⁿ = 1/aⁿ.','L’exposant peut devenir négatif : a⁻ⁿ = 1/aⁿ.');}
  const it=numItem(q+' = '+b+'^n. n = ?',e,{keys:'-'});return steps(it,[rule,k===0?m+' + '+n:k===1?(m+n)+' − '+n:k===2?m+' · '+n:n+' − '+(n+m),'n = '+e]);});
topic('m9-roots',9,1,['Wurzeln vereinfachen','Simplifying roots','Simplifier des racines'],
 ['√(a · b) = √a · √b. Ziehe Quadratzahlen heraus: √50 = √(25 · 2) = 5 · √2.','√(a · b) = √a · √b. Take out square numbers: √50 = √(25 · 2) = 5 · √2.','√(a · b) = √a · √b. Sors les carrés : √50 = √(25 · 2) = 5 · √2.'],['root'],

topic('m9-formula',9,1,['Formeln umstellen','Rearranging formulas','Transformer des formules'],
 ['Eine Formel stellst du um wie eine Gleichung: Löse nach der gesuchten Grösse auf. Beispiel: v = s : t → s = v · t → t = s : v.','Rearrange a formula like an equation: solve for the quantity you want. Example: v = s : t → s = v · t → t = s : v.','On transforme une formule comme une équation : isole la grandeur cherchée. Exemple : v = d : t → d = v · t → t = d : v.'],['formula','equation'],
 lv=>{const F=[()=>{const r=ri(2,9),h=ri(2,12);return[X(`Die Fläche eines Rechtecks ist A = a · b. A = ${r*h} cm², a = ${r} cm. b = ?`,`The area of a rectangle is A = a · b. A = ${r*h} cm², a = ${r} cm. b = ?`,`L’aire d’un rectangle est A = a · b. A = ${r*h} cm², a = ${r} cm. b = ?`),h,'b = A : a']},
  ()=>{const m=ri(2,10),V=ri(2,20);return[X(`Dichte ρ = m : V. m = ${m*V} g, V = ${V} cm³. ρ = ?`,`Density ρ = m : V. m = ${m*V} g, V = ${V} cm³. ρ = ?`,`Masse volumique ρ = m : V. m = ${m*V} g, V = ${V} cm³. ρ = ?`),m,'ρ = m : V']},
  ()=>{const c=ri(-10,35);return[X(`Temperatur: F = 1,8 · C + 32. F = ${fmtN(1.8*c+32)}. C = ?`,`Temperature: F = 1.8 · C + 32. F = ${fmtN(1.8*c+32)}. C = ?`,`Température : F = 1,8 · C + 32. F = ${fmtN(1.8*c+32)}. C = ?`),c,'C = (F − 32) : 1,8']},
  ()=>{const b=ri(2,12),h=ri(2,12);return[X(`Dreieck: A = g · h : 2. A = ${b*h/2} cm², g = ${b} cm. h = ?`,`Triangle: A = b · h : 2. A = ${b*h/2} cm², b = ${b} cm. h = ?`,`Triangle : A = b · h : 2. A = ${b*h/2} cm², b = ${b} cm. h = ?`),h,'h = 2 · A : g']}];
  const[q,v,f]=pick(F.slice(0,lv===1?2:4))();const it=numItem(q,v,{keys:'-,'});return steps(it,[X('Stelle die Formel nach der gesuchten Grösse um: ','Rearrange for the quantity you want: ','Isole la grandeur cherchée : ')+f+'.',X('Setze die Zahlen ein.','Substitute the numbers.','Remplace par les nombres.'),fmtN(v)]);});
topic('m9-pythagoras3d',9,2,['Pythagoras im Raum','Pythagoras in 3D','Pythagore dans l’espace'],
 ['Die Raumdiagonale eines Quaders: d² = a² + b² + c². Zuerst die Flächendiagonale, dann nochmals Pythagoras.','The space diagonal of a cuboid: d² = a² + b² + c². First the face diagonal, then Pythagoras again.','La diagonale d’un pavé : d² = a² + b² + c². D’abord la diagonale d’une face, puis encore Pythagore.'],['pythagoras'],
 lv=>{const T=[[1,2,2,3],[2,3,6,7],[1,4,8,9],[2,6,9,11],[4,4,7,9],[2,10,11,15]];let[a,b,c,d]=pick(T);let tol=0;if(lv===3){a=ri(2,9);b=ri(2,9);c=ri(2,9);d=nr1(Math.sqrt(a*a+b*b+c*c));tol=0.1;}
  const it=numItem(X(`Ein Quader ist ${a} cm lang, ${b} cm breit und ${c} cm hoch. Wie lang ist die Raumdiagonale? (in cm)`,`A cuboid is ${a} cm long, ${b} cm wide and ${c} cm high. How long is the space diagonal? (in cm)`,`Un pavé mesure ${a} cm, ${b} cm et ${c} cm. Quelle est la longueur de sa diagonale ? (en cm)`)+(tol?X(' Auf eine Dezimale.',' One decimal place.',' Au dixième.'):''),d,{keys:',',tol,fig:()=>figCuboid(Math.min(a,6),Math.min(b,4),Math.min(c,5))});
  return steps(it,['d² = '+a+'² + '+b+'² + '+c+'² = '+(a*a+b*b+c*c)+'.','d = √'+(a*a+b*b+c*c)+'.','d = '+fmtN(d)+' cm']);});
topic('m9-conesphere',9,2,['Kegel, Pyramide und Kugel','Cone, pyramid and sphere','Cône, pyramide et boule'],
 ['Pyramide und Kegel: V = Grundfläche · Höhe : 3. Kugel: V = 4/3 · π · r³.','Pyramid and cone: V = base area · height : 3. Sphere: V = 4/3 · π · r³.','Pyramide et cône : V = aire de la base · hauteur : 3. Boule : V = 4/3 · π · r³.'],['volume','cone','sphere'],
 lv=>{const k=ri(0,lv===1?0:2);if(k===0){const a=ri(2,9)*(lv===1?1:1),h=ri(2,9)*3;const V=a*a*h/3;const it=numItem(X(`Eine Pyramide hat eine quadratische Grundfläche mit a = ${a} cm und die Höhe ${h} cm. Volumen in cm³?`,`A pyramid has a square base with a = ${a} cm and height ${h} cm. Volume in cm³?`,`Une pyramide a une base carrée de côté ${a} cm et une hauteur de ${h} cm. Volume en cm³ ?`),V,{fig:()=>figSolid('pyramid')});
   return steps(it,[X('Grundfläche: ','Base area: ','Aire de la base : ')+a+' · '+a+' = '+a*a+' cm².',a*a+' · '+h+' : 3.',fmtN(V)+' cm³']);}
  if(k===1){const r=ri(1,8),h=ri(2,15);const V=Math.PI*r*r*h/3;const it=numItem(X(`Ein Kegel hat r = ${r} cm und h = ${h} cm. Volumen in cm³?`,`A cone has r = ${r} cm and h = ${h} cm. Volume in cm³?`,`Un cône a r = ${r} cm et h = ${h} cm. Volume en cm³ ?`)+PI_NOTE(),nr1(V),{keys:',',tol:piTol(V),fig:()=>figSolid2('cone','r = '+r+', h = '+h)});
   return steps(it,[X('Grundfläche: π · ','Base area: π · ','Aire de la base : π · ')+r+'² ≈ '+fmtN(nr1(Math.PI*r*r))+'.',X('Mal Höhe, durch 3.','Times height, divided by 3.','Fois la hauteur, divisé par 3.'),fmtN(nr1(V))+' cm³']);}
  const r=ri(1,10);const V=4/3*Math.PI*r**3;const it=numItem(X(`Eine Kugel hat r = ${r} cm. Volumen in cm³?`,`A sphere has r = ${r} cm. Volume in cm³?`,`Une boule a r = ${r} cm. Volume en cm³ ?`)+PI_NOTE(),nr1(V),{keys:',',tol:piTol(V),fig:()=>figSolid2('sphere','r = '+r)});
  return steps(it,['V = 4/3 · π · r³.',r+'³ = '+r**3+'.',fmtN(nr1(V))+' cm³']);});
topic('m9-sector',9,2,['Kreisbogen und Kreissektor','Arcs and sectors','Arcs et secteurs'],
 ['Ein Sektor mit Winkel α ist der Anteil α/360° des Kreises. Fläche = π · r² · α/360°, Bogen = 2 · π · r · α/360°.','A sector with angle α is the fraction α/360° of the circle. Area = π · r² · α/360°, arc = 2 · π · r · α/360°.','Un secteur d’angle α est la fraction α/360° du disque. Aire = π · r² · α/360°, arc = 2 · π · r · α/360°.'],['pi','sector'],
 lv=>{const r=ri(2,12),deg=pick([30,45,60,90,120,135,180,270]);const area=Math.random()<.5;const v=area?Math.PI*r*r*deg/360:2*Math.PI*r*deg/360;

topic('m9-scalearea',9,2,['Streckfaktor bei Flächen und Volumen','Scale factor for area and volume','Facteur d’agrandissement pour aires et volumes'],
 ['Werden alle Längen mit k vergrössert, wird die Fläche mit k² und das Volumen mit k³ vergrössert.','If all lengths are multiplied by k, the area is multiplied by k² and the volume by k³.','Si toutes les longueurs sont multipliées par k, l’aire est multipliée par k² et le volume par k³.'],['scalefactor','similar'],
 lv=>{const k=ri(2,5),A=ri(2,20);const vol=lv>=2&&Math.random()<.5;const it=numItem(vol?X(`Ein Würfel hat ${A} cm³ Volumen. Alle Kanten werden ${k}-mal so lang. Neues Volumen in cm³?`,`A cube has a volume of ${A} cm³. All edges become ${k} times as long. New volume in cm³?`,`Un cube a un volume de ${A} cm³. Toutes les arêtes deviennent ${k} fois plus longues. Nouveau volume en cm³ ?`)
   :X(`Eine Figur hat ${A} cm² Fläche. Alle Längen werden ${k}-mal so lang. Neue Fläche in cm²?`,`A shape has an area of ${A} cm². All lengths become ${k} times as long. New area in cm²?`,`Une figure a une aire de ${A} cm². Toutes les longueurs deviennent ${k} fois plus longues. Nouvelle aire en cm² ?`),vol?A*k**3:A*k*k);
  return steps(it,[vol?X('Volumen wächst mit k³.','Volume grows with k³.','Le volume est multiplié par k³.'):X('Fläche wächst mit k².','Area grows with k².','L’aire est multipliée par k².'),vol?k+'³ = '+k**3+'.':k+'² = '+k*k+'.',vol?A*k**3+' cm³':A*k*k+' cm²']);});
topic('m9-lineq',9,3,['Geraden durch zwei Punkte','Lines through two points','Droites passant par deux points'],
 ['Steigung m = (y₂ − y₁) : (x₂ − x₁). Dann q aus y = m · x + q mit einem Punkt berechnen.','Slope m = (y₂ − y₁) : (x₂ − x₁). Then find q from y = m · x + q using one point.','Pente m = (y₂ − y₁) : (x₂ − x₁). Puis calcule q avec y = m · x + q et un point.'],['slope','intercept','function'],
 lv=>{const m=ri(-3,3)||1,q=ri(-5,5);const x1=ri(-4,1),x2=x1+ri(1,4);const y1=m*x1+q,y2=m*x2+q;
  const it=numItem(X('Die Gerade geht durch ','The line passes through ','La droite passe par ')+'A('+x1+' | '+y1+X(') und B(',') and B(',') et B(')+x2+' | '+y2+'). y = mx + q. '+X('Gib m und q an.','Give m and q.','Donne m et q.'),0,{fields:[{label:'m',ans:m},{label:'q',ans:q}],keys:'-',answer:'y = '+lin(m,q)});

topic('m9-parabola',9,3,['Quadratische Funktionen','Quadratic functions','Fonctions du second degré'],
 ['y = (x − a)² + b ist eine Parabel mit dem Scheitelpunkt S(a | b). Sie ist nach oben offen und symmetrisch zur Geraden x = a.','y = (x − a)² + b is a parabola with vertex V(a | b). It opens upwards and is symmetric about the line x = a.','y = (x − a)² + b est une parabole de sommet S(a | b). Elle est ouverte vers le haut et symétrique par rapport à la droite x = a.'],['parabola','vertex'],
 lv=>{const a=ri(-3,3),b=ri(-4,3);const fromGraph=Math.random()<.5;const f=x=>(x-a)**2+b;const eq='y = '+(a?'(x '+(a<0?'+ '+(-a):'− '+a)+')²':'x²')+(b?(b<0?' − '+(-b):' + '+b):'');

topic('m9-growth',9,3,['Exponentielles Wachstum','Exponential growth','Croissance exponentielle'],

  return steps(it,[X('Wachstumsfaktor: 1 + ','Growth factor: 1 + ','Facteur de croissance : 1 + ')+p+'/100 = '+fmtN(1+p/100)+'.',fmtN(K)+' · '+fmtN(1+p/100)+'^'+n+'.',fmtN(v)]);});
topic('m9-combinatorics',9,3,['Kombinatorik','Counting (combinatorics)','Dénombrement'],

   return steps(it,[X('Platz 1: ','1st place: ','1re place : ')+n+X(' Möglichkeiten.',' options.',' possibilités.'),X('Platz 2: ','2nd: ','2e : ')+(n-1)+', '+X('Platz 3: ','3rd: ','3e : ')+(n-2)+'.',n+' · '+(n-1)+' · '+(n-2)+' = '+v]);}
  const d=ri(3,4),c=pick([4,6,10]);const v=c**d;const it=numItem(X(`Ein Zahlenschloss hat ${d} Ringe mit je ${c} Ziffern. Wie viele Kombinationen gibt es?`,`A combination lock has ${d} rings with ${c} digits each. How many combinations are there?`,`Un cadenas a ${d} molettes de ${c} chiffres chacune. Combien de combinaisons y a-t-il ?`),v);

topic('m9-relfreq',9,3,['Relative Häufigkeit','Relative frequency','Fréquence relative'],

/* q = [type, prompt, options|answer, hint, explanation, extra]  type: s single (first correct) · m multi (* marks correct) · o order (correct order) · f tap on figure (options = figure key, extra = target id) */
function bankTopic(id,y,a,n,c,terms,qs){const tp={id,y,a,n,c,terms,qs,g:null};tp.g=lv=>{if(!tp._ord||tp._i>=tp._ord.length){tp._ord=shuffle(qs.map((_,i)=>i));tp._i=0;}return itItem(qs[tp._ord[tp._i++]]);};ITT.push(tp);}
function itItem(q){const[ty,p,o,hn,ex,xt]=q;let it;
 if(ty==='s'){const opts=o.map(T3);it=choiceItem(T3(p),opts[0],opts.slice(1));}
 else if(ty==='m'){const opts=shuffle(o.map((s,i)=>({t:T3(s.replace(/^\*/,'')),ok:s.startsWith('*')})));it={type:'multi',prompt:T3(p),options:opts.map(x=>x.t),correct:opts.map((x,i)=>x.ok?i:-1).filter(i=>i>=0)};}
 else if(ty==='o'){it={type:'order',prompt:T3(p),order:o.map(T3)};}
 else if(ty==='f'){it={type:'tapfig',prompt:T3(p),figk:o,target:xt,answer:T3(ex).split('.')[0]};}
 return steps(it,[T3(hn),T3(ex)]);}

bankTopic('it1-inout',1,1,['Eingabe und Ausgabe','Input and output','Entrée et sortie'],
 ['Mit Eingabegeräten gibst du dem Computer etwas: Tastatur, Maus, Mikrofon, Kamera. Ausgabegeräte zeigen dir etwas: Bildschirm, Lautsprecher, Drucker.','Input devices give the computer something: keyboard, mouse, microphone, camera. Output devices show you something: screen, speakers, printer.','Les périphériques d’entrée donnent quelque chose à l’ordinateur : clavier, souris, micro, caméra. Ceux de sortie te montrent quelque chose : écran, haut-parleurs, imprimante.'],['it_input','it_output'],[
 N('m','Welche Geräte sind Eingabegeräte?|Which devices are input devices?|Quels appareils sont des périphériques d’entrée ?',['*Tastatur|keyboard|clavier','*Maus|mouse|souris','*Mikrofon|microphone|micro','Lautsprecher|speakers|haut-parleurs','Drucker|printer|imprimante'],'Womit gibst du dem Computer etwas?|What do you use to give the computer something?|Avec quoi donnes-tu quelque chose à l’ordinateur ?','Tastatur, Maus und Mikrofon bringen etwas in den Computer hinein.|Keyboard, mouse and microphone put something into the computer.|Le clavier, la souris et le micro font entrer quelque chose dans l’ordinateur.'),
 N('m','Welche Geräte sind Ausgabegeräte?|Which devices are output devices?|Quels appareils sont des périphériques de sortie ?',['*Bildschirm|screen|écran','*Lautsprecher|speakers|haut-parleurs','*Drucker|printer|imprimante','Tastatur|keyboard|clavier','Kamera|camera|caméra'],'Was zeigt oder spielt dir etwas vor?|What shows or plays something to you?|Qu’est-ce qui te montre ou te fait entendre quelque chose ?','Bildschirm, Lautsprecher und Drucker geben etwas aus dem Computer heraus.|Screen, speakers and printer give something out of the computer.|L’écran, les haut-parleurs et l’imprimante font sortir quelque chose de l’ordinateur.'),
 N('f','Tippe auf das Gerät, aus dem Musik kommt.|Tap the device that plays music.|Touche l’appareil d’où sort la musique.','desk','Es hat runde Membranen.|It has round cones.|Il a des membranes rondes.','Aus dem Lautsprecher kommt der Ton.|Sound comes out of the speaker.|Le son sort du haut-parleur.','speaker'),
 N('s','Du sprichst in ein Gerät und der Computer schreibt mit. Was brauchst du?|You speak and the computer writes it down. What do you need?|Tu parles et l’ordinateur écrit. De quoi as-tu besoin ?',['ein Mikrofon|a microphone|un micro','einen Drucker|a printer|une imprimante','einen Lautsprecher|a speaker|un haut-parleur'],'Das Gerät muss deine Stimme aufnehmen.|The device must pick up your voice.|L’appareil doit capter ta voix.','Ein Mikrofon nimmt Töne auf und ist ein Eingabegerät.|A microphone records sound and is an input device.|Un micro enregistre les sons : c’est un périphérique d’entrée.')]);
bankTopic('it1-care',1,1,['Sorgfältig mit Geräten','Taking care of devices','Prendre soin des appareils'],
 ['Geräte sind empfindlich: kein Essen und Trinken daneben, mit zwei Händen tragen, rechtzeitig laden und nach dem Arbeiten richtig ausschalten.','Devices are delicate: no food or drinks nearby, carry them with two hands, charge them in time and switch them off properly.','Les appareils sont fragiles : pas de nourriture ni de boissons à côté, les porter à deux mains, les recharger à temps et les éteindre correctement.'],['it_charge'],[
 N('m','Was ist gut für dein Tablet?|What is good for your tablet?|Qu’est-ce qui est bon pour ta tablette ?',['*mit zwei Händen tragen|carry it with two hands|la porter à deux mains','*rechtzeitig laden|charge it in time|la recharger à temps','daneben Saft trinken|drink juice next to it|boire du jus à côté','in der Sonne liegen lassen|leave it in the sun|la laisser au soleil'],'Stell dir vor, das Gerät fällt oder wird nass.|Imagine the device falls or gets wet.|Imagine que l’appareil tombe ou soit mouillé.','Vorsichtig tragen und laden schützt das Gerät; Flüssigkeit und Hitze schaden ihm.|Careful carrying and charging protect it; liquids and heat damage it.|Le porter avec soin et le recharger le protègent ; les liquides et la chaleur l’abîment.'),
 N('s','Der Akku ist fast leer. Was machst du?|The battery is almost empty. What do you do?|La batterie est presque vide. Que fais-tu ?',['Ich lade das Gerät mit dem Kabel.|I charge it with the cable.|Je le recharge avec le câble.','Ich schüttle das Gerät.|I shake the device.|Je secoue l’appareil.','Ich lege es in den Kühlschrank.|I put it in the fridge.|Je le mets au frigo.'],'Der Akku braucht Strom.|The battery needs power.|La batterie a besoin d’électricité.','Mit dem Ladekabel bekommt der Akku wieder Strom.|The charging cable gives the battery power again.|Le câble de charge redonne de l’énergie à la batterie.'),
 N('s','Was machst du, wenn du fertig bist mit dem Computer in der Schule?|What do you do when you have finished with the computer at school?|Que fais-tu quand tu as fini avec l’ordinateur à l’école ?',['abmelden und richtig ausschalten|sign out and shut down properly|me déconnecter et l’éteindre correctement','einfach den Stecker ziehen|just pull the plug|débrancher simplement la prise','offen lassen für die Nächsten|leave it open for the next person|le laisser ouvert pour les suivants'],'Deine Sachen sollen sicher bleiben.|Your things should stay safe.|Tes affaires doivent rester en sécurité.','Abmelden schützt deine Daten, richtig ausschalten schützt das Gerät.|Signing out protects your data, shutting down properly protects the device.|Se déconnecter protège tes données, bien éteindre protège l’appareil.')]);
bankTopic('it1-tablet',1,3,['Tablet bedienen','Using a tablet','Utiliser une tablette'],
 ['Auf dem Tablet benutzt du die Finger: tippen zum Öffnen, wischen zum Blättern, mit zwei Fingern auseinanderziehen zum Vergrössern.','On a tablet you use your fingers: tap to open, swipe to scroll, spread two fingers apart to zoom in.','Sur une tablette, tu utilises tes doigts : toucher pour ouvrir, glisser pour faire défiler, écarter deux doigts pour agrandir.'],['it_tap','it_swipe'],[
 N('s','Du willst ein Foto grösser machen. Was machst du?|You want to make a photo bigger. What do you do?|Tu veux agrandir une photo. Que fais-tu ?',['zwei Finger auseinanderziehen|spread two fingers apart|écarter deux doigts','einmal kurz tippen|tap once|toucher une fois','das Tablet schütteln|shake the tablet|secouer la tablette'],'Du brauchst zwei Finger.|You need two fingers.|Il te faut deux doigts.','Mit zwei Fingern auseinanderziehen vergrössert, zusammenziehen verkleinert.|Spreading two fingers zooms in, pinching zooms out.|Écarter deux doigts agrandit, les rapprocher réduit.'),
 N('s','Wie öffnest du eine App?|How do you open an app?|Comment ouvres-tu une app ?',['kurz auf das Symbol tippen|tap its icon briefly|toucher brièvement son icône','lange auf den Bildschirm drücken|press the screen for a long time|appuyer longtemps sur l’écran','das Tablet umdrehen|turn the tablet over|retourner la tablette'],'Ein kurzer Fingertipp reicht.|A short tap is enough.|Un simple toucher suffit.','Tippen öffnet die App.|Tapping opens the app.|Toucher ouvre l’app.'),
 N('f','Ein iPad ohne Home-Taste: Wo wischst du nach oben, um zum Home-Bildschirm zu kommen?|An iPad without a Home button: where do you swipe up to go to the Home Screen?|Un iPad sans bouton principal : où glisses-tu vers le haut pour revenir à l’écran d’accueil ?','tablet','Es ist am unteren Rand.|It is at the bottom edge.|C’est au bord inférieur.','Vom unteren Rand nach oben wischen führt zum Home-Bildschirm.|Swiping up from the bottom edge goes to the Home Screen.|Glisser vers le haut depuis le bord inférieur ramène à l’écran d’accueil.','bottom'),
 N('s','Du willst in einer langen Liste weiter nach unten. Was machst du?|You want to go further down a long list. What do you do?|Tu veux descendre dans une longue liste. Que fais-tu ?',['mit dem Finger nach oben wischen|swipe up with your finger|glisser le doigt vers le haut','auf die Kamera tippen|tap the camera|toucher la caméra','das Tablet ausschalten|switch the tablet off|éteindre la tablette'],'Die Liste bewegt sich mit deinem Finger.|The list moves with your finger.|La liste suit ton doigt.','Nach oben wischen schiebt den Inhalt nach oben; so siehst du, was weiter unten steht.|Swiping up pushes the content up so you see what is further down.|Glisser vers le haut fait monter le contenu : tu vois la suite.')]);

bankTopic('it2-keyboard',2,1,['Wichtige Tasten','Important keys','Touches importantes'],
 ['Die Leertaste macht einen Abstand, die Eingabetaste (↵) eine neue Zeile, die Rücktaste (⌫) löscht nach links, die Umschalttaste (⇧) macht Grossbuchstaben.','Space makes a gap, Enter (↵) starts a new line, Backspace (⌫) deletes to the left, Shift (⇧) makes capital letters.','La barre d’espace fait un espace, Entrée (↵) une nouvelle ligne, Retour arrière (⌫) efface à gauche, Maj (⇧) fait des majuscules.'],['it_enter','it_shift','it_space'],[
 N('f','Tippe auf die Leertaste.|Tap the space bar.|Touche la barre d’espace.','keyboard','Es ist die längste Taste.|It is the longest key.|C’est la touche la plus longue.','Die Leertaste ist die lange Taste unten in der Mitte.|The space bar is the long key at the bottom in the middle.|La barre d’espace est la longue touche en bas au milieu.','space'),
 N('f','Tippe auf die Eingabetaste (Enter).|Tap the Enter key.|Touche la touche Entrée.','keyboard','Sie hat einen Pfeil, der nach links abbiegt: ↵|It has an arrow that turns left: ↵|Elle a une flèche qui tourne à gauche : ↵','Die Eingabetaste ↵ ist rechts in der Mitte.|The Enter key ↵ is on the right in the middle.|La touche Entrée ↵ est à droite au milieu.','enter'),
 N('f','Tippe auf die Rücktaste, die nach links löscht.|Tap the Backspace key, which deletes to the left.|Touche la touche Retour arrière, qui efface à gauche.','keyboard','Sie ist oben rechts.|It is at the top right.|Elle est en haut à droite.','Die Rücktaste ⌫ ist oben rechts.|Backspace ⌫ is at the top right.|Retour arrière ⌫ est en haut à droite.','backspace'),
 N('f','Tippe auf eine Umschalttaste (für Grossbuchstaben).|Tap a Shift key (for capital letters).|Touche une touche Maj (pour les majuscules).','keyboard','Sie hat einen Pfeil nach oben: ⇧|It has an upward arrow: ⇧|Elle a une flèche vers le haut : ⇧','Es gibt zwei Umschalttasten ⇧, links und rechts.|There are two Shift keys ⇧, left and right.|Il y a deux touches Maj ⇧, à gauche et à droite.','shift'),
 N('s','Welche Taste drückst du, um einen Abstand zwischen zwei Wörtern zu machen?|Which key makes a gap between two words?|Quelle touche fait un espace entre deux mots ?',['Leertaste|space bar|barre d’espace','Eingabetaste|Enter|Entrée','Rücktaste|Backspace|Retour arrière'],'Die Taste ist lang und liegt unten.|The key is long and at the bottom.|La touche est longue et en bas.','Die Leertaste macht einen Abstand.|The space bar makes a gap.|La barre d’espace fait un espace.')]);
bankTopic('it2-mouse',2,1,['Mit der Maus arbeiten','Using a mouse','Utiliser la souris'],
 ['Linksklick wählt aus, Doppelklick öffnet, Rechtsklick zeigt ein Menü, Ziehen verschiebt etwas, mit dem Rad scrollst du.','Left-click selects, double-click opens, right-click shows a menu, dragging moves something, the wheel scrolls.','Le clic gauche sélectionne, le double-clic ouvre, le clic droit affiche un menu, glisser déplace, la molette fait défiler.'],['it_click','it_doubleclick'],[
 N('s','Wie öffnest du auf dem Computer einen Ordner auf dem Schreibtisch?|How do you open a folder on the desktop?|Comment ouvres-tu un dossier sur le bureau ?',['Doppelklick|double-click|double-clic','Rechtsklick|right-click|clic droit','Mausrad drehen|turn the mouse wheel|tourner la molette'],'Zweimal schnell klicken.|Click twice quickly.|Clique deux fois rapidement.','Ein Doppelklick öffnet Ordner und Dateien.|A double-click opens folders and files.|Un double-clic ouvre dossiers et fichiers.'),
 N('s','Was passiert meistens bei einem Rechtsklick?|What usually happens on a right-click?|Que se passe-t-il en général avec un clic droit ?',['Ein kleines Menü erscheint.|A small menu appears.|Un petit menu apparaît.','Der Computer schaltet aus.|The computer switches off.|L’ordinateur s’éteint.','Die Datei wird gedruckt.|The file is printed.|Le fichier est imprimé.'],'Es zeigt dir Möglichkeiten.|It shows you options.|Il te montre des possibilités.','Der Rechtsklick öffnet ein Kontextmenü mit passenden Befehlen.|A right-click opens a context menu with matching commands.|Le clic droit ouvre un menu contextuel avec des commandes adaptées.'),
 N('s','Wie verschiebst du ein Bild auf dem Bildschirm an einen anderen Ort?|How do you move a picture to another place on the screen?|Comment déplaces-tu une image à un autre endroit de l’écran ?',['anklicken, Taste gedrückt halten und ziehen|click, hold the button and drag|cliquer, maintenir le bouton et glisser','zweimal klicken|click twice|cliquer deux fois','das Mausrad drehen|turn the wheel|tourner la molette'],'Du musst die Taste gedrückt halten.|You have to keep the button pressed.|Tu dois garder le bouton enfoncé.','Ziehen und Ablegen verschiebt Dinge (Drag and Drop).|Dragging and dropping moves things (drag and drop).|Glisser-déposer déplace les objets.'),
 N('s','Wozu ist das Rad an der Maus?|What is the wheel on the mouse for?|À quoi sert la molette de la souris ?',['nach oben und unten scrollen|scrolling up and down|faire défiler vers le haut et le bas','den Computer einschalten|switching the computer on|allumer l’ordinateur','lauter stellen|making it louder|monter le son'],'Denk an eine lange Webseite.|Think of a long web page.|Pense à une longue page web.','Mit dem Mausrad scrollst du durch lange Seiten.|The mouse wheel scrolls through long pages.|La molette fait défiler les longues pages.')]);
bankTopic('it2-passwords',2,1,['Anmelden und Passwörter','Signing in and passwords','Connexion et mots de passe'],
 ['Mit deinem Benutzernamen und deinem Passwort meldest du dich an. Das Passwort ist geheim: Du verrätst es niemandem ausser deinen Eltern.','You sign in with your user name and password. The password is secret: you tell nobody except your parents.','Tu te connectes avec ton nom d’utilisateur et ton mot de passe. Le mot de passe est secret : tu ne le dis à personne sauf à tes parents.'],['it_password','it_login'],[
 N('s','Eine Freundin fragt nach deinem Passwort. Was machst du?|A friend asks for your password. What do you do?|Une amie te demande ton mot de passe. Que fais-tu ?',['Ich sage es nicht.|I don’t tell her.|Je ne le dis pas.','Ich schreibe es ihr auf.|I write it down for her.|Je le lui écris.','Ich sage es laut in der Klasse.|I say it out loud in class.|Je le dis à voix haute en classe.'],'Ein Passwort ist wie ein Hausschlüssel.|A password is like a house key.|Un mot de passe est comme une clé de maison.','Passwörter bleiben geheim, auch unter Freunden.|Passwords stay secret, even among friends.|Les mots de passe restent secrets, même entre amis.'),
 N('s','Welches Passwort ist am sichersten?|Which password is the safest?|Quel mot de passe est le plus sûr ?',['Tiger-Velo-Wolke-17|Tiger-Bike-Cloud-17|Tigre-Velo-Nuage-17','1234|1234|1234','Lea|Lea|Lea'],'Lang und schwer zu erraten ist gut.|Long and hard to guess is good.|Long et difficile à deviner, c’est bien.','Lange Passwörter aus mehreren Wörtern und Zahlen sind schwer zu erraten.|Long passwords made of several words and numbers are hard to guess.|Les mots de passe longs, faits de plusieurs mots et chiffres, sont difficiles à deviner.'),
 N('s','Was heisst «sich abmelden»?|What does “signing out” mean?|Que veut dire « se déconnecter » ?',['sein Konto schliessen, damit niemand weiterarbeiten kann|closing your account so nobody else can carry on|fermer son compte pour que personne ne puisse continuer','den Computer putzen|cleaning the computer|nettoyer l’ordinateur','ein Spiel gewinnen|winning a game|gagner une partie'],'Es ist das Gegenteil von anmelden.|It is the opposite of signing in.|C’est le contraire de se connecter.','Abmelden beendet deine Sitzung; so kann niemand mit deinem Konto weitermachen.|Signing out ends your session so nobody can carry on with your account.|Se déconnecter termine ta session : personne ne peut continuer avec ton compte.')]);
bankTopic('it2-ipad',2,3,['iPad: erste Schritte','iPad: first steps','iPad : premiers pas'],
 ['Der Home-Bildschirm zeigt alle Apps. Mit den Tasten am Rand stellst du die Lautstärke ein und sperrst das iPad. Zum Laden steckst du das Kabel unten ein.','The Home Screen shows all apps. The buttons on the edge change the volume and lock the iPad. To charge it, plug the cable in at the bottom.','L’écran d’accueil montre toutes les apps. Les boutons sur le bord règlent le volume et verrouillent l’iPad. Pour le recharger, branche le câble en bas.'],['it_homescreen','it_app'],[
 N('f','Tippe auf die Lautstärketasten.|Tap the volume buttons.|Touche les boutons de volume.','tablet','Es sind zwei Tasten am rechten Rand.|They are two buttons on the right edge.|Ce sont deux boutons sur le bord droit.','Die Lautstärketasten sind am Rand (auf diesem Bild rechts oben).|The volume buttons are on the edge (top right in this picture).|Les boutons de volume sont sur le bord (en haut à droite sur l’image).','volume'),
 N('f','Wo steckst du das Ladekabel ein?|Where do you plug in the charging cable?|Où branches-tu le câble de charge ?','tablet','Unten in der Mitte.|At the bottom in the middle.|En bas au milieu.','Der Anschluss ist unten am iPad.|The port is at the bottom of the iPad.|Le port est en bas de l’iPad.','port'),
 N('f','Tippe auf die Kamera.|Tap the camera.|Touche la caméra.','tablet','Ein kleiner Punkt am Rand des Bildschirms.|A small dot at the edge of the screen.|Un petit point au bord de l’écran.','Die Frontkamera ist oben in der Mitte.|The front camera is at the top in the middle.|La caméra avant est en haut au milieu.','camera'),
 N('s','Was ist eine App?|What is an app?|Qu’est-ce qu’une app ?',['ein Programm auf dem Tablet oder Handy|a program on a tablet or phone|un programme sur la tablette ou le téléphone','ein Kabel|a cable|un câble','eine Hülle|a case|une coque'],'Du tippst auf ihr Symbol, um sie zu öffnen.|You tap its icon to open it.|Tu touches son icône pour l’ouvrir.','Apps sind Programme, zum Beispiel zum Zeichnen, Lesen oder Rechnen.|Apps are programs, for example for drawing, reading or maths.|Les apps sont des programmes, par exemple pour dessiner, lire ou calculer.')]);

bankTopic('it3-files',3,1,['Dateien und Ordner','Files and folders','Fichiers et dossiers'],
 ['Eine Datei ist ein gespeichertes Werk: ein Text, ein Bild, ein Lied. Ordner sind wie Schubladen: Darin ordnest du Dateien und weitere Ordner.','A file is a saved piece of work: a text, a picture, a song. Folders are like drawers: you sort files and other folders into them.','Un fichier est un travail enregistré : un texte, une image, une chanson. Les dossiers sont comme des tiroirs : tu y ranges fichiers et autres dossiers.'],['it_file','it_folder'],[
 N('s','Was ist ein Ordner?|What is a folder?|Qu’est-ce qu’un dossier ?',['ein Behälter für Dateien|a container for files|un contenant pour des fichiers','ein Bild|a picture|une image','ein Drucker|a printer|une imprimante'],'Denk an eine Schublade.|Think of a drawer.|Pense à un tiroir.','In Ordnern sammelst und ordnest du Dateien.|Folders collect and sort files.|Les dossiers rassemblent et rangent les fichiers.'),
 N('s','Du hast lange an einem Text gearbeitet. Was machst du, damit er nicht verloren geht?|You have worked on a text for a long time. What do you do so it isn’t lost?|Tu as longtemps travaillé sur un texte. Que fais-tu pour ne pas le perdre ?',['speichern|save it|l’enregistrer','den Bildschirm ausschalten|switch off the screen|éteindre l’écran','alles markieren|select everything|tout sélectionner'],'Der Computer muss ihn aufbewahren.|The computer has to keep it.|L’ordinateur doit le conserver.','Speichern legt die Datei ab, damit du sie später wieder öffnen kannst.|Saving stores the file so you can open it again later.|Enregistrer range le fichier pour le rouvrir plus tard.'),
 N('s','Welcher Dateiname ist am besten?|Which file name is best?|Quel nom de fichier est le meilleur ?',['Aufsatz_Ferien_2026|Essay_Holidays_2026|Redaction_Vacances_2026','neu (3)|new (3)|nouveau (3)','asdfgh|asdfgh|asdfgh'],'Man soll später wissen, was drin ist.|Later you should know what is inside.|Plus tard, on doit savoir ce qu’il contient.','Ein klarer Name hilft, die Datei wiederzufinden.|A clear name helps you find the file again.|Un nom clair aide à retrouver le fichier.'),
 N('o','Ordne vom Grössten zum Kleinsten.|Order from biggest to smallest.|Range du plus grand au plus petit.',['Ordner «Schule»|folder “School”|dossier « École »','Ordner «Deutsch»|folder “German”|dossier « Allemand »','Datei «Gedicht»|file “Poem”|fichier « Poème »'],'Was enthält was?|What contains what?|Qu’est-ce qui contient quoi ?','Der Ordner «Schule» enthält den Ordner «Deutsch», darin liegt die Datei.|The “School” folder contains the “German” folder, which holds the file.|Le dossier « École » contient le dossier « Allemand », qui contient le fichier.')]);
bankTopic('it3-windows',3,2,['Windows: Start, Taskleiste, Fenster','Windows: Start, taskbar, windows','Windows : Démarrer, barre des tâches, fenêtres'],
 ['Unten ist die Taskleiste mit dem Start-Knopf. Jedes Programm öffnet sich in einem Fenster. Oben rechts im Fenster: minimieren (−), maximieren (□) und schliessen (×).','At the bottom is the taskbar with the Start button. Each program opens in a window. At the top right of a window: minimise (−), maximise (□) and close (×).','En bas se trouve la barre des tâches avec le bouton Démarrer. Chaque programme s’ouvre dans une fenêtre. En haut à droite : réduire (−), agrandir (□) et fermer (×).'],['it_taskbar','it_window'],[
 N('f','Tippe auf den Start-Knopf.|Tap the Start button.|Touche le bouton Démarrer.','winscreen','Er hat vier kleine Quadrate.|It has four small squares.|Il a quatre petits carrés.','Der Start-Knopf ist in der Taskleiste unten.|The Start button is in the taskbar at the bottom.|Le bouton Démarrer est dans la barre des tâches en bas.','start'),
 N('f','Tippe auf die Taste, die das Fenster schliesst.|Tap the button that closes the window.|Touche le bouton qui ferme la fenêtre.','winwindow','Es ist ein Kreuz.|It is a cross.|C’est une croix.','× schliesst das Fenster.|× closes the window.|× ferme la fenêtre.','close'),
 N('f','Tippe auf die Taste, die das Fenster in die Taskleiste versteckt (minimieren).|Tap the button that hides the window in the taskbar (minimise).|Touche le bouton qui cache la fenêtre dans la barre des tâches (réduire).','winwindow','Es ist ein Strich.|It is a line.|C’est un trait.','− minimiert das Fenster; es bleibt offen, nur versteckt.|− minimises the window; it stays open, just hidden.|− réduit la fenêtre ; elle reste ouverte, juste cachée.','min'),
 N('f','Tippe auf die Uhrzeit.|Tap the clock.|Touche l’horloge.','winscreen','Unten rechts.|Bottom right.|En bas à droite.','Uhr, WLAN und Lautstärke sind unten rechts in der Taskleiste.|Clock, Wi-Fi and volume are at the bottom right of the taskbar.|L’heure, le Wi-Fi et le volume sont en bas à droite de la barre des tâches.','tray')]);
bankTopic('it3-mac',3,3,['Mac: Dock, Menüleiste, Fenster','Mac: Dock, menu bar, windows','Mac : Dock, barre des menus, fenêtres'],
 ['Unten ist das Dock mit den Apps. Oben ist die Menüleiste mit dem Apple-Menü ganz links. Fensterknöpfe sind oben links: rot schliesst, gelb versteckt im Dock, grün macht Vollbild.','At the bottom is the Dock with apps. At the top is the menu bar with the Apple menu on the far left. Window buttons are at the top left: red closes, yellow hides in the Dock, green goes full screen.','En bas se trouve le Dock avec les apps. En haut, la barre des menus avec le menu Pomme tout à gauche. Les boutons de fenêtre sont en haut à gauche : rouge ferme, jaune réduit dans le Dock, vert passe en plein écran.'],['it_dock','it_menubar'],[
 N('f','Tippe auf das Dock.|Tap the Dock.|Touche le Dock.','macscreen','Die Reihe mit den App-Symbolen unten.|The row of app icons at the bottom.|La rangée d’icônes d’apps en bas.','Das Dock ist unten am Bildschirm.|The Dock is at the bottom of the screen.|Le Dock est en bas de l’écran.','dock'),
 N('f','Tippe auf das Apple-Menü.|Tap the Apple menu.|Touche le menu Pomme.','macscreen','Ganz oben links.|At the very top left.|Tout en haut à gauche.','Das Apple-Menü ist ganz links in der Menüleiste.|The Apple menu is at the far left of the menu bar.|Le menu Pomme est tout à gauche de la barre des menus.','applemenu'),
 N('f','Tippe auf den Knopf, der das Fenster schliesst.|Tap the button that closes the window.|Touche le bouton qui ferme la fenêtre.','macwindow','Es ist der rote Knopf.|It is the red button.|C’est le bouton rouge.','Rot schliesst das Fenster, gelb minimiert, grün macht Vollbild.|Red closes, yellow minimises, green goes full screen.|Rouge ferme, jaune réduit, vert passe en plein écran.','close'),
 N('s','Wo sind die Fensterknöpfe auf dem Mac?|Where are the window buttons on a Mac?|Où sont les boutons de fenêtre sur un Mac ?',['oben links|top left|en haut à gauche','oben rechts|top right|en haut à droite','unten in der Mitte|bottom middle|en bas au milieu'],'Anders als bei Windows.|Different from Windows.|Différent de Windows.','Auf dem Mac sind die drei Fensterknöpfe oben links.|On a Mac the three window buttons are at the top left.|Sur Mac, les trois boutons sont en haut à gauche.')]);
bankTopic('it3-typing',3,1,['Texte schreiben','Writing texts','Écrire des textes'],
 ['Für einen Grossbuchstaben hältst du die Umschalttaste gedrückt. Mit der Rücktaste löschst du den letzten Buchstaben. Die Eingabetaste beginnt einen neuen Absatz.','For a capital letter, hold Shift. Backspace deletes the last letter. Enter starts a new paragraph.','Pour une majuscule, maintiens Maj. Retour arrière efface la dernière lettre. Entrée commence un nouveau paragraphe.'],['it_shift','it_enter'],[
 N('s','Wie schreibst du ein grosses A?|How do you type a capital A?|Comment tapes-tu un A majuscule ?',['Umschalttaste halten und A drücken|hold Shift and press A|maintenir Maj et appuyer sur A','zweimal A drücken|press A twice|appuyer deux fois sur A','A lange drücken|press A for a long time|appuyer longtemps sur A'],'Du brauchst eine zweite Taste.|You need a second key.|Il te faut une deuxième touche.','Mit gedrückter Umschalttaste ⇧ entstehen Grossbuchstaben.|Holding Shift ⇧ gives capital letters.|Avec Maj ⇧ enfoncée, on obtient des majuscules.'),
 N('f','Mit welcher Taste schreibst du den Buchstaben Z?|Which key types the letter Z?|Quelle touche tape la lettre Z ?','keyboard','Auf Schweizer Tastaturen ist Z oben, Y unten.|On Swiss keyboards Z is at the top, Y at the bottom.|Sur les claviers suisses, Z est en haut, Y en bas.','Die Schweizer Tastatur heisst QWERTZ: Das Z ist in der oberen Buchstabenreihe.|The Swiss keyboard is called QWERTZ: Z is in the top letter row.|Le clavier suisse s’appelle QWERTZ : le Z est dans la rangée du haut.','kZ'),
 N('s','Welche Taste löscht den Buchstaben links vom Cursor?|Which key deletes the letter to the left of the cursor?|Quelle touche efface la lettre à gauche du curseur ?',['Rücktaste ⌫|Backspace ⌫|Retour arrière ⌫','Leertaste|space bar|barre d’espace','Umschalttaste ⇧|Shift ⇧|Maj ⇧'],'Sie ist oben rechts und zeigt nach links.|It is at the top right and points left.|Elle est en haut à droite et pointe à gauche.','Die Rücktaste löscht nach links.|Backspace deletes to the left.|Retour arrière efface à gauche.')]);

bankTopic('it4-parts',4,1,['Im Inneren des Computers','Inside the computer','À l’intérieur de l’ordinateur'],
 ['Der Prozessor (CPU) rechnet, der Arbeitsspeicher (RAM) merkt sich, woran gerade gearbeitet wird, der Speicher (SSD) bewahrt Dateien dauerhaft auf. Das Netzteil oder der Akku liefert Strom.','The processor (CPU) calculates, the working memory (RAM) holds what you are working on right now, storage (SSD) keeps files permanently. The power supply or battery provides power.','Le processeur (CPU) calcule, la mémoire vive (RAM) garde ce sur quoi on travaille, le stockage (SSD) conserve les fichiers durablement. L’alimentation ou la batterie fournit le courant.'],['it_cpu','it_ram','it_ssd'],[
 N('s','Welches Teil rechnet im Computer?|Which part does the calculating?|Quelle pièce fait les calculs ?',['der Prozessor (CPU)|the processor (CPU)|le processeur (CPU)','der Lautsprecher|the speaker|le haut-parleur','das Netzteil|the power supply|l’alimentation'],'Man nennt es auch das «Gehirn» des Computers.|It is also called the computer’s “brain”.|On l’appelle aussi le « cerveau » de l’ordinateur.','Die CPU führt die Befehle der Programme aus.|The CPU carries out the programs’ instructions.|Le CPU exécute les instructions des programmes.'),
 N('s','Wo bleiben deine Fotos gespeichert, auch wenn der Computer aus ist?|Where do your photos stay stored even when the computer is off?|Où tes photos restent-elles enregistrées même quand l’ordinateur est éteint ?',['auf dem Speicher (SSD)|on the storage (SSD)|sur le stockage (SSD)','im Arbeitsspeicher (RAM)|in the working memory (RAM)|dans la mémoire vive (RAM)','im Bildschirm|in the screen|dans l’écran'],'Der RAM vergisst alles beim Ausschalten.|RAM forgets everything when switched off.|La RAM oublie tout à l’extinction.','Die SSD speichert dauerhaft; der RAM nur, solange Strom da ist.|The SSD stores permanently; RAM only while there is power.|Le SSD stocke durablement ; la RAM seulement tant qu’il y a du courant.'),
 N('s','Was passiert mit dem Inhalt des Arbeitsspeichers (RAM), wenn der Strom ausfällt?|What happens to the contents of the RAM when the power fails?|Qu’arrive-t-il au contenu de la RAM en cas de coupure de courant ?',['Er geht verloren.|It is lost.|Il est perdu.','Er wird gedruckt.|It is printed.|Il est imprimé.','Er wird grösser.|It gets bigger.|Il grandit.'],'Deshalb soll man regelmässig speichern.|That is why you should save regularly.|C’est pourquoi il faut enregistrer souvent.','RAM ist flüchtig: Ohne Strom ist er leer. Was nicht gespeichert wurde, ist weg.|RAM is volatile: without power it is empty. Anything unsaved is gone.|La RAM est volatile : sans courant, elle se vide. Ce qui n’est pas enregistré est perdu.'),
 N('m','Welche Teile findest du in fast jedem Computer?|Which parts are in almost every computer?|Quelles pièces trouve-t-on dans presque chaque ordinateur ?',['*Prozessor|processor|processeur','*Arbeitsspeicher|working memory|mémoire vive','*Speicher|storage|stockage','Drucker|printer|imprimante'],'Ein Drucker ist ein Zusatzgerät.|A printer is an extra device.|Une imprimante est un appareil en plus.','CPU, RAM und Speicher gehören zu jedem Computer, auch zu Tablet und Smartphone.|CPU, RAM and storage are in every computer, including tablets and smartphones.|CPU, RAM et stockage sont dans chaque ordinateur, tablettes et smartphones compris.')]);
bankTopic('it4-explorer',4,2,['Windows: Datei-Explorer','Windows: File Explorer','Windows : Explorateur de fichiers'],
 ['Im Datei-Explorer siehst du Laufwerke, Ordner und Dateien. Du kannst Dateien kopieren, verschieben, umbenennen und löschen. Gelöschte Dateien kommen zuerst in den Papierkorb.','File Explorer shows drives, folders and files. You can copy, move, rename and delete files. Deleted files first go to the Recycle Bin.','L’Explorateur de fichiers montre lecteurs, dossiers et fichiers. On peut copier, déplacer, renommer et supprimer. Les fichiers supprimés vont d’abord dans la Corbeille.'],['it_explorer','it_trash'],[
 N('s','Du hast aus Versehen eine Datei gelöscht. Wo suchst du zuerst?|You deleted a file by mistake. Where do you look first?|Tu as supprimé un fichier par erreur. Où cherches-tu d’abord ?',['im Papierkorb|in the Recycle Bin|dans la Corbeille','im Drucker|in the printer|dans l’imprimante','in der Uhr|in the clock|dans l’horloge'],'Gelöschtes wird nicht sofort vernichtet.|Deleted things are not destroyed straight away.|Ce qui est supprimé n’est pas détruit tout de suite.','Aus dem Papierkorb kannst du Dateien wiederherstellen.|You can restore files from the Recycle Bin.|On peut restaurer les fichiers depuis la Corbeille.'),
 N('s','Was ist der Unterschied zwischen Kopieren und Verschieben?|What is the difference between copying and moving?|Quelle est la différence entre copier et déplacer ?',['Beim Kopieren bleibt das Original, beim Verschieben nicht.|Copying keeps the original, moving does not.|Copier garde l’original, déplacer non.','Es gibt keinen Unterschied.|There is no difference.|Il n’y a pas de différence.','Verschieben löscht die Datei ganz.|Moving deletes the file completely.|Déplacer supprime complètement le fichier.'],'Wie viele Dateien gibt es danach?|How many files are there afterwards?|Combien de fichiers y a-t-il ensuite ?','Kopieren macht ein Duplikat; Verschieben bringt dieselbe Datei an einen neuen Ort.|Copying makes a duplicate; moving takes the same file to a new place.|Copier crée un double ; déplacer emmène le même fichier ailleurs.'),
 N('s','Mit welcher Tastenkombination öffnest du den Datei-Explorer?|Which key combination opens File Explorer?|Quel raccourci ouvre l’Explorateur de fichiers ?',['Windows-Taste + E|Windows key + E|touche Windows + E','Ctrl + P|Ctrl + P|Ctrl + P','Alt + F4|Alt + F4|Alt + F4'],'E wie Explorer.|E as in Explorer.|E comme Explorateur.','Windows-Taste + E öffnet den Datei-Explorer.|Windows key + E opens File Explorer.|Touche Windows + E ouvre l’Explorateur.'),
 N('s','Wie benennst du eine Datei im Explorer um?|How do you rename a file in File Explorer?|Comment renommes-tu un fichier dans l’Explorateur ?',['auswählen und F2 drücken (oder Rechtsklick → Umbenennen)|select it and press F2 (or right-click → Rename)|le sélectionner et appuyer sur F2 (ou clic droit → Renommer)','Doppelklick|double-click|double-clic','Ctrl + C|Ctrl + C|Ctrl + C'],'Es gibt eine Funktionstaste dafür.|There is a function key for it.|Il y a une touche de fonction pour ça.','F2 oder Rechtsklick → Umbenennen.|F2 or right-click → Rename.|F2 ou clic droit → Renommer.')]);
bankTopic('it4-iphone',4,3,['iPhone und iPad: Kontrollzentrum und Mitteilungen','iPhone and iPad: Control Center and notifications','iPhone et iPad : centre de contrôle et notifications'],
 ['Auf Geräten ohne Home-Taste öffnest du das Kontrollzentrum, indem du von der oberen rechten Ecke nach unten wischst. Von oben in der Mitte kommen die Mitteilungen.','On devices without a Home button, open Control Center by swiping down from the top-right corner. Swiping down from the top middle shows notifications.','Sur les appareils sans bouton principal, ouvre le centre de contrôle en glissant vers le bas depuis le coin supérieur droit. Depuis le haut au milieu apparaissent les notifications.'],['it_controlcenter','it_notification'],[
 N('f','Wo wischst du nach unten, um das Kontrollzentrum zu öffnen?|Where do you swipe down to open Control Center?|Où glisses-tu vers le bas pour ouvrir le centre de contrôle ?','tablet','In einer Ecke.|In a corner.|Dans un coin.','Von der oberen rechten Ecke nach unten wischen öffnet das Kontrollzentrum.|Swiping down from the top-right corner opens Control Center.|Glisser vers le bas depuis le coin supérieur droit ouvre le centre de contrôle.','topright'),
 N('f','Wo wischst du nach unten, um die Mitteilungen zu sehen?|Where do you swipe down to see notifications?|Où glisses-tu vers le bas pour voir les notifications ?','tablet','Oben, aber nicht in der Ecke.|At the top, but not in the corner.|En haut, mais pas dans le coin.','Von oben in der Mitte nach unten wischen zeigt die Mitteilungen.|Swiping down from the top middle shows notifications.|Glisser vers le bas depuis le haut au milieu affiche les notifications.','topcenter'),
 N('s','Was findest du im Kontrollzentrum?|What do you find in Control Center?|Que trouves-tu dans le centre de contrôle ?',['WLAN, Lautstärke und Helligkeit|Wi-Fi, volume and brightness|Wi-Fi, volume et luminosité','alle deine Fotos|all your photos|toutes tes photos','deine Hausaufgaben|your homework|tes devoirs'],'Es sind schnelle Einstellungen.|They are quick settings.|Ce sont des réglages rapides.','Das Kontrollzentrum bietet schnelle Schalter für WLAN, Bluetooth, Helligkeit und Lautstärke.|Control Center has quick switches for Wi-Fi, Bluetooth, brightness and volume.|Le centre de contrôle offre des boutons rapides pour Wi-Fi, Bluetooth, luminosité et volume.'),
 N('s','Wie machst du auf einem iPhone ohne Home-Taste ein Bildschirmfoto?|How do you take a screenshot on an iPhone without a Home button?|Comment fais-tu une capture d’écran sur un iPhone sans bouton principal ?',['Seitentaste und Lauter-Taste gleichzeitig drücken|press the side button and volume up together|appuyer en même temps sur le bouton latéral et volume +','dreimal auf den Bildschirm tippen|tap the screen three times|toucher l’écran trois fois','das iPhone schütteln|shake the iPhone|secouer l’iPhone'],'Zwei Tasten gleichzeitig.|Two buttons at once.|Deux boutons en même temps.','Seitentaste + Lauter-Taste kurz gleichzeitig drücken und loslassen.|Briefly press and release the side button and volume up together.|Appuyer brièvement ensemble sur le bouton latéral et volume +, puis relâcher.')]);
bankTopic('it4-internet',4,1,['Internet und WLAN','Internet and Wi-Fi','Internet et Wi-Fi'],
 ['Über das WLAN verbindet sich das Gerät mit dem Router, und der Router mit dem Internet. Mit einem Browser öffnest du Webseiten, mit einer Suchmaschine findest du sie.','Via Wi-Fi the device connects to the router, and the router to the internet. A browser opens web pages; a search engine finds them.','Par le Wi-Fi, l’appareil se connecte au routeur, et le routeur à Internet. Un navigateur ouvre les pages web ; un moteur de recherche les trouve.'],['it_wifi','it_browser','it_router'],[
 N('s','Welches Programm brauchst du, um Webseiten anzuschauen?|Which program do you need to view web pages?|De quel programme as-tu besoin pour voir des pages web ?',['einen Browser|a browser|un navigateur','einen Taschenrechner|a calculator|une calculatrice','eine Kamera-App|a camera app|une app appareil photo'],'Safari, Chrome, Edge und Firefox sind Beispiele.|Safari, Chrome, Edge and Firefox are examples.|Safari, Chrome, Edge et Firefox en sont des exemples.','Ein Browser zeigt Webseiten an.|A browser displays web pages.|Un navigateur affiche les pages web.'),
 N('o','Wie kommt eine Webseite zu deinem Tablet? Ordne von dir aus.|How does a web page reach your tablet? Order starting with you.|Comment une page web arrive-t-elle sur ta tablette ? Range en partant de toi.',['Tablet|tablet|tablette','WLAN|Wi-Fi|Wi-Fi','Router|router|routeur','Internet|internet|Internet'],'Das Tablet spricht zuerst mit dem Router.|The tablet talks to the router first.|La tablette parle d’abord au routeur.','Tablet → WLAN → Router → Internet.|Tablet → Wi-Fi → router → internet.|Tablette → Wi-Fi → routeur → Internet.'),
 N('s','Was ist eine Suchmaschine?|What is a search engine?|Qu’est-ce qu’un moteur de recherche ?',['eine Webseite, die andere Webseiten findet|a website that finds other websites|un site qui trouve d’autres sites','ein Kabel|a cable|un câble','ein Virus|a virus|un virus'],'Du gibst Wörter ein und bekommst Treffer.|You type words and get results.|Tu tapes des mots et obtiens des résultats.','Suchmaschinen durchsuchen das Web nach deinen Suchwörtern.|Search engines search the web for your search words.|Les moteurs de recherche parcourent le web pour tes mots-clés.')]);

bankTopic('it5-units',5,1,['Speichergrössen','Storage units','Unités de stockage'],
 ['1 Byte = 8 Bit. Dann geht es in Tausenderschritten: Kilobyte (KB), Megabyte (MB), Gigabyte (GB), Terabyte (TB). Manche Programme rechnen mit 1024 statt 1000.','1 byte = 8 bits. Then it goes up in steps of a thousand: kilobyte (KB), megabyte (MB), gigabyte (GB), terabyte (TB). Some programs use 1024 instead of 1000.','1 octet = 8 bits. Ensuite, on avance par milliers : kilooctet (Ko), mégaoctet (Mo), gigaoctet (Go), téraoctet (To). Certains programmes utilisent 1024 au lieu de 1000.'],['it_bit','it_byte'],[
 N('o','Ordne vom Kleinsten zum Grössten.|Order from smallest to largest.|Range du plus petit au plus grand.',['Bit|bit|bit','Byte|byte|octet','Kilobyte|kilobyte|kilooctet','Megabyte|megabyte|mégaoctet','Gigabyte|gigabyte|gigaoctet','Terabyte|terabyte|téraoctet'],'Kilo, Mega, Giga, Tera: immer etwa tausendmal mehr.|Kilo, mega, giga, tera: each about a thousand times more.|Kilo, méga, giga, téra : chaque fois environ mille fois plus.','Bit < Byte < KB < MB < GB < TB.|bit < byte < KB < MB < GB < TB.|bit < octet < Ko < Mo < Go < To.'),
 N('s','Wie viele Bit hat ein Byte?|How many bits are in a byte?|Combien de bits y a-t-il dans un octet ?',['8|8|8','10|10|10','100|100|100'],'Es ist eine Zweierpotenz.|It is a power of two.|C’est une puissance de deux.','1 Byte = 8 Bit.|1 byte = 8 bits.|1 octet = 8 bits.'),
 N('s','Etwa wie gross ist ein Foto vom Handy?|About how big is a photo from a phone?|Quelle est à peu près la taille d’une photo de téléphone ?',['einige Megabyte|a few megabytes|quelques mégaoctets','einige Byte|a few bytes|quelques octets','einige Terabyte|a few terabytes|quelques téraoctets'],'Ein Textbrief ist viel kleiner, ein Film viel grösser.|A text letter is much smaller, a film much bigger.|Une lettre est bien plus petite, un film bien plus grand.','Ein Handyfoto hat meist einige Megabyte, je nach Kamera und Format.|A phone photo is usually a few megabytes, depending on camera and format.|Une photo de téléphone fait en général quelques mégaoctets, selon l’appareil et le format.'),
 N('s','1 GB sind ungefähr …|1 GB is about …|1 Go, c’est environ …',['1000 MB|1,000 MB|1 000 Mo','100 MB|100 MB|100 Mo','10 KB|10 KB|10 Ko'],'Ein Schritt nach oben ist etwa mal 1000.|One step up is about times 1,000.|Un cran plus haut, c’est environ fois 1000.','1 GB ≈ 1000 MB (genau 1000, oder 1024 bei manchen Programmen).|1 GB ≈ 1,000 MB (exactly 1,000, or 1,024 in some programs).|1 Go ≈ 1000 Mo (exactement 1000, ou 1024 selon les programmes).')]);
bankTopic('it5-winkeys',5,2,['Tastenkürzel unter Windows','Keyboard shortcuts on Windows','Raccourcis clavier sous Windows'],
 ['Ctrl + C kopiert, Ctrl + V fügt ein, Ctrl + X schneidet aus, Ctrl + Z macht rückgängig, Ctrl + S speichert. Alt + Tab wechselt zwischen offenen Programmen.','Ctrl + C copies, Ctrl + V pastes, Ctrl + X cuts, Ctrl + Z undoes, Ctrl + S saves. Alt + Tab switches between open programs.','Ctrl + C copie, Ctrl + V colle, Ctrl + X coupe, Ctrl + Z annule, Ctrl + S enregistre. Alt + Tab passe d’un programme ouvert à l’autre.'],['it_shortcut','it_clipboard'],[
 N('s','Welches Kürzel macht den letzten Schritt rückgängig?|Which shortcut undoes the last step?|Quel raccourci annule la dernière action ?',['Ctrl + Z|Ctrl + Z|Ctrl + Z','Ctrl + C|Ctrl + C|Ctrl + C','Ctrl + P|Ctrl + P|Ctrl + P'],'Die Taste ist links unten neben X.|The key is at the bottom left next to X.|La touche est en bas à gauche à côté de X.','Ctrl + Z = rückgängig.|Ctrl + Z = undo.|Ctrl + Z = annuler.'),
 N('s','Du willst einen Text an eine andere Stelle bringen. Welche zwei Kürzel brauchst du?|You want to move a text to another place. Which two shortcuts do you need?|Tu veux déplacer un texte ailleurs. Quels deux raccourcis te faut-il ?',['Ctrl + X, dann Ctrl + V|Ctrl + X, then Ctrl + V|Ctrl + X, puis Ctrl + V','Ctrl + C, dann Ctrl + Z|Ctrl + C, then Ctrl + Z|Ctrl + C, puis Ctrl + Z','Ctrl + S, dann Ctrl + A|Ctrl + S, then Ctrl + A|Ctrl + S, puis Ctrl + A'],'Ausschneiden und einfügen.|Cut and paste.|Couper et coller.','Ctrl + X schneidet aus, Ctrl + V fügt ein.|Ctrl + X cuts, Ctrl + V pastes.|Ctrl + X coupe, Ctrl + V colle.'),
 N('s','Welches Kürzel wechselt zwischen offenen Programmen?|Which shortcut switches between open programs?|Quel raccourci passe d’un programme ouvert à l’autre ?',['Alt + Tab|Alt + Tab|Alt + Tab','Ctrl + S|Ctrl + S|Ctrl + S','Shift + Enter|Shift + Enter|Maj + Entrée'],'Tab wie «wechseln».|Tab as in “switch”.|Tab comme « changer ».','Alt + Tab zeigt alle offenen Fenster zum Wechseln.|Alt + Tab shows all open windows to switch between.|Alt + Tab montre toutes les fenêtres ouvertes.'),
 N('s','Welches Kürzel markiert alles?|Which shortcut selects everything?|Quel raccourci sélectionne tout ?',['Ctrl + A|Ctrl + A|Ctrl + A','Ctrl + M|Ctrl + M|Ctrl + M','Ctrl + Q|Ctrl + Q|Ctrl + Q'],'A wie «alles».|A as in “all”.|A comme « all » (tout en anglais).','Ctrl + A markiert alles.|Ctrl + A selects all.|Ctrl + A sélectionne tout.'),
 N('s','Welches Kürzel zeigt sofort den Desktop?|Which shortcut shows the desktop straight away?|Quel raccourci affiche tout de suite le bureau ?',['Windows-Taste + D|Windows key + D|touche Windows + D','Ctrl + D|Ctrl + D|Ctrl + D','Alt + D|Alt + D|Alt + D'],'D wie Desktop.|D as in desktop.|D comme « desktop ».','Windows-Taste + D blendet alle Fenster aus und zeigt den Desktop.|Windows key + D hides all windows and shows the desktop.|Touche Windows + D masque toutes les fenêtres et affiche le bureau.')]);
bankTopic('it5-mackeys',5,3,['Tastenkürzel auf dem Mac','Keyboard shortcuts on a Mac','Raccourcis clavier sur Mac'],
 ['Auf dem Mac übernimmt die Befehlstaste ⌘ die Rolle von Ctrl: ⌘ + C kopiert, ⌘ + V fügt ein, ⌘ + Z macht rückgängig. ⌘ + Tab wechselt Apps, ⌘ + Leertaste öffnet Spotlight.','On a Mac the Command key ⌘ plays the role of Ctrl: ⌘ + C copies, ⌘ + V pastes, ⌘ + Z undoes. ⌘ + Tab switches apps, ⌘ + Space opens Spotlight.','Sur Mac, la touche Commande ⌘ joue le rôle de Ctrl : ⌘ + C copie, ⌘ + V colle, ⌘ + Z annule. ⌘ + Tab change d’app, ⌘ + Espace ouvre Spotlight.'],['it_command','it_spotlight'],[
 N('s','Welche Taste ersetzt auf dem Mac meistens Ctrl?|Which key usually replaces Ctrl on a Mac?|Quelle touche remplace généralement Ctrl sur Mac ?',['Befehlstaste ⌘|Command key ⌘|touche Commande ⌘','Wahltaste ⌥|Option key ⌥|touche Option ⌥','Feststelltaste ⇪|Caps Lock ⇪|Verr. Maj ⇪'],'Sie hat ein Kleeblatt-Zeichen.|It has a clover-leaf sign.|Elle porte un signe en forme de trèfle.','⌘ (Command) ist die wichtigste Kürzel-Taste auf dem Mac.|⌘ (Command) is the main shortcut key on a Mac.|⌘ (Commande) est la principale touche de raccourci sur Mac.'),
 N('s','Was ist der Unterschied zwischen ⌘ + W und ⌘ + Q?|What is the difference between ⌘ + W and ⌘ + Q?|Quelle est la différence entre ⌘ + W et ⌘ + Q ?',['⌘ + W schliesst das Fenster, ⌘ + Q beendet die ganze App.|⌘ + W closes the window, ⌘ + Q quits the whole app.|⌘ + W ferme la fenêtre, ⌘ + Q quitte toute l’app.','Beide machen dasselbe.|Both do the same.|Les deux font pareil.','⌘ + Q speichert, ⌘ + W druckt.|⌘ + Q saves, ⌘ + W prints.|⌘ + Q enregistre, ⌘ + W imprime.'],'W wie Window, Q wie Quit.|W for window, Q for quit.|W pour « window », Q pour « quit ».','⌘ + W schliesst nur ein Fenster; ⌘ + Q beendet das Programm.|⌘ + W closes one window; ⌘ + Q quits the program.|⌘ + W ferme une fenêtre ; ⌘ + Q quitte le programme.'),
 N('s','Mit welchem Kürzel öffnest du Spotlight, die Suche auf dem Mac?|Which shortcut opens Spotlight, the Mac’s search?|Quel raccourci ouvre Spotlight, la recherche du Mac ?',['⌘ + Leertaste|⌘ + Space|⌘ + Espace','⌘ + S|⌘ + S|⌘ + S','⌘ + Tab|⌘ + Tab|⌘ + Tab'],'Die längste Taste ist dabei.|The longest key is involved.|La touche la plus longue en fait partie.','⌘ + Leertaste öffnet Spotlight.|⌘ + Space opens Spotlight.|⌘ + Espace ouvre Spotlight.'),
 N('f','Tippe auf die Suche (Spotlight) in der Menüleiste.|Tap search (Spotlight) in the menu bar.|Touche la recherche (Spotlight) dans la barre des menus.','macscreen','Eine Lupe oben rechts.|A magnifying glass at the top right.|Une loupe en haut à droite.','Die Lupe oben rechts öffnet Spotlight.|The magnifying glass at the top right opens Spotlight.|La loupe en haut à droite ouvre Spotlight.','spotlight'),
 N('s','Wie machst du auf dem Mac ein Bildschirmfoto von einem Ausschnitt?|How do you take a screenshot of part of the screen on a Mac?|Comment fais-tu une capture d’une partie de l’écran sur Mac ?',['⌘ + Shift + 4|⌘ + Shift + 4|⌘ + Maj + 4','⌘ + P|⌘ + P|⌘ + P','⌘ + A|⌘ + A|⌘ + A'],'Es sind drei Tasten mit einer Zahl.|It is three keys with a number.|Ce sont trois touches avec un chiffre.','⌘ + Shift + 3 ganzer Bildschirm, ⌘ + Shift + 4 Ausschnitt, ⌘ + Shift + 5 Werkzeugleiste.|⌘ + Shift + 3 whole screen, ⌘ + Shift + 4 selection, ⌘ + Shift + 5 toolbar.|⌘ + Maj + 3 écran entier, ⌘ + Maj + 4 sélection, ⌘ + Maj + 5 barre d’outils.')]);
bankTopic('it5-filetypes',5,1,['Dateitypen','File types','Types de fichiers'],
 ['Die Endung nach dem Punkt verrät den Dateityp: .docx Text, .pdf Dokument zum Lesen, .jpg und .png Bilder, .mp3 Musik, .mp4 Video, .zip zusammengepackte Dateien.','The ending after the dot tells you the file type: .docx text, .pdf document for reading, .jpg and .png pictures, .mp3 music, .mp4 video, .zip packed files.','L’extension après le point indique le type : .docx texte, .pdf document à lire, .jpg et .png images, .mp3 musique, .mp4 vidéo, .zip fichiers compressés.'],['it_extension'],[
 N('s','Welche Datei ist ein Bild?|Which file is a picture?|Quel fichier est une image ?',['ferien.jpg|holidays.jpg|vacances.jpg','lied.mp3|song.mp3|chanson.mp3','brief.docx|letter.docx|lettre.docx'],'Schau auf die Endung.|Look at the ending.|Regarde l’extension.','.jpg (und .png) sind Bildformate.|.jpg (and .png) are picture formats.|.jpg (et .png) sont des formats d’image.'),
 N('s','Welche Datei ist ein Video?|Which file is a video?|Quel fichier est une vidéo ?',['film.mp4|film.mp4|film.mp4','foto.png|photo.png|photo.png','notizen.txt|notes.txt|notes.txt'],'mp4 ist oft Video, mp3 nur Ton.|mp4 is usually video, mp3 only sound.|mp4 est souvent de la vidéo, mp3 seulement du son.','.mp4 ist ein Videoformat.|.mp4 is a video format.|.mp4 est un format vidéo.'),
 N('s','Du willst ein Dokument verschicken, das überall gleich aussieht und nicht leicht verändert wird. Welches Format?|You want to send a document that looks the same everywhere and isn’t easily changed. Which format?|Tu veux envoyer un document qui s’affiche pareil partout et qu’on ne modifie pas facilement. Quel format ?',['PDF|PDF|PDF','MP3|MP3|MP3','ZIP|ZIP|ZIP'],'Es ist ein Format zum Lesen und Drucken.|It is a format for reading and printing.|C’est un format pour lire et imprimer.','PDF sieht auf jedem Gerät gleich aus.|A PDF looks the same on every device.|Un PDF s’affiche pareil sur tous les appareils.'),
 N('s','Was ist in einer .zip-Datei?|What is inside a .zip file?|Que contient un fichier .zip ?',['eine oder mehrere zusammengepackte Dateien|one or more packed files|un ou plusieurs fichiers compressés','immer ein Lied|always a song|toujours une chanson','ein Programm zum Zeichnen|a drawing program|un programme de dessin'],'Denk an einen Koffer.|Think of a suitcase.|Pense à une valise.','ZIP packt Dateien zusammen und macht sie oft kleiner.|ZIP packs files together and often makes them smaller.|Le ZIP regroupe des fichiers et les rend souvent plus petits.')]);

bankTopic('it6-os',6,1,['Betriebssysteme','Operating systems','Systèmes d’exploitation'],
 ['Das Betriebssystem ist das Grundprogramm eines Geräts. Es verwaltet Speicher, Dateien und Geräte und startet Apps. Beispiele: Windows, macOS, iPadOS, iOS, Android, Linux.','The operating system is a device’s basic program. It manages memory, files and devices and starts apps. Examples: Windows, macOS, iPadOS, iOS, Android, Linux.','Le système d’exploitation est le programme de base d’un appareil. Il gère la mémoire, les fichiers et les périphériques et lance les apps. Exemples : Windows, macOS, iPadOS, iOS, Android, Linux.'],['it_os','it_update'],[
 N('s','Welches Betriebssystem läuft auf einem iPhone?|Which operating system runs on an iPhone?|Quel système d’exploitation fonctionne sur un iPhone ?',['iOS|iOS|iOS','Windows|Windows|Windows','Android|Android|Android'],'Es ist von Apple.|It is made by Apple.|Il est fait par Apple.','Das iPhone verwendet iOS, das iPad iPadOS, der Mac macOS.|iPhone uses iOS, iPad uses iPadOS, Mac uses macOS.|L’iPhone utilise iOS, l’iPad iPadOS, le Mac macOS.'),
 N('m','Welche davon sind Betriebssysteme?|Which of these are operating systems?|Lesquels sont des systèmes d’exploitation ?',['*Windows|Windows|Windows','*macOS|macOS|macOS','*Android|Android|Android','*Linux|Linux|Linux','Word|Word|Word','Chrome|Chrome|Chrome'],'Word und Chrome laufen auf einem Betriebssystem.|Word and Chrome run on an operating system.|Word et Chrome fonctionnent sur un système d’exploitation.','Windows, macOS, Android und Linux sind Betriebssysteme; Word und Chrome sind Anwendungen.|Windows, macOS, Android and Linux are operating systems; Word and Chrome are applications.|Windows, macOS, Android et Linux sont des systèmes ; Word et Chrome sont des applications.'),
 N('s','Warum solltest du Updates installieren?|Why should you install updates?|Pourquoi faut-il installer les mises à jour ?',['Sie schliessen Sicherheitslücken und beheben Fehler.|They close security holes and fix bugs.|Elles corrigent des failles de sécurité et des bugs.','Sie machen den Bildschirm grösser.|They make the screen bigger.|Elles agrandissent l’écran.','Sie löschen alle Fotos.|They delete all photos.|Elles effacent toutes les photos.'],'Es geht um Sicherheit.|It is about safety.|C’est une question de sécurité.','Updates machen das System sicherer und stabiler.|Updates make the system safer and more stable.|Les mises à jour rendent le système plus sûr et plus stable.')]);
bankTopic('it6-winsettings',6,2,['Windows: Einstellungen und Task-Manager','Windows: Settings and Task Manager','Windows : Paramètres et Gestionnaire des tâches'],
 ['In den Einstellungen (Windows-Taste + I) änderst du WLAN, Bildschirm, Konten und Updates. Der Task-Manager (Ctrl + Shift + Esc) zeigt laufende Programme und kann hängende Programme beenden.','In Settings (Windows key + I) you change Wi-Fi, display, accounts and updates. Task Manager (Ctrl + Shift + Esc) shows running programs and can end programs that hang.','Dans Paramètres (touche Windows + I), tu modifies le Wi-Fi, l’affichage, les comptes et les mises à jour. Le Gestionnaire des tâches (Ctrl + Maj + Échap) montre les programmes en cours et peut fermer ceux qui sont bloqués.'],['it_taskmanager','it_settings'],[
 N('s','Ein Programm reagiert nicht mehr. Womit beendest du es?|A program has stopped responding. What do you use to end it?|Un programme ne répond plus. Avec quoi le fermes-tu ?',['mit dem Task-Manager|with Task Manager|avec le Gestionnaire des tâches','mit dem Papierkorb|with the Recycle Bin|avec la Corbeille','mit dem Drucker|with the printer|avec l’imprimante'],'Ctrl + Shift + Esc.|Ctrl + Shift + Esc.|Ctrl + Maj + Échap.','Im Task-Manager wählst du das Programm und klickst «Task beenden».|In Task Manager select the program and click “End task”.|Dans le Gestionnaire des tâches, sélectionne le programme et clique « Fin de tâche ».'),
 N('s','Welches Kürzel öffnet die Einstellungen?|Which shortcut opens Settings?|Quel raccourci ouvre les Paramètres ?',['Windows-Taste + I|Windows key + I|touche Windows + I','Windows-Taste + L|Windows key + L|touche Windows + L','Ctrl + I|Ctrl + I|Ctrl + I'],'Es ist ein Vokal.|It is a vowel.|C’est une voyelle.','Windows-Taste + I öffnet die Einstellungen.|Windows key + I opens Settings.|Touche Windows + I ouvre les Paramètres.'),
 N('s','Du gehst kurz weg. Wie sperrst du den Computer schnell?|You step away for a moment. How do you lock the computer quickly?|Tu t’absentes un moment. Comment verrouilles-tu vite l’ordinateur ?',['Windows-Taste + L|Windows key + L|touche Windows + L','Ctrl + Z|Ctrl + Z|Ctrl + Z','Alt + Tab|Alt + Tab|Alt + Tab'],'L wie «Lock» (sperren).|L as in lock.|L comme « lock » (verrouiller).','Windows-Taste + L sperrt den Bildschirm.|Windows key + L locks the screen.|Touche Windows + L verrouille l’écran.'),
 N('s','Welches Kürzel öffnet den Task-Manager direkt?|Which shortcut opens Task Manager directly?|Quel raccourci ouvre directement le Gestionnaire des tâches ?',['Ctrl + Shift + Esc|Ctrl + Shift + Esc|Ctrl + Maj + Échap','Ctrl + Alt + P|Ctrl + Alt + P|Ctrl + Alt + P','Shift + F1|Shift + F1|Maj + F1'],'Esc ist dabei.|Esc is involved.|Échap en fait partie.','Ctrl + Shift + Esc öffnet den Task-Manager.|Ctrl + Shift + Esc opens Task Manager.|Ctrl + Maj + Échap ouvre le Gestionnaire des tâches.')]);
bankTopic('it6-macfinder',6,3,['Mac: Finder, Systemeinstellungen, Sofort beenden','Mac: Finder, System Settings, Force Quit','Mac : Finder, Réglages Système, Forcer à quitter'],
 ['Im Finder verwaltest du Dateien und Ordner. In den Systemeinstellungen (Apple-Menü) änderst du WLAN, Anzeige und Benutzer. Hängt eine App, hilft «Sofort beenden» (⌘ + ⌥ + Esc).','Finder manages files and folders. In System Settings (Apple menu) you change Wi-Fi, display and users. If an app hangs, use Force Quit (⌘ + ⌥ + Esc).','Le Finder gère fichiers et dossiers. Dans Réglages Système (menu Pomme), tu modifies Wi-Fi, affichage et utilisateurs. Si une app est bloquée, utilise Forcer à quitter (⌘ + ⌥ + Échap).'],['it_finder','it_forcequit'],[
 N('s','Welches Programm zeigt auf dem Mac deine Dateien und Ordner?|Which program shows your files and folders on a Mac?|Quel programme montre tes fichiers et dossiers sur Mac ?',['der Finder|Finder|le Finder','Safari|Safari|Safari','Musik|Music|Musique'],'Es hat ein lächelndes Gesicht als Symbol.|Its icon is a smiling face.|Son icône est un visage souriant.','Der Finder ist die Dateiverwaltung des Mac.|Finder is the Mac’s file manager.|Le Finder est le gestionnaire de fichiers du Mac.'),
 N('s','Eine App auf dem Mac reagiert nicht mehr. Was hilft?|An app on the Mac has stopped responding. What helps?|Une app ne répond plus sur le Mac. Qu’est-ce qui aide ?',['⌘ + ⌥ + Esc (Sofort beenden)|⌘ + ⌥ + Esc (Force Quit)|⌘ + ⌥ + Échap (Forcer à quitter)','⌘ + C|⌘ + C|⌘ + C','den Bildschirm putzen|clean the screen|nettoyer l’écran'],'Drei Tasten, eine davon ist Esc.|Three keys, one of them Esc.|Trois touches, dont Échap.','⌘ + ⌥ (Wahltaste) + Esc öffnet «Sofort beenden».|⌘ + ⌥ (Option) + Esc opens Force Quit.|⌘ + ⌥ (Option) + Échap ouvre « Forcer à quitter ».'),
 N('f','Wo öffnest du die Systemeinstellungen?|Where do you open System Settings?|Où ouvres-tu les Réglages Système ?','macscreen','Über ein Menü ganz links oben.|Through a menu at the very top left.|Par un menu tout en haut à gauche.','Die Systemeinstellungen findest du im Apple-Menü.|System Settings are in the Apple menu.|Les Réglages Système se trouvent dans le menu Pomme.','applemenu'),
 N('f','Tippe auf das Kontrollzentrum des Mac.|Tap the Mac’s Control Center.|Touche le centre de contrôle du Mac.','macscreen','Oben rechts, vier kleine Schalter.|Top right, four small switches.|En haut à droite, quatre petits boutons.','Das Kontrollzentrum ist oben rechts in der Menüleiste.|Control Center is at the top right of the menu bar.|Le centre de contrôle est en haut à droite de la barre des menus.','controlcenter')]);
bankTopic('it6-cloud',6,1,['Speichern: lokal und in der Cloud','Saving: local and cloud','Enregistrer : en local et dans le cloud'],
 ['Lokal gespeichert liegt eine Datei auf dem Gerät. In der Cloud liegt sie auf Servern im Internet (zum Beispiel iCloud, OneDrive, Dropbox) und ist auf mehreren Geräten verfügbar. Eine Sicherungskopie (Backup) schützt vor Verlust.','Saved locally, a file is on the device. In the cloud it is on servers on the internet (for example iCloud, OneDrive, Dropbox) and available on several devices. A backup copy protects against loss.','Enregistré en local, un fichier est sur l’appareil. Dans le cloud, il est sur des serveurs sur Internet (par exemple iCloud, OneDrive, Dropbox) et disponible sur plusieurs appareils. Une sauvegarde protège contre la perte.'],['it_cloud','it_backup'],[
 N('s','Was bedeutet «in der Cloud speichern»?|What does “saving in the cloud” mean?|Que veut dire « enregistrer dans le cloud » ?',['auf Servern im Internet speichern|storing on servers on the internet|stocker sur des serveurs sur Internet','in einer Wolke am Himmel|in a cloud in the sky|dans un nuage dans le ciel','nur auf einem USB-Stick|only on a USB stick|seulement sur une clé USB'],'Die Cloud sind Computer anderswo.|The cloud is computers somewhere else.|Le cloud, ce sont des ordinateurs ailleurs.','Cloud-Speicher liegt auf Servern eines Anbieters und ist über das Internet erreichbar.|Cloud storage is on a provider’s servers and reachable over the internet.|Le stockage cloud est sur les serveurs d’un fournisseur, accessible par Internet.'),
 N('m','Welche Aussagen stimmen?|Which statements are true?|Quelles affirmations sont vraies ?',['*Mit der Cloud sind Dateien auf mehreren Geräten verfügbar.|With the cloud, files are available on several devices.|Avec le cloud, les fichiers sont disponibles sur plusieurs appareils.','*Ohne Internet kommst du oft nicht an Cloud-Dateien, die nicht heruntergeladen sind.|Without internet you often can’t reach cloud files that aren’t downloaded.|Sans Internet, on n’accède souvent pas aux fichiers cloud non téléchargés.','Cloud-Speicher kann nie ausfallen.|Cloud storage can never fail.|Le stockage cloud ne peut jamais tomber en panne.','Eine Datei nur lokal zu haben ist immer sicher.|Having a file only locally is always safe.|Avoir un fichier seulement en local est toujours sûr.'],'Denk an Vor- und Nachteile.|Think of pros and cons.|Pense aux avantages et inconvénients.','Die Cloud synchronisiert zwischen Geräten, braucht aber Internet; eine zusätzliche Sicherung ist trotzdem sinnvoll.|The cloud syncs between devices but needs internet; an extra backup still makes sense.|Le cloud synchronise entre appareils mais demande Internet ; une sauvegarde supplémentaire reste utile.'),
 N('s','Was ist ein Backup?|What is a backup?|Qu’est-ce qu’une sauvegarde ?',['eine Sicherungskopie deiner Daten|a safety copy of your data|une copie de sécurité de tes données','ein neues Spiel|a new game|un nouveau jeu','ein Virus|a virus|un virus'],'Es hilft, wenn das Gerät kaputtgeht.|It helps if the device breaks.|Elle aide si l’appareil tombe en panne.','Mit einem Backup kannst du Daten nach einem Verlust wiederherstellen.|With a backup you can restore data after a loss.|Avec une sauvegarde, on peut restaurer les données après une perte.')]);
