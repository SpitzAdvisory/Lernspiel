/* maps toolbox */
async function adminMaps(body){
 const imp=h('input',{type:'file',accept:'application/json,.json',multiple:true,style:'display:none',onchange:async e=>{let n=0;
  try{for(const file of e.target.files){const d=JSON.parse(await file.text());const list=Array.isArray(d.packs)?d.packs:[d];
    for(const P of list){if(!P||!P.id||!Array.isArray(P.layers))continue;await S.store.write('maps/'+P.id+'.json',P);delete PACKS[P.id];n++;}}
   toast(t('mapsImported',{n}));}catch(err){toast(t('err',{e:err.message}),true);}viewAdmin('maps');}});
 const ids=await listPacks();const viewer=h('div',{});
 body.append(h('p',{class:'muted'},t('mapsIntro')),h('div',{class:'row',style:'margin-bottom:14px'},h('button',{class:'btn',onclick:()=>imp.click()},t('importMaps')),imp));
 if(!ids.length)return body.append(h('p',{class:'muted'},t('noMaps')));
 const geoC=h('div',{class:'maplist'}),histC=h('div',{class:'maplist'});body.append(h('div',{class:'maphead'},t('g_geo')),geoC,h('div',{class:'maphead'},t('g_hist')),histC,viewer);
 for(const id of ids.sort()){const cards=isHistPack(id)?histC:geoC;let P;try{P=await loadPack(id);}catch(e){continue;}const n=P.layers.reduce((a,L)=>a+L.f.filter(f=>!f.bg&&L.kind!=='bg').length,0);
  cards.append(h('button',{class:'item',onclick:()=>showPack(P)},h('div',{class:'grow'},h('b',{},fname({n:P.name})),h('div',{class:'small muted'},(P.period?perText(P.period)+' · ':'')+t('objects',{n}))),'›'));}
 function showPack(P){const shown=new Set();const box=h('div',{});const tip=h('div',{class:'maptip'},t('tapToName'));
  const draw=()=>{const mv=mapView(P,{show:[...shown],faint:shown.has('landscapes')||shown.has('continents')});mv.el.append(tip);
   mv.onTap=(x,y,ppu)=>{const order=[...shown].concat(P.layers.filter(L=>L.kind!=='bg'&&L.kind!=='point'&&!['landscapes','continents','seas'].includes(L.id)&&!shown.has(L.id)).map(L=>L.id).reverse());let hit=null;
    for(const L of order){const hs=mapHits(P,L,x,y,ppu,'medium');if(hs.length){hit=hs[0];break;}}
    tip.textContent=hit?fname(P.byId[hit])+' ('+(P.layers.find(l=>l.id===P.byId[hit].layer).label[S.lang]||'')+')':t('tapToName');
    Object.values(mv.els).forEach(e=>e.classList.remove('hl'));if(hit&&mv.els[hit])mv.els[hit].classList.add('hl');};
   box.replaceChildren(mv.el);};
  const toggles=h('div',{class:'row',style:'gap:14px;margin:10px 0'},P.layers.filter(L=>L.kind==='point'||L.opt||['landscapes','continents','regions'].includes(L.id)).map(L=>{
   const c=h('input',{type:'checkbox',onchange:e=>{e.target.checked?shown.add(L.id):shown.delete(L.id);draw();}});return h('label',{style:'display:inline-flex;gap:6px;align-items:center'},c,L.label[S.lang]||L.id);}));
  viewer.replaceChildren(h('h3',{},fname({n:P.name})),h('div',{class:'small muted'},t('layers')+':'),toggles,box);draw();}
}
/* logs */
async function adminLogs(body){
 try{await syncLogs();}catch(e){toast(t('err',{e:e.message}),true);}
 const logs=uniqLogs().sort((a,b)=>String(b.started).localeCompare(String(a.started))).slice(0,300);
 if(!logs.length)return body.append(h('p',{class:'muted'},t('logsEmpty')));
 body.append(h('div',{class:'scroll'},h('table',{},h('thead',{},h('tr',{},[t('date'),t('player'),t('game'),t('mode_'),t('difficulty'),t('score'),t('accuracy'),''].map(x=>h('th',{},x)))),
  h('tbody',{},logs.map(l=>h('tr',{},h('td',{},fmtDate(l.started)),h('td',{},l.players.map(p=>p.name).join(' vs ')),h('td',{},l.game.title),
   h('td',{},t('m_'+l.mode)+(l.adaptive?' · '+t('adaptive'):'')+(l.aborted?' · '+t('aborted'):'')),h('td',{},t('d_'+l.difficulty)),
   h('td',{},l.players.map(p=>p.score).join(' : ')),h('td',{},l.players.map(p=>p.accuracy+' %').join(' : ')),
   h('td',{},h('button',{class:'btn ghost small',onclick:()=>logDetails(l)},t('details')))))))));
}
function logDetails(l){
 const wrong=l.answers.filter(a=>!a.correct);const dlg=$('#dlg');const nameOf=id=>(l.players.find(p=>p.id===id)||{}).name||'';
 dlg.replaceChildren(h('div',{class:'stack'},h('h2',{},l.game.title+' – '+fmtDate(l.started)),h('h3',{},t('mistakes')),
  wrong.length?h('div',{class:'list'},wrong.map(a=>h('div',{class:'item',style:'display:block'},h('div',{},(l.players.length>1?nameOf(a.player)+': ':'')+a.prompt),
   h('div',{class:'small',style:'color:var(--red)'},'✗ '+a.given),h('div',{class:'small',style:'color:var(--green)'},'✓ '+a.expected)))):h('p',{class:'muted'},t('noMistakes')),
  h('button',{class:'btn',onclick:()=>dlg.close()},'OK')));
 dlg.showModal();
}
/* settings */
async function adminSettings(body){
 const key=h('input',{type:'password',id:'ak',autocomplete:'off',placeholder:'sk-ant-…'});key.value=(await IDB.get('kv','apiKey'))||'';
 const model=h('input',{type:'text',id:'am'});model.value=(await IDB.get('kv','model'))||DEFAULT_MODEL;
 const npw=h('input',{type:'password',id:'np',autocomplete:'new-password'});
 body.append(h('div',{class:'stack',style:'max-width:620px'},
  h('h3',{},t('dataFolder')),h('p',{},h('b',{},S.store.kind==='folder'?'📁 '+S.store.name:t('browserStorage'))),
  h('p',{class:'small muted'},t('folderHint')),
  h('button',{class:'btn ghost',onclick:async()=>{const hd=await pickFolder();if(!hd)return;const ns=new FolderStore(hd);
   try{const ex=await ns.read('config.json');if(ex)toast(t('folderExisting'));else{await copyAll(S.store,ns);toast(t('folderMoved'));}
    await IDB.set('kv','dirHandle',hd);await IDB.set('kv','storeMode','folder');S.store=ns;await loadAll();viewAdmin('settings');}catch(e){toast(t('err',{e:e.message}),true);}}},t('chooseFolder')),
  h('h3',{},t('apiKey')),key,h('p',{class:'small muted'},t('apiKeyNote')),
  h('div',{},h('label',{class:'f',for:'am'},t('model')),model,h('p',{class:'small muted'},t('modelNote'))),
  h('button',{class:'btn',onclick:async()=>{await IDB.set('kv','apiKey',key.value.trim());await IDB.set('kv','model',model.value.trim()||DEFAULT_MODEL);toast(t('keySaved'));}},t('save')),
  h('h3',{},t('changePw')),h('div',{},h('label',{class:'f',for:'np'},t('newPw')),npw),
  h('button',{class:'btn ghost',onclick:async()=>{if(npw.value.length<4)return toast(t('pwShort'),true);const salt=uid()+uid();
   S.cfg=Object.assign({},S.cfg,{salt,pwHash:await sha(salt+npw.value)});await S.store.write('config.json',S.cfg);npw.value='';toast(t('pwSet'));}},t('changePw'))));
}

init();
</script>
</body>
