<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1040 640' width='1040' height='640' font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" role='img' aria-label='Fassungen und Sicherung'>
<rect width='1040' height='640' fill='#F7F9FC'/>
<defs><marker id='sp' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'><path d='M 0 0 L 10 5 L 0 10 z' fill='#0A2D56'/></marker></defs>
<text x='40' y='46' font-size='21' font-weight='700' fill='#0A2D56'>Jede Fassung bleibt greifbar</text>
<text x='40' y='70' font-size='13.5' fill='#6B7B8E'>Eine neue Fassung geht an vier Orte. Aus dreien davon lässt sie sich zurückholen.</text>
<rect x='56' y='126' width='200' height='116' rx='14' fill='#DCEEEC' stroke='#4FB8B0' stroke-width='2'/>
<text x='156' y='152' font-size='15' font-weight='700' fill='#0A2D56' text-anchor='middle'>Werkstatt</text>
<text x='156' y='176' font-size='13' fill='#6B7B8E' text-anchor='middle'>Arbeitsplatz von Claude</text>
<text x='156' y='196' font-size='13' fill='#6B7B8E' text-anchor='middle'>index.html wird geändert</text>
<text x='156' y='216' font-size='13' fill='#6B7B8E' text-anchor='middle'>und durchgeprüft</text>
<rect x='390' y='114' width='246' height='62' rx='14' fill='#FFFFFF' stroke='#3D6A9A' stroke-width='2'/>
<text x='513' y='141' font-size='15' font-weight='600' fill='#0A2D56' text-anchor='middle'>GitHub  main</text>
<text x='513' y='161' font-size='12' fill='#6B7B8E' text-anchor='middle'>54 Fassungen, einzeln</text>
<rect x='390' y='194' width='246' height='62' rx='14' fill='#FFFFFF' stroke='#C8D3DE' stroke-width='2'/>
<text x='513' y='221' font-size='15' font-weight='600' fill='#0A2D56' text-anchor='middle'>Dropbox Source</text>
<text x='513' y='241' font-size='12' fill='#6B7B8E' text-anchor='middle'>die letzten acht</text>
<rect x='390' y='274' width='246' height='62' rx='14' fill='#FFFFFF' stroke='#C8D3DE' stroke-width='2'/>
<text x='513' y='301' font-size='15' font-weight='600' fill='#0A2D56' text-anchor='middle'>OneDrive Archiv</text>
<text x='513' y='321' font-size='12' fill='#6B7B8E' text-anchor='middle'>45 Fassungen ab V51</text>
<rect x='390' y='354' width='246' height='62' rx='14' fill='#DCEEEC' stroke='#4FB8B0' stroke-width='2'/>
<text x='513' y='381' font-size='15' font-weight='600' fill='#0A2D56' text-anchor='middle'>Dropbox Apps</text>
<text x='513' y='401' font-size='12' fill='#6B7B8E' text-anchor='middle'>was die Kinder spielen</text>
<line x1='260' y1='184' x2='386' y2='145' stroke='#0A2D56' stroke-width='2.2' marker-end='url(#sp)'/>
<line x1='260' y1='184' x2='386' y2='225' stroke='#0A2D56' stroke-width='2.2' marker-end='url(#sp)'/>
<line x1='260' y1='184' x2='386' y2='305' stroke='#0A2D56' stroke-width='2.2' marker-end='url(#sp)'/>
<line x1='260' y1='184' x2='386' y2='385' stroke='#0A2D56' stroke-width='2.2' marker-end='url(#sp)'/>
<rect x='752' y='114' width='234' height='62' rx='14' fill='#FFFFFF' stroke='#3D6A9A' stroke-width='2'/>
<text x='869' y='141' font-size='15' font-weight='600' fill='#0A2D56' text-anchor='middle'>GitHub Pages</text>
<text x='869' y='161' font-size='12' fill='#6B7B8E' text-anchor='middle'>die Adresse im Safari</text>
<line x1='640' y1='145' x2='748' y2='145' stroke='#0A2D56' stroke-width='2.2' marker-end='url(#sp)'/>
<text x='752' y='218' font-size='14' font-weight='700' fill='#0A2D56'>Zurückholen</text>
<text x='752' y='242' font-size='12.5' fill='#6B7B8E'>GitHub: ein Befehl, jede der</text>
<text x='752' y='260' font-size='12.5' fill='#6B7B8E'>54 Fassungen, in Sekunden.</text>
<text x='752' y='288' font-size='12.5' fill='#6B7B8E'>Archiv und Dropbox:</text>
<text x='752' y='306' font-size='12.5' fill='#6B7B8E'>Datei kopieren, fertig.</text>
<text x='752' y='340' font-size='12.5' fill='#6B7B8E'>Die Spielkopie wird immer</text>
<text x='752' y='358' font-size='12.5' fill='#6B7B8E'>überschrieben. Sie ist kein</text>
<text x='752' y='376' font-size='12.5' fill='#6B7B8E'>Archiv.</text>
<rect x='56' y='450' width='930' height='148' rx='12' fill='#FFFFFF' stroke='#C46060' stroke-width='2'/>
<text x='78' y='480' font-size='14' font-weight='700' fill='#0A2D56'>Die Spielstände sind etwas anderes</text>
<text x='78' y='506' font-size='13' fill='#6B7B8E'>Punkte, Protokolle und Profile der Kinder leben im Browser des jeweiligen Geräts und in der Spielkopie.</text>
<text x='78' y='526' font-size='13' fill='#6B7B8E'>Keine Fassung der App kann diese Daten wiederherstellen. Löscht ein Kind die Browserdaten, sind die</text>
<text x='78' y='546' font-size='13' fill='#6B7B8E'>Punkte dieses Geräts fort.</text>
<text x='78' y='574' font-size='13' fill='#6B7B8E'>Stand 31. Oktober 2026 liegt eine Sicherung im OneDrive Archiv: 161 Protokolle seit dem 19. September</text>
<text x='78' y='590' font-size='12.5' font-family="ui-monospace,Menlo,monospace" fill='#3D6A9A'>20261031_SPITZ-Lernen_Spielstaende_V1.zip</text>
</svg>
