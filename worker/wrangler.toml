# Bauplan des Vermittlers fuer die selbsttaetige Auslieferung.
#
# Stand in der Cloudflare-Oberflaeche, nachgesehen am 31.10.2026:
#
#   Secrets             ANTHROPIC_KEY, ELEVEN_KEY   bleiben bei jeder Auslieferung
#   Bindings            keine ("No connected bindings")
#   Compatibility date  2026-10-28                  unten uebernommen
#   Compatibility flags keine
#   Cache               Disabled
#
# Der Quelltext wurde Zeile fuer Zeile gegen den laufenden Worker geprueft:
# alle 256 Zeilen wortgleich. Die erste selbsttaetige Auslieferung aendert
# am Verhalten also nichts.
#
# Erledigt am 31.10.2026: die Variable "ElevenLabs" lag im Klartext und
# wurde von keiner Zeile gelesen. Von Urs geloescht. Danach geprueft:
# /tts antwortet 200 mit audio/mpeg, /unbekannt ohne Herkunft 403.
#
# Offen: die Tagesgrenze laeuft ins Leere. Der Quelltext prueft env.ZAEHLER,
# und diese KV-Bindung gibt es nicht. Vor dem Sprachagenten anzulegen.

name = "spitz-lernen"
main = "worker.js"
compatibility_date = "2026-10-28"
workers_dev = true
# Der erste Lauf warnte: ohne diese Zeile schaltet wrangler zusaetzliche
# Vorschau-Adressen frei. Jede davon ist derselbe Vermittler unter einem
# weiteren Namen. Kein neues Risiko, aber unnoetige Oberflaeche - aus.
preview_urls = false

# Der Zaehler fuer die Tagesgrenze. Am 31.10.2026 angelegt.
# Die Kennung ist kein Geheimnis: ohne den API-Schluessel laesst sich damit
# nichts anfangen. Cloudflare sieht genau diesen Weg vor.
[[kv_namespaces]]
binding = "ZAEHLER"
id = "22501df105df40cca89ab6869556fced"

# Anfragen je Tag ueber alle vier Wege zusammen. Danach antwortet der
# Vermittler bis Mitternacht mit 429.
#
# 2000 ist bewusst hoch angesetzt. Gemessen am Konto: 1653 Anfragen am
# 30.10. und 2359 am 31.10. - darin stecken aber die Tonerzeugung und meine
# eigenen Pruefläufe, die sich aus Cloudflares Zahlen nicht herausloesen
# lassen. Die Grenze soll beim Spielen nie greifen und nur eine verhakte
# Schleife stoppen. Nach einer Woche echtem Betrieb enger ziehen.
[vars]
TAGESGRENZE = "2000"
